  - rubric: 予測器の定義を理解している。
    type: multichoice
    title: 01-01-予測器の定義
    question: |
      入力された特徴量からラベルを予測するために、学習アルゴリズムによって構築された関数のことを何と呼ぶか。
    choices:
      A: "損失"
      B: "予測器（Predictor）"
      C: "特徴量"
      D: "リスク"
    answer: B
    feedback:
      [cite_start]A: "損失は予測の誤差を測る指標です [cite: 426]。"
      [cite_start]B: "正解です。予測器は、特徴量を入力としてラベルの予測値を出力する関数です [cite: 283]。"
      [cite_start]C: "特徴量は予測器への入力です [cite: 282]。"
      [cite_start]D: "リスクは予測器の性能を測る指標（損失の期待値）です [cite: 431]。"
  - rubric: 経験リスクの定義を理解している。
    type: multichoice
    title: 01-02-経験リスクの定義
    question: |
      訓練データに対する損失の平均を指す用語として、最も適切なものを一つ選びなさい。
    choices:
      A: "期待リスク"
      B: "汎化誤差"
      C: "経験リスク"
      D: "損失関数"
    answer: C
    feedback:
      [cite_start]A: "期待リスクは、未知データに対する損失の期待値であり、理論的な目標です [cite: 431]。"
      B: "汎化誤差は、訓練誤差とテスト誤差の差を指すことが多く、汎化性能の指標です。"
      [cite_start]C: "正解です。経験リスクは、手元の訓練データにおける損失の標本平均です [cite: 457]。"
      [cite_start]D: "損失関数は、個々のデータ点に対する誤差を計算する関数です [cite: 426]。"
  - rubric: ハイパーパラメーターの定義を理解している。
    type: multichoice
    title: 03-03-ハイパーパラメーターの定義
    question: |
      モデルの学習プロセス自体を制御し、学習前に人間が設定するパラメーター（例：学習率、正則化係数など）の総称を何と呼ぶか。
    choices:
      A: "特徴量"
      B: "重みパラメーター"
      C: "ラベル"
      D: "ハイパーパラメーター"
    answer: D
    feedback:
      [cite_start]A: "特徴量はモデルへの入力です [cite: 282]。"
      [cite_start]B: "重みパラメーターは学習によって決定される変数です [cite: 396]。"
      [cite_start]C: "ラベルは予測の正解データです [cite: 283]。"
      [cite_start]D: "正解です。ハイパーパラメーターは学習アルゴリズムの挙動を制御します [cite: 686]。"
  - rubric: ノンパラメトリックモデルの例を識別できる。
    type: multichoice
    title: 08-04-ノンパラメトリックモデルの例
    question: |
      k-最近傍法（k-NN）のように、学習時に明示的なパラメーターを持たず、訓練データそのものを記憶して予測に用いるモデルのカテゴリを何と呼ぶか。
    choices:
      A: "線形モデル"
      B: "パラメトリックモデル"
      C: "ノンパラメトリックモデル"
      D: "生成モデル"
    answer: C
    feedback:
      A: "線形モデルはパラメトリックモデルの一種です。"
      [cite_start]B: "パラメトリックモデルは、固定数のパラメーターを持つモデルです（例：線形回帰） [cite: 397]。"
      [cite_start]C: "正解です。ノンパラメトリックモデルは、モデルの複雑さがデータ数に応じて変化し、固定数のパラメーターを持ちません [cite: 1044]。"
      [cite_start]D: "生成モデルは、新しいデータを生成するタスクを解くモデルの総称です [cite: 1326]。"
  - rubric: オッカムの剃刀の原則を理解している。
    type: multichoice
    title: 03-05-オッカムの剃刀
    question: |
      学習の哲学において、複数の同程度に妥当な説明がある場合、最も単純な説明を選択すべきである、という考え方を何と呼ぶか。
    choices:
      A: "帰納の問題"
      B: "No-Free-Lunch Theorem"
      C: "オッカムの剃刀"
      D: "分布仮説"
    answer: C
    feedback:
      [cite_start]A: "帰納の問題は、過去の観測から未来を予測することの正当性に関する問題です [cite: 721]。"
      [cite_start]B: "No-Free-Lunch Theoremは、万能なアルゴリズムは存在しないという定理です [cite: 725]。"
      [cite_start]C: "正解です。オッカムの剃刀は「倹約の法則」とも呼ばれ、機械学習では単純なモデルを好む帰納バイアスとして現れます [cite: 731]。"
      [cite_start]D: "分布仮説は、単語の意味がその文脈によって決まるというNLPの仮説です [cite: 1278]。"
  - rubric: 近似ターゲットと損失関数の関係性を理解している。
    type: multichoice
    title: 04-06-二乗損失の近似ターゲット
    question: |
      損失関数の選択は、学習が目指すべき理想的な予測器である「近似ターゲット」を決定する。二乗損失 $(\\ell = (y-y')^2)$ を用いた場合に、近似ターゲットとなる統計量として最も適切なものを一つ選びなさい。
    choices:
      A: "条件付き期待値 $E[Y|X=x]$"
      B: "条件付き中央値"
      C: "条件付き最頻値"
      D: "条件付き分散"
    answer: A
    feedback:
      [cite_start]A: "正解です。期待二乗誤差を最小化する関数は、条件付き期待値関数であることが知られています [cite: 774]。"
      [cite_start]B: "条件付き中央値は、絶対誤差損失の近似ターゲットです [cite: 779]。"
      [cite_start]C: "条件付き最頻値は、0/1損失（分類）の近似ターゲット（ベイズ分類器）に関連します [cite: 798]。"
      D: "条件付き分散は予測のばらつきの指標であり、近似ターゲットではありません。"
  - rubric: k-NNにおけるkの値の影響を理解している。
    type: multichoice
    title: 08-07-k-NNのkの影響
    question: |
      k-最近傍法（k-NN）において、ハイパーパラメーターであるkの値を大きくした場合にモデルに起こる変化として、最も適切なものを一つ選びなさい。
    choices:
      A: "より多くの近傍点を参照するため、決定境界はより複雑になり、過適合しやすくなる。"
      B: "より多くの近傍点を参照するため、決定境界はより滑らかになり、過少適合しやすくなる。"
      C: "学習に必要な計算時間が増加するが、予測時の計算時間は変化しない。"
      D: "モデルのパラメーター数がkに比例して増加する。"
    answer: B
    feedback:
      [cite_start]A: "kを小さくした場合の説明です [cite: 1046]。"
      [cite_start]B: "正解です。kを大きくすると、より広い範囲のデータで平均化・多数決を行うため、ノイズの影響を受けにくくなり、モデルはより単純（滑らか）になります [cite: 1046]。"
      C: "k-NNは学習時の計算がほぼ不要で、予測時に計算コストがかかります。"
      [cite_start]D: "k-NNはノンパラメトリックモデルであり、パラメーター数はゼロです [cite: 1044]。"
  - rubric: データセットの3分割の役割を理解している。
    type: multichoice
    title: 03-08-データセット3分割の役割
    question: |
      モデル選択において、手元のデータを訓練データ、検証データ、テストデータに分割する。これらのデータセットの主な役割の組み合わせとして、最も適切なものを一つ選びなさい。
    choices:
      A: "訓練：モデルの最終評価／検証：パラメーター学習／テスト：ハイパーパラメーター調整"
      B: "訓練：パラメーター学習／検証：ハイパーパラメーター調整／テスト：モデルの最終評価"
      C: "訓練：ハイパーパラメーター調整／検証：モデルの最終評価／テスト：パラメーター学習"
      D: "訓練：パラメーター学習／検証：モデルの最終評価／テスト：ハイパーパラメーター調整"
    answer: B
    feedback:
      A: "役割が混在しています。"
      [cite_start]B: "正解です。訓練データでパラメーターを学習し、検証データでハイパーパラメーターを調整し、テストデータで最終的な性能を一度だけ評価します [cite: 688]。"
      C: "役割が混在しています。"
      D: "検証とテストの役割が逆です。"
  - rubric: パラメーター線形モデルが非線形関数を表現できる理由を理解している。
    type: multichoice
    title: 02-09-パラメーター線形モデルの表現力
    question: |
      パラメーター線形モデル $f_\\theta(x) = \\theta^\\top \\phi(x)$ が、入力 $x$ に対して非線形な関数を表現できる理由として、最も適切なものを一つ選びなさい。
    choices:
      A: "パラメーター $\\theta$ が非線形な値を取るから。"
      B: "特徴写像 $\\phi(x)$ が入力 $x$ の非線形変換を行うことができるから。"
      C: "目的関数が非線形な形をしているから。"
      D: "最適化アルゴリズムに勾配降下法を用いるから。"
    answer: B
    feedback:
      A: "パラメーターは実数値です。モデルが線形かはパラメーターに関しての性質です。"
      [cite_start]B: "正解です。特徴写像 $\\phi(x)$ によって入力 $x$ を高次元の非線形な空間に写すことで、モデル全体として入力に対して非線形な関係を捉えることができます [cite: 589]。"
      C: "目的関数はモデルの性質とは別の要素です。"
      D: "最適化アルゴリズムはモデルの性質を決定しません。"
  - rubric: トークン埋め込みとワンホット表現の違いを理解している。
    type: multichoice
    title: 11-10-トークン埋め込みとワンホット表現
    question: |
      自然言語処理において、トークンIDのような離散的なデータを、低次元で密な実数値ベクトルに変換する手法またはそのベクトル表現を何と呼ぶか。
    choices:
      A: "ワンホット埋め込み"
      B: "トークン埋め込み（単語埋め込み）"
      C: "サブワード分割"
      D: "形態素解析"
    answer: B
    feedback:
      [cite_start]A: "ワンホット表現は高次元でスパース（ほとんどが0）なベクトル表現です [cite: 1275]。"
      [cite_start]B: "正解です。トークン埋め込みは、低次元で密な（dense）ベクトルに変換し、意味的な類似性を表現できるように学習されます [cite: 1276]。"
      [cite_start]C: "サブワード分割はトークン化の手法です [cite: 1269]。"
      [cite_start]D: "形態素解析はトークン化の手法です [cite: 1270]。"
  - rubric: DNNにおける特徴の階層性を理解している。
    type: multichoice
    title: 08-11-特徴の階層性
    question: |
      深層ニューラルネットワークにおいて、入力に近い層から出力に近い層に進むにつれて、学習される特徴がどのように変化する傾向があるか。最も適切なものを一つ選びなさい。
    choices:
      A: "常に同じ特徴が学習される。"
      B: "抽象的な特徴から、具体的な特徴へと変化する。"
      C: "局所的で単純な特徴から、大域的で複雑・抽象的な特徴へと変化する。"
      D: "特徴の次元数が徐々に増加していく。"
    answer: C
    feedback:
      A: "各層で異なる変換が行われ、異なる特徴が抽出されます。"
      B: "逆です。具体的な（低レベルな）特徴から抽象的な（高レベルな）特徴へと変化します。"
      [cite_start]C: "正解です。浅い層はエッジや色といった単純な特徴を、深い層はそれらを組み合わせた物体の一部や全体といった抽象的な特徴を捉える傾向があります [cite: 1018]。"
      D: "次元数はアーキテクチャ設計によりますが、必ずしも増加するわけではありません（例：プーリング層）。"
  - rubric: アップサンプリングの役割を理解している。
    type: multichoice
    title: 10-12-アップサンプリングの役割
    question: |
      U-Netのようなセグメンテーションモデルにおいて、エンコーダーで縮小した特徴マップの解像度を、デコーダーで元の画像サイズに戻していくプロセスを何と呼ぶか。
    choices:
      A: "プーリング"
      B: "畳み込み"
      C: "アップサンプリング"
      D: "アテンション"
    answer: C
    feedback:
      A: "プーリングは解像度を下げる（ダウンサンプリング）処理です。"
      B: "畳み込みは特徴抽出を行いますが、解像度を上げる処理ではありません。"
      [cite_start]C: "正解です。アップサンプリングは、特徴マップの解像度を上げる処理であり、デコーダー部分でピクセル単位の予測を可能にします [cite: 1217]。"
      D: "アテンションはトークン間の関連性を計算する仕組みです。"
  - rubric: VAEの学習原理を理解している。
    type: multichoice
    title: 12-13-VAEの学習
    question: |
      変分オートエンコーダー（VAE）の学習プロセスに関する説明として、最も適切なものを一つ選びなさい。
    choices:
      A: "生成器と識別器を敵対的に競わせることで学習する。"
      B: "入力データから潜在変数の分布を推定するエンコーダーと、潜在変数からデータを復元するデコーダーを同時に学習し、「再構成誤差」と「正則化項」の和を最小化する。"
      C: "データの系列性を利用し、次に来るデータを予測することで学習する。"
      D: "人間が良いと評価したデータを選択的に学習することで、高品質な生成を目指す。"
    answer: B
    feedback:
      [cite_start]A: "これはGANs（敵対的生成ネットワーク）の説明です [cite: 1352]。"
      [cite_start]B: "正解です。VAEは、再構成誤差を小さくしつつ、エンコーダーが出力する潜在変数の分布が単純な事前分布（例：正規分布）から大きく乖離しないように正則化項で制約をかけることで学習します [cite: 1350, 1351]。"
      [cite_start]C: "これは自己回帰型モデルの学習方法です [cite: 1338]。"
      D: "これは人間のフィードバックを用いた学習の考え方です。"
  - rubric: ソフトマックス関数における温度パラメーターの役割を理解している。
    type: multichoice
    title: 12-14-ソフトマックスの温度
    question: |
      自己回帰型のテキスト生成において、ソフトマックス関数に導入される「温度（temperature）」パラメーターを非常に高く設定した場合、生成されるテキストはどのような傾向を持つか。
    choices:
      A: "最も確率の高い単語が常に選ばれ、決まりきった文章が生成される。"
      B: "各単語の選択確率が平坦化（一様分布に近づく）し、より多様でランダムな、時には突飛な文章が生成される。"
      C: "文法的に完璧だが、意味的に無関係な単語が選ばれやすくなる。"
      D: "生成速度が著しく低下する。"
    answer: B
    feedback:
      [cite_start]A: "これは温度を非常に低く（0に近く）設定した場合の挙動です [cite: 1169]。"
      [cite_start]B: "正解です。温度を高くすると、スコアの差が確率の差に与える影響が小さくなり、確率分布が平坦化するため、より多様な単語が選ばれやすくなります [cite: 1169]。"
      C: "文法的な正しさが保証されるわけではありません。"
      D: "生成速度には直接影響しません。"
  - rubric: NLPにおける分布仮説を理解している。
    type: multichoice
    title: 11-15-分布仮説
    question: |
      自然言語処理における「分布仮説」の考え方を最もよく説明しているものを一つ選びなさい。
    choices:
      A: "単語の出現頻度は、Zipfの法則と呼ばれる特定の確率分布に従う。"
      B: "単語の意味は、その単語がどのような文脈（周囲の単語）で使われるかによって決まる。"
      C: "全ての言語は、普遍的な文法構造という共通の分布から生成されている。"
      D: "文書内のトピックの分布は、潜在ディリクレ配分法によってモデル化できる。"
    answer: B
    feedback:
      A: "これは言語の統計的性質に関する別の法則です。"
      B: "正解です。分布仮説は "A word is characterized by the company it keeps." [cite_start]という言葉で表され、word2vecなどの単語埋め込み学習の理論的根拠となっています [cite: 1278]。"
      C: "これは生成文法などの言語学の仮説であり、ここでいう分布仮説とは異なります。"
      D: "これはトピックモデルの説明です。"
  - rubric: 事前学習と精密調整の有効性を理解している。
    type: multichoice
    title: 08-16-事前学習の有効性
    question: |
      深層学習における「事前学習と精密調整（ファインチューニング）」というアプローチが有効である主な理由として、最も適切なものを一つ選びなさい。
    choices:
      A: "精密調整は、事前学習よりも常に計算コストが低いため。"
      B: "大規模データで事前学習されたモデルは、様々なタスクに共通して有用な特徴表現を獲得しており、それを個別タスクに再利用することで、少ないデータでも効率的に高い性能を達成できるため。"
      C: "事前学習を行うことで、モデルの著作権が放棄され、誰でも自由に利用できるようになるため。"
      D: "精密調整を行うことで、モデルのパラメーター数を大幅に削減できるため。"
    answer: B
    feedback:
      A: "計算コストが低いことは利点ですが、有効である本質的な理由ではありません。"
      [cite_start]B: "正解です。このアプローチは、知識の「転移」を可能にすることで、データや計算資源が限られた状況でも高性能なモデルを構築することを可能にします [cite: 1025]。"
      C: "著作権と事前学習は直接関係ありません。"
      D: "精密調整でパラメーター数を削減するわけではありません。"
  - rubric: AIエージェントの概念を理解している。
    type: multichoice
    title: 13-17-AIエージェントの定義
    question: |
      大規模言語モデル（LLM）が、思考の連鎖（CoT）などを通じて自らタスクを分解し、検索エンジンなどの外部ツールを利用しながら、目標を達成しようと振る舞う枠組みを何と呼ぶか。
    choices:
      A: "マルチモーダルモデル"
      B: "検索拡張生成（RAG）"
      C: "自律エージェント"
      D: "アラインメント"
    answer: C
    feedback:
      [cite_start]A: "マルチモーダルモデルは複数のデータ様式を扱います [cite: 1424]。"
      [cite_start]B: "RAGはエージェントが使用する「ツール」の一つとなりえますが、エージェントの枠組みそのものではありません [cite: 1544]。"
      [cite_start]C: "正解です。エージェントは、単に応答を生成するだけでなく、目標達成のために計画を立て、ツールを用いて行動する能力を持ちます [cite: 1416]。"
      [cite_start]D: "アラインメントはモデルを人間の価値観に沿わせる調整です [cite: 1435]。"
  - rubric: AIバイアスの事例を理解している。
    type: multichoice
    title: 14-18-AIバイアスの事例
    question: |
      再犯予測AI「COMPAS」をめぐる倫理的な議論で問題となった「バイアス」とは、具体的にどのような現象であったか。最も適切なものを一つ選びなさい。
    choices:
      A: "常に被告人に対して不利な予測ばかりを出力した。"
      B: "全体的な正答率は同じでも、予測を間違えるパターンが人種によって異なり、特定の人種に不利益な傾向があった。"
      C: "特徴量として人種を直接使用していたことが、法的に問題とされた。"
      D: "開発元の企業が、特定の人種を差別する意図を持ってモデルを設計していた。"
    answer: B
    feedback:
      A: "問題は、予測の精度ではなく、その「間違い方」の公平性でした。"
      [cite_start]B: "正解です。黒人被告の偽陽性率（再犯しないのに再犯すると予測される率）が白人の約2倍であり、公平性の指標によって評価が分かれることが問題となりました [cite: 1522]。"
      [cite_start]C: "人種は直接の特徴量としては使われていませんでしたが、他の特徴量から間接的に推測された可能性が指摘されています [cite: 1522]。"
      D: "意図的ではなかったとしても、結果としてバイアスが生じることが問題です。"
  - rubric: スケーリング則の概念を理解している。
    type: multichoice
    title: 13-19-スケーリング則
    question: |
      大規模言語モデルの性能が、モデルのパラメーター数や訓練データ量を増やすと、予測可能な冪乗則に従って向上するという経験則を何と呼ぶか。
    choices:
      A: "ムーアの法則"
      B: "収穫逓減の法則"
      C: "スケーリング則"
      D: "表現定理"
    answer: C
    feedback:
      A: "ムーアの法則は半導体の集積密度に関する経験則です。"
      B: "スケーリング則は、少なくとも観測されている範囲では、性能向上が逓減せずに続くことを示唆しています。"
      [cite_start]C: "正解です。スケーリング則は、LLM開発における大規模化の指針となっています [cite: 1390]。"
      [cite_start]D: "表現定理はカーネル法に関する理論です [cite: 1064]。"
  - rubric: DPOとRLHFの違いを理解している。
    type: multichoice
    title: 13-20-DPOとRLHFの比較
    question: |
      LLMのアラインメント手法であるDPO (Direct Preference Optimization) が、RLHF (Reinforcement Learning from Human Feedback) と比較した場合の主な利点として、最も適切なものを一つ選びなさい。
    choices:
      A: "人間のフィードバックデータを一切必要としない。"
      B: "RLHFの中間ステップである「報酬モデル」の学習を必要とせず、選好データから直接LLMを学習するため、プロセスがよりシンプルで安定している。"
      C: "RLHFよりも少ない計算量で、常により高い性能を達成することが保証されている。"
      D: "どのような種類のモデルにも適用可能だが、RLHFはTransformerにしか適用できない。"
    answer: B
    feedback:
      [cite_start]A: "DPOもRLHFと同様に、人間の選好データを必要とします [cite: 1482]。"
      [cite_start]B: "正解です。DPOは、複雑で不安定になりがちな報酬モデリングと強化学習のステップを、単一の損失関数による教師あり学習に置き換えることで、訓練の安定性と単純さを向上させます [cite: 1482, 1485]。"
      C: "性能はタスクやデータによります。常に優れているとは限りません。"
      D: "どちらも主にTransformerベースのLLMに適用されます。"
