      次のうち、パラメーター線形モデル $f_\\theta(x) = \\theta^\\top \\phi(x)$ の具体例として、最も適切なものを一つ選びなさい。
    choices:
      A: "k-最近傍法"
      B: "多項式回帰モデル"
      C: "決定木モデル"
      D: "誤差逆伝播法"
