Quizzes:
  # ==================================================
  # == Aパターン
  # ==================================================
  - rubric: AIの歴史における第2次ブームの特徴と限界を理解している。
    type: multichoice
    title: 01-01-第2次AIブームの特徴
    question: |
      第2次AIブームで中心となった技術的アプローチとその限界に関する説明として、最も適切なものを一つ選びなさい。
    choices:
      A: "大量のデータから統計的に規則性を見出すアプローチだったが、計算機の性能不足で限界を迎えた。"
      B: "迷路解決のような特定のルールが明確な問題を解く「推論と探索」が中心だったが、現実の複雑な問題には対応できなかった。"
      C: "専門家の知識を「if-thenルール」として大量に記述するエキスパートシステムが中心だったが、知識の網羅や更新の困難さから限界を迎えた。"
      D: "インターネットの普及を背景に、人間の脳を模したニューラルネットワークが初めて登場したが、理論的な基盤が未熟だった。"
    answer: C
    feedback:
      [cite_start]A: "これは第3次AIブームの説明に近いです。第2次ブームはデータ駆動型ではありませんでした [cite: 114]。"
      [cite_start]B: "これは第1次AIブームの特徴です [cite: 100, 103]。"
      [cite_start]C: "正解です。第2次ブームではエキスパートシステムが中心でしたが、知識の表現・管理の困難さが限界となりました [cite: 107, 113]。"
      [cite_start]D: "ニューラルネットワークが大きな成功を収めたのは第3次AIブームです [cite: 114, 120]。"
  - rubric: 教師付き学習における基本用語（ラベル）を理解している。
    type: multichoice
    title: 01-02-教師付き学習の用語定義
    question: |
      教師付き学習における「ラベル」の説明として、最も適切なものを一つ選びなさい。
    choices:
      A: "予測の対象となる入力データのこと。（例：迷惑メールの本文）"
      B: "予測を行うためにモデルが学習するパラメーターのこと。"
      C: "予測したい正解の出力のこと。（例：迷惑メールか否かの判定）"
      D: "データを収集した日時や場所などの付帯情報のこと。"
    answer: C
    feedback:
      [cite_start]A: "これは「特徴量」の説明です [cite: 282]。"
      [cite_start]B: "これはモデルの「パラメーター」の説明です [cite: 396]。"
      [cite_start]C: "正解です。ラベルはモデルが予測すべき正解の値を指します [cite: 283]。"
      D: "これは特徴量の一部となることはありますが、ラベルそのものの定義ではありません。"
  - rubric: 回帰タスクの具体例を識別できる。
    type: multichoice
    title: 01-03-回帰タスクの例
    question: |
      機械学習における「回帰」タスクの具体例として、最も適切なものを一つ選びなさい。
    choices:
      A: "手書きされた画像データから、それが0から9のどの数字であるかを予測する。"
      B: "顧客の過去の購買履歴から、次に購入する商品のカテゴリを予測する。"
      C: "ワインの化学成分データから、そのワインの品質スコア（100点満点）を予測する。"
      D: "ニュース記事のテキストから、その記事が「政治」「経済」「スポーツ」のどれに分類されるかを予測する。"
    answer: C
    feedback:
      [cite_start]A: "これは「分類」タスクの例です [cite: 292]。"
      [cite_start]B: "これも「分類」タスクの例です [cite: 292]。"
      [cite_start]C: "正解です。品質スコアという量的な（連続的な）値を予測するため、回帰タスクに該当します [cite: 287]。"
      [cite_start]D: "これも「分類」タスクの例です [cite: 292]。"
  - rubric: モデル評価におけるデータ分割の目的を理解している。
    type: multichoice
    title: 02-04-データ分割の目的
    question: |
      モデルの学習において、訓練データと評価用（テスト）データを分ける最も重要な理由を一つ選びなさい。
    choices:
      A: "計算量を減らし、学習時間を短縮するため。"
      B: "モデルの真の性能（汎化性能）を、未知のデータで公平に評価するため。"
      C: "訓練データにノイズが多い場合、それを取り除くため。"
      D: "著作権のあるデータが評価用データに含まれないようにするため。"
    answer: B
    feedback:
      A: "データを分けると学習に使えるデータが減るため、必ずしも学習時間が短縮されるわけではありません。"
      [cite_start]B: "正解です。学習に使用したデータで評価すると性能を過大評価してしまうため、未知データに見立てた評価用データが必要です [cite: 555]。"
      C: "データ分割はノイズ除去を直接の目的とはしていません。"
      D: "著作権の管理は重要ですが、データ分割の主目的ではありません。"
  - rubric: ハイパーパラメーターとパラメーターを区別できる。
    type: multichoice
    title: 03-05-ハイパーパラメーターの例
    question: |
      次のうち、モデルの学習前に人間が設定する必要がある「ハイパーパラメーター」に該当するものを一つ選びなさい。
    choices:
      A: "線形回帰モデルの重みパラメーター"
      B: "L2正則化における正則化の強さを決める係数 $\\lambda$"
      C: "訓練データセットに含まれるサンプル数"
      D: "モデルが予測した出力値"
    answer: B
    feedback:
      [cite_start]A: "これは学習によって自動で決定される「パラメーター」です [cite: 396]。"
      [cite_start]B: "正解です。正則化係数 $\\lambda$ は、学習の挙動を制御するために人間が事前に設定するハイパーパラメーターです [cite: 686]。"
      C: "これはデータセットの性質であり、モデルのパラメーターではありません。"
      D: "これはモデルの出力結果です。"
  - rubric: 第3次AIブームの成功要因を理解している。
    type: multichoice
    title: 01-06-第3次AIブームの背景
    question: |
      第3次AIブームが過去のブームと異なり、現在まで続く成功を収めている背景として、講義資料で挙げられている2つの主要な「追い風」の組み合わせとして、最も適切なものを一つ選びなさい。
    choices:
      A: "エキスパートシステムの理論的完成と、高性能なプログラミング言語の登場"
      B: "インターネットの普及によるデータ量の増大と、高性能な計算機の普及"
      C: "ダートマス会議でのAIという概念の確立と、情報理論の誕生"
      D: "人間の脳の構造の完全な解明と、それを模倣するハードウェアの開発"
    answer: B
    feedback:
      [cite_start]A: "エキスパートシステムは第2次ブームの中心でしたが、その限界が冬の時代を招きました [cite: 113]。"
      [cite_start]B: "正解です。大量のデータとそれを処理する計算能力が、統計的機械学習の成功を支えました [cite: 118, 120]。"
      [cite_start]C: "ダートマス会議は第1次AIブームの始まりに関連します [cite: 101]。"
      D: "人間の脳の完全な解明はまだ達成されていません。"
  - rubric: 損失関数の選択が近似ターゲットに与える影響を理解している。
    type: multichoice
    title: 04-07-損失関数と近似ターゲットの関係
    question: |
      データに外れ値が多く含まれる状況で、住宅価格の予測モデルを構築することを考える。このとき、二乗損失を目的関数とする通常の最小二乗回帰ではなく、絶対誤差損失を目的関数とする回帰（最小絶対誤差回帰）を検討することがある。その理由として、最も適切なものを一つ選びなさい。
    choices:
      A: "絶対誤差損失の近似ターゲットは条件付き期待値であり、外れ値の影響をより強く反映するため。"
      B: "絶対誤差損失の近似ターゲットは条件付き中央値であり、外れ値に対してより頑健（影響を受けにくい）な予測モデルが学習される傾向があるため。"
      C: "絶対誤差損失は常に微分可能であり、勾配降下法による最適化がより高速に進むため。"
      D: "絶対誤差損失を用いると、モデルのパラメーター数が自動的に削減され、過適合が抑制されるため。"
    answer: B
    feedback:
      [cite_start]A: "二乗損失の近似ターゲットが条件付き期待値です [cite: 774]。"
      [cite_start]B: "正解です。期待値は外れ値に大きく引っ張られますが、中央値は影響を受けにくいため、絶対誤差損失（近似ターゲットは条件付き中央値）は外れ値に頑健なモデルの学習につながります [cite: 777, 779]。"
      C: "絶対誤差損失は原点で微分不可能です。"
      D: "絶対誤差損失にパラメーター数を削減する効果はありません。"
  - rubric: 過適合の現象を訓練誤差とテスト誤差の関係から説明できる。
    type: multichoice
    title: 02-08-過適合の定義
    question: |
      モデルの「過適合（Overfitting）」に関する説明として、最も適切なものを一つ選びなさい。
    choices:
      A: "モデルの表現能力が低すぎるため、訓練データの特徴を十分に捉えきれず、訓練誤差もテスト誤差も高い状態。"
      B: "訓練誤差は非常に低いが、未知のデータに対するテスト誤差が高くなってしまう状態。モデルが訓練データに特化しすぎている。"
      C: "訓練誤差もテスト誤差も十分に低く、モデルがデータに潜む普遍的な規則性を学習できている理想的な状態。"
      D: "学習データが多すぎるため、モデルの学習が収束せず、汎化性能が不安定になる状態。"
    answer: B
    feedback:
      [cite_start]A: "これは「過少適合（Underfitting）」の説明です [cite: 625]。"
      [cite_start]B: "正解です。過適合は、訓練データへの適合度（低い経験リスク）と汎化性能（高いリスク）が乖離した状態を指します [cite: 623]。"
      C: "これは適切に学習が成功している状態です。"
      D: "学習データが多いことは、一般に過適合の抑制につながります。"
  - rubric: No-Free-Lunch Theoremの含意を理解している。
    type: multichoice
    title: 03-09-No-Free-Lunch Theoremの示唆
    question: |
      「No-Free-Lunch Theorem（ノーフリーランチ定理）」が機械学習に示唆することとして、最も適切なものを一つ選びなさい。
    choices:
      A: "十分な量のデータと計算資源があれば、あらゆるタスクを完璧にこなす万能なモデルを作ることができる。"
      B: "あらゆる問題に対して最高の性能を発揮する万能な学習アルゴリズムは存在しないため、タスクの性質に合った適切な「仮定（帰納バイアス）」を持つモデルを選択することが重要である。"
      C: "機械学習モデルの学習には常にコストがかかり、無料で利用できるオープンソースのモデルは性能が低い。"
      D: "統計的学習の理論は未完成であり、モデルの性能がなぜ向上するのかを完全に説明することはできない。"
    answer: B
    feedback:
      [cite_start]A: "これはNo-Free-Lunch Theoremが否定する内容です [cite: 725]。"
      [cite_start]B: "正解です。この定理は、手法の性能が問題との相性（＝帰納バイアスが適切か）に依存することを示唆しています [cite: 727]。"
      [cite_start]C: "経済的な意味でのフリーランチの話ではなく、アルゴリズムの性能に関する理論です [cite: 725]。"
      D: "理論が未完成であることは事実ですが、この定理が直接的に示唆する内容ではありません。"
  - rubric: トークン化の役割を理解している。
    type: multichoice
    title: 11-10-トークン化の定義
    question: |
      自然言語処理において、テキストデータをモデルが扱えるようにするための最初のステップである「トークン化（Tokenization）」の説明として、最も適切なものを一つ選びなさい。
    choices:
      A: "テキストに含まれる文法的な誤りを自動で修正する処理。"
      B: "テキストを単語やサブワードといった意味のある最小単位（トークン）の系列に分割する処理。"
      C: "テキスト全体の感情がポジティブかネガティブかを判定する処理。"
      D: "テキストを別の言語に自動で翻訳する処理。"
    answer: B
    feedback:
      A: "これは文法誤り訂正という別のタスクです。"
      [cite_start]B: "正解です。トークン化は、生の文字列をモデルが処理できる単位の列に変換する前処理です [cite: 1267, 1268]。"
      [cite_start]C: "これは感情分析という応用タスクです [cite: 1248]。"
      [cite_start]D: "これは機械翻訳という応用タスクです [cite: 1255]。"
  - rubric: 物体検出タスクの定義を理解している。
    type: multichoice
    title: 10-11-物体検出の定義
    question: |
      コンピュータービジョンにおける「物体検出（Object Detection）」タスクの説明として、最も適切なものを一つ選びなさい。
    choices:
      A: "画像全体に写っている主要な被写体が何かを、単一のクラスラベルで予測する。"
      B: "画像内の各ピクセルが、どの物体のクラスに属するかを塗り分ける。"
      C: "画像内に存在する物体の位置を、バウンディングボックス（矩形）で囲んで特定する。"
      D: "入力された画像と似ている画像を、データベースから検索してくる。"
    answer: C
    feedback:
      [cite_start]A: "これは「画像分類」タスクの説明です [cite: 1181]。"
      [cite_start]B: "これは「セグメンテーション」タスクの説明です [cite: 1184]。"
      [cite_start]C: "正解です。物体検出は、物体のクラスとその位置（バウンディングボックス）を同時に予測します [cite: 1182]。"
      D: "これは画像検索タスクです。"
  - rubric: 自己回帰型生成モデルのプロセスを理解している。
    type: multichoice
    title: 12-12-自己回帰生成のプロセス
    question: |
      テキスト生成タスクで主流となっている自己回帰型モデルの基本的な生成プロセスとして、最も適切なものを一つ選びなさい。
    choices:
      A: "生成したいテキストの内容を要約した潜在変数をまず生成し、そこからテキスト全体を一度に生成する。"
      B: "テキストの最初と最後の単語を予測し、その間を埋めるように単語を生成していく。"
      C: "「<BOS>（文頭）」トークンから始め、「それまでのトークン列を条件として次に来るトークンを予測しサンプリングする」という処理を繰り返す。"
      D: "複数のモデルが生成したテキスト案を競わせ、最も自然なものを選択する。"
    answer: C
    feedback:
      [cite_start]A: "これは潜在変数型モデルの考え方に近いです [cite: 1332]。"
      B: "これはインフィリングと呼ばれる特殊なタスクです。"
      [cite_start]C: "正解です。自己回帰モデルは、自身の過去の出力を次の入力として、系列を逐次的に生成します [cite: 1333, 1341]。"
      D: "これは生成後の処理であり、自己回帰モデルの基本的な生成プロセスではありません。"
  - rubric: CNNのアーキテクチャ上の利点を理解している。
    type: multichoice
    title: 10-13-CNNの利点
    question: |
      畳み込みニューラルネットワーク（CNN）が画像データの扱いに適している理由として、最も適切なものを一つ選びなさい。
    choices:
      A: "任意の画像データを完全に可逆な形で圧縮することができるため。"
      B: "畳み込み層が、ピクセル間の空間的な位置関係（局所性）を保ったまま特徴を抽出し、パラメーター共有によって効率的な学習を可能にするため。"
      C: "画像内の全てのピクセル間の関連性を一度に計算するため、大域的な文脈の理解に優れているため。"
      D: "モデルのパラメーター数を画像のピクセル数と完全に一致させることで、情報の損失なく処理できるため。"
    answer: B
    feedback:
      A: "CNNは特徴抽出器であり、可逆圧縮を目的とはしていません。"
      [cite_start]B: "正解です。局所的な結合とパラメーター共有は、画像の持つ事前知識（局所性と位置不変性）を活用した効率的なアーキテクチャです [cite: 1206, 1210]。"
      C: "これはアテンション機構（Transformer）の説明に近いです。"
      [cite_start]D: "全結合層ではそうなりますが、それではパラメーター数が膨大になり、空間情報も失われます [cite: 1202]。"
  - rubric: アテンション機構の役割を理解している。
    type: multichoice
    title: 11-14-アテンション機構の役割
    question: |
      Transformerアーキテクチャの中核をなす「アテンション機構」の役割に関する説明として、最も適切なものを一つ選びなさい。
    choices:
      A: "系列データの処理速度を向上させるために、トークンをランダムに間引く処理。"
      B: "各トークンが系列内の他のどのトークンと強く関連しているかを動的に計算し、文脈に応じた表現（文脈化埋め込み）を生成する仕組み。"
      C: "テキストの文法構造を解析し、係り受け関係を木構造として出力する仕組み。"
      D: "モデルのパラメーターを量子化することで、メモリ使用量を削減する仕組み。"
    answer: B
    feedback:
      A: "アテンションは計算量が多い処理であり、トークンを間引くものではありません。"
      [cite_start]B: "正解です。アテンションは、Query, Key, Valueを用いてトークン間の動的な関連性を捉え、文脈を反映した表現を生成します [cite: 1286, 1290]。"
      [cite_start]C: "これは構文解析という別のタスクです [cite: 1246]。"
      D: "これは量子化という別の技術です。"
  - rubric: BERTとGPTのアーキテクチャと目的の違いを理解している。
    type: multichoice
    title: 11-15-BERTとGPTの比較
    question: |
      BERTとGPTは、どちらもTransformerをベースとしたモデルだが、そのアーキテクチャと主目的には違いがある。その違いに関する説明として、最も適切なものを一つ選びなさい。
    choices:
      A: "BERTは回帰タスク、GPTは分類タスクに特化している。"
      B: "BERTは画像処理、GPTは自然言語処理に特化している。"
      C: "BERTは系列全体を双方向に見るエンコーダー構造を持ち文脈理解タスクに、GPTは未来を見ない因果的アテンションを持つデコーダー構造でテキスト生成タスクに適している。"
      D: "BERTは小規模なデータでの学習、GPTは大規模なデータでの学習を前提として設計されている。"
    answer: C
    feedback:
      A: "どちらも主に自然言語処理タスクに用いられます。"
      B: "どちらも主に自然言語処理に用いられます。"
      [cite_start]C: "正解です。アーキテクチャの違い（双方向か単方向か）が、それぞれの得意なタスク（理解か生成か）に直結しています [cite: 1317, 1321]。"
      D: "どちらも大規模なデータでの事前学習を前提としています。"
  - rubric: 次元の呪いが距離に基づく学習に与える影響を理解している。
    type: multichoice
    title: 08-16-次元の呪いとk-NN
    question: |
      高次元空間で発生する「次元の呪い」が、k-最近傍法（k-NN）のような距離に基づく学習手法に与える影響として、最も適切なものを一つ選びなさい。
    choices:
      A: "高次元空間ではデータが密に分布するため、最近傍点を見つける計算が指数関数的に増加する。"
      B: "高次元空間では、任意の2点間の距離がほとんど変わらなくなり、「最も近い点（最近傍）」という概念が意味を失ってしまうため、性能が低下する。"
      C: "高次元空間では、データの中心からの距離が全ての点で等しくなるため、中心を基準とした分類しかできなくなる。"
      D: "高次元空間では、全てのデータ点が互いに直交するため、内積を用いた類似度計算が不可能になる。"
    answer: B
    feedback:
      [cite_start]A: "高次元空間はむしろスカスカになります [cite: 1109]。"
      [cite_start]B: "正解です。距離の均質化により、近傍とそうでない点の区別が困難になることが、距離ベースの手法にとって深刻な問題です [cite: 1114, 1117]。"
      [cite_start]C: "中心からの距離がほぼ等しくなるのは球面集中現象の一側面ですが、分類ができなくなるわけではありません [cite: 1111]。"
      [cite_start]D: "直交に近くなるのは事実ですが、内積が不可能になるわけではありません [cite: 1115]。"
  - rubric: ハルシネーションの具体例を識別できる。
    type: multichoice
    title: 14-17-ハルシネーションの例
    question: |
      AIの利用に伴う倫理的リスクである「ハルシネーション（幻覚）」の具体例として、最も適切なものを一つ選びなさい。
    choices:
      A: "AIチャットボットが、特定の職業に対して性別に関するステレオタイプを反映した回答を生成した。"
      B: "弁護士が法的調査に利用したAIが、存在しない架空の判例をもっともらしく生成した。"
      C: "ユーザーが巧妙な指示（プロンプト）を与えることで、AIの安全対策を回避し、有害な情報を生成させた。"
      D: "AIの学習データに含まれていた個人の連絡先情報が、生成された文章の中に意図せず出力されてしまった。"
    answer: B
    feedback:
      [cite_start]A: "これは「バイアス」の例です [cite: 1521]。"
      [cite_start]B: "正解です。ハルシネーションは、事実に基づかない情報をあたかも真実であるかのように生成する現象です [cite: 1517, 1518]。"
      [cite_start]C: "これは「プロンプトインジェクション」や「脱獄」といった悪用の例です [cite: 1531, 1533]。"
      [cite_start]D: "これはプライバシー侵害のリスクです [cite: 1541]。"
  - rubric: 日本の著作権法におけるAI学習データの扱いを理解している。
    type: multichoice
    title: 14-18-AIと著作権法
    question: |
      日本の著作権法において、AI開発のためにインターネット上から収集した著作物（画像やテキスト）を学習データとして利用する行為は、どのように扱われるか。最も適切なものを一つ選びなさい。
    choices:
      A: "いかなる場合でも著作権侵害となり、法的に禁止されている。"
      B: "著作権者の許諾を個別に得る必要があるが、非営利目的であれば許諾は不要である。"
      C: "著作権法第30条の4に基づき、情報解析目的であれば、原則として著作権者の許諾なく利用できる。"
      D: "海外のサーバーで学習を行う場合に限り、日本の著作権法は適用されないため適法となる。"
    answer: C
    feedback:
      A: "日本の著作権法では、原則として適法と解釈されています。"
      B: "営利・非営利の区別は、この条文の基本的な要件ではありません。"
      [cite_start]C: "正解です。平成30年の法改正により、情報解析を目的とする著作物の利用は、原則として権利者の許諾なく行えるようになりました [cite: 1554]。"
      D: "サーバーの場所だけでなく、様々な要因で準拠法が決まります。単純にそうとは言えません。"
  - rubric: LLMのアラインメントの目的と手法を理解している。
    type: multichoice
    title: 13-19-アラインメントの目的と手法
    question: |
      大規模言語モデル（LLM）の訓練プロセスにおける「アラインメント」の目的とそのための主要な手法の組み合わせとして、最も適切なものを一つ選びなさい。
    choices:
      A: "目的：モデルのパラメーター数を削減すること。／ 手法：モデルの層を減らすプルーニング。"
      B: "目的：より多くの言語に対応させること。／ 手法：多言語のテキストデータで事前学習をやり直す。"
      C: "目的：人間の意図や価値観（有用、誠実、無害など）に沿うようにモデルを調整すること。／ 手法：人間のフィードバックからの強化学習（RLHF）。"
      D: "目的：推論の速度を向上させること。／ 手法：GPUクラスタを増強し、並列計算を行う。"
    answer: C
    feedback:
      A: "これはモデル圧縮の文脈です。"
      B: "これは多言語化の文脈です。"
      [cite_start]C: "正解です。アラインメントは、モデルの挙動を人間にとって望ましいものに調整するプロセスであり、RLHFはそのための代表的な手法です [cite: 1436, 1447, 1488]。"
      D: "これは推論の高速化・効率化の文脈です。"
  - rubric: 生成AIが生産性に与える影響の傾向を理解している。
    type: multichoice
    title: 14-20-生成AIと生産性
    question: |
      実証研究によって示された、生成AIが人間の労働生産性に与える影響の傾向として、最も適切なものを一つ選びなさい。
    choices:
      A: "主に単純な定型業務を自動化するため、低スキル労働者の仕事が奪われ、高スキル労働者の生産性には影響しない。"
      B: "導入コストが高いため、高スキル・高賃金の職種でのみ生産性向上の効果が見られ、スキル格差を拡大させる。"
      C: "特に経験の浅い従業員や低スキル層の生産性を大幅に向上させる効果があり、スキル格差を縮小させる可能性がある。"
      D: "全てのスキルレベルの労働者の生産性を一様に低下させることが報告されている。"
    answer: C
    feedback:
      [cite_start]A: "高スキル労働者にも影響があることが示されています [cite: 1506]。"
      [cite_start]B: "低スキル層での効果が大きいという報告があります [cite: 1501, 1503]。"
      [cite_start]C: "正解です。複数のRCT研究で、特に低スキル層における生産性向上効果が大きいことが示されています [cite: 1501, 1503]。"
      [cite_start]D: "生産性を向上させる効果が多くの研究で報告されています [cite: 1501, 1502, 1503]。"
