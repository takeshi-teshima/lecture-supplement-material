      [cite_start]A: "k-NNはパラメーターを持たないノンパラメトリックモデルです [cite: 1044]。"
      [cite_start]B: "正解です。多項式回帰は、特徴写像として $\\phi(x)=(1, x, x^2, ...)$ を用いたパラメーター線形モデルです [cite: 591]。"
      C: "決定木は非線形なモデルですが、この形式では表現されません。"
      [cite_start]D: "誤差逆伝播法は最適化アルゴリズムです [cite: 974]。"
  - rubric: 学習率の役割を理解している。
    type: multichoice
    title: 05-05-学習率の役割
    question: |
