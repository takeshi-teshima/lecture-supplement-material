      C: "順序が異なります。"
      D: "順序が逆です。"
  - rubric: 検証データの役割を理解している。
    type: multichoice
    title: 03-07-検証データの役割
    question: |
      ハイパーパラメーターを選択する際に、訓練データとは別に「検証データ」を用意する。その最も重要な役割として、適切なものを一つ選びなさい。
    choices:
      A: "訓練データの正解ラベルが正しいかを確認するために使う。"
      B: "異なるハイパーパラメーター設定で学習したモデルたちの性能を公平に比較し、最適なものを選択するために使う。"
      C: "モデルの最終的な性能を、社会に対して報告するために使う。"
      D: "訓練データが不足している場合に、データの代わりとして学習に使う。"
    answer: B
    feedback:
      A: "ラベルの正しさの確認は、データ作成段階で行うべきことです。"
      [cite_start]B: "正解です。検証データは、モデルの汎化性能を代理で評価し、最適なハイパーパラメーターを見つけるための「ものさし」として機能します [cite: 688]。"
      [cite_start]C: "その役割を担うのは、学習にもモデル選択にも使われていない「テストデータ」です [cite: 688]。"
      D: "検証データは学習には使いません。"
  - rubric: 帰納バイアスの重要性を理解している。
    type: multichoice
    title: 03-08-帰納バイアスの重要性
    question: |
      「あらゆる問題で最強の万能な学習アルゴリズムは存在しない」ことを示唆するNo-Free-Lunch Theoremを踏まえたとき、ある特定のタスクで高い性能を出すモデルを開発するために重要となる考え方は何か。最も適切なものを一つ選びなさい。
    choices:
      A: "モデルのパラメーター数を可能な限り増やすこと。"
      B: "そのタスクに適した「仮定」や「好ましさ」（帰納バイアス）をモデルや学習アルゴリズムに組み込むこと。"
      C: "計算時間を無視して、全ての可能なモデルを試すこと。"
      D: "学習データを一切使わず、人間の直感だけでモデルを設計すること。"
    answer: B
    feedback:
      A: "パラメーター数を増やすだけでは、タスクに合わないと過適合する可能性があります。"
      [cite_start]B: "正解です。No-Free-Lunch Theoremは、汎用性よりも、特定のタスクドメインに特化したバイアスを持つことの重要性を示唆しています [cite: 727, 728]。"
      C: "全てのモデルを試すことは現実的ではありません。"
      D: "データからの学習は機械学習の根幹です。"
  - rubric: 学習曲線から過適合を判断できる。
    type: multichoice
    title: 02-09-学習曲線と過適合
    question: |
      モデルの複雑度と損失の関係を示す学習曲線において、「過適合」が起きている典型的な状況として、最も適切なものを一つ選びなさい。
    choices:
      A: "訓練損失とテスト損失が両方とも高い値で収束している。"
      B: "訓練損失は低いが、テスト損失が高い値を示している。"
      C: "訓練損失は高いが、テスト損失が低い値を示している。"
      D: "訓練損失とテスト損失が両方とも低い値で収束している。"
    answer: B
    feedback:
      [cite_start]A: "これは「過少適合」の状態です [cite: 625]。"
      [cite_start]B: "正解です。訓練データには適合しているが、汎化に失敗している状態を示しています [cite: 626]。"
      C: "このような状況は通常起こりえません。"
      D: "これは学習が成功している状態です。"
  - rubric: サブワード分割の利点を理解している。
    type: multichoice
    title: 11-10-サブワード分割の利点
    question: |
      テキストの前処理であるトークン化において、辞書にない未知語に遭遇しても対応でき、かつ単語の内部構造（例：接頭辞）を捉えられる可能性がある手法として、最も適切なものを一つ選びなさい。
    choices:
      A: "文字コード化"
      B: "ワンホットエンコーディング"
      C: "サブワード分割"
      D: "全文平均化"
    answer: C
    feedback:
      [cite_start]A: "文字コードは文字の数値表現であり、分割手法ではありません [cite: 988]。"
      [cite_start]B: "ワンホットエンコーディングはトークンをベクトル化する手法です [cite: 1275]。"
      [cite_start]C: "正解です。サブワード分割は、単語をより小さな単位に分割することで、未知語を既知のサブワードの組み合わせとして表現できます [cite: 1269, 1271]。"
      [cite_start]D: "これは文書全体のベクトル表現を得る手法の一つです [cite: 1301]。"
  - rubric: U-Netアーキテクチャの特徴を理解している。
    type: multichoice
    title: 10-11-U-Netの特徴
    question: |
      画像を入力とし、入力と同じサイズのセマンティックセグメンテーションマップ（各ピクセルにクラスラベルを割り当てた画像）を出力するタスクに適した、U字型のアーキテクチャを持つモデルとして、講義で紹介されたものを一つ選びなさい。
    choices:
      A: "BERT"
      B: "U-Net"
      C: "k-最近傍法"
      D: "ロジスティック回帰"
    answer: B
    feedback:
      [cite_start]A: "BERTはテキスト処理用のモデルです [cite: 1317]。"
      [cite_start]B: "正解です。U-Netは、エンコーダー・デコーダー構造とスキップ接続を持ち、医用画像セグメンテーションなどで広く使われます [cite: 1219]。"
      [cite_start]C: "k-NNは事例ベースの汎用的なモデルです [cite: 1040]。"
      [cite_start]D: "ロジスティック回帰は分類モデルですが、画像セグメンテーションには直接使われません [cite: 862]。"
  - rubric: 自己回帰生成における貪欲法の問題を理解している。
    type: multichoice
    title: 12-12-貪欲生成の問題点
    question: |
      自己回帰型のテキスト生成において、常に確率が最大のトークンを選択する貪欲法（Greedy search）の欠点として、最も適切なものを一つ選びなさい。
    choices:
      A: "計算コストが非常に高い。"
      B: "文法的に誤った文章を生成しやすい。"
      C: "ありきたりで多様性に欠ける文章を生成しやすい。"
      D: "非常に創造的だが、意味不明な文章を生成しやすい。"
    answer: C
    feedback:
      A: "計算コストは比較的低いです。"
      B: "文法的な正しさは比較的保たれやすいです。"
      [cite_start]C: "正解です。常に最も「ありきたりな」選択をするため、同じような決まりきった文章ばかり生成する傾向があります [cite: 1343]。"
      D: "創造性は低くなる傾向があります。"
  - rubric: 次元の呪いの数学的背景を理解している。
    type: multichoice
    title: 08-13-次元の呪いと幾何学
    question: |
      高次元空間において「次元の呪い」と呼ばれる現象が発生する。この現象がk-最近傍法（k-NN）に与える影響として、最も深刻なものを一つ選びなさい。
    choices:
      A: "データの全ての点が原点に集中してしまうため、距離が計算できなくなる。"
      B: "任意の2点間の距離の差がほとんどなくなり、「最も近い点」を探すというk-NNの基本操作が意味をなさなくなる。"
      C: "メモリ使用量が次元数に比例して爆発的に増大し、訓練データを保持できなくなる。"
      D: "勾配の計算が不可能になり、モデルを学習させることができなくなる。"
    answer: B
    feedback:
      [cite_start]A: "原点ではなく、中心から一定の距離にある「球面」に体積が集中します [cite: 1111]。"
      [cite_start]B: "正解です。距離の均質化により、近傍とそうでない点の区別が困難になることが、距離ベースの手法にとって深刻な問題です [cite: 1114, 1117]。"
      C: "メモリ使用量は増えますが、これが次元の呪いの本質的な問題ではありません。"
      [cite_start]D: "k-NNは勾配計算を伴う学習を行いません [cite: 1044]。"
  - rubric: BERTとGPTの事前学習タスクの違いを理解している。
    type: multichoice
    title: 11-14-BERTとGPTの事前学習タスク
    question: |
      BERTとGPTは、どちらもTransformerアーキテクチャを基にしているが、その事前学習タスクには大きな違いがある。その違いとして、最も適切なものを一つ選びなさい。
    choices:
      A: "BERTは翻訳タスク、GPTは要約タスクで事前学習される。"
      B: "BERTは系列全体の文脈を考慮する「マスク言語モデリング（穴埋め問題）」、GPTは未来の情報を参照しない「次トークン予測」で事前学習される。"
      C: "BERTは教師あり学習、GPTは強化学習で事前学習される。"
      D: "BERTはテキストデータ、GPTは画像データで事前学習される。"
    answer: B
    feedback:
      A: "これらは下流のタスク（応用タスク）の例です。"
      [cite_start]B: "正解です。BERTは入力の一部をマスクしてそれを予測させ、GPTは与えられた文脈の次の単語を予測させることで、それぞれ異なる能力を獲得します [cite: 1318, 1321]。"
      C: "どちらも自己教師あり学習という枠組みで事前学習されます。"
      D: "どちらもテキストデータで事前学習されます。"
  - rubric: 表現学習の概念を理解している。
    type: multichoice
    title: 08-15-表現学習の定義
    question: |
      深層学習における「表現学習」の考え方として、最も適切なものを一つ選びなさい。
    choices:
      A: "人間が事前に設計した特徴量を、モデルが効率的に学習すること。"
      B: "モデルの学習プロセス自体が、生の入力データからタスクを解くのに有用な特徴量（ベクトル表現）を自動で発見・構築すること。"
      C: "モデルの出力結果を、人間が理解しやすいように可視化する技術のこと。"
      D: "訓練データをできるだけ多く記憶し、全く同じ入力が来た時に素早く応答できるようにすること。"
    answer: B
    feedback:
      [cite_start]A: "これは特徴量エンジニアリングを用いた従来のアプローチです [cite: 603]。"
      [cite_start]B: "正解です。表現学習は、データから特徴抽出器そのものを学習するアプローチです [cite: 1029]。"
      C: "これはモデルの解釈性の話です。"
      D: "これは単なる記憶であり、表現学習の目的である汎化可能な特徴の獲得とは異なります。"
  - rubric: 誤差逆伝播法の数学的原理を理解している。
    type: multichoice
    title: 07-16-誤差逆伝播法の原理
    question: |
      ニューラルネットワークの学習において、複雑なモデル全体の勾配を効率的に計算する誤差逆伝播法が依存している、最も基本的な数学的原理を一つ選びなさい。
    choices:
      A: "ベイズの定理"
      B: "大数の法則"
      C: "合成関数の微分の連鎖律（Chain Rule）"
      D: "ピタゴラスの定理"
    answer: C
    feedback:
      A: "ベイズの定理は確率の更新に関するもので、直接関係ありません。"
      B: "大数の法則は期待値と標本平均の関係性に関するもので、直接関係ありません。"
      [cite_start]C: "正解です。誤差逆伝播法は、連鎖律を計算グラフ上で出力から入力へと逆に適用していくことで、全てのパラメーターに関する勾配を効率的に求めます [cite: 970]。"
      D: "幾何学の定理であり、関係ありません。"
  - rubric: 思考の連鎖（CoT）の目的を理解している。
    type: multichoice
    title: 13-17-思考の連鎖（CoT）の目的
    question: |
      大規模言語モデル（LLM）において、入力プロンプトに「ステップごとに考えましょう。(Let's think step by step.)」と付け加えるだけで、複雑な推論タスクの性能が向上するプロンプト技術を何と呼ぶか。"
    choices:
      A: "少数事例プロンプティング"
      B: "ゼロショット思考の連鎖（Zero-shot CoT）"
      C: "指示チューニング"
      D: "検索拡張生成（RAG）"
    answer: B
    feedback:
      [cite_start]A: "少数事例プロンプティングは、いくつかの解答例をプロンプトに含める手法です [cite: 1400]。"
      [cite_start]B: "正解です。解答例なしに推論過程の生成を促すこの手法はゼロショットCoTと呼ばれます [cite: 1404]。"
      [cite_start]C: "指示チューニングは、モデルをファインチューニングする学習段階のことです [cite: 1450]。"
      [cite_start]D: "RAGは、外部文書を検索して回答を生成する手法です [cite: 1544]。"
  - rubric: AIにおけるバイアスの原因を理解している。
    type: multichoice
    title: 14-18-AIバイアスの原因
    question: |
      AIの倫理的・安全上の課題の一つである「バイアス」が、モデルに生じる主な原因として、最も適切なものを一つ選びなさい。
    choices:
      A: "モデルのパラメーター数が多すぎること。"
      B: "学習に用いられるデータセットに、社会的な偏見やステレオタイプが反映されていること。"
      C: "活性化関数としてReLUを使用していること。"
      D: "最適化アルゴリズムとして確率的勾配降下法を使用していること。"
    answer: B
    feedback:
      A: "パラメーター数が多いとバイアスを学習しやすくなる可能性はありますが、根本原因ではありません。"
      [cite_start]B: "正解です。モデルはデータに潜むパターンを学習するため、データ自体が偏っていると、その偏見をモデルが学習・増幅してしまうことが主な原因です [cite: 1521]。"
      C: "活性化関数の種類は、バイアスの直接的な原因ではありません。"
      D: "最適化アルゴリズムは、バイアスの直接的な原因ではありません。"
  - rubric: AI開発における計算資源の重要性を理解している。
    type: multichoice
    title: 14-19-AIと計算資源
    question: |
      AIモデルの学習・推論に不可欠な計算資源であり、その市場動向がAI業界全体の競争環境に大きな影響を与えているハードウェアとして、最も重要なものを一つ選びなさい。
    choices:
      A: "CPU（中央処理装置）"
      B: "SSD（ソリッドステートドライブ）"
      C: "GPU（グラフィックスプロセッシングユニット）"
      D: "RAM（ランダムアクセスメモリ）"
    answer: C
    feedback:
      A: "CPUも使われますが、深層学習の主要な計算である行列演算にはGPUほど適していません。"
      B: "SSDはデータの保存に使われますが、計算そのものを担うわけではありません。"
      [cite_start]C: "正解です。GPUは大規模な並列計算（行列演算）に特化しており、深層学習の学習と推論を劇的に高速化するため、現代AIの基盤となっています [cite: 1568]。"
      D: "RAMは一時的なデータ保持に使われますが、計算そのものを担うわけではありません。"
  - rubric: RLHFの役割を理解している。
    type: multichoice
    title: 13-20-RLHFの役割
    question: |
      事前学習済みのLLMを、人間の意図に沿うように調整する「アラインメント」の中でも、特に有害な応答を抑制したり、より好ましい応答スタイルを学習させたりするために用いられる、人間の「選好（どちらが良いか）」データを利用する学習手法として、最も適切なものを一つ選びなさい。
    choices:
      A: "次トークン予測による自己教師あり学習"
      B: "指示チューニング（教師付きファインチューニング）"
      C: "人間のフィードバックからの強化学習（RLHF）"
      D: "検索拡張生成（RAG）"
    answer: C
    feedback:
      [cite_start]A: "これは事前学習の段階で行われる学習です [cite: 1493]。"
      [cite_start]B: "指示チューニングは「模範解答」を学習させますが、RLHFは「どちらが良いか」という比較評価から学習します [cite: 1450]。"
      [cite_start]C: "正解です。RLHFは、正解が一つに定まらないような、より主観的で複雑な人間の好みをモデルに反映させるための強力な手法です [cite: 1471, 1488]。"
      [cite_start]D: "RAGはハルシネーション対策の推論時テクニックです [cite: 1544]。"

