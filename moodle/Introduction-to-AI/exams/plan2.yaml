      C: "局所最適解は、最適化問題における解の一種です。"
      [cite_start]D: "過適合は、汎化性能が低い状態を指します [cite: 623]。"
  - rubric: パラメーター線形モデルの例を識別できる。
    type: multichoice
    title: 02-04-パラメーター線形モデルの例
