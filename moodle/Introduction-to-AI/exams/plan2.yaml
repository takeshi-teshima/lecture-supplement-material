      [cite_start]C: "特徴写像は入力を変換する関数です [cite: 585]。"
      [cite_start]D: "経験リスクは、訓練データ全体に対する損失の平均です [cite: 457]。"
  - rubric: 汎化性能の概念を理解している。
    type: multichoice
    title: 01-03-汎化性能の定義
    question: |
