      B: "勾配は $\\nabla L(\\theta)$ です。"
      [cite_start]C: "正解です。$\\eta$ は学習率と呼ばれ、パラメーター更新のステップサイズを制御するハイパーパラメーターです [cite: 867]。"
      [cite_start]D: "正則化係数は通常 $\\lambda$ などで表されます [cite: 632]。"
