    question: |
      第1次AIブームで中心的に研究された「推論と探索」のアプローチが得意とした問題の例として、最も適切なものを一つ選びなさい。
    choices:
      A: "インターネット上の大量の画像から猫を認識する問題"
      B: "専門家の知識を学習し、病気の診断を行う問題"
      C: "膨大な顧客データから購買パターンを予測する問題"
      D: "ルールが明確な迷路やパズルを解く問題"
    answer: D
    feedback:
      [cite_start]A: "これは第3次ブームの統計的機械学習が得意とする問題です [cite: 114]。"
      [cite_start]B: "これは第2次ブームのエキスパートシステムが目指した問題です [cite: 107]。"
      [cite_start]C: "これも第3次ブームの統計的機械学習が得意とする問題です [cite: 114]。"
      [cite_start]D: "正解です。第1次ブームでは、ルールが明確に定義された特定の問題を解くことが中心でした [cite: 103]。"
  - rubric: モデルとパラメーターの定義を理解している。
    type: multichoice
    title: 01-02-モデルとパラメーターの定義
    question: |
      機械学習モデルが持つ、学習によって値が決定される調整可能な変数を何と呼ぶか、最も適切なものを一つ選びなさい。
    choices:
      A: "ラベル"
      B: "特徴量"
      C: "パラメーター"
      D: "ハイパーパラメーター"
    answer: C
    feedback:
      [cite_start]A: "ラベルは予測の正解データです [cite: 283]。"
      [cite_start]B: "特徴量はモデルへの入力データです [cite: 282]。"
      [cite_start]C: "正解です。パラメーターは、データから学習を通じて自動的に調整される変数です [cite: 396]。"
      [cite_start]D: "ハイパーパラメーターは、学習の前に人間が設定する変数です [cite: 686]。"
  - rubric: 0/1損失の最適化における困難性を理解している。
    type: multichoice
    title: 04-03-0/1損失と最適化
    question: |
      分類タスクで標準的に用いられる0/1損失関数を、経験リスク最小化（ERM）の目的関数として直接用いることが難しい主な理由として、最も適切なものを一つ選びなさい。
    choices:
      A: "損失の値が常に0か1であるため、計算コストが非常に高くなるから。"
      B: "パラメーターをわずかに変化させても損失の値が変化しない点がほとんどで、勾配を用いた最適化ができないから。"
      C: "0/1損失は回帰タスクにしか適用できず、分類タスクには使えないから。"
      D: "損失の期待値（リスク）を計算するのが容易すぎるため、過適合を引き起こしやすいから。"
    answer: B
    feedback:
      A: "計算コストが高いわけではありません。"
      [cite_start]B: "正解です。0/1損失は不連続なステップ関数であり、微分がほとんどの点でゼロになるため、勾配降下法などの最適化手法を適用できません [cite: 795]。"
      [cite_start]C: "0/1損失は分類タスクでの定番の損失関数です [cite: 429]。"
      D: "リスクの計算は困難です。また、過適合しやすいのはモデルの複雑さが原因です。"
  - rubric: 帰納バイアスの概念を理解している。
    type: multichoice
    title: 03-04-帰納バイアスの定義
    question: |
      学習の哲学における「帰納バイアス」の説明として、最も適切なものを一つ選びなさい。
    choices:
      A: "訓練データに含まれる社会的な偏見のこと。"
      B: "学習アルゴリズムが、ありうる複数の仮説の中から特定の種類の解を好む傾向や、そのための仮定のこと。"
      C: "モデルの予測が常に楽観的な方向に偏ってしまう現象のこと。"
      D: "人間がAIに対して抱く、非論理的な先入観のこと。"
    answer: B
    feedback:
      [cite_start]A: "これはデータバイアスと呼ばれる問題で、帰納バイアスとは区別されます [cite: 1521]。"
      [cite_start]B: "正解です。帰納バイアスは、限られたデータから汎化するために必要な「学習アルゴリズムの持つ好みや前提」を指します [cite: 730]。"
      C: "これは特定のモデルの特性かもしれませんが、帰納バイアスの定義ではありません。"
      D: "これは人間の認知バイアスに関する話です。"
  - rubric: パラメーター線形モデルにおける特徴写像の役割を理解している。
    type: multichoice
    title: 02-05-特徴写像の定義
    question: |
      パラメーター線形モデル $f_\\theta(x) = \\theta^\\top \\phi(x)$ において、入力 $x$ をベクトル $\\phi(x)$ に変換する関数 $\\phi$ を何と呼ぶか、最も適切なものを一つ選びなさい。
    choices:
      A: "損失関数"
      B: "活性化関数"
      C: "特徴写像"
      D: "目的関数"
    answer: C
    feedback:
      [cite_start]A: "損失関数は予測の誤差を測る関数です [cite: 426]。"
      [cite_start]B: "活性化関数はニューラルネットワークの層で非線形性を導入する関数です [cite: 925]。"
      [cite_start]C: "正解です。$\\phi(x)$ は特徴写像（または基底関数）と呼ばれます [cite: 585]。"
      [cite_start]D: "目的関数は学習時に最小化（または最大化）される関数です [cite: 539]。"
  - rubric: リスクと経験リスクの関係性を理解している。
    type: multichoice
    title: 01-06-リスクと経験リスクの関係
    question: |
      理想的な学習目標である「リスク」と、現実的な代理目標である「経験リスク」の関係性について、最も適切な説明を一つ選びなさい。
    choices:
      A: "リスクは訓練データに対する平均誤差、経験リスクは未知のデータに対する平均誤差である。"
      B: "経験リスクは常にリスクよりも大きい値を取ることが理論的に証明されている。"
      C: "リスクは損失の期待値であり計算不可能だが、経験リスクはその標本近似であり計算可能である。ERMはこの経験リスクを最小化する。"
      D: "リスクと経験リスクは全く無関係な指標であり、経験リスクを最小化してもリスクが小さくなる保証はない。"
    answer: C
    feedback:
      [cite_start]A: "説明が逆です。リスクが未知データに対する期待損失、経験リスクが訓練データに対する平均損失です [cite: 431, 457]。"
      B: "そのような関係性は一般には成り立ちません。"
      [cite_start]C: "正解です。ERMは、計算不可能なリスクの代わりに、その標本近似である経験リスクを最小化するアプローチです [cite: 457, 460]。"
      [cite_start]D: "経験リスクはリスクの良い近似であることが期待されるため、このアプローチは有効です [cite: 447]。"
  - rubric: ハイパーパラメーター探索手法を比較できる。
    type: multichoice
    title: 03-07-ハイパーパラメーター探索手法の比較
    question: |
      ハイパーパラメーターが複数ある場合に、その最適な組み合わせを効率的に探索する「ベイズ最適化」の特徴として、最も適切なものを一つ選びなさい。
    choices:
      A: "全てのハイパーパラメーターの組み合わせを網羅的に試し、最も性能が良かったものを選択する。"
      B: "ハイパーパラメーターの候補を完全にランダムにサンプリングし、試行回数内で最良のものを選択する。"
      C: "訓練データと検証データを交互に入れ替えながら、全てのデータが一度は検証に使われるように評価する。"
      D: "これまでの評価結果に基づき、次に試すべき有望なハイパーパラメーターの組み合わせを統計的に推測しながら探索を進める。"
    answer: D
    feedback:
      [cite_start]A: "これは「グリッドサーチ」の説明です [cite: 702]。"
      [cite_start]B: "これは「ランダムサーチ」の説明です [cite: 703]。"
      [cite_start]C: "これは「交差検証」の説明であり、ハイパーパラメーターの評価方法ではありますが、探索方法そのものではありません [cite: 692]。"
      [cite_start]D: "正解です。ベイズ最適化は、より少ない試行回数で最適解を見つけることを目指す、効率的な探索手法です [cite: 704]。"
  - rubric: L2正則化の挙動を理解している。
    type: multichoice
    title: 02-08-L2正則化の挙動
    question: |
      モデルの過適合を抑制するためにL2正則化を導入する。その目的関数 $L(\\theta) = \\hat{R}(f_\\theta) + \\lambda ||\\theta||^2$ に関する記述として、最も適切なものを一つ選びなさい。
    choices:
      A: "$\\lambda$ を大きくすると正則化の効果が弱まり、モデルはより複雑になる傾向がある。"
      B: "$\\lambda$ を大きくすると正則化の効果が強まり、モデルのパラメーター $||\theta||$ がより小さく抑えられる傾向がある。"
      C: "この手法は、パラメーターの数を直接的に減らすことでモデルを単純化する。"
      D: "この手法は、訓練誤差 $\\hat{R}(f_\\theta)$ を大きくすることを目的としており、汎化性能とは無関係である。"
    answer: B
    feedback:
      [cite_start]A: "逆です。$\\lambda$ は罰則の重みなので、大きくすると正則化の効果は強まります [cite: 635]。"
      [cite_start]B: "正解です。$\\lambda$ を大きくすると、パラメーターのノルムを小さくすることへのインセンティブが強まります [cite: 635]。"
      C: "パラメーターの数を減らすのはL1正則化などの特徴です。L2正則化は値をゼロに近づけますが、ゼロにはしにくいです。"
      D: "汎化性能を高める（テスト誤差を小さくする）ことが最終的な目的です。"
  - rubric: 表現定理の含意を理解している。
    type: multichoice
    title: 09-09-表現定理の帰結
    question: |
      カーネル法で用いられる「表現定理（Representer Theorem）」が示唆する重要な帰結として、最も適切なものを一つ選びなさい。
    choices:
      A: "どのようなモデルでも、最終的なパラメーターは必ず訓練データそのものになる。"
      B: "適切な条件下で学習された線形モデルの解は、訓練データの特徴ベクトルの線形結合で表現できるため、高次元特徴空間での内積をカーネル関数で代替できる。"
      C: "モデルの表現能力は、使用するカーネル関数の数に比例して向上する。"
      D: "あらゆるカーネル関数は、何らかの有限次元の特徴写像の内積として表現できる。"
    answer: B
    feedback:
      A: "パラメーターが訓練データ「の線形結合」で表現できる、ということです。"
      [cite_start]B: "正解です。この定理が、なぜカーネルトリックという計算上の工夫が正当化されるのか、その理論的な裏付けを与えています [cite: 1064, 1066]。"
      [cite_start]C: "カーネル関数の数ではなく、訓練データ数にパラメーター数が依存します [cite: 1058]。"
      D: "逆で、カーネル関数は無限次元の特徴写像に対応することもあります。"
  - rubric: セグメンテーションタスクの種類を区別できる。
    type: multichoice
    title: 10-10-セグメンテーションの種類
    question: |
      コンピュータービジョンにおけるセグメンテーションタスクのうち、画像内の物体を個体ごとに区別して塗り分ける手法を何と呼ぶか、最も適切なものを一つ選びなさい。
    choices:
      A: "物体検出"
      B: "画像分類"
      C: "セマンティックセグメンテーション"
      D: "インスタンスセグメンテーション"
    answer: D
    feedback:
      [cite_start]A: "物体検出は、矩形（バウンディングボックス）で位置を特定するタスクです [cite: 1182]。"
      [cite_start]B: "画像分類は、画像全体に一つのラベルを付けるタスクです [cite: 1181]。"
      [cite_start]C: "セマンティックセグメンテーションは、同じクラスの物体（例：複数の人物）を区別せず、同じ色で塗り分けます [cite: 1185]。"
      [cite_start]D: "正解です。インスタンスセグメンテーションは、人1、人2のように、個々の物体（インスタンス）を区別して塗り分けます [cite: 1185]。"
  - rubric: ニューラルネットワークにおける活性化関数の役割を理解している。
    type: multichoice
    title: 06-11-活性化関数の役割
    question: |
      ニューラルネットワークにおいて、線形変換の結果に適用され、モデルに非線形性を導入する役割を持つ関数を何と呼ぶか、最も適切なものを一つ選びなさい。
    choices:
      A: "損失関数"
      B: "活性化関数"
      C: "目的関数"
      D: "カーネル関数"
    answer: B
    feedback:
      [cite_start]A: "損失関数は予測の誤差を測ります [cite: 426]。"
      [cite_start]B: "正解です。活性化関数がなければ、何層重ねてもモデルは線形な変換しか表現できません [cite: 925, 931]。"
      [cite_start]C: "目的関数は学習時に最小化される関数です [cite: 539]。"
      [cite_start]D: "カーネル関数は類似度を計算する関数です [cite: 1059]。"
  - rubric: 深層学習における学習戦略（事前学習）を理解している。
    type: multichoice
    title: 08-12-事前学習の定義
    question: |
      深層学習において、大規模データセットで汎用的なモデルをあらかじめ学習させておくフェーズを何と呼ぶか、最も適切なものを一つ選びなさい。
    choices:
      A: "精密調整（ファインチューニング）"
      B: "事前学習（プレトレーニング）"
      C: "経験リスク最小化"
      D: "早期停止"
    answer: B
    feedback:
      [cite_start]A: "精密調整は、事前学習済みモデルを個別タスクに適応させるフェーズです [cite: 1020]。"
      [cite_start]B: "正解です。事前学習は、後の精密調整で再利用することを目的とした、最初の学習フェーズです [cite: 1023]。"
      [cite_start]C: "経験リスク最小化は、学習の基本原理の一つです [cite: 460]。"
      [cite_start]D: "早期停止は、過適合を防ぐためのテクニックです [cite: 870]。"
  - rubric: 誤差逆伝播法の原理と流れを理解している。
    type: multichoice
    title: 07-13-誤差逆伝播法の原理
    question: |
      誤差逆伝播法（Backpropagation）のアルゴリズムを支える数学的な原理と、その処理の流れとして、最も適切なものを一つ選びなさい。
    choices:
      A: "原理はニュートン法。出力から入力に向かって、損失関数の2階微分を計算する。"
      B: "原理は連鎖律（Chain Rule）。計算グラフを順方向にたどって損失を計算し、逆方向にたどりながら各パラメーターの勾配を効率的に計算する。"
      C: "原理は大数の法則。ミニバッチごとに勾配を計算し、それらを平均することで真の勾配を推定する。"
      D: "原理はベイズの定理。パラメーターの事後分布を計算し、その期待値をもって勾配の代わりとする。"
    answer: B
    feedback:
      A: "ニュートン法も最適化手法ですが、誤差逆伝播法とは異なります。"
      [cite_start]B: "正解です。誤差逆伝播法は、合成関数の微分である連鎖律を、計算グラフ上でシステマチックに適用するアルゴリズムです [cite: 970, 971, 974]。"
      C: "これは確率的勾配降下法の説明の一部です。"
      D: "ベイズ的な最適化手法もありますが、誤差逆伝播法の原理ではありません。"
  - rubric: アテンション機構の構成要素の役割を理解している。
    type: multichoice
    title: 11-14-アテンションのQKVの役割
    question: |
      Transformerアーキテクチャで用いられる自己注意機構（Self-Attention）において、各トークンが生成するQuery, Key, Valueベクトルの役割に関する説明として、最も適切なものを一つ選びなさい。
    choices:
      A: "Queryはトークンの位置情報、Keyはその品詞情報、Valueはその意味情報を表す。"
      B: "全て同じベクトルであり、計算を3回繰り返すことで精度を高めている。"
      C: "Queryは他のトークンに「問い合わせる」情報、Keyは自身の「索引」情報、Valueは他のトークンに提供する「内容」情報としての役割を持つ。"
      D: "Queryは入力トークン、Keyは中間トークン、Valueは出力トークンを表す。"
    answer: C
    feedback:
      A: "これらは学習によって獲得されるベクトルであり、特定の文法情報を直接表すわけではありません。"
      [cite_start]B: "それぞれ異なる線形変換（異なる重み行列）によって生成される、役割の違うベクトルです [cite: 1287]。"
      [cite_start]C: "正解です。このアナロジーは、アテンションがトークン間の情報検索のような働きをしていることを直観的に説明するものです [cite: 1290]。"
      D: "これらは全て同じトークンから生成され、トークン間の相互作用を計算するために使われます。"
  - rubric: 次元の呪いの具体例を識別できる。
    type: multichoice
    title: 08-15-次元の呪いの具体例
    question: |
      高次元空間の性質である「次元の呪い」に関する記述として、誤っているものを一つ選びなさい。
    choices:
      A: "高次元の超球の体積は、その中心付近ではなく、表面の薄い殻の部分にほとんどが集中する。"
      B: "高次元空間では、ランダムに選んだ2点間の距離は、どのペアを選んでもほぼ同じような大きい値になる傾向がある。"
      C: "高次元空間では、ランダムに選んだ2つのベクトルは、ほぼ直交する（なす角が90度に近くなる）傾向がある。"
      D: "高次元空間ではデータが非常に密に詰まるため、最近傍点を見つけるのが容易になる。"
    answer: D
    feedback:
      [cite_start]A: "これは球面集中現象として知られる、高次元空間の正しい性質です [cite: 1111]。"
      [cite_start]B: "これは距離の均質化として知られる、高次元空間の正しい性質です [cite: 1114]。"
      [cite_start]C: "これも高次元空間の正しい性質です [cite: 1115]。"
      [cite_start]D: "誤りであり、これが正解です。高次元空間は直観に反して非常に「スカスカ」であり、データは密に詰まりません [cite: 1109]。"
  - rubric: 対照学習のメカニズムを理解している。
    type: multichoice
    title: 09-16-対照学習のメカニズム
    question: |
      ラベルなしデータから類似度を学習する「対照学習」の基本的な仕組みとして、最も適切なものを一つ選びなさい。
    choices:
      A: "同じデータからデータ拡張などで生成したペアを「正例」、ミニバッチ内の他のデータとのペアを「負例」とし、正例ペアの類似度を高く、負例ペアの類似度を低くするように表現を学習する。"
      B: "全てのデータペアの類似度を計算し、その分布が一様分布に近づくように学習する。"
      C: "エンコーダーでデータを圧縮し、デコーダーで元に戻す再構成誤差を最小化することで、類似したデータが近い潜在表現を持つように学習する。"
      D: "全てのデータ点をクラスタリングし、同じクラスターに属するデータが類似しているとみなして学習する。"
    answer: A
    feedback:
      [cite_start]A: "正解です。この「似ているものを近づけ、似ていないものを遠ざける」という対比的な学習が、対照学習の基本原理です [cite: 1164]。"
      B: "一様分布に近づけるのではありません。類似・非類似構造を学習させます。"
      [cite_start]C: "これはオートエンコーダーによる表現学習の説明です [cite: 1032]。"
      D: "これはクラスタリングの考え方ですが、対照学習の典型的な枠組みとは異なります。"
  - rubric: LLMの創発的能力を理解している。
    type: multichoice
    title: 13-17-創発的能力の定義
    question: |
      大規模言語モデル（LLM）において、モデルが一定以上の規模になると、小さいモデルでは見られなかった高度な能力が予期せず現れる現象を何と呼ぶか、最も適切なものを一つ選びなさい。
    choices:
      A: "過適合"
      B: "アラインメント"
      C: "創発的能力"
      D: "スケーリング則"
    answer: C
    feedback:
      [cite_start]A: "過適合は、汎化性能が低下する現象です [cite: 623]。"
      [cite_start]B: "アラインメントは、モデルを人間の意図に沿わせる調整プロセスです [cite: 1435]。"
      [cite_start]C: "正解です。創発的能力は、スケールアップによって量的な変化が質的な変化を生む現象を指します [cite: 1394]。"
      [cite_start]D: "スケーリング則は、性能がスケールに対して予測可能に向上する経験則であり、創発的能力が現れる背景となっています [cite: 1390]。"
  - rubric: AI生成物と著作権の基本的な関係を理解している。
    type: multichoice
    title: 14-18-AI生成物と著作権
    question: |
      AIによる生成物が既存の著作物と類似していた場合に、著作権侵害と判断されるための主要な論点として、講義で挙げられているものを一つ選びなさい。
    choices:
      A: "生成にかかった時間の長さ"
      B: "生成AIがオープンソースであるかどうか"
      C: "生成物が既存の著作物に対して「依拠」しているかどうか"
      D: "生成物が商業的に利用されているかどうか"
    answer: C
    feedback:
      A: "生成時間は著作権侵害の判断基準ではありません。"
      B: "AIのライセンスは別の問題であり、著作権侵害の判断基準ではありません。"
      [cite_start]C: "正解です。著作権侵害の成立には、類似性に加えて、既存の著作物に基づいて創作されたという「依拠性」が論点となります [cite: 1559]。"
      D: "商業利用の有無は損害賠償額などに関わりますが、侵害成立の必須要件ではありません。"
  - rubric: AIエージェントの基本フレームワークを理解している。
    type: multichoice
    title: 13-19-ReActフレームワーク
    question: |
      大規模言語モデル（LLM）を自律エージェントとして機能させるためのフレームワーク「ReAct」の基本サイクルとして、最も適切なものを一つ選びなさい。
    choices:
      A: "予測 → 評価 → 再学習"
      B: "思考 → 行動 → 観察"
      C: "データ収集 → 前処理 → モデル構築"
      D: "エンコード → アテンション → デコード"
    answer: B
    feedback:
      A: "これは一般的な機械学習の改善サイクルです。"
      [cite_start]B: "正解です。ReActフレームワークは、LLMにまず「思考」させて計画を立てさせ、次にツール使用などの「行動」を起こさせ、その結果を「観察」して次の思考につなげるサイクルを回します [cite: 1419]。"
      C: "これは機械学習プロジェクトの一般的な流れです。"
      D: "これはTransformerモデル内部の処理の流れです。"
  - rubric: RLHFのプロセスを理解している。
    type: multichoice
    title: 13-20-RLHFのプロセス
    question: |
      LLMのアラインメント手法である「人間のフィードバックからの強化学習（RLHF）」のプロセスに関する説明として、最も適切なものを一つ選びなさい。
    choices:
      A: "人間が良いと評価した出力を正解データとして、教師付き学習でファインチューニングする。"
      B: "人間による複数の出力のランキング（選好データ）を収集し、それを基に「出力の良さ」を予測する報酬モデルを学習し、その報酬を最大化するようにLLMを強化学習で調整する。"
      C: "人間が書いた大量の倫理的なテキストを読み込ませ、次トークン予測タスクを通じて倫理観を学習させる。"
      D: "LLMに倫理的な問題を出題し、正答率が上がるようにパラメーターを調整する。"
    answer: B
    feedback:
      [cite_start]A: "これは指示チューニングの説明に近いです [cite: 1450]。"
      [cite_start]B: "正解です。RLHFは「選好データ収集」「報酬モデル学習」「強化学習によるLLM調整」という3つのステップで構成されます [cite: 1472, 1488]。"
      C: "これは事前学習の段階で行われる可能性がありますが、RLHFのプロセスではありません。"
      D: "これは特定のタスクに対するファインチューニングの一種かもしれませんが、RLHFの枠組みとは異なります。"

