  - rubric: 予測モデルにおける「特徴量」の定義を理解している。
    type: multichoice
    title: 01-01-特徴量の定義
    question: |
      予測モデルへの入力として使用される、個々のデータの属性や測定値を何と呼ぶか、最も適切なものを一つ選びなさい。
    choices:
      A: "ラベル"
      B: "パラメーター"
      C: "特徴量"
      D: "ハイパーパラメーター"
    answer: C
    feedback:
      [cite_start]A: "ラベルは予測したい正解データです [cite: 283]。"
      [cite_start]B: "パラメーターはモデルが学習する変数です [cite: 396]。"
      [cite_start]C: "正解です。特徴量は予測の手がかりとなる入力情報です [cite: 282]。"
      [cite_start]D: "ハイパーパラメーターは学習前に人間が設定する変数です [cite: 686]。"
  - rubric: 機械学習における「汎化」の概念を理解している。
    type: multichoice
    title: 01-02-汎化の定義
    question: |
      モデルの学習において最終的に目指すべき「汎化」を最もよく説明しているものを一つ選びなさい。
    choices:
      A: "訓練データに対する予測誤差をゼロにすること。"
      B: "モデルのパラメーター数を可能な限り増やすこと。"
      C: "学習に用いていない未知のデータに対しても、高い予測性能を発揮すること。"
      D: "特定のタスクだけでなく、あらゆるタスクを解けるようにモデルを一般化すること。"
    answer: C
    feedback:
      [cite_start]A: "これは訓練データへの適合であり、過適合につながる可能性があります [cite: 623]。"
      B: "パラメーター数を増やすと過適合のリスクが高まります。"
      [cite_start]C: "正解です。汎化とは、訓練データから学習した規則性を、未知のデータにうまく適用できる能力（汎化性能）を指します [cite: 411]。"
      D: "これは汎用AIなどのより広範な概念であり、ここでいう汎化とは異なります。"
  - rubric: 勾配降下法における学習率の役割を理解している。
    type: multichoice
    title: 05-03-学習率の役割
    question: |
      最適化手法である勾配降下法において、一度の更新でパラメーターが動く大きさ（ステップサイズ）を制御するハイパーパラメーターを何と呼ぶか。
    choices:
      A: "損失"
      B: "勾配"
      C: "学習率"
      D: "バッチサイズ"
    answer: C
    feedback:
      A: "損失は最適化の対象となる指標です。"
      [cite_start]B: "勾配は更新の「方向」を示します [cite: 865, 866]。"
      [cite_start]C: "正解です。学習率は更新の「歩幅」を決めます [cite: 867]。"
      [cite_start]D: "バッチサイズは一度に使うデータ数です [cite: 944]。"
  - rubric: データセットの役割（テストデータ）を理解している。
    type: multichoice
    title: 02-04-テストデータの役割
    question: |
      教師付き学習のプロセスにおいて、学習されたモデルの性能を最終的に評価するために使用される、学習にもハイパーパラメーター調整にも一切使われていないデータセットを何と呼ぶか。
    choices:
      A: "訓練データ"
      B: "検証データ"
      C: "テストデータ"
      D: "ラベルなしデータ"
    answer: C
    feedback:
      [cite_start]A: "訓練データはモデルのパラメーター学習に使われます [cite: 555]。"
      [cite_start]B: "検証データはハイパーパラメーターの調整に使われます [cite: 688]。"
      [cite_start]C: "正解です。テストデータは、開発プロセス全体から隔離され、最終的な汎化性能を一度だけ公平に評価するために使われます [cite: 555]。"
      D: "ラベルなしデータは教師なし学習などで使われます。"
  - rubric: 正則化の目的を理解している。
    type: multichoice
    title: 02-05-正則化の目的
    question: |
      モデルの学習において、目的関数にパラメーターのノルムの大きさに応じた罰則項を加えることで、過適合を抑制する手法の総称を何と呼ぶか。
    choices:
      A: "正則化"
      B: "確率的勾配降下法"
      C: "交差検証"
      D: "早期停止"
    answer: A
    feedback:
      [cite_start]A: "正解です。正則化は、モデルの複雑さを抑えるための一般的なテクニックです [cite: 636]。"
      [cite_start]B: "これは最適化アルゴリズムの一種です [cite: 945]。"
      [cite_start]C: "これはモデル評価・選択の手法です [cite: 692]。"
      [cite_start]D: "これも正則化の一種ですが、より広い総称は「正則化」です [cite: 870]。"
  - rubric: 具体的なシナリオから回帰と分類を区別できる。
    type: multichoice
    title: 01-06-回帰と分類の区別
    question: |
      あるECサイトが、顧客の年齢、居住地域、過去の閲覧履歴という特徴量から、来月の購入金額を予測するタスクを考えた。このタスクは回帰と分類のどちらに該当するか、またその理由として最も適切なものを一つ選びなさい。
    choices:
      A: "分類。購入するかしないかの2値で予測するため。"
      B: "回帰。購入金額という連続的な数値を予測するため。"
      C: "分類。居住地域というカテゴリカルな特徴量が含まれているため。"
      D: "回帰。年齢という数値的な特徴量が含まれているため。"
    answer: B
    feedback:
      A: "タスクは「購入金額」の予測であり、「購入するかしないか」ではありません。"
      [cite_start]B: "正解です。予測対象（ラベル）が「金額」という量的変数であるため、これは回帰タスクです [cite: 287]。"
      C: "タスクの種類は、特徴量ではなくラベルの種類によって決まります。"
      D: "タスクの種類は、特徴量ではなくラベルの種類によって決まります。"
  - rubric: ERMの理論的背景を理解している。
    type: multichoice
    title: 01-07-ERMの背景
    question: |
      学習の理想的な目標であるリスク $R(f)$ を直接最小化するのではなく、経験リスク $\\hat{R}(f)$ を最小化するアプローチ（ERM）を取る根本的な理由として、最も適切なものを一つ選びなさい。
    choices:
      A: "経験リスクの方が計算が簡単で、常にリスクよりも良い指標だから。"
      B: "リスクは理論上の概念であり、その計算に必要なデータの真の確率分布 $p(x,y)$ が未知だから。"
      C: "経験リスクを最小化すると、モデルのパラメーターが必ずゼロに収束し、安定するから。"
      D: "リスクを最小化するとモデルが過適合に陥りやすいことが知られているから。"
    answer: B
    feedback:
      A: "リスクの方がより本質的な指標ですが、計算できません。"
      [cite_start]B: "正解です。リスクは確率分布 $p(x,y)$ 上の期待値ですが、この分布は通常未知であるため、手元のデータでの平均（経験リスク）で代用します [cite: 441]。"
      C: "そのような性質はありません。"
      [cite_start]D: "逆で、経験リスクを最小化しすぎると過適合に陥りやすいです [cite: 623]。"
  - rubric: L2正則化の式と目的を理解している。
    type: multichoice
    title: 02-08-L2正則化の目的関数
    question: |
      線形モデルの学習において、モデルが複雑になりすぎて訓練データに過適合するのを防ぎたい。この目的のためにL2正則化を導入する場合、目的関数はどのように変更されるか。最も適切なものを一つ選びなさい。（$\\hat{R}(f_\\theta)$ は元の経験リスク、$\\lambda$ は正則化係数とする）
    choices:
      A: "目的関数: $\\hat{R}(f_\\theta) - \\lambda ||\\theta||^2$"
      B: "目的関数: $\\hat{R}(f_\\theta) + \\lambda ||\\theta||^2$"
      C: "目的関数: $\\lambda \\hat{R}(f_\\theta) - ||\\theta||^2$"
      D: "目的関数: $||\\theta||^2 / \\hat{R}(f_\\theta)$"
    answer: B
    feedback:
      A: "罰則項は損失を増やす方向に働くため、符号が逆です。"
      [cite_start]B: "正解です。元の経験リスクに、パラメーターのL2ノルムの2乗に比例する罰則項を加えます [cite: 632]。"
      C: "項の形が異なります。"
      D: "項の形が異なります。"
  - rubric: パラメトリックモデルとノンパラメトリックモデルを比較できる。
    type: multichoice
    title: 08-09-パラメトリックとノンパラメトリックの比較
    question: |
      k-最近傍法（k-NN）と線形回帰モデルを比較した際の説明として、最も適切なものを一つ選びなさい。
    choices:
      A: "k-NNはパラメトリックモデル、線形回帰はノンパラメトリックモデルである。"
      B: "どちらも学習時に明示的なパラメーターを学習しない事例ベースのモデルである。"
      C: "k-NNは学習フェーズで計算を行わずデータを記憶するだけだが、線形回帰は学習フェーズで最適化によりパラメーターを決定する。"
      D: "k-NNは回帰タスクにしか使えないが、線形回帰は分類タスクにも使える。"
    answer: C
    feedback:
      [cite_start]A: "逆です。線形回帰はパラメーター数が固定なのでパラメトリック、k-NNはデータ数に依存するためノンパラメトリックです [cite: 1044]。"
      B: "線形回帰はパラメーターを学習します。"
      C: "正解です。このためk-NNは「遅延学習」モデルとも呼ばれます。"
      [cite_start]D: "どちらも回帰と分類の両方に適用可能です（k-NN分類、ロジスティック回帰など） [cite: 1040, 1041]。"
  - rubric: NLPにおけるトークンの概念を理解している。
    type: multichoice
    title: 11-10-トークンの定義
    question: |
      自然言語処理において、テキストを構成する意味のある最小単位（単語やサブワードなど）を指す用語として、最も適切なものを一つ選びなさい。
    choices:
      A: "ピクセル"
      B: "チャンネル"
      C: "トークン"
      D: "カーネル"
    answer: C
    feedback:
      [cite_start]A: "ピクセルは画像の最小単位です [cite: 984]。"
      [cite_start]B: "チャンネルは画像の色情報などを表します [cite: 1178]。"
      [cite_start]C: "正解です。テキスト処理では、単語やそれより小さいサブワードなどをトークンとして扱います [cite: 1267]。"
      [cite_start]D: "カーネルは畳み込み層のフィルターやカーネル法で使われる用語です [cite: 1204, 1072]。"
  - rubric: CNNにおけるカーネルの役割を理解している。
    type: multichoice
    title: 10-11-CNNカーネルの役割
    question: |
      画像の特徴抽出に用いられる畳み込み層で、画像上をスライドさせながら局所的な特徴を抽出するために使われる、学習可能なパラメーターを持つ小さな行列を何と呼ぶか。
    choices:
      A: "バウンディングボックス"
      B: "カーネル（フィルター）"
      C: "活性化関数"
      D: "埋め込みベクトル"
    answer: B
    feedback:
      [cite_start]A: "バウンディングボックスは物体検出の出力です [cite: 1182]。"
      [cite_start]B: "正解です。畳み込み層では、このカーネルが画像上を移動しながら特徴を抽出します [cite: 1204]。"
      [cite_start]C: "活性化関数は非線形性を導入します [cite: 925]。"
      [cite_start]D: "埋め込みベクトルは主にトークンなど離散データの表現に用いられます [cite: 1276]。"
  - rubric: ファインチューニングの定義を理解している。
    type: multichoice
    title: 08-12-ファインチューニングの定義
    question: |
      深層学習において、学習済みのモデルを別のタスクに適応させるために、追加のデータで再学習させるプロセスを何と呼ぶか。
    choices:
      A: "事前学習"
      B: "精密調整（ファインチューニング）"
      C: "表現学習"
      D: "自己教師あり学習"
    answer: B
    feedback:
      [cite_start]A: "事前学習は、ファインチューニングの前に行われる、大規模データでの最初の学習です [cite: 1023]。"
      [cite_start]B: "正解です。精密調整は、事前学習で得た知識を特定のタスクに適応させるための追加学習です [cite: 1020]。"
      [cite_start]C: "表現学習は、データから有用な特徴表現を学習すること全般を指す広い概念です [cite: 1029]。"
      [cite_start]D: "自己教師あり学習は、データ自身から教師信号を作成して学習する枠組みです [cite: 1163]。"
  - rubric: 誤差逆伝播法の役割を理解している。
    type: multichoice
    title: 07-13-誤差逆伝播法の役割
    question: |
      ニューラルネットワークの学習で用いられる誤差逆伝播法（Backpropagation）の役割として、最も適切なものを一つ選びなさい。
    choices:
      A: "モデルの出力と正解ラベルの間の損失を計算する。"
      B: "損失に対するモデルの全パラメーターの勾配を、効率的に計算する。"
      C: "モデルの過適合を防ぐために、パラメーターにノイズを加える。"
      D: "入力データを、モデルが処理しやすい形の特徴ベクトルに変換する。"
    answer: B
    feedback:
      A: "損失の計算は順伝播の最後に行われます。"
      [cite_start]B: "正解です。誤差逆伝播法は、勾配降下法などの最適化アルゴリズムが必要とする勾配を、複雑なモデルであっても効率的に計算するための根幹技術です [cite: 974]。"
      C: "これはドロップアウトなどの正則化手法です。"
      D: "これはモデルの順伝播処理、特にエンコーダー部分の役割です。"
  - rubric: オートエンコーダーの構造と目的を理解している。
    type: multichoice
    title: 08-14-オートエンコーダーの仕組み
    question: |
      教師なし表現学習の手法であるオートエンコーダーの基本的な構造と学習目的として、最も適切なものを一つ選びなさい。
    choices:
      A: "構造：生成器と識別器からなる。／ 目的：識別器を騙せるようなリアルなデータを生成する。"
      B: "構造：エンコーダーとデコーダーからなる。／ 目的：入力を一度低次元の潜在変数に圧縮し、そこから元の入力を復元できるように学習する。"
      C: "構造：単一のTransformerブロックからなる。／ 目的：次に来る単語を予測することで、言語の構造を学習する。"
      D: "構造：畳み込み層とプーリング層を交互に重ねる。／ 目的：画像内の物体のクラスを分類する。"
    answer: B
    feedback:
      [cite_start]A: "これはGANs（敵対的生成ネットワーク）の説明です [cite: 1352]。"
      [cite_start]B: "正解です。オートエンコーダーは、再構成誤差を最小化することを通じて、データの次元削減や本質的な特徴表現の学習を目指します [cite: 1032, 1033]。"
      [cite_start]C: "これは自己回帰型言語モデルの説明です [cite: 1337]。"
      D: "これは画像分類用CNNの典型的な構造です。"
  - rubric: マルチヘッドアテンションの概念を理解している。
    type: multichoice
    title: 11-15-マルチヘッドアテンション
    question: |
      Transformerアーキテクチャで用いられるマルチヘッドアテンションの説明として、最も適切なものを一つ選びなさい。
    choices:
      A: "複数の異なる言語を同時に処理するための仕組み。"
      B: "アテンション計算を複数並列で行い、それぞれ異なる観点からのトークン間の関連性を捉え、その結果を統合する仕組み。"
      C: "モデルのヘッド（最終層）を複数用意し、アンサンブル学習を行うことで性能を安定させる仕組み。"
      D: "アテンション計算の対象を、自身のヘッド（トークン）のみに限定することで、計算量を削減する仕組み。"
    answer: B
    feedback:
      A: "これは多言語モデルのタスクの説明です。"
      [cite_start]B: "正解です。単一のアテンションでは捉えきれない、多様な文脈的関係性（例：文法的な関係、意味的な関係）を、複数の「ヘッド」で分担して捉えることができます [cite: 1291]。"
      C: "これはアンサンブル学習の説明であり、マルチヘッドアテンションとは異なります。"
      D: "アテンションは、自身と他のトークンとの関係を計算するものです。"
  - rubric: ソフトマックス関数の役割を理解している。
    type: multichoice
    title: 06-16-ソフトマックス関数の役割
    question: |
      確率論的分類モデルの最終層で、K個のスコアをK次元の確率値ベクトル（各要素が非負で合計が1）に変換するために用いられる関数として、最も適切なものを一つ選びなさい。
    choices:
      A: "ReLU関数"
      B: "シグモイド関数"
      C: "ソフトマックス関数"
      D: "恒等関数"
    answer: C
    feedback:
      [cite_start]A: "ReLUは非負の値を出力しますが、合計が1になるとは限りません [cite: 926]。"
      [cite_start]B: "シグモイド（ロジスティック）関数は、2クラス分類で単一の確率値を出力するのに使われます [cite: 855]。"
      [cite_start]C: "正解です。ソフトマックス関数は、複数のスコアを正規化し、多クラス分類の確率分布として解釈できるようにします [cite: 901]。"
      [cite_start]D: "恒等関数は回帰タスクの出力層で使われます [cite: 926]。"
  - rubric: マルチモーダルモデルの定義を理解している。
    type: multichoice
    title: 13-17-マルチモーダルモデルの定義
    question: |
      テキストだけでなく、画像や音声など複数の異なる様式（モダリティ）のデータを統合的に扱うAIモデルを指す用語として、最も適切なものを一つ選びなさい。
    choices:
      A: "自己回帰モデル"
      B: "マルチモーダルモデル"
      C: "生成的敵対ネットワーク"
      D: "潜在変数モデル"
    answer: B
    feedback:
      [cite_start]A: "自己回帰モデルは系列データを扱うモデルの一種です [cite: 1333]。"
      [cite_start]B: "正解です。マルチモーダルは「多種の様式」を意味し、画像とテキストを同時に入力するモデルなどが該当します [cite: 1424, 1425]。"
      [cite_start]C: "これは生成モデルの一種です [cite: 1352]。"
      [cite_start]D: "これも生成モデルの一種です [cite: 1332]。"
  - rubric: 指示チューニングの目的を理解している。
    type: multichoice
    title: 13-18-指示チューニングの目的
    question: |
      大規模言語モデル（LLM）の訓練において、人間の指示に従う能力を獲得させるために、大量の「指示とその模範解答」のペアデータを用いてファインチューニングするプロセスを何と呼ぶか。
    choices:
      A: "事前学習"
      B: "表現学習"
      C: "指示チューニング"
      D: "検索拡張生成"
    answer: C
    feedback:
      [cite_start]A: "事前学習は、次トークン予測など自己教師あり学習でモデルの基礎能力を構築する段階です [cite: 1447]。"
      [cite_start]B: "表現学習は学習全般で起こる現象を指す広い概念です [cite: 1029]。"
      [cite_start]C: "正解です。指示チューニングは、事前学習済みのモデルを、対話や指示応答といった特定の振る舞いをするように教師付き学習で調整するプロセスです [cite: 1447, 1450]。"
      [cite_start]D: "RAGは推論時のテクニックであり、モデルの学習プロセスではありません [cite: 1544]。"
  - rubric: AIが生産性に与える影響を理解している。
    type: multichoice
    title: 14-19-AIと生産性への影響
    question: |
      生成AIツールが労働生産性に与える影響について、講義で紹介された実証研究が示す傾向として、最も適切なものを一つ選びなさい。
    choices:
      A: "主に高スキル労働者の生産性を向上させ、スキル格差を拡大させる。"
      B: "全ての労働者の生産性を一様に向上させる。"
      C: "特に低スキル・経験の浅い労働者の生産性を大きく向上させ、スキル格差を縮小させる可能性がある。"
      D: "導入による効果はほとんどなく、生産性に変化は見られない。"
    answer: C
    feedback:
      [cite_start]A: "高スキル労働者への効果は限定的か、むしろ低スキル労働者への効果の方が大きいことが示唆されています [cite: 1501]。"
      [cite_start]B: "効果は一様ではなく、スキルレベルによって差が見られます [cite: 1501, 1503]。"
      [cite_start]C: "正解です。複数のRCT研究で、特に低スキル層における生産性向上効果が大きいことが示されています [cite: 1501, 1503]。"
      [cite_start]D: "複数の研究で有意な生産性向上が報告されています [cite: 1501, 1502, 1503]。"
  - rubric: RAGの仕組みを理解している。
    type: multichoice
    title: 14-20-RAGの仕組み
    question: |
      LLMのハルシネーション（虚偽情報の生成）を抑制するための技術である「検索拡張生成（RAG）」の仕組みとして、最も適切なものを一つ選びなさい。
    choices:
      A: "モデルが回答を生成する際に、その都度インターネットで検索を行い、最新の情報に基づいて回答するように強制する。"
      B: "ユーザーからの入力に対し、まず関連する信頼性の高い文書をデータベースから検索し、その文書の内容を参考情報としてプロンプトに含めてからLLMに回答を生成させる。"
      C: "モデルのパラメーターを直接編集し、誤った知識を正しい情報に書き換える。"
      D: "生成された回答が事実と異なる場合、ユーザーが手動で修正し、そのデータを再学習させる。"
    answer: B
    feedback:
      A: "単に検索させるだけでなく、検索結果をプロンプトに「拡張」するのがポイントです。"
      [cite_start]B: "正解です。RAGは、LLMが内部知識だけに頼るのではなく、検索によって得られた具体的な根拠に基づいて回答を生成するように導くことで、ハルシネーションを抑制します [cite: 1544]。"
      C: "パラメーターの直接編集は一般的ではありません。"
      D: "これはモデルを改善するための一つの方法ですが、RAGの仕組みではありません。"

