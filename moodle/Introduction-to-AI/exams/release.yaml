  multichoice:
    shuffleanswers: true
    answernumbering: "none"

Quizzes:
  # この試験構成案を完全にマスターした学生は、まず、目の前にある課題を機械学習の問題として正しく定式化する能力を身につけています。例えば、あるビジネス課題に対し、何を予測すべき「ラベル」とし、何を手がかりとなる「特徴量」とすべきかを定義し、それを回帰または分類タスクとして捉えることができます。そして、学習の最終目標が未知データに対する性能、すなわち「汎化性能」を高めることだと理解しています。その理想的な指標は計算不可能な「リスク」（損失の期待値）であるため、現実的なアプローチとして、手元のデータで計算可能な「経験リスク」を最小化する（ERM）という、学習の基本戦略を説明できます。
  - rubric: A-1-2
    type: multichoice
    title: 01-05-回帰タスクと分類タスクの区別
    default_grade: 2
    question: |
      予測タスクの多くは、ラベルの性質によって回帰と分類に大別されます。次のうち**分類タスク**として定式化されるのが標準的だと考えられるものを**全て**選択しなさい。

      - A: 手書き文字画像から、その画像が表す数字（0～9）を予測する。
      - B: ワインの化学計測データから、ブドウの品種名（例：Barolo, Barbera）を予測する。
      - C: 動物の画像から、その動物の体重を1kg単位で予測する。
      - D: 過去の売上データから、翌日の売上金額を1万円単位で予測する。
    choices:
      NoneOfThese: なし
      A: A
      B: B
      C: C
      D: D
      AB: AとB
      AC: AとC
      AD: AとD
      BC: BとC
      BD: BとD
      CD: CとD
      ABC: AとBとC
      ABD: AとBとD
      ACD: AとCとD
      BCD: BとCとD
      ABCD: AとBとCとD
    shuffleanswers: true
    answernumbering: "none"
    answer: AB
    general_feedback: |
      - 手書き文字画像から、その画像が表す数字（0～9）を予測する。: 正解です。予測すべきラベルが「0」から「9」までの10個のカテゴリ（クラス）であるため、これは通常、分類タスクとして定式化されます。
      - ワインの化学計測データから、ブドウの品種名（例：Barolo, Barbera）を予測する。: 正解です。予測すべきラベルが予め定められた質的なカテゴリ（品種名）であるため、これは通常、分類タスクとして定式化されます。
      - 動物の画像から、その動物の体重[kg]を予測する。: 誤りです。予測すべきラベルである体重は、連続的な数値（量的な値）であるため、これは通常、回帰タスクとして定式化されます。
      - 過去の売上データから、翌日の売上金額を予測する。: 誤りです。予測すべきラベルである売上金額は、連続的な数値（量的な値）であるため、これは通常、回帰タスクとして定式化されます。

  - rubric: A-2-2
    type: multichoice
    title: 01-02-学習の基本戦略（リスクと経験リスク）
    score: 2
    question: |
      予測タスクの機械学習における基本戦略について、最も的確に説明しているものはどれですか。
    choices:
      A: 汎化性能の理想的な指標であるリスク（期待損失）を、手元のデータから直接計算して最小化する。
      B: 汎化性能を高めるため、手元データから計算可能な経験リスク（訓練損失）を目的関数に組み込んで最小化する。
      C: モデルの複雑さを最大化することでリスク（期待損失）を最小化する。
      D: リスク（期待損失）と経験リスク（訓練損失）は数学的に等価であるため、どちらを最小化しても結果は同じであり、計算が簡単な経験リスクを最小化する。
    # これは、リスク（期待損失）が計算不可能であるための現実的なアプローチである。
    answer: B
    feedback:
      A: 誤りです。リスク（期待損失）は、データの真の確率分布が未知であるため、手元のデータだけから直接計算することはできません。
      B: 正解です。学習の真の目的は計算不可能なリスクの最小化ですが、その代理指標として計算可能な経験リスクを最小化することが、学習の基本戦略（経験リスク最小化：ERM）です。
      C: 誤りです。また、モデルの複雑さを無闇に最大化することで自動的にリスクが最小化されるわけではありません。
      D: 誤りです。リスクと経験リスクは異なる量です．この差が汎化における基本的な課題です．

  # 次に、その学生は、学習成果を正しく評価するための方法論を深く理解しています。経験リスクをただ最小化するだけでは、訓練データに過剰に適合してしまう「過適合」に陥ることを学習曲線のイメージと共に説明できます。そのため、モデルの真の性能をより正確に推定するには、学習に用いていないテストデータで評価すべきであると知っています。さらに、そのデータの分割方法は状況に応じて選ぶべきであることもわかっており、例えば時系列データであれば、未来のデータで評価するために過去のデータを訓練に使う、という工夫が必要なことを説明できます。
  - rubric: Rolling-window方式の検証方法のアイデアを持っている
    type: multichoice
    title: 08-01-時系列データのモデル選択
    default_grade: 2
    question: |
      あなたは，ある店舗の日次売上を直前7日間の特徴量と売上に基づいて予測するモデルを構築しており，そのハイパーパラメータを選択したいとします．
      過去7年分の日次売上データ（特徴量と売上金額の日付つき表形式データ）が利用可能であると仮定します。
      この時系列データに対して、 **相対的に最も適切** だと考えられる **ハイパーパラメーター選択規準（モデル選択規準）の定め方** はどれですか。
      （ただし、計算時間などは問題にならないと仮定し、また、学習後の最終的な評価に用いるデータは別途用意できているものとし、ここでは考慮しないものとします。）
    choices:
      A: 「最新1か月を検証用，その前の全期間を訓練用」としてデータを分割し、検証データでの性能（検証損失）をモデル選択規準とする。
      B: 「最初の(48+T)ヶ月間を訓練用，その直後1ヶ月間（49+Tの1ヶ月間）を検証用，それ以降は使わない」としてデータを分割して訓練〜検証評価を行うことを，T=0からT=35まで繰り返し，それらの検証評価値の平均値をモデル選択規準とする。
      C: データをランダムにシャッフルしてからK分割交差検証を行い、検証評価値の平均をとったものをモデル選択規準とする。
      D: 全てのデータを訓練に用い、訓練データに対する損失（訓練誤差）をモデル選択規準とする。
    answer: B
    feedback:
      A: この方法は時系列性を考慮しており有効なアプローチの一つですが、特定の1か月間の性能に評価が依存してしまいます。計算時間が無尽蔵にあるという仮定のもとでは、より頑健なRolling-window方式のモデル選択方法のほうが適切であるとして使用されることがよくあります（時系列データであることに由来する、広く活用されている事前知識の一つ）。
      B: 正解です。Rolling-window方式と呼ばれ、実際の運用（新しいデータでモデルを更新し未来を予測する）に近い形で、複数の期間にわたってモデルの性能を評価できます。これにより、特定の期間に依存しない、より信頼性の高い汎化性能の推定値が得られる、計算資源が許す限り最も望ましいアプローチと考えられています（時系列データであることに由来する、広く活用されている事前知識の一つ）。
      C: 誤りです。時系列データをランダムにシャッフルすると、未来のデータを使って過去のデータを予測するという非現実的な状況（情報リーク）が発生し、モデルの性能を正しく評価できないと考えるのが妥当です。
      D: 誤りです。訓練誤差を指標にすると、訓練データに過適合したモデルを選択してしまい、未知のデータに対する汎化性能が低くなる可能性が非常に高いです。

  # 学生の知識は、学習の定式化・評価といった基本戦略だけでなく、モデルがどのようにして学習を実行するのかというメカニズムにも及びます。単純な線形回帰であれば目的関数を微分してゼロと置くことで正規方程式という解析解が存在するのに対し、ロジスティック回帰やニューラルネットワークのような複雑なモデルの目的関数は、解析的に解くことが困難であることを理解しています。そのため、目的関数の勾配を計算し、その情報に基づいて反復的にパラメーターを更新する勾配降下法のような最適化手法が用いられることを説明できます。そして、その勾配計算を、どんなに複雑な層の組み合わせを持つモデルであっても、合成関数の連鎖律を用いてシステマチックかつ効率的に実行するアルゴリズムが「誤差逆伝播法」であることを理解しています。学習の定式化・評価についての基本的な理解と、モデルの構成・最適化の実行についての理解が合わさることで、学生は実際に必要に応じて学習を様々なタスクに活用できる基礎理解が揃った状態になります。

  # さらに進んで、学生はモデル選択の背後にある哲学を語ることができます。「No-Free-Lunch Theorem」を根拠に、あらゆる問題に万能なモデルは存在しないと理解しているため、タスクの性質に合った「帰納バイアス」（モデルの持つ仮定や好み）を選択することが重要だと主張できます。例えば、k-NNが持つ「近くの点はラベルも似ている」というバイアスと、線形モデルが持つ「データ全体に単純な法則がある」というバイアスの違いを比較できます。
  - rubric: ML-06-01
    type: multichoice
    title: 08-02-データ量とモデルの複雑さ
    default_grade: 1
    question: |
      「データ量が多いならば、より高度なモデル（複雑な関数を表現できるモデル）を使ったほうが良い」という考え方について、最も適切なものはどれですか。
    choices:
      A: いつでもそうである
      B: 必ずしもそうとは限らない
    answer: B
    feedback:
      A: 誤りです。ノーフリーランチ定理が示唆するように、あらゆる状況で最良となるモデルは存在しません。例えば，データの背後にある関係性が単純な線型であることが既知である場合などは、複雑なモデルは過適合のリスクや不要な計算コストを増大させる可能性があります。
      B: 正解です。例えば、データの背後にある真の関係が単純な線型であることが既知である場合、データがどれだけ多くても、複雑な非線形モデルを使うメリットはありません。モデルの複雑さは、データの量だけでなく、解くべき問題の本質的な複雑さに応じて選択することが重要です。

  # そして学生の理解は、リスク最小化という行為を別の角度から捉える、もう一つの重要な領域へと繋がります。彼らは、この**「近似ターゲット」という概念自体が一つの広大な領域であることを認識しています。損失関数の選択が単なる誤差の測り方にはとどまらず、モデルが最終的に何を学習しようと試みるか、すなわち理想的な予測器である「近似ターゲット」を定義する戦略的な行為であることを理解しています。この考え方を応用し、学生は、タスクの実行に有用な関数を学習したい場合に、その関数が近似ターゲットとなるような損失関数を意図的に選択するという設計思想を説明できます。このように、リスク最小化は、より大きなタスクを実現するための中間目標として使われることがある**、という強力な枠組みを理解しているからこそ、なぜ分類タスクへの確率論的アプローチに使われる学習手法が生成タスクの学習にも使われるのかを、その根源から説明できるのです。

  # 学生はニューラルネットワークが持つアーキテクチャ設計の柔軟性の重要性を説明できます。ニューラルネットワークが重宝されるのは、単に表現力が高いからだけでなく、その柔軟性を活かして、データが持つ対称性、文脈性、階層性といった事前知識によく合った構造をアーキテクチャに反映できるからです。そのような例の一つはCNNであり、画像の「空間的局所性」という事前知識を、畳み込み層という特殊なアーキテクチャによって実現していることを説明できます。

  # さらに、学生は生成タスクへの二大アプローチを比較できます。テキスト生成で主流の「自己回帰型」アプローチが、次に来るトークンを逐次的に予測・生成するプロセスであるのに対し、画像生成で主流の「潜在変数型」アプローチ（VAE、拡散モデルなど）は、単純な確率分布からのサンプリング（潜在変数）を、学習済みの複雑な関数（生成器）によって一括でデータに変換するプロセスであることを説明できます。また、テキストと画像のような異なるモダリティをAIがどう統合的に扱うかについても理解しており、その基盤として、異なるデータを共通のベクトル空間に対応付ける表現学習が重要であることを説明できます。
  - rubric: G-1-1
    type: multichoice
    title: 12-01-生成モデルのアプローチ比較
    default_grade: 2
    question: |
      生成タスクを実現するための主要な二つのアプローチ、「自己回帰型」と「潜在変数型」について、その特徴と主な適用先を最も的確に説明しているものはどれですか。
    choices:
      A: 自己回帰型は、それまでの生成結果を条件として次の一つを予測する逐次的な生成アプローチであり、主にテキスト生成において採用される。潜在変数型は、単純な分布からの潜在変数をデータに変換するアプローチであり、主に画像生成に用いられる。
      B: 自己回帰型は、自ら生成可能な単純な分布からの潜在変数を一括でデータに変換するプロセスであり、主に画像生成において採用される。潜在変数型は、それまでの生成結果を潜在的に条件として逐次的な生成を行うアプローチであり、主にテキスト生成に用いられる。
      C: 自己回帰型モデルと潜在変数型モデルは、どちらもデータの要素を一つずつ順番に生成する逐次的なプロセスであるが、テキストには自己回帰型、画像には潜在変数型が使われる傾向がある。
      D: 自己回帰型モデルと潜在変数型モデルは、学習の最終目的は常に同じ経験リスク最小化（ERM）であり、主にテキストに使われるか画像に使われるかの違いしかない。
    answer: A
    feedback:
      A: 正解です。これは両アプローチの違いと、それぞれの典型的な適用領域を正確に捉えています。自己回帰型は系列の依存関係をモデル化しやすく、潜在変数型は高次元データを一括で扱うのに適しています。
      B: 誤りです。自己回帰型と潜在変数型の説明が逆になっています。
      C: 誤りです。自己回帰型モデルは逐次的な生成を行いますが、潜在変数型モデルは潜在変数から一括でデータを生成するのが基本的な仕組みです。
      D: 誤りです。学習の最終目的は生成タスクであり、経験リスク最小化はその過程で例えば条件付き分布を近似するための手段として使われるものという位置付けです。

  # 最後に、学生はこれらの技術が社会の中でどのように機能し、どのような課題を抱えているかという視点を持っています。LLMが単なる予測器に留まらず、思考し、外部ツールを使いこなす「自律エージェント」として機能しうる仕組みを説明できます。さらに、「事実でないことを生成する」ハルシネーションや「データ内の偏見を反映する」バイアスといったAIが抱える多様なリスクを明確に区別し、日本の著作権法（第30条の4）やアルゴリズム特許といった、技術を取り巻く法制度の現状についても基本的な知識を有していることが確かめられます。
  - rubric: H-1-3
    type: multichoice
    title: 14-01-著作権侵害の要件
    default_grade: 2
    question: |
      生成AIで作成した画像・文章について、2025年7月時点の日本においては、
      **著作権侵害の成否のための要件**として含まれるものは、次のうちどれでしょうか。
      次のうち **当てはまるものをすべて選択** しなさい。

      - A: 依拠性（既存著作物への依拠が認められること）
      - B: 類似性（出力が既存著作物と実質的同一または本質的特徴を共通にする程度に類似していること）
      - C: 営利性（出力が著作権者に経済的または社会的損失を与えたと推認される程度の営利を主たる目的とする活動に使用されたこと）
      - D: 著作権管理情報の削除・改変（既存著作物に付随する著作権管理情報（CMI）の掲示にかかる善良な管理者の注意を怠ったことが認められること）

      （本資料は **教育・研修目的の一般的情報提供** であり、個別案件に対する法的助言ではありません。判例・実務は変動し得るため、具体的な権利処理や紛争対応には必ず弁護士等の専門家へご相談ください。）
    choices:
      NoneOfThese: なし
      A: A
      B: B
      C: C
      D: D
      AB: AとB
      AC: AとC
      AD: AとD
      BC: BとC
      BD: BとD
      CD: CとD
      ABC: AとBとC
      ABD: AとBとD
      ACD: AとCとD
      BCD: BとCとD
      ABCD: AとBとCとD
    shuffleanswers: true
    answernumbering: "none"
    answer: AB
    general_feedback: |
      依拠性（A）: 正解です。依拠性と類似性が立証対象となります。

      類似性（B）: 正解です。依拠性と類似性が立証対象となります。

      営利性（C）: 誤りです。著作権侵害成立の必須要件ではありません。

      CMI の削除・改変（D）: 誤りです。CMI の有無は技術的保護手段等の別論点であり、侵害要件ではありません。
