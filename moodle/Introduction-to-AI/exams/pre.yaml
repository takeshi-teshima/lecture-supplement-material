Quizzes:
  # 次に、その学生は、学習成果を正しく評価するための方法論を深く理解しています。経験リスクをただ最小化するだけでは、訓練データに過剰に適合してしまう「過適合」に陥ることを学習曲線のイメージと共に説明できます。そのため、モデルの真の性能をより正確に推定するには、学習に用いていないテストデータで評価すべきであると知っています。さらに、そのデータの分割方法は状況に応じて選ぶべきであることもわかっており、例えば時系列データであれば、未来のデータで評価するために過去のデータを訓練に使う、という工夫が必要なことを説明できます。
  - rubric: Walk-forward方式の検証方法のアイデアを持っている
    type: multichoice
    title: 08-01-時系列データのモデル選択
    default_grade: 2
    question: |
      あなたは，ある店舗の日次売上を直前7日間の特徴量と売上に基づいて予測するモデルを構築しており，そのハイパーパラメータを選択したいとします．
      過去7年分の日次売上データ（特徴量と売上金額の日付つき表形式データ）が利用可能であると仮定します。
      この時系列データに対して、 **相対的に最も適切** だと考えられる **ハイパーパラメーター選択規準（モデル選択規準）の定め方** はどれですか。
      （ただし、計算時間などは問題にならないと仮定し、また、学習後の最終的な評価に用いるデータは別途用意できているものとし、ここでは考慮しないものとします。）
    choices:
      A: 「最新1か月を検証用，その前の全期間を訓練用」としてデータを分割し、検証データでの性能（検証損失）をモデル選択規準とする。
      B: 「最初の(48+T)ヶ月間を訓練用，その直後1ヶ月間（49+Tの1ヶ月間）を検証用，それ以降は使わない」としてデータを分割して訓練〜検証評価を行うことを，T=0からT=35まで繰り返し，それらの検証評価値の平均値をモデル選択規準とする。
      C: データをランダムにシャッフルしてからK分割交差検証を行い、検証評価値の平均をとったものをモデル選択規準とする。
      D: 全てのデータを訓練に用い、訓練データに対する損失（訓練誤差）をモデル選択規準とする。
    answer: B
    feedback:
      A: この方法は時系列性を考慮しており有効なアプローチの一つですが、特定の1か月間の性能に評価が依存してしまいます。計算時間が無尽蔵にあるという仮定のもとでは、より頑健なWalk-forward方式のモデル選択方法のほうが適切であるとして使用されることがよくあります（時系列データであることに由来する、広く活用されている事前知識の一つ）。
      B: 正解です。Walk-forward方式と呼ばれ、実際の運用（新しいデータでモデルを更新し未来を予測する）に近い形で、複数の期間にわたってモデルの性能を評価できます。これにより、特定の期間に依存しない、より信頼性の高い汎化性能の推定値が得られる、計算資源が許す限り最も望ましいアプローチと考えられています（時系列データであることに由来する、広く活用されている事前知識の一つ）。
      C: 誤りです。時系列データをランダムにシャッフルすると、未来のデータを使って過去のデータを予測するという非現実的な状況（情報リーク）が発生し、モデルの性能を正しく評価できないと考えるのが妥当です。
      D: 誤りです。訓練誤差を指標にすると、訓練データに過適合したモデルを選択してしまい、未知のデータに対する汎化性能が低くなる可能性が非常に高いです。

    # 推定できるか、その真の汎化性能を評価するために
    # タスクは、住宅価格の調査が完了していないの住宅価格を正確に予測する、というものである。
    # データには各物件の緯度・経度情報も含まれており、分析の結果「地理的に近い物件の価格は、互いに似通う」という空間的自己相関が確認された。
    # 区画単位で訓練・検証の分割を行うK分割交差検証により
    # このとき、モデルの汎化性能を推定してハイパーパラメーター選択を行うために最も適切なデータ分割の方法はどれか。
    # （なお、単純化のため、性能評価の方法は別途用意できているものとし、ここではハイパーパラメーター選択のための方法に限って考えるものとする。）

    # これは、リスク（期待損失）が計算不可能であるための現実的なアプローチである。

  # パターンを学ぶ能力が不足している状態のため、
  # データが持つ規則性を十分に学習できない程度に
  # 訓練を行い、その性能を評価するためにエポックごとの損失をグラフ化した「学習曲線」を作成しました。
  # 訓練データに対する損失（訓練損失）と、未知のデータに対する損失（検証損失）の2つの曲線が描かれています。
  # これはモデルがデータの特徴を十分に学習できていない「学習不足（Underfitting）」の典型的な兆候です。

  - rubric: モデルの過適合を理解し、そのモデルに適した正則化手法を選択できる
    type: multichoice
    title: 006-01-決定木における過適合対策
    default_grade: 2
    question: |
      あなたは、顧客の解約予測モデルとして「決定木」を訓練しました。
      完成したモデルを評価したところ、訓練データに対しては99.5%という非常に高い正解率を達成しています。
      しかし、事前に「取り置いた検証データ」で性能を試したところ、正解率は65%しかなく、実用には耐えないことが分かりました。
      モデルの構造を詳しく見ると、木が非常に深く、末端の葉（リーフ）には1件や2件のデータしか含まれていない分岐が多数存在していました。
      この状況を改善するために、次にあなたが取るべき最も適切なアクションはどれですか。
    choices:
      A: より多くの特徴量（顧客情報）を追加して、分岐の判断材料を増やす。
      B: 木の深さに上限を設定するか、葉に含まれる最小サンプル数を増やす。
      C: 決定木では表現力が不足していると判断し、より大規模なニューラルネットワークに変更する。
      D: 訓練データと検証データを合わせて、全てのデータで再度モデルを訓練する。
    answer: B
    feedback:
      A: 特徴量を増やすと、モデルはさらに訓練データ内の細かいノイズを学習しやすくなるため、過適合を悪化させる可能性があります。
      B: 正解。木の深さを制限したり、葉の最小サンプル数を増やしたりすることは、決定木の複雑さを直接的に抑制する最も代表的な正則化手法です。これにより、モデルが訓練データのノイズに過剰に適合するのを防ぎ、汎化性能を向上させます。
      C: このモデルの問題は「表現力不足」ではなく、むしろ訓練データに対して「表現力が高すぎ（過剰適合しすぎ）」な点にあります。より表現力の高いモデルに変更するのは逆効果です。
      D: 検証データを訓練に混ぜてしまうと、モデルの未知のデータに対する性能（汎化性能）を正しく評価できなくなってしまいます。

# 、どちらも高い値からほとんど下がらず、

Quizzes:

  - rubric: C-1-2
    type: multichoice
    title: 03-02-勾配降下法の原理
    default_grade: 1
    question: |
      勾配降下法は、モデルのパラメータをどのように更新していく手法ですか。正しい記述を**全て**選んでください。

      - A: 目的関数の値が最も急に大きくなる方向（勾配の方向）に、少しだけパラメータを移動させることを繰り返す。
      - B: 目的関数の値が最も急に小さくなる方向（勾配の逆方向）に、少しだけパラメータを移動させることを繰り返す。
      - C: パラメータをランダムに変化させ、偶然目的関数の値が小さくなったものを採用することを繰り返す。
      - D: 目的関数の値をパラメータで2回微分した情報を用いて、一回の計算で最適解を求める。
    choices:
      NoneOfThese: いずれでもない
      A: A
      B: B
      C: C
      D: D
      AB: AとB
      AC: AとC
      AD: AとD
      BC: BとC
      BD: BとD
      CD: CとD
      ABC: AとBとC
      ABD: AとBとD
      ACD: AとCとD
      BCD: BとCとD
      ABCD: AとBとCとD
    shuffleanswers: true
    answernumbering: "none"
    answer: B
    general_feedback: |
      - A: 誤りです。これは勾配「上昇」法であり、目的関数を最大化する場合に用います。
      - B: 正解です。目的関数を最小化するため、勾配（最も傾きが急な上り坂の方向）とは逆の方向にパラメータを少しずつ更新します。
      - C: これはランダムサーチと呼ばれる手法で、勾配を利用しません。効率的な探索が難しい場合があります。
      - D: これはニュートン法などに近い考え方であり、勾配降下法の説明ではありません。

  - rubric: C-1-3
    type: multichoice
    title: 03-03-誤差逆伝播法の役割
    default_grade: 2
    question: |
      誤差逆伝播法の役割に関する記述として、正しいものを**全て**選んでください。

      - A: ニューラルネットワーク全体のパラメータに対する損失関数の勾配を、合成関数の連鎖律を用いて効率的に計算するアルゴリズムである。
      - B: 勾配降下法に代わってパラメータを更新する、より高性能な最適化アルゴリズムである。
      - C: モデルの過適合を防ぐための正則化手法の一種である。
      - D: 線形回帰の正規方程式のように、最適解を解析的に求めるために使用される。
    choices:
      NoneOfThese: いずれでもない
      A: A
      B: B
      C: C
      D: D
      AB: AとB
      AC: AとC
      AD: AとD
      BC: BとC
      BD: BとD
      CD: CとD
      ABC: AとBとC
      ABD: AとBとD
      ACD: AとCとD
      BCD: BとCとD
      ABCD: AとBとCとD
    shuffleanswers: true
    answernumbering: "none"
    answer: A
    general_feedback: |
      - A: 正解です。誤差逆伝播法は、複雑な関数の微分を連鎖律に基づいてシステマチックに計算するためのアルゴリズムであり、勾配降下法などの最適化手法に勾配の値を提供します。
      - B: 誤りです。誤差逆伝播法は勾配を「計算」するアルゴリズムであり、パラメータを「更新」する最適化アルゴリズムではありません。両者は協調して機能します。
      - C: 誤りです。正則化は目的関数に罰則項を加えるなどして過適合を抑制する技術であり、勾配計算アルゴリズムである誤差逆伝播法とは役割が異なります。
      - D: 誤りです。誤差逆伝播法は反復的な最適化手法で用いられる勾配計算のアルゴリズムであり、解析解を求めるものではありません。

  - rubric: 近似ターゲットと損失関数の関係性を理解している。
    type: multichoice
    title: 04-06-二乗損失の近似ターゲット
    question: |
      損失関数の選択は、学習が目指すべき理想的な予測器である「近似ターゲット」を決定する。二乗損失 $(\\ell = (y-y')^2)$ を用いた場合に、近似ターゲットとなる統計量として最も適切なものを一つ選びなさい。
    choices:
      A: "条件付き期待値 $E[Y|X=x]$"
      B: "条件付き中央値"
      C: "条件付き最頻値"
      D: "条件付き分散"
    answer: A
    feedback:
      [cite_start]A: "正解です。期待二乗誤差を最小化する関数は、条件付き期待値関数であることが知られています [cite: 774]。"
      [cite_start]B: "条件付き中央値は、絶対誤差損失の近似ターゲットです [cite: 779]。"
      [cite_start]C: "条件付き最頻値は、0/1損失（分類）の近似ターゲット（ベイズ分類器）に関連します [cite: 798]。"
      D: "条件付き分散は予測のばらつきの指標であり、近似ターゲットではありません。"


# このような傾向はモデルの性能改善に伴って緩和されていくと期待できるが，性能が高くないモデルでは顕著である．



    # C: LLMは「正確性」よりも自然な言語生成を優先するため、曖昧な状況ではもっともらしく補完して事実と異なる記述をすることがある。
    # C: 不正解ではありますが、LLMの出力原理に近づいた説明です。実際には、この曖昧な補完も、統計的なパターンから導かれた結果であると考える方がより正確です。
