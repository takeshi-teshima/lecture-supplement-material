# ==================================================
# == 学習到達目標（ストーリー形式）
# ==================================================
LearningOutcomeNarrative:
  - key: problem_formulation
    desc: この試験構成案を完全にマスターした学生は、まず、目の前にある課題を機械学習の問題として正しく**定式化する**能力を身につけています。
    content:
      - >
        例えば、住宅価格の予測は「回帰」、スパムメールの判定や顔認証は「分類」タスクであると即座に判断できます。
      - そして、学習の最終目標が未知データに対する性能、すなわち「汎化性能」を高めることだと理解しています。
      - >
        その理想的な指標は計算不可能な「リスク」（損失の期待値）であるため、現実的なアプローチとして、
        手元の訓練データに対する誤差の平均である「経験リスク」を最小化する（ERM）という、 学習の基本戦略を説明できます。
      - また，学生は，リスク最小化の学習の過程で、条件付き確率を学習するための近似ターゲット
        二乗損失を選べば外れ値に敏感な「条件付き期待値」を、
        絶対誤差損失を選べば外れ値に頑健な「条件付き中央値」を、モデルが暗黙的に追い求めることになるという、より深いレベルでのモデルの挙動を説明できます。
  - key: evaluation_methodology
    desc: 次に、その学生は、学習成果を**正しく評価する**ための方法論を深く理解しています。
    content:
      - 経験リスクをただ最小化するだけでは、訓練データに過剰に適合してしまう「過適合」に陥ることを学習曲線のイメージと共に説明できます。
      - そのため、モデルの真の性能を測るには、学習に用いていないテストデータで評価すべきであると知っています。
      - >
        さらに、そのデータの分割方法は状況に応じて選ぶべきであることもわかっており、
        例えば時系列データであれば、未来のデータで評価するために過去のデータを訓練に使う、という工夫が必要なことを説明できます。
  - key: model_selection_philosophy
    desc: さらに進んで、学生は**モデル選択の背後にある哲学**を語ることができます。
    content:
      - >
        「No-Free-Lunch Theorem」を根拠に、あらゆる問題に万能なモデルは存在しないと理解しているため、
        タスクの性質に合った「帰納バイアス」（モデルの持つ仮定や好み）を選択することが重要だと主張できます。
        例えば、k-NNが持つ「近くの点はラベルも似ている」というバイアスと、線形モデルが持つ「データ全体に単純な法則がある」というバイアスの違いを比較できます。
  - key: optimization_mechanism
    description: |
      そして、学生の理解は、モデルが**どのようにして学習を実行するのか**というメカニズムへと繋がります。単純な線形回帰であれば正規方程式という解析解が存在するのに対し、ロジスティック回帰やニューラルネットワークのような複雑なモデルの目的関数は、解析的に解くことが困難であることを理解しています。そのため、目的関数の勾配を計算し、その情報に基づいて反復的にパラメーターを更新する勾配降下法のような最適化手法が必要不可欠であることを説明できます。そして、その勾配計算を、どんなに複雑な層の組み合わせを持つモデルであっても、合成関数の連鎖律を用いてシステマチックかつ効率的に実行するアルゴリズムが「誤差逆伝播法」であることを理解しています。
  - key: architectural_flexibility
    description: |
      この最適化能力を基盤として、学生はニューラルネットワークが持つ**アーキテクチャ設計の柔軟性**の重要性を説明できます。ニューラルネットワークが重宝されるのは、単に表現力が高いからだけでなく、その柔軟性を活かしてデータに関する強力な事前知識（帰納バイアス）を構造に組み込めるからです。その最たる例がCNNであり、画像の「空間的局所性」という事前知識を、畳み込み層という特殊なアーキテクチャによって実現していることを説明できます。同様に、Transformerが「アテンション機構」によってトークン間の文脈的関連性を捉えていること、特にBERTの双方向性とGPTの単方向性というアーキテクチャの違いが、それぞれの得意なタスク（文脈理解とテキスト生成）にいかに密接に関連しているかを論じることができます。
  - key: generative_model_paradigms
    description: |
      さらに、学生は**AIによる「創造」の二大潮流**を比較できます。テキスト生成で主流の「自己回帰型」アプローチが、次に来るトークンを逐次的に予測・生成するプロセスであるのに対し、画像生成で主流の「潜在変数型」アプローチ（VAE、拡散モデルなど）は、単純な確率分布からのサンプリング（潜在変数）を、学習済みの複雑な関数（生成器）によって一括でデータに変換するプロセスであることを説明できます。また、テキストと画像のような異なる種類のデータ（モダリティ）をAIがどう統合的に扱うかについても理解しており、CLIPのような手法が、対照学習を通じて、例えば「犬」というテキストと「犬の写真」を同じベクトル空間の近い場所に配置する「共通の表現空間」を学習していること、そしてそれこそがマルチモーダルな理解の基盤となっていることを説明できます。
  - key: societal_implications
    description: |
      最後に、学生はこれらの技術が**社会の中でどのように機能し、どのような課題を抱えているか**という視点を持っています。LLMが単なる予測器に留まらず、思考し、外部ツールを使いこなす「自律エージェント」として機能しうる仕組みを説明できます。そして、その強力な能力を人間にとって有益であるように調整する「アラインメント」の重要性を認識し、その実現手法であるRLHFとDPOの違いを語ることができます。さらに、「事実でないことを生成する」ハルシネーションと「データ内の偏見を反映する」バイアスという、AIが抱える二大リスクを明確に区別し、日本の著作権法（第30条の4）やアルゴリズム特許といった、技術を取り巻く法制度の現状についても基本的な知識を有していることが確かめられます。

  # D: 系列生成においては系列順序の保持が重要である。次トークン予測は分類タスクであり、本来の目的である生成タスクとは異なるが、しかし系列順序の情報を損なわずに学習させられる利点を持つので、計算可能な指標で便宜的に系列データで学習を行うには最も適した学習設定であるため。
  # このため、分類タスクとしての事前学習で予測性能を高めることが生成の品質に直結するから。
  # D4: 次トークン予測を通じて単語の意味的な関係や文法規則を学習することができるため、それが結果として文章生成にも使えるようになる。したがって、生成のためにこの分類タスクが用いられる。
  # D2: 次トークン予測では交差エントロピー損失を用いるが、これは分類タスクで一般的に使われるためであり、特に生成に特化した戦略的理由があるわけではない。
  # 、生成のような系列予測には自然に適用される。目的である
  # D2: 誤りです。損失関数の選択には明確な戦略的意図があります。交差エントロピーを使うのは、条件付き確率分布を近似ターゲットとして学習するためであり、「慣習」で選ばれているわけではありません。
  # D3: 誤りです。系列順序の保持は必要条件ですが目的ではありません。本質は、各時点での次トークンの条件付き確率分布を学ぶことであり、それが生成の柔軟性と多様性を支える要素です。
  # D4: 誤りです。意味的な表現の獲得は副次的な効果にすぎません。生成タスクにおける本質的な学習対象は、次に来るトークンの条件付き分布であり、それを近似することが主目的です。
