Quizzes:
  - rubric: Rolling-window方式の検証方法のアイデアを持っている
    type: multichoice
    title: 時系列分割
    question: |
      次の中で最も適切だと考えられるモデル選択規準はどれか．
      ただし，計算時間などは無尽蔵にあると仮定する．
    choices:
      A: 「最新 1 か月を評価用，その前の 1 か月を検証用」とする分割
      B: (Rolling-window方式)
      C:
      D:
    answer:
    feedback:
      A:
      B:
      C:
      D:

  - question: データ量が多いならば、より高度なモデル（複雑な関数を表現できるモデル）を使ったほうが良い
    type: multichoice
    choices:
      A: いつでもそう
      B: そうとは限らない
    answer: B
    feedback:
      B: 理由：例えば、真の関数が線形であると知っている場合に、複雑なモデルを使用することで得られる利点はない。

  - question: |
      Softmaxでtemperatureをあげる
      →KLダイバージェンスが上がるか？など
      →Cross entropy lossの値は上がるか？を考えさせる
      数値的な計算は困難にしておいて，上がるか下がるかを考えることで答えさせるか？

  - rubric: 著作権侵害の成立要件（依拠性＋実質的同一性）を説明できる
    type: multichoice
    title: 014-52-生成物と著作権侵害
    question: |
      生成 AI を用いて作成した画像・文章が **他者の著作権を侵害していると認定される** のは，
      次のうち **どの要件が立証された場合** か。
    choices:
      A: 出力が偶然，既存作品と似たテーマ・構図になっただけで，依拠性が否定された
      B: 出力が他者の作品と実質的に同一であるが，AI がその作品にアクセスした事実が確認できない
      C: AI が他者の著作物に依拠しており，かつ当該出力が当該著作物と実質的に同一または本質的特徴を感得させる程度に類似している
      D: 出力を営利目的で販売した場合は，自動的に著作権侵害と推定される
    answer: C
    feedback:
      A: 依拠性が立証されていないため侵害認定されません．
      B: 依拠性が立証できなければ侵害と認められません．
      C: 正解です．日本法の実務では **「依拠性」（他人作品を素材としていること）** と
         **「実質的同一性（本質的特徴の同一）」** の両方が立証されたときに
         複製権（著作権法第21条）等の侵害が成立します．
      D: 営利性の有無は侵害成立の要件ではなく，損害賠償額などに影響するにとどまります．

