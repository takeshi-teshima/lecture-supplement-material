# Chinchilla スケーリング則
# L^*(P, D) = 1.61 + \frac{406.4}{P^{0.34}} + \frac{410.7}{D^{0.28}}

# と，トランスフォーマーにおける計算量の概算公式
# 6 P D = \mathrm{FLOPs}

# また，2.0 \times 10^{22} FLOPs あたり，約650万円(6.5 \times 10^{6}円)だと仮定する．

# 予算が 6.0 \times 10^{25} FLOPs
#   だけ学習する場合は，
# ここで，パラメーター数とデータ量は，計算量による予算の制約を除けば任意に設定可能であるとする．

# Chinchilla スケーリング則に基づけば，
# x = 6 P D * 6.5 \times 10^{6} / 2.0 \times 10^{22}

