### 第11回：自然言語処理

```yaml
lecture_number: 11
title: "応用領域の案内②：自然言語処理（NLP）"
description: "機械に人間の言語を扱わせる自然言語処理の分野を概観します。テキストデータの前処理であるトークン化と埋め込み、そして系列データを扱うための強力なアーキテクチャであるTransformerの仕組みを学びます。"
learning_objectives:
  - "テキストデータが、トークン化と埋め込みという2段階の処理を経て、モデルが扱えるベクトル系列に変換されるプロセスを説明できる。"
  - "アテンション機構が、系列内の単語間の関連度を動的に計算し、文脈に応じた表現を生成する仕組みであることを説明できる。"
  - "BERTとGPTが、同じTransformerアーキテクチャをベースとしながらも、異なる目的（文脈理解 vs. テキスト生成）のために特化していることを説明できる。"
topics:
  - topic_name: "テキストデータの前処理"
    concepts:
      - concept_name: "トークン化（Tokenization）"
        [cite_start]description: "生のテキストを、意味のある最小単位である**トークン**の系列に分割する処理です [cite: 1267, 1268][cite_start]。単語単位だけでなく、より細かい**サブワード**（例：「言語」→「言」「語」）に分割する手法が主流で、未知語問題への対処や単語の内部構造の活用に繋がります [cite: 1269]。"
        rubric:
          level_1_unacceptable: "トークン化が何かを説明できない。"
          level_2_basic: "テキストを単語に分ける処理だと理解している。"
          [cite_start]level_3_proficient: "なぜ単語単位ではなく、より細かいサブワードに分割するトークナイザーが主流になっているのか、その利点（未知語への頑健性）を説明できる [cite: 1270, 1271]。"
          [cite_start]level_4_advanced: "形態素解析器とサブワードトークナイザーという、2つの主要なトークナイザーの種類の違いを説明できる [cite: 1270]。"
      - concept_name: "トークン埋め込み（Token Embedding）"
        [cite_start]description: "各トークンIDを、低次元で密な実数値ベクトル（**埋め込みベクトル**）に対応付ける層（埋め込み層）です [cite: 1276, 1281][cite_start]。これにより、離散的なトークンを、モデルが処理できる連続的なベクトル空間上の点として表現します。意味的に近いトークンは、ベクトル空間上でも近い位置に配置されるように学習されます [cite: 1277]。"
        rubric:
          level_1_unacceptable: "なぜトークンをベクトルに変換する必要があるか説明できない。"
          level_2_basic: "ワンホット表現との違いを説明できない。"
          level_3_proficient: "ワンホット表現の問題点（高次元でスパース、類似度が計算できない）を挙げ、埋め込みが低次元で密な学習可能な表現であることを説明できる。"
          [cite_start]level_4_advanced: "「単語の意味はその周辺に出現する単語によって決まる」という**分布仮説**が、word2vecのような埋め込み学習手法の理論的背景となっていることを説明できる [cite: 1278]。"
  - topic_name: "系列モデルとTransformer"
    concepts:
      - concept_name: "アテンション機構（Attention Mechanism）"
        [cite_start]description: "トークン系列内の各要素が、他のどの要素と強く関連しているか（「注意」を払うべきか）を動的に計算する仕組みです [cite: 1285][cite_start]。各トークンは**Query**（情報要求）、**Key**（情報提供インデックス）、**Value**（提供情報）の3つのベクトルを生成し、自身のQueryと他の全てのKeyの内積で関連度（注意重み）を計算し、その重みに従ってValueの重み付き和を取ることで、文脈を考慮した新しい表現を獲得します [cite: 1286, 1287, 1288]。"
        rubric:
          level_1_unacceptable: "アテンションが何をする仕組みか説明できない。"
          level_2_basic: "LLMの重要な部品であることは知っている。"
          [cite_start]level_3_proficient: "Query, Key, Valueの3つの役割の概要を説明し、アテンションが系列内の全トークン間の関連性を考慮して、各トークンの表現を更新する仕組みであることを説明できる [cite: 1286]。"
          [cite_start]level_4_advanced: "アテンション層を複数並列に実行するマルチヘッドアテンションが、異なる観点からの関連性を同時に捉えるために有効であることを説明できる [cite: 1291]。"
      - concept_name: "Transformerアーキテクチャ（BERTとGPT）"
        [cite_start]description: "アテンション機構を中核に据えた、現在の自然言語処理における標準的なアーキテクチャです [cite: 1316][cite_start]。主に3つの構成があり、**BERT**は系列全体を双方向に見るエンコーダーのみの構成で文脈理解タスクに [cite: 1317][cite_start]、**GPT**は未来の情報を見ない因果的アテンションを用いたデコーダーのみの構成でテキスト生成タスクに適しています [cite: 1321]。"
        rubric:
          level_1_unacceptable: "BERTやGPTが何かを説明できない。"
          level_2_basic: "有名なAIの名前だと知っている。"
          level_3_proficient: "BERTが文脈理解（例：穴埋め問題）に、GPTがテキスト生成（例：文章の続きを予測）に使われるという主な用途の違いを説明できる。"
          [cite_start]level_4_advanced: "この用途の違いが、BERTが双方向アテンション、GPTが因果的アテンション（未来のトークンを見ない）というアーキテクチャの違いに起因することを説明できる [cite: 1317, 1321]。"

