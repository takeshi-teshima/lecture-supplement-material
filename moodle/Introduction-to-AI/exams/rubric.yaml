          [cite_start]level_3_proficient: "二乗損失と絶対誤差損失（またはピンボール損失）が、それぞれ条件付き期待値と条件付き中央値（または分位点）という異なる統計量を近似ターゲットとすることを説明できる [cite: 774, 778, 779]。"
          [cite_start]level_4_advanced: "データに外れ値が多い場合に、なぜ二乗損失よりも絶対誤差損失の方が頑健な予測器の学習につながる可能性があるかを、近似ターゲット（期待値 vs. 中央値）の性質から説明できる [cite: 777, 779]。"
  - topic_name: "分類タスクの基礎"
    concepts:
      - concept_name: "分類タスクの困難性"
        [cite_start]description: "分類タスクでは、①ラベルが離散的であるため数値を出力するモデルをそのまま使えず [cite: 788][cite_start]、②標準的な0/1損失の経験リスクはパラメーターに関して微分がほぼ常にゼロとなり、勾配ベースの最適化が困難であるという問題があります [cite: 795]。"
        rubric:
          level_1_unacceptable: "なぜ分類が回帰より難しい場合があるか説明できない。"
          level_2_basic: "ラベルが数値でないことが難しい点だと知っているが、最適化の問題点を説明できない。"
          [cite_start]level_3_proficient: "0/1損失の経験リスクが、パラメーターを微小に変化させても値が変わらない（不連続な）関数であるため、勾配を用いた最適化が難しいことを説明できる [cite: 795]。"
          [cite_start]level_4_advanced: "この最適化の困難性を乗り越えるために、0/1損失の代わりに微分可能で滑らかな「代理損失」を用いる決定論的アプローチがあることを説明できる [cite: 797]。"
      - concept_name: "確率論的分類とベイズ分類器"
        [cite_start]description: "分類タスクへの有力なアプローチの一つ。0/1損失（誤分類率）のリスクを最小化する近似ターゲットは、各クラスの事後確率 $p(y=k|x)$ が最大となるクラスを予測する**ベイズ分類器** $f^*(x) = \arg\max_k p(y=k|x)$ であることが知られています [cite: 798][cite_start]。この事実に基づき、まずクラス事後確率 $p(y|x)$ をモデルで推定し、その結果から予測を行うアプローチを**確率論的分類**と呼びます [cite: 796, 801]。"
        rubric:
          level_1_unacceptable: "確率論的分類のアプローチを説明できない。"
          level_2_basic: "確率を予測するアプローチだと知っているが、なぜそれが有効か説明できない。"
          [cite_start]level_3_proficient: "誤分類率を最小化する最適な予測器（ベイズ分類器）が、クラス事後確率を用いて書けることを説明できる [cite: 798]。"
          [cite_start]level_4_advanced: "確率論的分類が、直接的に誤分類率を最小化するのではなく、「クラス事後確率を精度良く推定する」という中間目標を立てることで、元の困難な問題を解決しようとする間接的なアプローチであることを説明できる [cite: 796]。"

lecture_number: 5
title: "確率論的二値分類と勾配法"
description: "分類タスクの中で最も基本的な二値分類を、確率論的アプローチで解く方法を学びます。具体的には、ロジスティック回帰を題材に、確率値を出力するモデルの作り方と、勾配降下法による最適化について理解を深めます。"
learning_objectives:
  - "確率論的二値分類の目標が、クラス1に属する事後確率 $p(y=1|x)$ をモデル化することにあると説明できる。"
  - "ロジスティック（シグモイド）関数が、実数値の出力を確率値に変換するために用いられることを説明できる。"
  - "ロジスティック回帰が、線形モデル、ロジスティック関数、交差エントロピー損失を組み合わせたものであることを説明できる。"
  - "勾配降下法のアルゴリズムを説明し、なぜ解析的に解けない問題の最適化に有効なのかを理解する。"
topics:
  - topic_name: "確率論的二値分類のモデル"
    concepts:
      - concept_name: "二値交差エントロピー損失"
        [cite_start]description: "2クラス（ラベル$y \in \{0,1\}$）分類において、モデルの出力 $g(x)$ がクラス1の事後確率 $p(y=1|x)$ を近似するように学習させるための損失関数です [cite: 853][cite_start]。式は $\ell = -y \log g(x) - (1-y)\log(1-g(x))$ で与えられます [cite: 853]。"
        rubric:
          level_1_unacceptable: "二値交差エントロピー損失を知らない。"
          level_2_basic: "分類で使われる損失関数の一種であることを知っている。"
          [cite_start]level_3_proficient: "この損失関数を最小化することが、モデル出力 $g(x)$ を真の事後確率 $p(y=1|x)$ に近づけること（最尤法）と等価であることを説明できる [cite: 853]。"
          [cite_start]level_4_advanced: "正解ラベルが $y=1$ のときは $- \log g(x)$ が、 $y=0$ のときは $- \log(1-g(x))$ が最小化されるように働き、モデルが正しい確率を出力するように学習が進むことを説明できる [cite: 853]。"
      - concept_name: "ロジスティック（シグモイド）関数"
        [cite_start]description: "任意の実数値 $z$ を (0, 1) の範囲の値に変換する関数 $\sigma(z) = 1/(1+e^{-z})$ です [cite: 855][cite_start]。線形モデルなどの実数値出力を、確率値として解釈できるようにするために活性化関数として用いられます [cite: 854]。"
        rubric:
          level_1_unacceptable: "ロジスティック関数を知らない。"
          level_2_basic: "S字型のグラフを持つ関数であることを知っている。"
          [cite_start]level_3_proficient: "入力が実数で出力が(0,1)の範囲に収まるという性質を持ち、確率値を出力するモデルの最終層で使われることを説明できる [cite: 854, 855]。"
          [cite_start]level_4_advanced: "入力 $z$ が大きいほど出力は1に近づき、小さいほど0に近づくという関数の挙動を説明できる [cite: 855]。"
      - concept_name: "ロジスティック回帰"
        [cite_start]description: "パラメーター線形モデルの出力 $\theta^\top\phi(x)$ をロジスティック関数に通して確率値を得て、二値交差エントロピー損失（の経験リスク）を最小化するように学習する、確率論的二値分類の代表的な手法です [cite: 862][cite_start]。「回帰」という名前ですが分類手法です [cite: 862]。"
        rubric:
          level_1_unacceptable: "ロジスティック回帰を回帰手法だと誤解している。"
          level_2_basic: "分類手法の一種であることを知っている。"
          [cite_start]level_3_proficient: "ロジスティック回帰が「線形モデル」「ロジスティック関数」「交差エントロピー損失」の3つの要素から構成されることを説明できる [cite: 862]。"
          [cite_start]level_4_advanced: "なぜこの手法で学習されたモデルの出力が、クラス1に属する事後確率の良い近似となることが期待されるのかを、近似ターゲットの観点から説明できる [cite: 853]。"
  - topic_name: "勾配法による最適化"
    concepts:
      - concept_name: "勾配降下法"
        [cite_start]description: "目的関数 $L(\theta)$ を最小化するため、現在のパラメーター $\theta$ の位置から、関数値が最も急峻に減少する方向（負の勾配 $-\nabla L(\theta)$ の方向）に、少しずつパラメーターを更新していく反復的な最適化手法です [cite: 865, 866][cite_start]。更新式は $\theta \leftarrow \theta - \eta \nabla L(\theta)$ です [cite: 867]。"
        rubric:
          level_1_unacceptable: "勾配降下法が何をするのか説明できない。"
          level_2_basic: "最適化の手法の一つであることを知っている。"
          [cite_start]level_3_proficient: "目的関数の「坂」を少しずつ下っていくイメージでアルゴリズムを説明でき、学習率 $\eta$ がその「歩幅」を制御するハイパーパラメーターであることを理解している [cite: 867, 868]。"
          [cite_start]level_4_advanced: "ロジスティック回帰の目的関数は解析的に解（解の公式）が得られないため、勾配降下法のような反復的な最適化手法が必要になることを説明できる [cite: 863, 864]。"
      - concept_name: "重み減衰と早期停止"
        [cite_start]description: "勾配法における正則化の実現方法です。**重み減衰**はL2正則化と等価で、更新のたびにパラメーターを原点方向にわずかに縮小させます [cite: 869][cite_start]。**早期停止**は、検証データでの性能改善が見られなくなった時点で学習を打ち切ることで、過適合を防ぐ正則化手法です [cite: 870]。"
        rubric:
          level_1_unacceptable: "これらの用語を知らない。"
          level_2_basic: "正則化の一種であることを知っている。"
          [cite_start]level_3_proficient: "重み減衰がL2正則化に対応すること [cite: 869][cite_start]、早期停止が検証データを使って過適合を監視し学習を止める手法であることを説明できる [cite: 870]。"
          [cite_start]level_4_advanced: "早期停止が、学習の更新回数（iteration）自体をモデルの複雑さを制御するハイパーパラメーターと見なすアプローチであることを説明できる [cite: 870]。"

