### 第6回：多クラス分類とニューラルネットワーク

```yaml
lecture_number: 6
title: "確率論的多クラス分類とニューラルネットワークの基礎"
description: "二値分類の考え方を多クラス分類へ拡張し、そのためのソフトマックス関数を学びます。さらに、より表現力の高い非線形モデルの代表例として、ニューラルネットワークの基本的な構造と構成要素を理解します。"
learning_objectives:
  - "ソフトマックス関数が、多クラス分類における事後確率ベクトルを出力するために用いられることを説明できる。"
  - "ニューラルネットワークが、線形変換と非線形な活性化関数からなる「層（レイヤー）」を積み重ねた階層的なモデルであることを説明できる。"
  - "活性化関数がモデルに非線形性を導入し、表現能力を高めるために不可欠な役割を果たすことを理解する。"
topics:
  - topic_name: "確率論的多クラス分類"
    concepts:
      - concept_name: "ソフトマックス関数"
        [cite_start]description: "K個の実数値からなるベクトル $z$ を、K次元の確率値ベクトル（各成分が非負で総和が1）に変換する関数です [cite: 901][cite_start]。$k$番目の出力は $\text{Softmax}(z)_k = e^{z_k} / \sum_{j=1}^K e^{z_j}$ で計算されます [cite: 901]。多クラス分類モデルの最終層で、各クラスに属する事後確率を出力するために用いられます。"
        rubric:
          level_1_unacceptable: "ソフトマックス関数を知らない。"
          level_2_basic: "多クラス分類で使われる関数であることを知っている。"
          [cite_start]level_3_proficient: "実数値のベクトルを確率値のベクトルに変換する役割を説明できる [cite: 900]。"
          [cite_start]level_4_advanced: "ソフトマックス関数が、2クラスの場合にはロジスティック関数と等価な表現になることを説明でき、ロジスティック関数の多クラスへの一般化とみなせることを理解している [cite: 902]。"
      - concept_name: "多クラスロジスティック回帰"
        [cite_start]description: "各クラスごとに個別の線形モデルを用意してK次元のスコアベクトルを計算し、それをソフトマックス関数に通して確率値ベクトルを得て、交差エントロピー損失で学習する、確率論的多クラス分類の代表的な手法です [cite: 905]。"
        rubric:
          level_1_unacceptable: "多クラス分類をどのように行うか説明できない。"
          level_2_basic: "ロジスティック回帰を多クラスにしたものであることを知っている。"
          [cite_start]level_3_proficient: "クラスごとに線形モデルがあり、それらの出力をソフトマックス関数で確率に変換するモデル構造を説明できる [cite: 905]。"
          [cite_start]level_4_advanced: "その目的関数（負の対数尤度）の勾配を計算し、勾配降下法で学習できることを説明できる [cite: 908]。"
  - topic_name: "ニューラルネットワークの基礎"
    concepts:
      - concept_name: "順伝播型ニューラルネットワーク（FNN）の構造"
        [cite_start]description: "入力層、複数の中間層（隠れ層）、出力層から構成される、最も基本的なニューラルネットワークアーキテクチャです [cite: 924][cite_start]。情報は入力層から出力層へ一方向に伝播（順伝播）します。各層は複数の**ユニット**（ニューロン）から構成されます [cite: 932, 933]。"
        rubric:
          level_1_unacceptable: "ニューラルネットワークの構造を説明できない。"
          level_2_basic: "層が積み重なったものであることを知っている。"
          [cite_start]level_3_proficient: "入力層、隠れ層、出力層の役割と、情報が一方向に流れる「順伝播型」の構造を図示して説明できる [cite: 924]。"
          [cite_start]level_4_advanced: "各層のユニット数が「層の幅」、層の数が「モデルの深さ」というハイパーパラメーターに対応することを説明できる [cite: 929, 935]。"
      - concept_name: "レイヤーと活性化関数"
        [cite_start]description: "各層（レイヤー）の計算は、入力ベクトルに対する線形変換（重み行列 $W$ とバイアスベクトル $b$ による $Wx+b$）と、その結果の各成分に適用される非線形な**活性化関数** $\psi$ の2段階で構成されます [cite: 925]。"
        rubric:
          level_1_unacceptable: "レイヤーが何をしているか説明できない。"
          level_2_basic: "「線形変換」と「活性化関数」という言葉を知っている。"
          [cite_start]level_3_proficient: "レイヤーの処理が $x \rightarrow \psi(Wx+b)$ という計算であることを説明できる [cite: 925]。"
          [cite_start]level_4_advanced: "もし活性化関数がなければ（あるいは線形な活性化関数しかなければ）、何層重ねても結局は1層の線形変換と等価になってしまい、モデルの表現能力が向上しないことを説明できる [cite: 931]。"
      - concept_name: "主要な活性化関数"
        [cite_start]description: "活性化関数はモデルに非線形性を導入します。代表的なものに、**シグモイド関数** $\sigma(z)$、**ReLU**（Rectified Linear Unit） $\max(0, z)$、**ソフトマックス関数**などがあります [cite: 926][cite_start]。出力層の活性化関数は、タスクの目的（回帰なら恒等関数、確率的分類ならシグモイドやソフトマックス）に応じて選択されます [cite: 930]。"
        rubric:
          level_1_unacceptable: "活性化関数の具体例を挙げられない。"
          level_2_basic: "ReLUという名前を知っている。"
          level_3_proficient: "ReLU関数がどのような計算をするかを図示でき、なぜ中間層でシグモイドよりも広く使われるかの理由（勾配消失問題の緩和など）について言及できる。"
          [cite_start]level_4_advanced: "回帰、二値分類、多クラス分類の各タスクにおいて、出力層で一般的に用いられる活性化関数（恒等関数、シグモイド、ソフトマックス）をそれぞれ挙げ、その選択理由を説明できる [cite: 930]。"

lecture_number: 7
title: "ニューラルネットワークの最適化と非構造化データ"
description: "複雑で大規模になりがちなニューラルネットワークを効率的に学習させるための最適化手法（確率的勾配法、誤差逆伝播法）を学びます。また、AIの主要な応用対象である非構造化データ（画像・テキスト）の性質を理解します。"
learning_objectives:
  - "大規模データセットに対する学習において、なぜミニバッチ確率的勾配法が必要とされるのかを説明できる。"
  - "誤差逆伝播法が、計算グラフ上の連鎖律を用いて、複雑なモデルの勾配を効率的に計算するアルゴリズムであることを説明できる。"
  - "構造化データと非構造化データの違いを説明できる。"
  - "画像やテキストデータが、コンピュータ内部でどのように数値（テンソル）として表現され、どのような階層的構造を持つかを説明できる。"
topics:
  - topic_name: "ニューラルネットワークの最適化"
    concepts:
      - concept_name: "ミニバッチ確率的勾配法（Mini-batch SGD）"
        [cite_start]description: "大規模な訓練データ全体（フルバッチ）ではなく、その一部をランダムに抽出した**ミニバッチ**を使って勾配を計算し、パラメーターを更新する手法です [cite: 944][cite_start]。1回の更新にかかる計算量を大幅に削減でき、大規模データでの学習を可能にします [cite: 943]。"
        rubric:
          level_1_unacceptable: "SGDについて説明できない。"
          level_2_basic: "データを少しずつ使って学習する手法であることを知っている。"
          [cite_start]level_3_proficient: "フルバッチの勾配降下法の計算コストの問題点を指摘し、ミニバッチSGDがその解決策であることを説明できる [cite: 943]。"
          level_4_advanced: "ミニバッチの勾配が真の勾配のノイズを含んだ推定値であるため、学習過程がランダムに変動する（確率的）が、結果として非凸な目的関数においてより良い局所解にたどり着く可能性があることに言及できる。"
      - concept_name: "誤差逆伝播法（Backpropagation）"
        [cite_start]description: "ニューラルネットワークのような複雑な複合関数の勾配を、効率的に計算するためのアルゴリズムです。**計算グラフ**を用いて計算過程を表現し、出力側（損失）から入力側に向かって連鎖律を適用することで、各パラメーターに関する微分をシステマチックに求めていきます [cite: 970, 971, 974]。"
        rubric:
          level_1_unacceptable: "誤差逆伝播法が何かを説明できない。"
          level_2_basic: "ニューラルネットワークの学習で使われる手法であることを知っている。"
          [cite_start]level_3_proficient: "順伝播で損失を計算した後、逆方向に微分を「伝播」させていくことで、全てのパラメーターに関する勾配を一度の計算で求められるアルゴリズムである、という概要を説明できる [cite: 974]。"
          [cite_start]level_4_advanced: "誤差逆伝播法が、自動微分のリバースモードの一種であり、どのようなアーキテクチャのニューラルネットワークでも勾配計算を可能にする汎用的な手法であることを説明できる [cite: 973]。"
  - topic_name: "非構造化データとその特性"
    concepts:
      - concept_name: "構造化データ vs. 非構造化データ"
        [cite_start]description: "**構造化データ**は表形式データのように、どこに何の情報があるかという構造が予め定義されています [cite: 982, 983][cite_start]。一方、**非構造化データ**（画像、テキスト、音声など）は、そのような明確な構造を持たないデータです [cite: 993]。"
        rubric:
          level_1_unacceptable: "両者の違いを説明できない。"
          level_2_basic: "表形式データが構造化データであると知っている。"
          [cite_start]level_3_proficient: "構造化データと非構造化データの違いを説明し、それぞれの具体例を挙げることができる [cite: 981, 993]。"
          [cite_start]level_4_advanced: "なぜ非構造化データの扱いが難しいのかを、意味情報がデータ全体に暗黙的に埋め込まれており、それを抽出する必要があるからだと説明できる [cite: 992]。"
      - concept_name: "画像・テキストデータの数値表現"
        [cite_start]description: "コンピュータは、画像を**ピクセル**（画素）の輝度値や色情報（RGBなど）を**テンソル**（多次元配列）として並べたものとして扱います [cite: 984, 985, 986, 1178][cite_start]。テキストは、各文字に対応する番号（**文字コード**）の系列として扱われます [cite: 988]。"
        rubric:
          level_1_unacceptable: "画像やテキストがコンピュータ内でどう扱われるか説明できない。"
          level_2_basic: "画像が点の集まりであること、テキストが文字の並びであることを知っている。"
          [cite_start]level_3_proficient: "カラー画像が「高さ×幅×3チャンネル」のテンソルとして表現されることを説明できる [cite: 1178]。"
          [cite_start]level_4_advanced: "これらの生の数値表現（例：ピクセル値の羅列）から、人間が認識するような高次の意味（例：「犬」）を抽出することが、機械学習モデルの課題であることを説明できる [cite: 992]。"
      - concept_name: "概念の階層性"
        [cite_start]description: "非構造化データに含まれる意味情報は階層的です。例えば画像では「ピクセル→エッジ→パーツ→物体」のように [cite: 996][cite_start]、テキストでは「文字→単語→文→文章」のように [cite: 997]、低レベルな特徴から高レベルな概念が構成されます。"
        rubric:
          level_1_unacceptable: "階層性という言葉の意味を説明できない。"
          level_2_basic: "情報にレベルがあるという程度の理解。"
          [cite_start]level_3_proficient: "画像またはテキストを例に、概念の階層性を具体的な例を挙げて説明できる [cite: 996, 997]。"
          [cite_start]level_4_advanced: "深層ニューラルネットワークの階層的なアーキテクチャが、非構造化データの持つ概念の階層性を捉えるのに適しているという仮説について説明できる [cite: 998]。"

lecture_number: 8
title: "深層学習、類似度、次元の呪い"
description: "深層ニューラルネットワークがどのようにしてデータから有用な「表現」を学習するのかを理解します。また、予測のもう一つのアプローチである「類似度に基づく予測」を学び、その際に問題となる「次元の呪い」について考察します。"
learning_objectives:
  - "深層学習が、データから階層的な特徴表現を自動で学習する「表現学習」であることを説明できる。"
  - "事前学習と精密調整が、大規模データで学習された汎用的な表現を再利用する効率的な学習戦略であることを理解する。"
  - "k-最近傍法（k-NN）のアルゴリズムと、その性能が類似度（距離）の定義に依存することを説明できる。"
  - "「次元の呪い」がなぜ距離に基づく学習の妨げになるのかを、高次元空間の幾何学的な性質から説明できる。"
topics:
  - topic_name: "深層学習と表現学習"
    concepts:
      - concept_name: "深層ニューラルネットワーク（DNN）による階層的特徴抽出"
        [cite_start]description: "層を深く重ねたDNNは、学習を通じて、入力に近い浅い層ではエッジや模様のような局所的で単純な特徴を、出力に近い深い層では物体の一部や全体のような大域的で抽象的な特徴を捉えるユニットを獲得する傾向があります [cite: 1013, 1014, 1015, 1016]。"
        rubric:
          level_1_unacceptable: "DNNが何をしているか説明できない。"
          level_2_basic: "層が深いネットワークであると知っている。"
          [cite_start]level_3_proficient: "DNNの各層が、前の層の出力を入力として、より高次の特徴表現に変換しているという階層的な処理の概要を説明できる [cite: 1018]。"
          [cite_start]level_4_advanced: "学習済みモデルのユニットを活性化させる入力画像を可視化する実験結果を元に、浅い層と深い層で学習される特徴の抽象度の違いを具体的に説明できる [cite: 1013, 1015]。"
      - concept_name: "表現学習と事前学習・精密調整"
        [cite_start]description: "**表現学習**とは、データからタスクを解くのに有用なベクトル表現を自動で学習することです [cite: 1029][cite_start]。大規模データセットで汎用的な表現を学習させる**事前学習**を行い、その学習済みモデルを初期値として、個別タスクの少量のデータで追加学習する**精密調整（ファインチューニング）**は、効率的な学習戦略です [cite: 1020, 1022, 1023]。"
        rubric:
          level_1_unacceptable: "表現学習やファインチューニングが何かを説明できない。"
          level_2_basic: "学習済みのモデルを再利用することだと知っている。"
          [cite_start]level_3_proficient: "事前学習と精密調整のプロセスを説明し、なぜそれがゼロからの学習（フルスクラッチ）よりも効率的な場合があるのかを説明できる [cite: 1025]。"
          [cite_start]level_4_advanced: "DNNの浅い層は汎用的な特徴（エッジ検出など）を学習し、深い層はタスク固有の特徴を学習する傾向があるため、特に浅い層のパラメーターが再利用に適しているという仮説を説明できる [cite: 1019]。"
      - concept_name: "オートエンコーダー"
        [cite_start]description: "入力データ $x$ を、それより低次元の潜在変数 $z$ に圧縮するエンコーダーと、$z$ から元のデータ $x$ を復元しようとするデコーダーから構成される、教師なしの表現学習モデルです [cite: 1032][cite_start]。再構成誤差 $||x - D(E(x))||^2$ を最小化するように学習します [cite: 1033]。"
        rubric:
          level_1_unacceptable: "オートエンコーダーの構造を説明できない。"
          level_2_basic: "教師なし学習の手法の一つであると知っている。"
          [cite_start]level_3_proficient: "エンコーダーで次元を削減し、デコーダーで復元するという構造を説明でき、その学習目的が「情報を圧縮しつつも復元できるような良い表現（潜在変数）」の獲得にあることを理解している [cite: 1032, 1033]。"
          [cite_start]level_4_advanced: "オートエンコーダーがラベルなしデータで学習可能であるため、大量のデータを使って汎用的な特徴抽出器を事前学習するのに利用できることを説明できる [cite: 1033]。"
  - topic_name: "類似度に基づく予測と次元の呪い"
    concepts:
      - concept_name: "k-最近傍法（k-NN）"
        [cite_start]description: "入力されたデータ点に対し、訓練データの中から最も距離が近いk個のデータ点を見つけ、それらのラベルの多数決（分類）や平均（回帰）で予測を行う、事例ベースのノンパラメトリックモデルです [cite: 1040, 1041, 1044]。"
        rubric:
          level_1_unacceptable: "k-NNのアルゴリズムを説明できない。"
          level_2_basic: "「近いデータを見る」というアイデアを知っているが、kの役割を説明できない。"
          [cite_start]level_3_proficient: "k-NNのアルゴリズムを説明し、kの値と使用する距離関数がモデルの挙動を決めるハイパーパラメーターであることを理解している [cite: 1045]。"
          [cite_start]level_4_advanced: "kの値が小さいと過適合しやすく、大きいと過少適合しやすくなる傾向があることを、決定境界の形状の観点から説明できる [cite: 1046]。"
      - concept_name: "次元の呪い"
        [cite_start]description: "データの次元数が高くなるにつれて、空間が極端にスカスカになり、①体積が超球の表面近くに集中し [cite: 1111][cite_start]、②任意の2点間の距離がほとんど変わらなくなり [cite: 1114][cite_start]、③任意の2つのベクトルがほぼ直交する [cite: 1115] など、低次元での幾何学的直観が通用しなくなる現象群です。"
        rubric:
          level_1_unacceptable: "次元の呪いという言葉を知らない、または説明できない。"
          level_2_basic: "「次元が高いと学習が難しい」という程度の理解。"
          [cite_start]level_3_proficient: "高次元空間では、体積が球面に集中したり、ランダムなベクトルがほぼ直交したりといった具体的な現象を挙げることができる [cite: 1111, 1115]。"
          [cite_start]level_4_advanced: "次元の呪いがk-NNのような距離に基づく手法にとってなぜ問題なのかを、「最近傍」という概念が統計的に意味を失い、近くの点も遠くの点も区別がつかなくなるため、と説明できる [cite: 1117]。"

