### 第10回：コンピュータービジョン

```yaml
lecture_number: 10
title: "応用領域の案内①：コンピュータービジョン"
description: "機械に「見る」能力を与えるコンピュータービジョンの世界を概観します。画像認識や物体検出といった主要なタスクを学び、それらを実現するための中核技術である畳み込みニューラルネットワーク（CNN）の仕組みを理解します。"
learning_objectives:
  - "コンピュータービジョンの主要なタスク（画像分類、物体検出、セグメンテーション）を区別し、それぞれの入出力を説明できる。"
  - "画像データがコンピュータ内でテンソルとして表現されることを理解する。"
  - "畳み込み層が、画像の空間的構造（局所性）と位置不変性という事前知識をどのように活用しているかを説明できる。"
  - "U-Netのようなエンコーダー・デコーダー構造が、なぜピクセル単位の予測（セグメンテーションなど）に適しているのかを説明できる。"
topics:
  - topic_name: "コンピュータービジョンのタスク"
    concepts:
      - concept_name: "画像データとテンソル表現"
        [cite_start]description: "画像は、**ピクセル**（画素）のグリッドです。各ピクセルは色情報（例：RGBの3チャンネル）や輝度値を持ちます。コンピュータ内では、画像は「高さ×幅×チャンネル数」の形状を持つ3階の**テンソル**として表現されます [cite: 1178, 1197]。"
        rubric:
          level_1_unacceptable: "画像がどのように数値で表現されるか説明できない。"
          level_2_basic: "画像がピクセルの集まりであることは知っているが、チャンネルの概念を説明できない。"
          [cite_start]level_3_proficient: "カラー画像が3チャンネル（RGB）、グレースケール画像が1チャンネルのテンソルであり、その形状を説明できる [cite: 1178]。"
          [cite_start]level_4_advanced: "画像内の座標系が、左上を原点とし、下方向がy軸、右方向がx軸となることを説明できる [cite: 1179]。"
      - concept_name: "画像認識の主要タスク"
        [cite_start]description: "画像から意味情報を抽出するタスク群です。**画像分類**（画像全体のラベル付け）[cite: 1181][cite_start]、**物体検出**（物体の位置をバウンディングボックスで特定）[cite: 1182][cite_start]、**セグメンテーション**（ピクセル単位で物体領域を塗り分ける）[cite: 1184][cite_start]、**キーポイント推定**（物体の特徴点の座標を推定）[cite: 1183]などがあります。"
        rubric:
          level_1_unacceptable: "画像認識タスクを区別できない。"
          level_2_basic: "画像分類が何かを知っているが、物体検出やセグメンテーションとの出力の違いを説明できない。"
          level_3_proficient: "画像分類、物体検出、セグメンテーション、キーポイント推定の4つのタスクについて、それぞれの出力が何か（クラスラベル、座標、マスク画像など）を明確に区別して説明できる。"
          [cite_start]level_4_advanced: "セマンティックセグメンテーション（クラス毎に塗り分け）とインスタンスセグメンテーション（物体個体毎に塗り分け）の違いを説明できる [cite: 1185]。"
  - topic_name: "画像処理モデルのアーキテクチャ"
    concepts:
      - concept_name: "畳み込み層（Convolution Layer）"
        [cite_start]description: "学習可能な小さなフィルター（**カーネル**）を画像上でスライドさせながら、局所領域との内積（**畳み込み**演算）を計算することで、特徴マップを生成する層です [cite: 1204, 1205, 1206][cite_start]。これにより、ピクセル間の空間的な隣接関係を保ったまま処理を進めることができます [cite: 1200]。"
        rubric:
          level_1_unacceptable: "畳み込み層が何をするのか説明できない。"
          level_2_basic: "CNNで使われる層であると知っている。"
          [cite_start]level_3_proficient: "カーネル（フィルター）が画像上の小領域をスキャンして特徴を抽出する、という畳み込み層の基本的な処理を図で説明できる [cite: 1206]。"
          level_4_advanced: "全結合層がピクセルの位置情報を無視してしまうのに対し、畳み込み層は局所的な結合とパラメーター共有によって、位置情報を保持しつつ効率的に学習できることを対比して説明できる。"
      - concept_name: "U-Netとエンコーダー・デコーダー構造"
        [cite_start]description: "セグメンテーションのように、入力画像と同じサイズの画像（マスク）を出力するタスクに用いられる代表的なアーキテクチャです [cite: 1219][cite_start]。前半の**エンコーダー**部分（畳み込み層を重ねる）で画像の特徴を抽出しながら空間解像度を下げ、後半の**デコーダー**部分で**アップサンプリング**等を用いて解像度を上げながらピクセル単位の予測を生成します。エンコーダーからデコーダーへの**スキップ接続**が特徴です [cite: 1219]。"
        rubric:
          level_1_unacceptable: "U-Netの構造を説明できない。"
          level_2_basic: "画像から画像を生成するモデルであることを知っている。"
          [cite_start]level_3_proficient: "エンコーダーで圧縮し、デコーダーで復元するというU字型の構造を説明できる [cite: 1219]。"
          level_4_advanced: "スキップ接続が、エンコーダーで抽出された低レベルな位置情報（物体の輪郭など）をデコーダーに直接伝えることで、精度の高いセグメンテーションを可能にする役割を果たしていることを説明できる。"

