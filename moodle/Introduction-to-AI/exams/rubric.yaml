### 第3回：モデル選択と学習の哲学

```yaml
lecture_number: 3
title: "モデル選択と学習の哲学"
description: "モデルの性能を最大化するために不可欠なハイパーパラメーター選択の手法を学びます。また、機械学習の根底にある「帰納」という考え方と、その限界について哲学的な側面から考察します。"
learning_objectives:
  - "ハイパーパラメーターの具体例を挙げ、その選択がなぜ重要かを説明できる。"
  - "検証データを用いたモデル選択のプロセスと、交差検証の役割を説明できる。"
  - "複数のハイパーパラメーターを効率的に探索する手法の存在を知る。"
  - "機械学習が直面する根源的な問題（帰納の問題）と、それを乗り越えるための「帰納バイアス」の重要性を説明できる。"
topics:
  - topic_name: "モデル選択とハイパーパラメーター"
    concepts:
      - concept_name: "ハイパーパラメーターの定義と例"
        [cite_start]description: "モデルの訓練前に人間が設定し、学習プロセス自体を制御するパラメーターのことです [cite: 686][cite_start]。例として、モデルの複雑さ（多項式の次数 $r$）、正則化の強さ（正則化係数 $\lambda$）、最適化手法の挙動（学習率 $\eta$）などがあります [cite: 686]。"
        rubric:
          level_1_unacceptable: "ハイパーパラメーターとパラメーターの違いを説明できない。"
          level_2_basic: "正則化係数 $\lambda$ がハイパーパラメーターであることを知っているが、他に例を挙げられない。"
          [cite_start]level_3_proficient: "モデルの複雑さ、正則化、最適化手法の3つの観点から、ハイパーパラメーターの具体例をそれぞれ挙げることができる [cite: 686]。"
          [cite_start]level_4_advanced: "どのモデルアーキテクチャ（例：線形モデル vs. k-NN）を使うかという「モデル選択」自体も、広義のハイパーパラメーター選択問題であることを説明できる [cite: 686]。"
      - concept_name: "検証データの取り置き法（ホールドアウト法）"
        [cite_start]description: "手元のデータを訓練用・検証用・テスト用に分割し、ハイパーパラメーターの各候補について、①訓練用データでモデルを学習し、②検証用データで性能を評価するプロセスを繰り返します。最終的に、検証データで最も性能が良かったハイパーパラメーターを選択し、その設定で全訓練データを使って再学習したモデルを最終モデルとします [cite: 688, 689, 690]。"
        rubric:
          level_1_unacceptable: "検証データの役割を説明できない。"
          level_2_basic: "データを3つに分けることは知っているが、検証データで何をするのかを具体的に説明できない。"
          [cite_start]level_3_proficient: "訓練データ・検証データ・テストデータの3つの役割（学習、モデル選択、最終性能評価）を明確に区別し、ホールドアウト法のプロセスを説明できる [cite: 688]。"
          level_4_advanced: "検証データでハイパーパラメーターを何度も試行錯誤するため、検証データでの性能評価値もまた楽観的な推定値になりうる。そのため、最終的な汎化性能の真に公平な評価には、一度もモデル選択に関与していないテストデータが必要であることを説明できる。"
      - concept_name: "交差検証（Cross-Validation）"
        [cite_start]description: "手元の訓練データをK個に分割し、そのうちの1つを検証データ、残りを訓練データとしてK回の学習・評価を繰り返し、性能評価値の平均をそのハイパーパラメーターのスコアとする手法です [cite: 692]。特にデータ量が少ない場合に、データを有効活用し、評価のばらつきを抑えることができます。"
        rubric:
          level_1_unacceptable: "交差検証が何かを説明できない。"
          level_2_basic: "データを複数に分割する手法であることは知っているが、その目的がわからない。"
          [cite_start]level_3_proficient: "K分割交差検証のプロセスを図を用いて説明でき、なぜデータが少ない場合に有効なのかを説明できる [cite: 692]。"
          [cite_start]level_4_advanced: "データ数n個の場合のn分割交差検証である「1つ抜き交差検証（LOOCV）」の概念を説明できる [cite: 693]。"
      - concept_name: "ハイパーパラメーター探索手法"
        [cite_start]description: "ハイパーパラメーターが複数ある場合、その最適な組み合わせを見つけるための手法です。**グリッドサーチ**は全ての組み合わせを試す総当たり方式 [cite: 702][cite_start]、**ランダムサーチ**はランダムに組み合わせを試す方式 [cite: 703][cite_start]、**ベイズ最適化**は過去の評価結果を元に次に試すべき有望な点を推測する、より効率的な方式です [cite: 704]。"
        rubric:
          level_1_unacceptable: "ハイパーパラメーターが複数ある場合にどうすればよいか説明できない。"
          level_2_basic: "グリッドサーチ（総当たり）という手法を知っている。"
          [cite_start]level_3_proficient: "グリッドサーチの計算コストの問題点を指摘し、ランダムサーチがその代替案となりうることを説明できる [cite: 702, 703]。"
          [cite_start]level_4_advanced: "ベイズ最適化が、単なるランダムな探索ではなく、これまでの試行結果から「当たり」をつけながら効率的に探索する手法であるという基本概念を説明できる [cite: 704]。"
  - topic_name: "学習の哲学と枠組み"
    concepts:
      - concept_name: "学習の枠組み（まとめ）"
        [cite_start]description: "予測タスクの教師付き学習は、①タスクと学習戦略の設定 → ②モデルと損失関数の選定 → ③目的関数の設計と最適化 → ④モデル選択と評価、という一連のプロセスとして体系化できます [cite: 709, 710, 711, 712, 713]。"
        rubric:
          level_1_unacceptable: "機械学習のプロセスを説明できない。"
          level_2_basic: "「データを集めて学習する」という断片的な理解に留まる。"
          level_3_proficient: "学習の主要な4ステップ（タスク設定、モデル選定、最適化、評価）を順に挙げ、各ステップで何を決定するのかを説明できる。"
          level_4_advanced: "この枠組みが、線形回帰だけでなく、今後学ぶであろう様々な機械学習手法にも共通して適用可能な、汎用的な考え方であることを理解している。"
      - concept_name: "帰納の問題と自然の斉一性"
        [cite_start]description: "**帰納**とは、限られた観測事例から一般的な法則を導く推論です [cite: 720][cite_start]。しかし、「過去がそうだったから未来もそうである」という推論の正当性は論理的には保証できず、これを**帰納の問題**と呼びます [cite: 721][cite_start]。我々は暗黙のうちに「自然の法則は変わらない（**自然の斉一性**）」という仮定を置いています [cite: 722]。"
        rubric:
          level_1_unacceptable: "帰納という言葉の意味を説明できない。"
          level_2_basic: "帰納と演繹の違いを説明できない。"
          level_3_proficient: "「全てのカラスは黒い」という命題を例に、帰納的推論の性質とその論理的な脆弱性（帰納の問題）を説明できる。"
          [cite_start]level_4_advanced: "教師付き学習が「観測されたデータ（過去）」から「未知のデータ（未来）」に対する法則を獲得しようとする試みであり、本質的に帰納的推論と同じ構造を持つことを説明できる [cite: 723]。"
      - concept_name: "No-Free-Lunch Theorem と帰納バイアス"
        [cite_start]description: "**No-Free-Lunch Theorem**は、「あらゆる問題に対して最高の性能を発揮する万能な学習アルゴリズムは存在しない」ことを示唆します [cite: 725][cite_start]。ある手法が有効であるためには、特定の種類の問題に特化する必要があり、その「特化」や「仮定」を**帰納バイアス**と呼びます [cite: 730]。"
        rubric:
          level_1_unacceptable: "No-Free-Lunch Theoremや帰納バイアスという言葉を知らない。"
          level_2_basic: "「万能のAIはない」という結論だけを知っている。"
          [cite_start]level_3_proficient: "No-Free-Lunch Theoremが示唆することを説明し、なぜ機械学習手法に「仮定（帰納バイアス）」が必要不可欠なのかを説明できる [cite: 727]。"
          [cite_start]level_4_advanced: "オッカムの剃刀（単純なモデルを好む傾向）が、強力な帰納バイアスの一例であることを説明し、L2正則化がこのバイアスを実装する一つの方法であると関連付けて説明できる [cite: 731]。"

lecture_number: 4
title: "リスク最小化と近似ターゲット、分類タスクの基礎"
description: "損失関数の選択が、学習が目指すべき理想的な関数（近似ターゲット）を決定することを学びます。また、回帰タスクとの違いに注目しながら、分類タスクを解くための基本的なアプローチを理解します。"
learning_objectives:
  - "損失関数とデータ生成分布によって、リスクを最小化する理想的な予測器（近似ターゲット）が一意に決まることを説明できる。"
  - "二乗損失、絶対誤差損失、0/1損失に対応する近似ターゲットがそれぞれ何かを説明できる。"
  - "分類タスクを解く上での困難（離散的な出力、目的関数の非微分性）を理解する。"
  - "分類タスクへの確率論的アプローチが、なぜクラス事後確率の推定を目指すのかを、近似ターゲットの観点から説明できる。"
topics:
  - topic_name: "リスク最小化と近似ターゲット"
    concepts:
      - concept_name: "近似ターゲットの概念"
        description: "モデルクラスの内部だけでなく、あらゆる関数の中でリスクを最小化する理想的な予測器 $f^*$ のことです。学習は、この近似ターゲットをモデルでできるだけ良く近似しようとする試みと見なせます。"
        rubric:
          level_1_unacceptable: "近似ターゲットという概念を説明できない。"
          level_2_basic: "「理想のモデル」といった曖昧な理解に留まる。"
          level_3_proficient: "近似ターゲットが、損失関数とデータ生成分布によって決まる、理論的に最適な予測器であることを説明できる。"
          level_4_advanced: "学習のゴールを「モデルが近似ターゲットに近づくこと」と捉え、モデルの表現能力がその達成度を左右する要因であることを説明できる。"
      - concept_name: "各種損失関数と対応する近似ターゲット"
        description: "損失関数の選択によって近似ターゲットは変わります。**二乗損失**の場合は**条件付き期待値** $f^*(x) = \mathbb{E}[Y|X=x]$ に、**絶対誤差損失**の場合は**条件付き中央値**に、**ピンボール損失**の場合は**条件付き分位点**になります。"
        rubric:
          level_1_unacceptable: "損失関数と近似ターゲットの関係を説明できない。"
          level_2_basic: "二乗損失がよく使われることは知っているが、それが何を推定しているのか説明できない。"
          level_3_proficient: "二乗損失と絶対誤差損失（またはピンボール損失）が、それぞれ条件付き期待値と条件付き中央値（または分位点）という異なる統計量を近似ターゲットとすることを説明できる。"
          level_4_advanced: "データに外れ値が多い場合に、なぜ二乗損失よりも絶対誤差損失の方が頑健な予測器の学習につながる可能性があるかを、近似ターゲット（期待値 vs. 中央値）の性質から説明できる。"
  - topic_name: "分類タスクの基礎"
    concepts:
      - concept_name: "分類タスクの困難性"
        description: "分類タスクでは、①ラベルが離散的であるため数値を出力するモデルをそのまま使えず、②標準的な0/1損失の経験リスクはパラメーターに関して微分がほぼ常にゼロとなり、勾配ベースの最適化が困難であるという問題があります。"
        rubric:
          level_1_unacceptable: "なぜ分類が回帰より難しい場合があるか説明できない。"
          level_2_basic: "ラベルが数値でないことが難しい点だと知っているが、最適化の問題点を説明できない。"
          level_3_proficient: "0/1損失の経験リスクが、パラメーターを微小に変化させても値が変わらない（不連続な）関数であるため、勾配を用いた最適化が難しいことを説明できる。"
          level_4_advanced: "この最適化の困難性を乗り越えるために、0/1損失の代わりに微分可能で滑らかな「代理損失」を用いるアプローチがあることを説明できる。"
      - concept_name: "確率論的分類とベイズ分類器"
        description: "分類タスクへの有力なアプローチの一つ。0/1損失（誤分類率）のリスクを最小化する近似ターゲットは、各クラスの事後確率 $p(y=k|x)$ が最大となるクラスを予測する**ベイズ分類器** $f^*(x) = \arg\max_k p(y=k|x)$ であることが知られています。この事実に基づき、まずクラス事後確率 $p(y|x)$ をモデルで推定し、その結果から予測を行うアプローチを**確率論的分類**と呼びます。"
        rubric:
          level_1_unacceptable: "確率論的分類のアプローチを説明できない。"
          level_2_basic: "確率を予測するアプローチだと知っているが、なぜそれが有効か説明できない。"
          level_3_proficient: "誤分類率を最小化する最適な予測器（ベイズ分類器）が、クラス事後確率を用いて書けることを説明できる。"
          level_4_advanced: "確率論的分類が、直接的に誤分類率を最小化するのではなく、「クラス事後確率を精度良く推定する」という中間目標を立てることで、元の困難な問題を解決しようとする間接的なアプローチであることを説明できる。"

