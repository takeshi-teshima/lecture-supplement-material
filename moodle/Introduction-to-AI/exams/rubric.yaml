### 第9回：カーネル法と類似度学習

```yaml
lecture_number: 9
title: "カーネル法と類似度学習"
description: "事例ベースの考え方とパラメーター線形モデルを融合したカーネル法を学びます。また、データに内在する「類似度」そのものを学習する、より高度な表現学習のアプローチとしての対照学習を理解します。"
learning_objectives:
  - "カーネル線形モデルが、訓練データ点との類似度を特徴量として用いるモデルであることを説明できる。"
  - "カーネルトリックの基本的なアイデアと、それがなぜ高次元特徴空間での計算を効率化するのかを説明できる。"
  - "類似度学習の目的と、それが認証や検索といったタスクでなぜ重要になるのかを説明できる。"
  - "対照学習が、類似ペアと非類似ペアの対比を通じて、ラベルなしデータから類似度を学習する枠組みであることを説明できる。"
topics:
  - topic_name: "カーネル法"
    concepts:
      - concept_name: "カーネル線形モデル"
        [cite_start]description: "訓練データ点 $x_j$ との類似度を測る**カーネル関数** $K(x, x_j)$ を特徴量として用いるパラメーター線形モデル $f_\theta(x) = \sum_{j=1}^n \theta_j K(x, x_j)$ のことです [cite: 1058][cite_start]。パラメーター数 $n$ は訓練データ数に等しくなります [cite: 1058]。"
        rubric:
          level_1_unacceptable: "カーネル法が何かを説明できない。"
          level_2_basic: "類似度を使う手法であると知っている。"
          [cite_start]level_3_proficient: "各訓練データ点との類似度を計算し、その重み付き和で予測を行うモデルであることを説明できる [cite: 1059]。"
          [cite_start]level_4_advanced: "パラメーターを持ちながらも訓練データを直接参照するため、パラメトリックモデルとノンパラメトリックモデル（事例ベースモデル）の両方の性質を併せ持つことを説明できる [cite: 1061]。"
      - concept_name: "表現定理とカーネルトリック"
        [cite_start]description: "**表現定理**は、特定の条件下で学習された線形モデルの解 $\hat{\eta}$ が、実は訓練データの特徴ベクトル $\psi(x_i)$ の線形結合で書けることを示します。これにより、予測値は $f(x) = \langle\hat{\eta}, \psi(x)\rangle = \sum_i \hat{\theta}_i \langle\psi(x_i), \psi(x)\rangle$ となります [cite: 1064][cite_start]。この内積部分 $\langle\psi(x_i), \psi(x)\rangle$ を直接計算可能なカーネル関数 $K(x_i, x)$ に置き換えることで、高次元の特徴ベクトル $\psi(x)$ を陽に計算せずに済ませる技術が**カーネルトリック**です [cite: 1066]。"
        rubric:
          level_1_unacceptable: "カーネルトリックが何かを説明できない。"
          level_2_basic: "計算を速くするテクニックであると知っている。"
          [cite_start]level_3_proficient: "カーネルトリックが、カーネル関数 $K(x,x')$ を使って、高次元特徴空間での内積計算を効率的に行う手法であることを説明できる [cite: 1066]。"
          [cite_start]level_4_advanced: "表現定理が、なぜ特徴写像 $\psi(x)$ を陽に計算する代わりにカーネル関数 $K(x,x')$ を用いるアプローチが正当化されるのか、その理論的根拠を与えていることを説明できる [cite: 1064, 1065]。"
  - topic_name: "類似度学習"
    concepts:
      - concept_name: "類似度学習の目的と応用"
        [cite_start]description: "データの本質的な「近さ」を捉えるような、タスクに特化した類似度関数 $sim(x, x')$ や、それを計算するための特徴表現 $\phi(x)$ を学習することです [cite: 1127][cite_start]。特に、学習後にも未知のクラスが登場しうる**オープンセット分類**（例：顔認証）や、類似度順にアイテムを並べる**情報検索**タスクで強力なアプローチとなります [cite: 1130, 1134, 1135]。"
        rubric:
          level_1_unacceptable: "類似度学習の目的を説明できない。"
          level_2_basic: "「似ているものを学習する」という程度の理解。"
          [cite_start]level_3_proficient: "次元の呪いを克服し、タスクにとって意味のある「近さ」の尺度を獲得することが目的であると説明できる [cite: 1127]。"
          [cite_start]level_4_advanced: "顔認証や類似商品検索のようなタスクでは、なぜクラス数が固定された通常の分類タスクとして解くのが難しく、類似度学習が有効なアプローチとなるのかを説明できる [cite: 1131]。"
      - concept_name: "対照学習（Contrastive Learning）"
        [cite_start]description: "ラベルなしデータから類似度を学習する自己教師あり学習の代表的な手法です。同じデータから作った異なるバージョン（例：同じ画像に別のデータ拡張を適用）を**正例（類似ペア）**とし、データセット内の他のデータとのペアを**負例（非類似ペア）**とみなします [cite: 1164][cite_start]。そして、ベクトル表現空間において、正例ペアの類似度（例：コサイン類似度）を高く、負例ペアの類似度を低くするように表現学習を行います [cite: 1165, 1166]。"
        rubric:
          level_1_unacceptable: "対照学習が何かを説明できない。"
          level_2_basic: "類似度を学習する手法の一つであることを知っている。"
          [cite_start]level_3_proficient: "「似ているものを近づけ、似ていないものを遠ざける」という基本原理を説明し、そのために正例ペアと負例ペアをどのように構築するかを説明できる [cite: 1164]。"
          [cite_start]level_4_advanced: "対照学習の損失関数（例：InfoNCE損失）が、正例ペアの類似度を分子に、全ペアの類似度の合計を分母に置くソフトマックスの形をしており、実質的に「正例ペアを正しく分類する」多クラス分類問題として学習が進むことを説明できる [cite: 1166, 1167]。"

