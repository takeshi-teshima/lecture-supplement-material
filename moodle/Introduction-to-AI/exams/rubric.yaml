lecture_number: 1
title: "AIと機械学習の概観、予測タスクの定式化"
description: "AIの歴史的背景と現代における機械学習の位置づけを理解し、最も基本的なタスクである予測系タスクを数理的に定式化する枠組みを学びます。"
learning_objectives:
  - "AIの歴史における主要なブームと、その技術的変遷を説明できる。"
  - "機械学習が現代AIの中核技術であることを理解し、その定義を説明できる。"
  - "予測タスクを特徴量xからラベルyへの写像を求める問題として抽象化できる。"
  - "教師付き学習におけるリスク関数と経験リスク最小化の概念を説明できる。"
topics:
  - topic_name: "AIの全体像と歴史"
    concepts:
      - concept_name: "AIの多様な応用分野"
        [cite_start]description: "広告最適化から自動運転まで、AIが様々な分野で利用されていることの概観です [cite: 40]。"
        rubric:
          level_1_unacceptable: "AIの応用例を全く挙げられない。"
          level_2_basic: "自動運転など、いくつかの有名な応用例を知っている。"
          [cite_start]level_3_proficient: "複数の異なる分野（例：医療、金融、製造）におけるAIの応用例を具体的に挙げることができる [cite: 40, 41, 42, 45, 48, 49, 50]。"
          [cite_start]level_4_advanced: "AIという単一の技術ではなく、様々な要素技術の組み合わせで応用が実現されていることを説明できる [cite: 56, 89]。"
      - concept_name: "AIの歴史と3つのブーム"
        [cite_start]description: "AI研究史における主要なブームと、各時代で中心となった技術（第1次：推論・探索 [cite: 100][cite_start]、第2次：知識とエキスパートシステム [cite: 107][cite_start]、第3次：統計的機械学習 [cite: 114]）の変遷を指します。"
        rubric:
          level_1_unacceptable: "AIブームについて全く説明できない。"
          level_2_basic: "AIに「冬の時代」があったことを知っているが、各ブームの特徴を区別できない。"
          [cite_start]level_3_proficient: "3つのAIブームそれぞれの主要アプローチ（例：ルールベース vs. データ駆動）と、なぜ「冬の時代」を迎えたかの限界を具体的に説明できる [cite: 105, 113]。"
          [cite_start]level_4_advanced: "第3次ブームの成功背景として、インターネット普及によるデータ量増大と計算機性能の向上という2つの「追い風」を挙げ、過去のブームとの本質的な違いを説明できる [cite: 118, 120]。"
  - topic_name: "予測系タスクの定式化"
    concepts:
      - concept_name: "予測系タスクの抽象化"
        [cite_start]description: "迷惑メールフィルタリングや文字認識など、一見異なるタスクが「入力xに対して正しいyを出力する」という共通の構造を持つ問題として抽象化できることです [cite: 255]。"
        rubric:
          level_1_unacceptable: "予測タスクが何かを説明できない。"
          level_2_basic: "いくつかの具体例を知っているが、共通の構造を説明できない。"
          [cite_start]level_3_proficient: "複数の具体的なタスク（例：音声認識、スパム判定）を「入力x」と「出力y」が何かを明示して、共通の枠組みで説明できる [cite: 258, 260]。"
          [cite_start]level_4_advanced: "このタスクを解くことが、コンピュータで計算可能な「関数f」を見つけることと同義であると説明できる [cite: 273, 274]。"
      - concept_name: "回帰タスクと分類タスク"
        [cite_start]description: "予測系タスクのうち、予測したいラベルyが量的（実数など）なものを**回帰** [cite: 287][cite_start]、質的（カテゴリ）なものを**分類** [cite: 292]と呼び分けます。"
        rubric:
          level_1_unacceptable: "回帰と分類の違いを説明できない。"
          level_2_basic: "回帰が数値を、分類がカテゴリを予測することを知っているが、具体例を挙げられない。"
          [cite_start]level_3_proficient: "回帰（例：体重予測）と分類（例：犬かどうかの判定）の定義を正確に説明し、それぞれの具体例を挙げることができる [cite: 287, 292]。"
          [cite_start]level_4_advanced: "ワインの品種を化学成分から予測するタスクが、多クラス分類問題であることを説明できる [cite: 299]。"
      - concept_name: "教師付き学習"
        [cite_start]description: "正しい入出力のペアを多数集めた「ラベル付きデータ」$\\{(x_i, y_i)\\}_{i=1}^n$ から予測器を自動で構築する学習の枠組みです [cite: 337, 338]。"
        rubric:
          level_1_unacceptable: "教師付き学習が何かを説明できない。"
          level_2_basic: "「正解データ」を使うことだと知っているが、その目的を説明できない。"
          [cite_start]level_3_proficient: "「入力と正解出力のペア」から「未知の入力に対する出力を予測する規則」を学習する枠組みとして説明できる [cite: 337]。"
          [cite_start]level_4_advanced: "人間が手で複雑な予測ルール（計算式）を設計することが困難であるため、データから自動でルールを獲得する教師付き学習のアプローチが強力であることを説明できる [cite: 331, 359]。"
  - topic_name: "統計的学習の枠組み"
    concepts:
      - concept_name: "モデルとパラメーター"
        [cite_start]description: "予測器の候補となる、調整可能なパラメーター $\theta$ を持つ関数の集合 $f_\theta$ を**モデル**と呼びます [cite: 385, 399]。パラメーターを調整することで、様々な形状の関数を表現できます。"
        rubric:
          level_1_unacceptable: "モデルやパラメーターという言葉の意味を説明できない。"
          level_2_basic: "モデルが「AIの何か」という程度の曖昧な理解に留まる。"
          [cite_start]level_3_proficient: "調整可能なパラメーターを持つ関数が「モデル」であり、パラメーターの値を変えることで具体的な予測器（関数）が一つ決まる、という関係を説明できる [cite: 385, 401]。"
          [cite_start]level_4_advanced: "100次多項式モデルという一つのモデルクラスが、パラメーターの値によって直線的な関数から複雑に振動する関数まで、多様な関数を表現できることを説明できる [cite: 386, 388, 392, 395]。"
      - concept_name: "汎化性能とリスク関数"
        [cite_start]description: "良い予測器とは、手元の訓練データだけでなく、未知のデータに対しても性能が高い（**汎化性能**が高い）予測器です [cite: 411][cite_start]。この性能は、予測の誤差を測る**損失関数** $l(y, y')$ の、未知データに対する期待値である**リスク関数** $R(f) = \mathbb{E}[l(Y, f(X))]$ で定量化されます [cite: 431]。"
        rubric:
          level_1_unacceptable: "汎化性能やリスクという概念を説明できない。"
          level_2_basic: "「未知のデータでも当たる」ことが重要だと知っているが、リスク関数との関連を説明できない。"
          [cite_start]level_3_proficient: "汎化性能の重要性を説明し、それが損失関数の期待値である「リスク」によって測られることを理解している [cite: 411, 431]。"
          [cite_start]level_4_advanced: "リスクを最小化する学習目標が、特定のデータ点での成功不成功ではなく、「平均的に」性能が良い予測器を目指す現実的な目標設定であることを説明できる [cite: 419]。"
      - concept_name: "経験リスク最小化（ERM）"
        [cite_start]description: "リスク関数はデータ生成分布 $p(x,y)$ が未知なため計算できません [cite: 441][cite_start]。そこで、手元の訓練データ $\{(x_i, y_i)\}_{i=1}^n$ を使ってリスクを標本近似した**経験リスク** $\hat{R}(f) = \frac{1}{n}\sum_{i=1}^n l(y_i, f(x_i))$ を代わりに最小化する手法を**経験リスク最小化 (ERM)** と呼びます [cite: 457, 460]。"
        rubric:
          level_1_unacceptable: "経験リスクという言葉の意味を説明できない。"
          level_2_basic: "リスクと経験リスクを混同している。"
          [cite_start]level_3_proficient: "リスクが期待値（母集団平均）で、経験リスクが標本平均であり、後者が前者の近似として計算可能な代替目標であることを説明できる [cite: 456, 457]。"
          [cite_start]level_4_advanced: "ERMが有効であるための前提として、訓練データがテストデータと同じ分布から独立同分布(i.i.d.)でサンプリングされているという仮定が必要であることを説明できる [cite: 450, 451]。"

