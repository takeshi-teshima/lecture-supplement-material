### 第2回：回帰、線形モデル、過適合と正則化

```yaml
lecture_number: 2
title: "回帰、線形モデル、過適合と正則化"
description: "教師付き学習の具体例として線形回帰モデルを学び、最小二乗法による学習と評価の方法を理解します。また、機械学習における普遍的な課題である過適合と、その対策としての正則化について学びます。"
learning_objectives:
  - "線形単回帰モデルを最小二乗法で学習するプロセスを、最適化問題として定式化し、その解を導出できる。"
  - "訓練データと評価用データを分離するホールドアウト法の重要性を説明できる。"
  - "パラメーター線形モデルが、特徴写像を用いることで非線形な現象もモデル化できることを理解する。"
  - "過適合の現象を学習曲線を用いて説明し、その対策としてL2正則化が有効であることを説明できる。"
topics:
  - topic_name: "線形回帰モデルの学習"
    concepts:
      - concept_name: "最小二乗法"
        [cite_start]description: "回帰タスクにおいて、二乗損失に対応する経験リスク（平均二乗誤差）$L(w,b) = \frac{1}{n}\sum(y_i - (wx_i+b))^2$ を最小化することで、モデルのパラメーター $(w,b)$ を決定する学習法です [cite: 536]。"
        rubric:
          level_1_unacceptable: "最小二乗法が何をするのか説明できない。"
          level_2_basic: "データに最もよくフィットする直線を引く方法であると知っているが、何を最小化しているか説明できない。"
          [cite_start]level_3_proficient: "訓練データに対する予測値と真のラベルの「二乗誤差の平均」を最小化する最適化問題として定式化できる [cite: 536, 540]。"
          [cite_start]level_4_advanced: "最適化の一階の条件（各パラメーターに関する偏微分=0）を立て、連立方程式を解くことでパラメーターの解が求まることを説明できる [cite: 541, 549]。"
      - concept_name: "訓練と評価（ホールドアウト法）"
        [cite_start]description: "モデルの真の性能（汎化性能）を評価するためには、学習に用いていない未知のデータが必要です。そのため、手元のデータを**訓練用データ**と**評価用（テスト）データ**に分割する**ホールドアウト法**が用いられます [cite: 555]。"
        rubric:
          level_1_unacceptable: "なぜデータを分割する必要があるか説明できない。"
          level_2_basic: "データを分けることを知っているが、それぞれの役割を説明できない。"
          [cite_start]level_3_proficient: "学習に用いたデータで性能を評価すると、モデルの性能を過大評価してしまう危険性があるため、評価用データを別に用意する必要があることを説明できる [cite: 555]。"
          [cite_start]level_4_advanced: "時系列データの場合、ランダムに分割するのではなく、過去のデータを訓練に、未来のデータを評価に使う「時系列分割」が適切であることを説明できる [cite: 557]。"
  - topic_name: "線形モデルの一般化"
    concepts:
      - concept_name: "パラメーター線形モデルと特徴写像"
        [cite_start]description: "パラメーター $\theta$ に関して線形なモデル $f_\theta(x) := \theta^\top\phi(x)$ のことです [cite: 585]。入力 $x$ を変換する関数 $\phi(x)$ を**特徴写像**と呼び、これを非線形にすることで、モデル全体としては入力 $x$ に対して非線形な関数を表現できます。"
        rubric:
          level_1_unacceptable: "線形モデルが直線や平面しか表現できないと誤解している。"
          level_2_basic: "特徴写像という言葉を知っているが、その役割を説明できない。"
          [cite_start]level_3_proficient: "多項式モデル [cite: 591] [cite_start]や三角多項式モデル [cite: 595] が、適切な特徴写像を用いることでパラメーター線形モデルとして表現できることを説明できる。"
          [cite_start]level_4_advanced: "Bag-of-Words [cite: 598] [cite_start]やHOG特徴量 [cite: 600] [cite_start]のように、テキストや画像といった非構造化データも、特徴写像を工夫することで線形モデルの枠組みで扱えることを説明できる（特徴量エンジニアリング [cite: 603]）。"
      - concept_name: "線形モデルの最小二乗解（正規方程式）"
        [cite_start]description: "一般のパラメーター線形モデル $f_\theta(x) = \theta^\top\phi(x)$ に対する最小二乗法の解は、計画行列 $\Phi$ を用いて $\hat{\theta} = (\Phi^\top\Phi)^{-1}\Phi^\top y$ という閉じた式（正規方程式）で与えられます [cite: 617, 616]。"
        rubric:
          level_1_unacceptable: "正規方程式を知らない。"
          level_2_basic: "解を求める公式があることを知っているが、その意味を説明できない。"
          [cite_start]level_3_proficient: "計画行列 $\Phi$ が、各訓練データ点の特徴写像 $\phi(x_i)^\top$ を行として並べたものであることを説明できる [cite: 613]。"
          [cite_start]level_4_advanced: "この解が、目的関数 $L(\theta) = \frac{1}{2}||\Phi\theta - y||^2$ の勾配 $\nabla_\theta L(\theta) = \Phi^\top\Phi\theta - \Phi^\top y$ をゼロと置くことで導出されることを説明できる [cite: 616]。"
  - topic_name: "過適合と正則化"
    concepts:
      - concept_name: "過適合と学習曲線"
        [cite_start]description: "**過適合**は、モデルの表現能力が高すぎる場合に、訓練データに過剰に適合し、未知データに対する性能（汎化性能）が低下する現象です [cite: 623][cite_start]。モデルの複雑度を横軸にとると、訓練損失は単調に減少する一方、テスト損失はある点で底を打って上昇に転じます [cite: 626][cite_start]。この関係を図示したものが**学習曲線**です [cite: 627]。"
        rubric:
          level_1_unacceptable: "過適合が何かを説明できない。"
          level_2_basic: "過適合を「学習しすぎ」と表現するが、訓練誤差とテスト誤差の観点から説明できない。"
          [cite_start]level_3_proficient: "学習曲線を用いて、モデルの複雑度（例：多項式の次数）と、訓練損失とテスト損失の関係性を図で示し、過適合・過少適合の状態を説明できる [cite: 626]。"
          [cite_start]level_4_advanced: "過適合したモデルのパラメーターは絶対値が大きくなる傾向があることを、激しく振動する関数を表現する必要があるという直観から説明できる [cite: 630]。"
      - concept_name: "L2正則化（リッジ回帰）"
        [cite_start]description: "過適合を抑制するため、経験リスクの最小化と同時に、パラメーターのL2ノルムの2乗 $||\theta||^2$ も小さくするように学習する手法です [cite: 632]。目的関数は $L(\theta) := \hat{R}(f_\theta) + \lambda ||\theta||^2$ となり、$\lambda$ は正則化の強さを決めるハイパーパラメーターです。"
        rubric:
          level_1_unacceptable: "正則化の目的を説明できない。"
          level_2_basic: "過適合を防ぐ手法であることは知っているが、具体的な仕組みを説明できない。"
          [cite_start]level_3_proficient: "L2正則化が、目的関数にパラメーターの大きさを抑える罰則項を追加する手法であることを数式を用いて説明できる [cite: 632]。"
          [cite_start]level_4_advanced: "L2正則化付き最小二乗回帰（リッジ回帰）の解が、正規方程式に $\lambda I$ を加えた $\hat{\theta} = (\Phi^\top\Phi + \lambda I)^{-1}\Phi^\top y$ の形で得られることを説明できる [cite: 634]。"

