### 第5回：確率論的二値分類

```yaml
lecture_number: 5
title: "確率論的二値分類と勾配法"
description: "分類タスクの中で最も基本的な二値分類を、確率論的アプローチで解く方法を学びます。具体的には、ロジスティック回帰を題材に、確率値を出力するモデルの作り方と、勾配降下法による最適化について理解を深めます。"
learning_objectives:
  - "確率論的二値分類の目標が、クラス1に属する事後確率 $p(y=1|x)$ をモデル化することにあると説明できる。"
  - "ロジスティック（シグモイド）関数が、実数値の出力を確率値に変換するために用いられることを説明できる。"
  - "ロジスティック回帰が、線形モデル、ロジスティック関数、交差エントロピー損失を組み合わせたものであることを説明できる。"
  - "勾配降下法のアルゴリズムを説明し、なぜ解析的に解けない問題の最適化に有効なのかを理解する。"
topics:
  - topic_name: "確率論的二値分類のモデル"
    concepts:
      - concept_name: "二値交差エントロピー損失"
        description: "2クラス分類において、モデルの出力 $g(x)$ がクラス1の事後確率 $p(y=1|x)$ を近似するように学習させるための損失関数です。式は $\ell = -y \log g(x) - (1-y)\log(1-g(x))$ で与えられます。"
        rubric:
          level_1_unacceptable: "二値交差エントロピー損失を知らない。"
          level_2_basic: "分類で使われる損失関数の一種であることを知っている。"
          level_3_proficient: "この損失関数を最小化することが、モデル出力 $g(x)$ を真の事後確率 $p(y=1|x)$ に近づけること（最尤法）と等価であることを説明できる。"
          level_4_advanced: "正解ラベルが $y=1$ のときは $- \log g(x)$ が、 $y=0$ のときは $- \log(1-g(x))$ が最小化されるように働き、モデルが正しい確率を出力するように学習が進むことを説明できる。"
      - concept_name: "ロジスティック（シグモイド）関数"
        description: "任意の実数値 $z$ を (0, 1) の範囲の値に変換する関数 $\sigma(z) = 1/(1+e^{-z})$ です。線形モデルなどの実数値出力を、確率値として解釈できるようにするために活性化関数として用いられます。"
        rubric:
          level_1_unacceptable: "ロジスティック関数を知らない。"
          level_2_basic: "S字型のグラフを持つ関数であることを知っている。"
          level_3_proficient: "入力が実数で出力が(0,1)の範囲に収まるという性質を持ち、確率値を出力するモデルの最終層で使われることを説明できる。"
          level_4_advanced: "入力 $z$ が大きいほど出力は1に近づき、小さいほど0に近づくという関数の挙動を説明できる。"
      - concept_name: "ロジスティック回帰"
        description: "パラメーター線形モデルの出力 $\theta^\top\phi(x)$ をロジスティック関数に通して確率値を得て、二値交差エントロピー損失（の経験リスク）を最小化するように学習する、確率論的二値分類の代表的な手法です。「回帰」という名前ですが分類手法です。"
        rubric:
          level_1_unacceptable: "ロジスティック回帰を回帰手法だと誤解している。"
          level_2_basic: "分類手法の一種であることを知っている。"
          level_3_proficient: "ロジスティック回帰が「線形モデル」「ロジスティック関数」「交差エントロピー損失」の3つの要素から構成されることを説明できる。"
          level_4_advanced: "なぜこの手法で学習されたモデルの出力が、クラス1に属する事後確率の良い近似となることが期待されるのかを、近似ターゲットの観点から説明できる。"
  - topic_name: "勾配法による最適化"
    concepts:
      - concept_name: "勾配降下法"
        description: "目的関数 $L(\theta)$ を最小化するため、現在のパラメーター $\theta$ の位置から、関数値が最も急峻に減少する方向（負の勾配 $-\nabla L(\theta)$ の方向）に、少しずつパラメーターを更新していく反復的な最適化手法です。更新式は $\theta \leftarrow \theta - \eta \nabla L(\theta)$ です。"
        rubric:
          level_1_unacceptable: "勾配降下法が何をするのか説明できない。"
          level_2_basic: "最適化の手法の一つであることを知っている。"
          level_3_proficient: "目的関数の「坂」を少しずつ下っていくイメージでアルゴリズムを説明でき、学習率 $\eta$ がその「歩幅」を制御するハイパーパラメーターであることを理解している。"
          level_4_advanced: "ロジスティック回帰の目的関数は解析的に解（解の公式）が得られないため、勾配降下法のような反復的な最適化手法が必要になることを説明できる。"
      - concept_name: "重み減衰と早期停止"
        description: "勾配法における正則化の実現方法です。**重み減衰**はL2正則化と等価で、更新のたびにパラメーターを原点方向にわずかに縮小させます。**早期停止**は、検証データでの性能改善が見られなくなった時点で学習を打ち切ることで、過適合を防ぐ正則化手法です。"
        rubric:
          level_1_unacceptable: "これらの用語を知らない。"
          level_2_basic: "正則化の一種であることを知っている。"
          level_3_proficient: "重み減衰がL2正則化に対応すること、早期停止が検証データを使って過適合を監視し学習を止める手法であることを説明できる。"
          level_4_advanced: "早期停止が、学習の更新回数（iteration）自体をモデルの複雑さを制御するハイパーパラメーターと見なすアプローチであることを説明できる。"

