### 第12回：生成タスク

```yaml
lecture_number: 12
title: "生成タスク"
description: "いわゆる「生成AI」の根幹をなす、新しいデータを生み出す生成タスクの仕組みを学びます。特に、テキスト生成で中心的な役割を果たす自己回帰型モデルと、画像生成などで用いられる潜在変数型モデルの二つの主要なアプローチを理解します。"
learning_objectives:
  - "生成タスクの目標が、データの確率分布からのサンプリングであることを説明できる。"
  - "自己回帰型生成モデルが、次トークン予測の繰り返しによって系列データを生成する仕組みを説明できる。"
  - "潜在変数型生成モデルが、単純な確率分布（潜在空間）から複雑なデータ分布への写像（生成器）を学習する枠組みであることを説明できる。"
topics:
  - topic_name: "生成タスクの枠組み"
    concepts:
      - concept_name: "生成タスクの目標"
        [cite_start]description: "学習データセット $\{x_i\}_{i=1}^n$ が従うであろう未知のデータ生成分布 $p(x)$ を模倣し、その分布から新しいデータ（サンプル）$X \sim p(x)$ を生成することです [cite: 1327][cite_start]。これは、分布 $p(x)$ 自体をモデル化する密度推定とは異なり、サンプリングを行う**生成器（Generator）**を学習することが主目的となります [cite: 1328]。"
        rubric:
          level_1_unacceptable: "生成タスクが何をするか説明できない。"
          level_2_basic: "「AIが絵を描いたり文章を書いたりすること」という理解に留まる。"
          [cite_start]level_3_proficient: "学習データに似ているが新しいデータを、確率分布からのサンプリングとして生成することが目標であると説明できる [cite: 1327]。"
          [cite_start]level_4_advanced: "確率密度関数 $p_\theta(x)$ を学習することと、その分布からサンプリングできる生成器 $g_\theta(z)$ を学習することが、必ずしも同じではないことを理解している [cite: 1328]。"
      - concept_name: "自己回帰型 vs. 潜在変数型"
        [cite_start]description: "生成モデルの主要な2つのアプローチです。**自己回帰型**は、データの要素を一つずつ順番に生成し、それまで生成した内容を条件として次の要素を予測するプロセスを繰り返します（系列データ向き）[cite: 1333][cite_start]。**潜在変数型**は、まず単純な分布（例：正規分布）から潜在変数 $z$ をサンプリングし、それをニューラルネットワーク（生成器）に入力してデータ $x$ に変換します（非系列データ向き）[cite: 1332]。"
        rubric:
          level_1_unacceptable: "両者のアプローチの違いを説明できない。"
          level_2_basic: "2つの種類があることを知っている。"
          [cite_start]level_3_proficient: "自己回帰型が「続きを予測」の繰り返しで [cite: 1333][cite_start]、潜在変数型が「ノイズから変換」で生成する [cite: 1332] という、それぞれの基本的な生成プロセスを説明できる。"
          level_4_advanced: "テキストのように明確な順序構造を持つデータには自己回帰型が、画像のように全体が一度に存在するデータには潜在変数型が、それぞれ親和性が高いことを説明できる。"
  - topic_name: "自己回帰型生成モデル"
    concepts:
      - concept_name: "次トークン予測による学習"
        [cite_start]description: "自己回帰型モデルは、**言語モデル**とも呼ばれ、途中までのトークン列 $\omega_0, \dots, \omega_{t-1}$ を条件として、次のトークン $\omega_t$ の確率分布 $p(\omega_t | \omega_0, \dots, \omega_{t-1})$ を予測するように学習されます [cite: 1337, 1338][cite_start]。これは、語彙数をクラス数とする多クラス分類問題として、最尤法（交差エントロピー損失）ベースで学習されます [cite: 1338, 1339]。"
        rubric:
          level_1_unacceptable: "自己回帰モデルの学習方法を説明できない。"
          level_2_basic: "文章の続きを予測することで学習すると知っている。"
          [cite_start]level_3_proficient: "訓練データ中の全てのトークンについて、「それまでの文脈からそのトークンを予測する」という教師あり学習（自己教師あり学習）を繰り返していることを説明できる [cite: 1338]。"
          [cite_start]level_4_advanced: "系列全体の同時確率 $p(\omega_0 \dots \omega_T)$ が、確率の連鎖律によって条件付き確率の積 $p(\omega_0)\prod p(\omega_t|\omega_0 \dots \omega_{t-1})$ に分解できることが、この学習方法の理論的根拠となっていることを説明できる [cite: 1344]。"
      - concept_name: "生成時のサンプリング手法"
        [cite_start]description: "学習済みの言語モデルからテキストを生成する際には、常に最も確率の高いトークンを選ぶ（**貪欲法**）だけでなく、生成結果の多様性を制御する工夫が用いられます。**温度付きサンプリング**は、ソフトマックス関数の鋭さを調整してランダム性を制御し [cite: 1342][cite_start]、**Top-p (nucleus) サンプリング**は、確率の高いトークン群の中からランダムに選択することで、もっともらしさと多様性を両立させます [cite: 1343]。"
        rubric:
          level_1_unacceptable: "生成方法について説明できない。"
          level_2_basic: "確率に基づいて次の単語を選んでいることを知っている。"
          [cite_start]level_3_proficient: "常に最も確率の高い単語を選ぶ貪欲法では、ありきたりな文章しか生成できない問題があることを説明できる [cite: 1343]。"
          [cite_start]level_4_advanced: "温度パラメーター $\tau$ の値を変更すると、生成されるテキストのランダム性（$\tau$大）や決定性（$\tau$小）がどのように変化するかを説明できる [cite: 1342]。"
  - topic_name: "潜在変数型生成モデル（概観）"
    concepts:
      - concept_name: "主要な潜在変数モデル"
        [cite_start]description: "潜在変数 $z$ からデータ $x$ への写像である生成器 $g_\theta(z)$ を学習するための様々なアプローチがあります。**変分オートエンコーダー（VAE）**は確率的なエンコーダーとデコーダーを使い [cite: 1349][cite_start]、**敵対的生成ネットワーク（GANs）**は生成器とそれを見破る識別器を競わせることで [cite: 1352][cite_start]、**拡散モデル（DMs）**はデータにノイズを加えていく過程の逆を学習することで生成を行います [cite: 1355]。"
        rubric:
          level_1_unacceptable: "潜在変数モデルの具体例を挙げられない。"
          level_2_basic: "VAEやGANという名前を知っている。"
          level_3_proficient: "VAE, GAN, 拡散モデルの3つを代表的な手法として挙げ、それぞれの学習の基本的なアイデア（再構成、敵対、ノイズ除去）を区別して説明できる。"
          [cite_start]level_4_advanced: "条件付き生成を行う際に、潜在変数 $z$ だけでなく条件変数 $c$ も生成器に入力するアプローチがあることを説明できる [cite: 1357]。"

lecture_number: 13
title: "大規模言語モデルとマルチモーダルAI"
description: "現代AIの中核をなす大規模言語モデル（LLM）の驚異的な能力を支える「スケール」の概念と、LLMを使いこなすためのプロンプト技術、そして人間に役立つように調整するアラインメントについて学びます。さらに、テキストと画像を統合的に扱うマルチモーダルモデルの仕組みを概観します。"
learning_objectives:
  - "スケーリング則がLLMの性能向上を予測可能にし、大規模化を推進した原動力であることを説明できる。"
  - "プロンプトエンジニアリング、特に「思考の連鎖（CoT）」がLLMの推論能力を引き出す上で重要であることを説明できる。"
  - "LLMが、思考・行動・観察のサイクルを通じて、自律的なエージェントとして機能しうることを理解する。"
  - "LLMを人間の意図や価値観に沿わせる「アラインメント」の重要性と、そのための主要な手法（RLHF, DPO）を説明できる。"
topics:
  - topic_name: "大規模言語モデル（LLM）の動向"
    concepts:
      - concept_name: "スケーリング則と創発的能力"
        [cite_start]description: "**スケーリング則**は、モデルサイズ、データ量、計算量を増やすと、モデルの性能（テスト損失）が冪乗則に従って予測可能に向上するという経験則です [cite: 1390][cite_start]。また、モデルが一定以上の規模になると、小さいモデルでは見られなかった高度な能力（例：マルチステップ推論）が**創発的**に現れることがあります [cite: 1394]。"
        rubric:
          level_1_unacceptable: "スケーリング則や創発的能力について説明できない。"
          level_2_basic: "「モデルが大きいほど賢い」という程度の理解。"
          [cite_start]level_3_proficient: "スケーリング則が、LLM開発における投資対効果の予測（例：チンチラ則）に利用されていることを説明できる [cite: 1392]。"
          [cite_start]level_4_advanced: "創発的能力が、量的な変化（スケールアップ）が質的な変化（新たな能力の獲得）を生む現象であり、LLMの挙動の予測を難しくしている一因であることを説明できる [cite: 1394]。"
      - concept_name: "プロンプトエンジニアリングと思考の連鎖（CoT）"
        [cite_start]description: "**プロンプトエンジニアリング**は、LLMへの入力（プロンプト）を工夫することで、その性能を最大限に引き出す技術です [cite: 1398][cite_start]。特に、結論だけでなく推論過程も生成させる**思考の連鎖（Chain-of-Thought, CoT）**は、複雑な算術問題などの推論タスクの性能を大幅に向上させます [cite: 1403]。"
        rubric:
          level_1_unacceptable: "プロンプトエンジニアリングが何か説明できない。"
          level_2_basic: "「AIへの命令の仕方」という程度の理解。"
          [cite_start]level_3_proficient: "文脈内学習（Few-shot prompting）とCoTプロンプティングの違いを、プロンプトの具体例を挙げて説明できる [cite: 1400, 1403]。"
          [cite_start]level_4_advanced: "「Let's think step by step.」のような単純な指示（ゼロショットCoT）でも性能が向上する理由を、モデルが内部的に持つ推論能力を誘発するため、と考察できる [cite: 1404]。"
      - concept_name: "自律エージェントとツール使用"
        [cite_start]description: "LLMは、思考→行動→観察のサイクル（**ReActフレームワーク**など）を回すことで、自律的にタスクを分解し、外部の**ツール**（例：検索エンジン、計算機）を使用して目標を達成する**エージェント**として機能させることができます [cite: 1416, 1419]。"
        rubric:
          level_1_unacceptable: "AIエージェントが何かを説明できない。"
          level_2_basic: "「AIが自動で何かしてくれる」という程度の理解。"
          [cite_start]level_3_proficient: "エージェントが、単なる予測器とは異なり、自ら計画を立ててツールを呼び出す（Tool Invocation）ことでタスクを遂行する枠組みであることを説明できる [cite: 1421, 1416]。"
          [cite_start]level_4_advanced: "ReActフレームワークにおける「思考」「行動」「観察」のサイクルが、LLMの内部的な推論能力と、外部ツールからのフィードバックをどのように統合しているかを説明できる [cite: 1419]。"
  - topic_name: "アラインメントとマルチモーダル"
    concepts:
      - concept_name: "マルチモーダルモデルと共通埋め込み"
        [cite_start]description: "**マルチモーダルモデル**は、テキスト、画像、音声など複数の異なる様式（モダリティ）のデータを統一的に扱います [cite: 1424, 1425][cite_start]。その実現のため、**CLIP**のような手法を用いて、異なるモダリティのデータを共通のベクトル空間に埋め込み、意味的な類似性を捉えられるようにする**共通埋め込み**の学習が行われます [cite: 1428]。"
        rubric:
          level_1_unacceptable: "マルチモーダルモデルが何かを説明できない。"
          level_2_basic: "テキストと画像を両方扱えるモデルであると知っている。"
          [cite_start]level_3_proficient: "CLIPが、大量の「画像とそれに付随するテキスト」のペアデータを用いて、対照学習によって共通の埋め込み空間を学習する手法であることを説明できる [cite: 1428, 1429]。"
          level_4_advanced: "共通埋め込み空間では、「犬」というテキストのベクトルと、「犬の写真」のベクトルが近い位置に来ることが期待され、これによりゼロショット画像分類などが可能になることを説明できる。"
      - concept_name: "アラインメント（RLHF, DPO）"
        [cite_start]description: "事前学習されたLLMを、人間の意図や価値観（**HHH**: Helpful, Honest, Harmlessなど）に沿うように調整することです [cite: 1435, 1436][cite_start]。**RLHF**は、人間の選好データから報酬モデルを学習し、強化学習でLLMを微調整します [cite: 1448][cite_start]。**DPO**は報酬モデルを介さず、選好データから直接LLMを微調整する、よりシンプルな手法です [cite: 1482]。"
        rubric:
          level_1_unacceptable: "アラインメントの目的を説明できない。"
          level_2_basic: "「AIを安全にすること」という程度の理解。"
          [cite_start]level_3_proficient: "アラインメントの目的がHHH（Helpful, Honest, Harmless）であることを説明し、そのために指示チューニングやRLHFが行われることを理解している [cite: 1436, 1447]。"
          [cite_start]level_4_advanced: "RLHFとDPOのプロセス上の違い（報酬モデルの学習ステップの有無）と、なぜDPOのような手法が開発されたか（RLHFの複雑さと不安定さの回避）を説明できる [cite: 1481, 1482]。"

