# ==================================================
# == 学習到達目標（ストーリー形式）
# ==================================================
LearningOutcomeNarrative:
  - key: problem_formulation
    description: |
      この試験構成案を完全にマスターした学生は、まず、目の前にある課題を機械学習の問題として正しく**定式化する**能力を身につけています。例えば、住宅価格の予測は「回帰」、スパムメールの判定や顔認証は「分類」タスクであると即座に判断できます。そして、学習の最終目標が未知データに対する性能、すなわち「汎化性能」を高めることだと理解しています。その理想的な指標は計算不可能な「リスク」（損失の期待値）であるため、現実的なアプローチとして、手元の訓練データに対する誤差の平均である「経験リスク」を最小化する（ERM）という、学習の基本戦略を説明できます。
  - key: evaluation_methodology
    description: |
      次に、その学生は、学習成果を**正しく評価する**ための方法論を深く理解しています。経験リスクをただ最小化するだけでは、訓練データに過剰に適合してしまう「過適合」に陥ることを学習曲線のイメージと共に説明できます。そのため、モデルの真の性能を測るには、学習に用いていないテストデータで評価すべきであると知っています。さらに、そのデータの分割方法は状況に応じて選ぶべきであることもわかっており、例えば時系列データであれば、未来のデータで評価するために過去のデータを訓練に使う、という工夫が必要なことを説明できます。
  - key: model_selection_philosophy
    description: |
      さらに進んで、学生は**モデル選択の背後にある哲学**を語ることができます。「No-Free-Lunch Theorem」を根拠に、あらゆる問題に万能なモデルは存在しないと理解しているため、タスクの性質に合った「帰納バイアス」（モデルの持つ仮定や好み）を選択することが重要だと主張できます。例えば、k-NNが持つ「近くの点はラベルも似ている」というバイアスと、線形モデルが持つ「データ全体に単純な法則がある」というバイアスの違いを比較できます。また、損失関数の選択も一種のバイアスであり、二乗損失を選べば外れ値に敏感な「条件付き期待値」を、絶対誤差損失を選べば外れ値に頑健な「条件付き中央値」を、モデルが暗黙的に追い求めることになるという、より深いレベルでのモデルの挙動を説明できます。
  - key: optimization_mechanism
    description: |
      そして、学生の理解は、モデルが**どのようにして学習を実行するのか**というメカニズムへと繋がります。単純な線形回帰であれば正規方程式という解析解が存在するのに対し、ロジスティック回帰やニューラルネットワークのような複雑なモデルの目的関数は、解析的に解くことが困難であることを理解しています。そのため、目的関数の勾配を計算し、その情報に基づいて反復的にパラメーターを更新する勾配降下法のような最適化手法が必要不可欠であることを説明できます。そして、その勾配計算を、どんなに複雑な層の組み合わせを持つモデルであっても、合成関数の連鎖律を用いてシステマチックかつ効率的に実行するアルゴリズムが「誤差逆伝播法」であることを理解しています。
  - key: architectural_flexibility
    description: |
      この最適化能力を基盤として、学生はニューラルネットワークが持つ**アーキテクチャ設計の柔軟性**の重要性を説明できます。ニューラルネットワークが重宝されるのは、単に表現力が高いからだけでなく、その柔軟性を活かしてデータに関する強力な事前知識（帰納バイアス）を構造に組み込めるからです。その最たる例がCNNであり、画像の「空間的局所性」という事前知識を、畳み込み層という特殊なアーキテクチャによって実現していることを説明できます。同様に、Transformerが「アテンション機構」によってトークン間の文脈的関連性を捉えていること、特にBERTの双方向性とGPTの単方向性というアーキテクチャの違いが、それぞれの得意なタスク（文脈理解とテキスト生成）にいかに密接に関連しているかを論じることができます。
  - key: generative_model_paradigms
    description: |
      さらに、学生は**AIによる「創造」の二大潮流**を比較できます。テキスト生成で主流の「自己回帰型」アプローチが、次に来るトークンを逐次的に予測・生成するプロセスであるのに対し、画像生成で主流の「潜在変数型」アプローチ（VAE、拡散モデルなど）は、単純な確率分布からのサンプリング（潜在変数）を、学習済みの複雑な関数（生成器）によって一括でデータに変換するプロセスであることを説明できます。また、テキストと画像のような異なる種類のデータ（モダリティ）をAIがどう統合的に扱うかについても理解しており、CLIPのような手法が、対照学習を通じて、例えば「犬」というテキストと「犬の写真」を同じベクトル空間の近い場所に配置する「共通の表現空間」を学習していること、そしてそれこそがマルチモーダルな理解の基盤となっていることを説明できます。
  - key: societal_implications
    description: |
      最後に、学生はこれらの技術が**社会の中でどのように機能し、どのような課題を抱えているか**という視点を持っています。LLMが単なる予測器に留まらず、思考し、外部ツールを使いこなす「自律エージェント」として機能しうる仕組みを説明できます。そして、その強力な能力を人間にとって有益であるように調整する「アラインメント」の重要性を認識し、その実現手法であるRLHFとDPOの違いを語ることができます。さらに、「事実でないことを生成する」ハルシネーションと「データ内の偏見を反映する」バイアスという、AIが抱える二大リスクを明確に区別し、日本の著作権法（第30条の4）やアルゴリズム特許といった、技術を取り巻く法制度の現状についても基本的な知識を有していることが確かめられます。

# ==================================================
# == 学習到達目標（ルーブリック）
# ==================================================
LearningOutcomeRubrics:
  - concept_key: problem_formulation
    rubric:
      level_1_basic: "回帰と分類の基本的な違いを説明できる。"
      level_2_proficient: "与えられたタスクが回帰・分類のどちらに該当するかを判断し、その理由を述べることができる。また、経験リスク最小化が学習の基本戦略であることを知っている。"
      level_3_advanced: "リスクと経験リスクの関係性（期待値と標本平均）を説明し、なぜERMが理論的なリスク最小化の代理目標となるのかを論理的に説明できる。"
  - concept_key: evaluation_methodology
    rubric:
      level_1_basic: "学習に使うデータと評価に使うデータを分ける必要があることを知っている。"
      level_2_proficient: "過適合の概念を学習曲線を用いて説明でき、テストデータで汎化性能を評価する必要性を理解している。"
      level_3_advanced: "時系列データのような特殊なケースにおいて、なぜランダムな分割ではなく、未来のデータをテスト用に確保する分割方法が適切なのかを説明できる。"
  - concept_key: model_selection_philosophy
    rubric:
      level_1_basic: "オッカムの剃刀など、単純なモデルが良いとされることがあるのを知っている。"
      level_2_proficient: "No-Free-Lunch Theoremの結論（万能なモデルはない）を述べ、モデル選択が重要であることを理解している。"
      level_3_advanced: "損失関数の選択が、モデルが暗黙的に何を学習目標とするか（近似ターゲット）を決定づけることを、条件付き期待値や中央値を例に挙げて説明できる。"
  - concept_key: optimization_mechanism
    rubric:
      level_1_basic: "モデルの学習が、最適化というプロセスで行われることを知っている。"
      level_2_proficient: "勾配降下法が、目的関数の勾配を利用して反復的に解を探索するアルゴリズムであることを説明できる。"
      level_3_advanced: "誤差逆伝播法が、合成関数の連鎖律を利用して、複雑なニューラルネットワーク全体の勾配を効率的に計算するための根幹技術であることを説明できる。"
  - concept_key: architectural_flexibility
    rubric:
      level_1_basic: "CNNが画像に、Transformerがテキストに使われることを知っている。"
      level_2_proficient: "CNNの畳み込み層やTransformerのアテンション機構が、それぞれのデータ（画像・テキスト）の特性を活かすための工夫であることを説明できる。"
      level_3_advanced: "BERTの双方向アテンションとGPTの因果的アテンションというアーキテクチャの違いが、それぞれの主目的（文脈理解 vs. テキスト生成）とどのように整合しているかを論理的に説明できる。"
  - concept_key: generative_model_paradigms
    rubric:
      level_1_basic: "テキスト生成と画像生成のタスクを知っている。"
      level_2_proficient: "自己回帰型モデルが逐次的に、潜在変数型モデルが一括（または非逐次的）にデータを生成するというプロセスの違いを説明できる。"
      level_3_advanced: "マルチモーダルモデルが、CLIPのような対照学習を用いて、異なるモダリティの情報を共通のベクトル空間に写し、それらの関係性を捉えることで実現されていることを説明できる。"
  - concept_key: societal_implications
    rubric:
      level_1_basic: "AIにはハルシネーションやバイアスといった問題があることを知っている。"
      level_2_proficient: "LLMが外部ツールを使うエージェントとして機能すること、またアラインメントという調整が必要なことを理解している。"
      level_3_advanced: "RLHFとDPOというアラインメント手法のプロセス上の違いを説明でき、AI開発における著作権法（30条の4）などの法的論点について基本的な知識を述べることができる。"

# ==================================================
# == 最終試験問題（全20問）
# ==================================================
FinalExamQuestions:
  - rubric: problem_formulation
    type: multichoice
    title: "01-リスクと経験リスク"
    points: 2
    question: |
      機械学習における理想的な学習目標である「リスク」と、その代理として用いられる「経験リスク」の関係性について、最も適切な説明を一つ選びなさい。
    choices:
      A: "リスクは訓練データに対する平均誤差、経験リスクは未知のデータに対する平均誤差である。"
      B: "経験リスクは常にリスクよりも大きい値を取ることが理論的に証明されている。"
      C: "リスクは損失の期待値であり計算不可能だが、経験リスクはその標本近似であり計算可能である。"
      D: "リスクと経験リスクは全く無関係な指標であり、経験リスクを最小化してもリスクが小さくなる保証はない。"
    answer: C
    feedback:
      A: "説明が逆です。リスクが未知データに対する期待損失、経験リスクが訓練データに対する平均損失です。"
      B: "そのような関係性は一般には成り立ちません。"
      C: "正解です。ERMは、計算不可能なリスクの代わりに、その標本近似である経験リスクを最小化するアプローチです。"
      D: "経験リスクはリスクの良い近似であることが期待されるため、このアプローチは有効です。"
  - rubric: model_selection_philosophy
    type: multichoice
    title: "02-No-Free-Lunch Theorem"
    points: 1
    question: |
      「No-Free-Lunch Theorem」が示唆することとして、最も適切なものを一つ選びなさい。
    choices:
      A: "十分なデータがあれば、どんなタスクでも解ける万能なモデルを作ることができる。"
      B: "モデルの性能はタスクとの相性に依存するため、タスクに適した仮定（帰納バイアス）を組み込むことが重要である。"
      C: "オープンソースのモデルは、商用モデルに比べて常に性能が劣る。"
      D: "機械学習の学習には、常に膨大な計算コストがかかる。"
    answer: B
    feedback:
      A: "これはNo-Free-Lunch Theoremが否定する内容です。"
      B: "正解です。この定理は、汎用性よりも、特定のタスクドメインに特化したバイアスを持つことの重要性を示唆しています。"
      C: "経済的な話ではなく、アルゴリズムの性能に関する理論です。"
      D: "計算コストの話ではなく、アルゴリズムの性能に関する理論です。"
  - rubric: evaluation_methodology
    type: multichoice
    title: "03-時系列データの評価"
    points: 2
    question: |
      時系列データの予測モデルのハイパーパラメーターを選択する際、最も信頼性の高い検証方法として適切なものを一つ選びなさい。ただし、計算時間は問題にならないものとする。
    choices:
      A: "データをランダムにシャッフルし、K分割交差検証を行う。"
      B: "最新の1ヶ月を検証用、それ以前の全データを訓練用とする単純な時系列分割を行う。"
      C: "訓練期間と検証期間を時間軸に沿ってスライドさせながら複数回の評価を行い、その平均性能を見るRolling-window方式の検証を行う。"
      D: "データ全体を訓練に用い、訓練誤差が最も小さくなるハイパーパラメーターを選択する。"
    answer: C
    feedback:
      A: "時系列データにランダムな分割を行うと、未来の情報で過去を予測することになり、性能を不当に高く評価してしまいます。"
      B: "これは適切な方法の一つですが、特定の期間のデータに性能が過剰に適合してしまう可能性があります。"
      C: "正解です。Rolling-window方式は、異なる期間で繰り返し評価を行うため、より頑健で信頼性の高いモデル選択が可能になります。"
      D: "訓練誤差でモデル選択を行うと、過適合したモデルを選んでしまう危険性が非常に高いです。"
  - rubric: evaluation_methodology
    type: multichoice
    title: "04-過適合の判断"
    points: 2
    question: |
      モデルの学習曲線において、訓練誤差（損失）は低いが、検証誤差（損失）が高い値を示している場合、モデルはどのような状態にあると考えられるか。
    choices:
      A: "過少適合（Underfitting）"
      B: "過適合（Overfitting）"
      C: "適切に学習されている"
      D: "学習が発散している"
    answer: B
    feedback:
      A: "過少適合の場合、訓練誤差も検証誤差も両方高い状態になります。"
      B: "正解です。訓練データには適合しているが、未知のデータ（検証データ）に対する汎化に失敗している典型的な過適合の状態です。"
      C: "適切に学習されている場合、訓練誤差と検証誤差の両方が低い値で収束します。"
      D: "学習が発散している場合、両方の誤差が増大し続けます。"
  - rubric: model_selection_philosophy
    type: multichoice
    title: "05-損失関数と近似ターゲット"
    points: 2
    question: |
      機械学習における損失関数の選択と、その学習が目指す理想的な予測器（近似ターゲット）の組み合わせとして、最も適切なものを一つ選びなさい。
    choices:
      A: "損失関数：二乗損失 ／ 近似ターゲット：条件付き中央値"
      B: "損失関数：絶対誤差損失 ／ 近似ターゲット：条件付き期待値"
      C: "損失関数：0/1損失（誤分類率） ／ 近似ターゲット：条件付き最頻値（事後確率最大のクラス）"
      D: "損失関数：ピンボール損失 ／ 近似ターゲット：条件付き期待値"
    answer: C
    feedback:
      A: "二乗損失の近似ターゲットは条件付き期待値です。"
      B: "絶対誤差損失の近似ターゲットは条件付き中央値です。"
      C: "正解です。誤分類率を最小化する最適な予測器は、各入力に対して事後確率が最大となるクラスを出力するベイズ分類器です。"
      D: "ピンボール損失の近似ターゲットは条件付き分位点です。"
  - rubric: architectural_flexibility
    type: multichoice
    title: "06-ソフトマックス関数の役割"
    points: 1
    question: |
      多クラス分類を行うニューラルネットワークの出力層で、ソフトマックス関数が用いられる主な理由として、最も適切なものを一つ選びなさい。
    choices:
      A: "モデルの計算速度を向上させるため。"
      B: "モデルのパラメーター数を削減し、過適合を防ぐため。"
      C: "複数の実数値スコアを、合計が1になる確率分布に変換するため。"
      D: "入力データに含まれるノイズを除去するため。"
    answer: C
    feedback:
      A: "ソフトマックス関数は指数計算を含むため、計算速度を低下させることはあっても向上させることはありません。"
      B: "パラメーター数には影響しません。"
      C: "正解です。モデルが出力した各クラスのスコアを、確率として解釈可能な値に正規化するのがソフトマックス関数の役割です。"
      D: "ノイズ除去の機能はありません。"
  - rubric: model_selection_philosophy
    type: multichoice
    title: "07-k-NNと線形モデルの帰納バイアス"
    points: 2
    question: |
      k-最近傍法（k-NN）と線形回帰モデルが持つ「帰納バイアス」（学習アルゴリズムが持つ暗黙の仮定や好み）に関する説明として、最も適切なものを一つ選びなさい。
    choices:
      A: "k-NNは「データ全体に滑らかな決定境界が存在する」というバイアスを持ち、線形回帰の帰納バイアスはない。"
      B: "k-NNは「特徴空間上で近くにあるデータは同じラベルを持つ傾向がある」というバイアスを持ち、線形回帰は「特徴量とラベルの間に線形な関係性が存在する」というバイアスを持つ。"
      C: "両者とも「データは正規分布に従う」という強いバイアスを持つ。"
      D: "k-NNはパラメーターを学習しないため帰納バイアスを持たず、線形回帰のみがバイアスを持つ。"
    answer: B
    feedback:
      A: "k-NNの決定境界はkの値によっては非常に複雑（非平滑）になります。"
      B: "正解です。k-NNは局所的な類似性、線形回帰は大域的な線形性を仮定しており、これがそれぞれの帰納バイアスです。"
      C: "どちらのモデルも、データが正規分布に従うことを必ずしも仮定しません。"
      D: "パラメーターを持たないk-NNも、「近傍を重視する」という強力な帰納バイアスを持っています。"
  - rubric: model_selection_philosophy
    type: multichoice
    title: "08-次元の呪いと類似度"
    points: 2
    question: |
      高次元空間では「次元の呪い」により、コサイン類似度のような尺度が役に立ちにくくなる傾向がある。その現象の最も直接的な原因として、適切なものを一つ選びなさい。
    choices:
      A: "高次元空間では、ほとんどのベクトルが互いにほぼ平行になるため。"
      B: "高次元空間では、ほとんどのベクトルが互いにほぼ直交（コサイン類似度が0に集中）するため。"
      C: "高次元空間では、ベクトルのノルム（長さ）が計算できなくなるため。"
      D: "高次元空間では、全てのベクトルが同じ方向を向いてしまうため。"
    answer: B
    feedback:
      A: "逆です。ベクトルは互いに直交する傾向があります。"
      B: "正解です。高次元空間では、ランダムに選んだ2つのベクトルがなす角は90度に近くなる傾向があり、コサイン類似度がほとんどのペアで0に近くなってしまい、類似度の差がなくなります。"
      C: "ノルムの計算は可能ですが、その値も特定の範囲に集中する傾向があります。"
      D: "逆です。空間が広大であるため、ベクトルは多様な方向を向きますが、互いに直交しやすくなります。"
  - rubric: architectural_flexibility
    type: multichoice
    title: "09-CNNのアーキテクチャ"
    points: 1
    question: |
      畳み込みニューラルネットワーク（CNN）が、画像処理において全結合層を持つ単純なニューラルネットワークよりも優れているとされる主な理由として、最も適切なものを一つ選びなさい。
    choices:
      A: "CNNはパラメーターを持たないため、学習が非常に高速である。"
      B: "CNNは画像の空間的な局所性と位置不変性を活用している。具体的には、畳み込み層が局所的な特徴を抽出し、同じカーネル（フィルター）を画像全体で共有する。"
      C: "CNNは任意の画像を完全に元の状態に復元できる可逆的な変換を行う。"
      D: "CNNは入力画像のサイズを問わず、常に同じ計算量で処理できる。"
    answer: B
    feedback:
      A: "CNNは畳み込みカーネルという学習可能なパラメーターを持ちます。"
      B: "正解です。局所的な結合とパラメーター共有は、画像の持つ構造的な事前知識をアーキテクチャに組み込んだものであり、CNNの効率性と性能の源泉です。"
      C: "CNNは特徴抽出を行う非可逆な変換です。"
      D: "計算量は入力画像のサイズに依存します。"
  - rubric: architectural_flexibility
    type: multichoice
    title: "10-BERTとGPTの比較"
    points: 2
    question: |
      BERTとGPTは、どちらもTransformerをベースとしているが、そのアーキテクチャと事前学習タスクには根本的な違いがある。この違いに関する説明として、最も適切なものを一つ選びなさい。
    choices:
      A: "BERTは双方向アテンションで文脈全体を捉え「マスク言語モデル（穴埋め）」で学習するのに対し、GPTは未来を見ない因果的アテンションで「次トークン予測」を行う。"
      B: "BERTはテキストの感情を分析するために、GPTはテキストを翻訳するために設計されている。"
      C: "BERTは画像データを、GPTはテキストデータを扱うように設計されている。"
      D: "BERTは強化学習、GPTは教師あり学習で訓練される。"
    answer: A
    feedback:
      A: "正解です。このアーキテクチャと事前学習タスクの違いが、BERTが文脈理解に、GPTがテキスト生成にそれぞれ適している理由です。"
      B: "これらは応用タスク（下流タスク）の例であり、モデルの根本的な設計思想ではありません。"
      C: "どちらも主にテキストデータを扱うモデルです。"
      D: "どちらも主に自己教師あり学習で事前学習されます。"
  - rubric: societal_implications
    type: multichoice
    title: "11-AIエージェントの概念"
    points: 2
    question: |
      大規模言語モデル（LLM）を基盤とした「自律エージェント」が、従来の予測器（Classifier/Regressor）と根本的に異なる点として、最も適切なものを一つ選びなさい。
    choices:
      A: "エージェントは、より多くのパラメーターを持つため、予測精度が常に高い。"
      B: "エージェントは、固定された「入力→出力」の処理を行うだけでなく、目標達成のために自ら計画を立て、外部ツールを使用するなどの「行動」を起こすことができる。"
      C: "エージェントは、テキストデータしか扱えないが、従来の予測器は画像データも扱える。"
      D: "エージェントは、学習に一切データを必要としない。"
    answer: B
    feedback:
      A: "精度が高いことは結果であり、根本的な違いではありません。"
      B: "正解です。ReActフレームワークに代表されるように、エージェントは「思考→行動→観察」のサイクルを通じて、より動的で複雑なタスクを遂行します。"
      C: "マルチモーダルなエージェントも存在します。"
      D: "エージェントの基盤となるLLMは、膨大なデータで学習されています。"
  - rubric: societal_implications
    type: multichoice
    title: "12-ハルシネーションとバイアス"
    points: 1
    question: |
      AIの倫理的リスクについて、以下の二つの事例はそれぞれ「ハルシネーション」と「バイアス」のどちらに該当するか。正しい組み合わせを一つ選びなさい。
      (1) 医師に関する文章を生成させると男性医師を、看護師に関する文章では女性看護師を主に描写する傾向がある。
      (2) 最新の出来事について質問した際に、それらしいが事実とは異なる架空のニュース記事を生成した。
    choices:
      A: "(1) ハルシネーション, (2) バイアス"
      B: "(1) バイアス, (2) ハルシネーション"
      C: "(1) バイアス, (2) バイアス"
      D: "(1) ハルシネーション, (2) ハルシネーション"
    answer: B
    feedback:
      A: "組み合わせが逆です。"
      B: "正解です。(1)は学習データに含まれる社会的なステレオタイプを反映した「バイアス」の例であり、(2)は事実に基づかない情報を生成する「ハルシネーション」の例です。"
      C: "(2)はハルシネーションです。"
      D: "(1)はバイアスです。"
  - rubric: model_selection_philosophy
    type: multichoice
    title: "13-データ量とモデルの複雑さ"
    points: 1
    question: |
      「利用可能なデータ量が非常に多いならば、常にできるだけ複雑なモデル（表現能力が高いモデル）を使用するべきである」という主張について、最も適切な評価を一つ選びなさい。
    choices:
      A: "正しい。データ量が多ければ過適合のリスクは無視できるため、最も複雑なモデルが良い性能を発揮する。"
      B: "誤りである。例えば、データの背後にある真の関係性が単純な線形である場合、複雑なモデルを使う必要はなく、過適合のリスクを不必要に高める可能性がある。"
      C: "正しい。No-Free-Lunch Theoremにより、複雑なモデルほど汎用性が高くなることが保証されているため。"
      D: "誤りである。データ量が多いと、複雑なモデルは計算量が多すぎて学習が不可能になるため。"
    answer: B
    feedback:
      A: "データ量が多くても過適合のリスクはゼロにはなりません。また、タスクに対して不必要に複雑なモデルは、解釈性や計算コストの面でも不利です。"
      B: "正解です。モデルの複雑さは、データの量だけでなく、タスク自体の内在的な複雑さに合わせるべきです。オッカムの剃刀の原則にも通じます。"
      C: "No-Free-Lunch Theoremは、万能なモデルの存在を否定するものであり、複雑なモデルの優位性を保証するものではありません。"
      D: "計算コストは問題になりますが、これが主張が誤りである本質的な理由ではありません。"
  - rubric: generative_model_paradigms
    type: multichoice
    title: "14-Softmaxの温度と損失"
    points: 2
    question: |
      自己回帰型の言語モデルが、ある文脈において次のトークンの正解が「猫」であり、モデルが「猫」に高い確率を与えている状況を考える。このとき、生成の多様性を上げるためにSoftmax関数の温度パラメーター $$\\tau$$ を1より大きい値に設定した場合、この1トークンに対する交差エントロピー損失の値はどのように変化すると考えられるか。
    choices:
      A: "温度を上げると正解トークンの確率が下がるため、損失は大きくなる。"
      B: "温度を上げると正解トークンの確率が上がるため、損失は小さくなる。"
      C: "温度は生成時のサンプリングにのみ影響し、損失の計算には影響しないため、変化しない。"
      D: "損失が大きくなるか小さくなるかは、文脈によって異なり一概には言えない。"
    answer: A
    feedback:
      A: "正解です。温度 $\\tau > 1$ は確率分布を平坦化させます。元々高かった正解トークンの確率が下がるため、負の対数尤度である交差エントロピー損失 ($-log(p)$) は大きくなります。"
      B: "逆です。温度を上げると、確率分布はより一様分布に近づき、突出した確率値は下がります。"
      C: "温度はSoftmaxの計算の一部であり、出力される確率値そのものを変えるため、当然損失の値にも影響します。"
      D: "元々正解トークンに高い確率を与えているという条件下では、損失は一貫して大きくなる方向に変化します。"
  - rubric: societal_implications
    type: multichoice
    title: "15-著作権侵害の成立要件"
    points: 2
    question: |
      生成AIを用いて作成した画像が、他者の著作権（複製権）を侵害していると法的に認定されるために、一般的に必要とされる2つの要件の組み合わせとして、最も適切なものを一つ選びなさい。
    choices:
      A: "AIが非営利目的で利用されたこと ＋ 出力が既存の著作物と完全に一致すること"
      B: "AIが学習データとしてその他者の著作物にアクセスしたという事実（依拠性） ＋ 出力がその他者の著作物の本質的特徴を感得させる程度に類似していること（実質的同一性）"
      C: "AIの出力がインターネット上で公開されたこと ＋ その出力に対して著作者が異議を申し立てたこと"
      D: "AIがオープンソースであること ＋ 出力が商業的に利用されたこと"
    answer: B
    feedback:
      A: "偶然の一致では依拠性が否定され、侵害は成立しにくいです。また、非営利であることは免責要件ではありません。"
      B: "正解です。日本の著作権法の実務では、一般に「依拠性」と「実質的同一性」の両方が立証されることが著作権侵害の成立に必要とされます。"
      C: "これらは侵害成立の要件ではありません。"
      D: "AIのライセンスや営利性の有無は、侵害が成立するかどうかの本質的な要件ではありません。"
  - rubric: problem_formulation
    type: multichoice
    title: "16-AIブームの比較"
    points: 1
    question: |
      AIの歴史における第1次ブームと第3次ブームの技術的アプローチの根本的な違いとして、最も適切なものを一つ選びなさい。
    choices:
      A: "第1次はハードウェア、第3次はソフトウェアに焦点を当てていた。"
      B: "第1次は人間がルールを明示的に与えるアプローチ、第3次はデータからルールを自動で学習するアプローチである。"
      C: "第1次は統計学、第3次は論理学に基づいていた。"
      D: "第1次は学術研究のみ、第3次は産業応用のみを目的としていた。"
    answer: B
    feedback:
      A: "どちらのブームもソフトウェアが中心ですが、そのアプローチが異なります。"
      B: "正解です。この「ルールベース」から「データ駆動」へのパラダイムシフトが、両ブームの最も本質的な違いです。"
      C: "説明が逆です。"
      D: "どちらのブームも学術研究と産業応用への期待がありました。"
  - rubric: evaluation_methodology
    type: multichoice
    title: "17-L2正則化の目的"
    points: 1
    question: |
      モデルの学習においてL2正則化を導入する主な目的は何か。
    choices:
      A: "学習速度を向上させるため。"
      B: "モデルのパラメーターの絶対値が大きくなりすぎるのを防ぎ、過適合を抑制するため。"
      C: "訓練データに含まれるノイズを自動的に除去するため。"
      D: "どのようなタスクにも対応できる、より汎用的なモデルを構築するため。"
    answer: B
    feedback:
      A: "正則化は計算を追加するため、学習速度はむしろわずかに低下する可能性があります。"
      B: "正解です。パラメーターが大きくなることは、モデルが訓練データに過剰に反応している兆候であり、L2正則化はこれを罰則項によって抑制します。"
      C: "ノイズ除去は直接の目的ではありません。"
      D: "正則化はモデルに「単純さを好む」というバイアスを与えるため、むしろ汎用性を少し犠牲にして特定の種類の解を導きます。"
  - rubric: optimization_mechanism
    type: multichoice
    title: "18-誤差逆伝播法の役割"
    points: 1
    question: |
      ニューラルネットワークの学習において、最適化アルゴリズムである勾配降下法は目的関数の「勾配」を必要とする。この勾配を効率的に計算する役割を担うアルゴリズムは何か。
    choices:
      A: "誤差逆伝播法（Backpropagation）"
      B: "経験リスク最小化（ERM）"
      C: "k-最近傍法（k-NN）"
      D: "ソフトマックス関数"
    answer: A
    feedback:
      A: "正解です。誤差逆伝播法は、複雑なニューラルネットワークのパラメーターに関する勾配を、連鎖律を用いてシステマチックに計算します。"
      B: "ERMは学習の基本原理であり、アルゴリズムではありません。"
      C: "k-NNは予測アルゴリズムであり、勾配計算は行いません。"
      D: "ソフトマックス関数は活性化関数の一種です。"
  - rubric: architectural_flexibility
    type: multichoice
    title: "19-文書埋め込みの基本"
    question: |
      自然言語処理において、文や文書全体の意味を一つのベクトルで表現する「文書埋め込み」を作成する最もシンプルな方法として、適切なものを一つ選びなさい。
    choices:
      A: "文書に含まれる単語の数を数え、その値をベクトルとする。"
      B: "文書を構成する各単語（トークン）の埋め込みベクトルを計算し、それらを全て平均する。"
      C: "文書の先頭と末尾の単語の埋め込みベクトルを連結する。"
      D: "文書を画像としてレンダリングし、CNNで特徴量を抽出する。"
    answer: B
    feedback:
      A: "これでは文の構造や意味が失われてしまいます。"
      B: "正解です。これはBag-of-Wordsの考え方を拡張したもので、単純ながら多くのタスクで有効なベースラインとなります。"
      C: "文の中間にある重要な情報が失われてしまいます。"
      D: "可能ではありますが、一般的でシンプルな方法ではありません。"
  - rubric: architectural_flexibility
    type: multichoice
    title: "20-活性化関数の役割"
    question: |
      ニューラルネットワークの中間層で、ReLUのような非線形の活性化関数が不可欠とされる最も重要な理由を一つ選びなさい。
    choices:
      A: "計算結果を必ず正の値にすることで、モデルの安定性を高めるため。"
      B: "活性化関数がなければ、どれだけ多くの層を重ねても、ネットワーク全体が単一の線形変換と等価になってしまい、複雑な関数を表現できないため。"
      C: "出力の合計を1に正規化し、確率として解釈できるようにするため。"
      D: "パラメーターの数を減らし、計算コストを削減するため。"
    answer: B
    feedback:
      A: "結果を正にすることはReLUの特性ですが、それが非線形活性化関数が不可欠である本質的な理由ではありません。"
      B: "正解です。非線形な活性化関数を挟むことで初めて、層を重ねることがモデルの表現能力の向上に繋がり、複雑な非線形関数を近似できるようになります。"
      C: "これは主に出力層で使われるソフトマックス関数の役割です。"
      D: "活性化関数はパラメーターの数に影響しません。"
