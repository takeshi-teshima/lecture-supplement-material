Quizzes:
  # ───────────────────────────────────────────────────────────────
  - rubric: 予算から総FLOPsを比例計算できる
    type: multichoice
    title: 013-08-1-総FLOPsの算出
    question: |
      **前提**
      - 計算コストは FLOPs に比例すると仮定する。
      - 2.0 × 10^{22} FLOPs の学習コスト = 6.5 × 10^{6} 円（650 万円）。
      - 今回の計算予算は **1.95 × 10^{9} 円（19.5 億円）** である。

      **問**
      この予算で実行できる総計算量 \(B\)（FLOPs）はどれか。
    choices:
      A: \(6.0\times10^{23}\)
      B: \(6.0\times10^{24}\)
      C: \(6.0\times10^{25}\)
      D: \(3.0\times10^{24}\)
    answer: B
    feedback:
      A: 倍率 30 で計算しており 10 倍不足しています。
      B: 正解。倍率は \(1.95\times10^{9} / 6.5\times10^{6} = 300\)。よって \(300 \times 2.0\times10^{22} = 6.0\times10^{24}\) FLOPs。
      C: さらに 10 倍過剰です。
      D: 倍率 150 で計算しており半分不足しています。

  # ───────────────────────────────────────────────────────────────
  - rubric: （前問の続き）制約式 6PD=B と損失式を手計算で比較し compute-optimal 候補を選べる
    type: multichoice
    title: 013-08-2-（前問の続き）最適パラメータ数とデータ量
    question: |
      **前問の結果** 総計算量
      \[
        B = 6.0\times10^{24}\ \text{FLOPs},\qquad
        \frac{B}{6}=1.0\times10^{24}.
      \]

      **損失近似（Chinchilla スケール則）**
      \[
        L^*(P,D)=1.61+\frac{406.4}{P^{0.34}}+\frac{410.7}{D^{0.28}}.
      \]

      **制約**
      \[
        6\,P\,D = B.
      \]

      ---
      #### 手計算ヒント
      1. 制約より \(D=\dfrac{B}{6P}=10^{24}/P\)。
      2. 損失の第2項と第3項は **同程度の大きさ** になるときに合計が最小になりやすい。
      3. 10 進指数の近似
         \[
           10^{0.2}\approx1.6,\qquad10^{0.8}\approx6.3.
         \]

      ---
      **問**
      次の 4 組はいずれも \(6PD\approx B\) を満たすように調整されている。
      損失 \(L^*(P,D)\) が **最も小さくなる** 組はどれか。（概算で十分）
    choices:
      A: \(P = 8.4\times10^{10}\) param， \(D = 1.2\times10^{13}\) token
      B: \(P = 3.0\times10^{9}\) param， \(D = 3.0\times10^{14}\) token
      C: \(P = 1.0\times10^{11}\) param， \(D = 7.0\times10^{12}\) token
      D: \(P = 1.2\times10^{13}\) param， \(D = 8.4\times10^{10}\) token
    answer: A
    feedback:
      A: 正解。第2項と第3項がほぼ 0.08 ± 0.01 程度で均衡し，合計が最小。
      B: パラメータ不足・データ過剰で第2項が大きく \(L^*\) 悪化。
      C: データ不足で第3項が大きくなり A より劣る。
      D: データ極端不足で第3項が支配的になり最も損失が大きい。

  # ───────────────────────────────────────────────────────────────
  - rubric: （前問の続き）選んだ (P,D) から最小損失 \(L^*\) を数量的に評価できる
    type: multichoice
    title: 013-08-3-（前問の続き）最小損失 \(L^*\) の概算
    question: |
      **前問で選んだ最適値**
      \[
        P = 8.4\times10^{10},\qquad
        D = 1.2\times10^{13}.
      \]

      **損失近似式**
      \[
        L^*(P,D)=1.61+\frac{406.4}{P^{0.34}}+\frac{410.7}{D^{0.28}}.
      \]

      ---
      #### 手計算ヒント
      - \(\log_{10}(8.4)\approx0.924\;\Rightarrow\;P^{0.34}\approx10^{0.924\times0.34}\times10^{10\times0.34}\approx2.6\times10^{3.4}\).
      - \(\log_{10}(1.2)\approx0.079\;\Rightarrow\;D^{0.28}\approx10^{0.079\times0.28}\times10^{13\times0.28}\approx1.1\times10^{3.64}\).
      - 第2項 ≈ 0.10 第3項 ≈ 0.07 （1 桁精度で十分）。

      ---
      **問**
      最小損失 \(L^*\) として最も妥当なのはどれか。
    choices:
      A: \(L^*\approx1.78\)
      B: \(L^*\approx1.70\)
      C: \(L^*\approx1.89\)
      D: \(L^*\approx1.98\)
    answer: A
    feedback:
      A: 正解。1.61 + 0.10 + 0.07 ≈ 1.78。
      B: 第2・第3項を過小評価しており低すぎる。
      C: 選択肢 B の (P,D) を用いた場合のおおよその損失。
      D: 選択肢 D の (P,D) を用いた場合のおおよその損失。
