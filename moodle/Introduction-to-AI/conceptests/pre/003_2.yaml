      D: λ を変えてもテスト誤差は同じ．
    answer: B
    feedback:
      B: 正解．検証セットは汎化性能の近似として機能します．&#8203;:contentReference[oaicite:32]{index=32}&#8203;:contentReference[oaicite:33]{index=33}
      A,C,D: 検証結果を無視した選択はリスクが高いです．

- rubric: 経験リスクと経験リスク最小化 (ERM) の定義を理解している
  type: multichoice
  title: 003-01-ERMとは何か
  question: |
    回帰タスクにおいて，経験リスク最小化（ERM）が最小化しようとする量はどれか。
    $$ n $$ 個の訓練標本 $$\{(x_i,y_i)\}_{i=1}^n$$ が与えられている。
  choices:
    A: 真のリスク $$ R(f) = \mathbb{E}[(Y-f(X))^2] $$
    B: 経験リスク $$ \hat R(f) = \frac1n\sum_{i=1}^n (y_i-f(x_i))^2 $$
    C: パラメータノルム $$ \lVert\theta\rVert_2^2 $$
    D: 情報量規準 AIC
  answer: B
  feedback:
    A: 真のリスクは未知で直接最小化できません．
    B: 正解です．ERM は訓練標本上の平均損失（経験リスク）を最小化します．
    C: これは L2 正則化項の一例です．
    D: AIC は情報量規準であり ERM とは別概念です．

- rubric: 多変量最適化における一階条件を理解している
  type: truefalse
  title: 003-02-勾配ゼロ条件
  question: |
    制約のない最適化問題 $$\min_{\phi\in\mathbb{R}^d} L(\phi)$$ では，
    最適解は必ず $$\nabla L(\phi)=0$$ を満たす．
  answer: true
  feedback:
    true: 正解です．局所極値の必要条件として勾配ゼロが成立します．
    false: 制約がない場合，必要条件が崩れることはありません．

- rubric: L2 正則化係数の役割を定性的に説明できる
  type: multichoice
  title: 003-03-正則化強度の効果
  question: |
    線形回帰で L2 正則化係数 $$ \alpha $$ を極端に大きくすると，学習済み
    予測器 $$ f_{\hat w,\hat b}(x)=\hat w x + \hat b $$ はどのような形に近づくか。
  choices:
    A: 斜率が大きい急峻な直線
    B: 原点を通る直線
    C: ほぼ水平な定数関数
    D: 高次多項式
  answer: C
  feedback:
    A: 斜率はむしろ 0 に近づきます．
    B: $$\hat b$$ も 0 に近づくため原点は通りますが傾きも消えます．
    C: 正解です．パラメータがゼロに収束し定数関数となります．
    D: 正則化はモデルを単純化し高次多項式にはしません．

- rubric: 検証データ分割の意義を説明できる
  type: multichoice
  title: 003-04-検証データの役割
  question: |
    検証 (validation) データを訓練に用いない主目的はどれか。
  choices:
    A: 訓練時間を短縮するため
    B: 未知データでの汎化性能を近似的に測るため
    C: パラメータ更新を高速化するため
    D: 損失関数を変更するためのデータを確保するため
  answer: B
  feedback:
    A: データを減らせば訓練は速くなりますが主目的ではありません．
    B: 正解です．モデル選択時に過適合を防ぎ汎化性能を推定します．
    C: 検証は最適化アルゴリズムの速度と直接関係しません．
    D: 検証データは損失関数そのものを変えるために使いません．

- rubric: K 分割交差検証とホールドアウトの比較を理解している
  type: truefalse
  title: 003-05-K分割交差検証の利点
  question: |
    データ量が非常に多い場合は，K 分割交差検証よりも単純な
    ホールドアウト法（1 回の分割）の方が実務上よく採用される．
  answer: true
  feedback:
    true: 正解です．大規模データではホールドアウトでも推定誤差が十分小さく，計算コストが低い利点があります．
    false: K 分割交差検証は計算コストが増大し不要に複雑になる場合があります．

- rubric: ハイパーパラメーター探索法の違いを区別できる
  type: multichoice
  title: 003-06-グリッドvsランダム
  question: |
    5 個のハイパーパラメーターを各 8 水準で調整する場合，
    総当たりグリッドサーチよりもランダムサーチが望ましい
    主な理由はどれか。
  choices:
    A: ランダムサーチは常に最適解を保証する
    B: グリッドサーチは連続値パラメーターを扱えない
    C: ランダムサーチは探索点が少なくても高次元空間を均等に被覆しやすい
    D: グリッドサーチは並列計算ができない
  answer: C
  feedback:
    A: 最適解の保証はありません．
    B: グリッドでも離散化すれば扱えます．
    C: 正解です．高次元では重要な軸だけを効果的に探索できます．
    D: どちらも並列化は可能です．

- rubric: ベイズ最適化の考え方を理解している
  type: multichoice
  title: 003-07-ベイズ最適化の本質
  question: |
    ベイズ最適化によるハイパーパラメーター探索の特徴はどれか。
  choices:
    A: 既知の解析解を直接計算する
    B: 目的関数の分布を事後確率でモデル化し，獲得関数で探索点を決める
    C: 目的関数を勾配降下法で最適化する
    D: 乱数のみでサンプリングする
  answer: B
  feedback:
    A: ハイパーパラメーター最適化に解析解は通常存在しません．
    B: 正解です．ガウス過程などを用いて目的関数を確率モデル化します．
    C: 目的関数はブラックボックスで勾配が取れない前提です．
    D: 乱数は使いますが獲得関数で指導されます．

- rubric: 特徴写像により多項式回帰を線形モデルで表せる理由を説明できる
  type: truefalse
  title: 003-08-多項式は線形モデル
  question: |
    適切な特徴写像 $$ \theta(x)=(1,x,x^2,\dots,x^r)^\top $$ を用いれば，
    $$r$$ 次多項式回帰は線形モデルとして学習できる。
  answer: true
  feedback:
    true: 正解です．パラメータが写像に対して線形だからです．
    false: 非線形性は入力空間での形状であり重みとの関係は線形です．

- rubric: 過適合の概念を定義できる
  type: multichoice
  title: 003-09-過適合の兆候
  question: |
    次のうち「過適合したモデル」の典型的な挙動はどれか。
  choices:
    A: 訓練損失も検証損失も共に大きい
    B: 訓練損失が小さく検証損失が大きい
    C: 訓練損失が大きく検証損失が小さい
    D: 訓練損失と検証損失がともに小さい
  answer: B
  feedback:
    A: モデルが単純すぎる可能性があります（アンダーフィット）．
    B: 正解です．訓練に合わせすぎ未知データで性能が落ちています．
    C: あり得ない組み合わせです．
    D: 十分に汎化できている理想的な状態です．

- rubric: Hold-out と時系列分割の違いを理解している
  type: multichoice
  title: 003-10-時系列分割
  question: |
    時系列データで検証用データを確保する際に
    「最新 1 か月を評価用，その前の 1 か月を検証用」とする分割を選ぶ
    主な理由はどれか。
  choices:
    A: データを均等にシャッフルしているから
    B: 将来予測の現場と同じ時系列順序の外挿を評価したいから
    C: 訓練データを最大化できるから
    D: 交差検証が計算できないから
  answer: B
  feedback:
    A: シャッフルは行いません．
    B: 正解です．時間依存性を保ち未来データでの汎化性能を推定します．
    C: 分割比率次第で訓練量は増減しますが主目的ではありません．
    D: 時系列でも工夫すれば交差検証は可能です（rolling-window など）．

- rubric: 学生同士の議論を通して帰納バイアスの例を識別できる
  type: multichoice
  title: 003-11-帰納バイアスとは？
  question: |
    3 人の学生がモデルの良さについて議論しています。正しい説明は誰でしょう？
    ---
    Aさん「帰納バイアスとは，モデルが自動的にパラメータを更新する速さのことだよ。」
    Bさん「帰納バイアスとは，『どのような仮説を好むか』という学習手法の先入観だよ。」
    Cさん「帰納バイアスとは，検証データを分割する個数のことを指すんだ。」
    Dさん「帰納バイアスとは，訓練損失をゼロにする能力のことだと思う。」
  choices:
    A: Aさん
    B: Bさん
    C: Cさん
    D: Dさん
  answer: B
  feedback:
    A: 更新速度は最適化のハイパーパラメーターです．
    B: 正解です．帰納バイアスは仮説空間内での好み（偏り）を指します．
    C: 分割数は交差検証の設定です．
    D: 損失ゼロは能力でありバイアスではありません．

- rubric: No-Free-Lunch 定理の含意を説明できる
  type: truefalse
  title: 003-12-万能学習器は存在しない
  question: |
    ノーフリーランチ定理によれば，あらゆる問題で常に他より
    高い汎化性能を示す単一の機械学習アルゴリズムは存在しない。
  answer: true
  feedback:
    true: 正解です．定理は「無料の昼食はない」，すなわち
      事前知識なしに普遍的に優れる手法はないと述べます．
    false: そのようなアルゴリズムが存在するなら定理に反します．

- rubric: 正則化付き最小二乗法の解析解を概念的に理解している
  type: truefalse
  title: 003-14-解析解の存在
  question: |
    線形モデルに L2 正則化を加えた場合でも，
    正則化付き最小二乗問題には
    解析解（閉形式解）が存在する。
  answer: true
  feedback:
    true: 正解です．$$(\Phi^\top\Phi+\alpha I)^{-1}\Phi^\top y$$ で求まります．
    false: 勾配法に頼らず行列計算で一括解が得られます．

- rubric: 検証曲線 (validation curve) の読み方を理解している
  type: multichoice
  title: 003-15-検証曲線の最小点
  question: |
    正則化係数 $$ \alpha $$ を横軸，検証損失を縦軸に
    プロットした検証曲線の最小点が示すものは何か。
  choices:
    A: テストデータで最小となることを保証する $$\alpha$$
    B: 検証データで最も良い性能を出した $$\alpha$$
    C: 損失関数を変更すべき点
    D: 学習率を調整すべき点
  answer: B
  feedback:
    A: テスト性能は保証されませんが近似します．
    B: 正解です．検証セットでの最良ハイパーパラメーターです．
    C: 損失関数変更とは無関係です．
    D: 学習率は最適化の別パラメーターです．

- rubric: 高次元多項式の特徴数を計算できる
  type: multichoice
  title: 003-16-多項式特徴次元
  question: |
    $$d$$ 変数 $$s$$ 次多項式の全特徴数は次のどれか。
  choices:
    A: $$\displaystyle {d+s \choose s}$$
    B: $$\displaystyle d^s$$
    C: $$\displaystyle (d+s)!$$
    D: $$\displaystyle s^d$$
  answer: A
  feedback:
    A: 正解です．重複組合せの公式です．
    B: 直積の場合の個数です．
    C: 階乗は無関係です．
    D: 変数と次数が逆です．

- rubric: ハイパーパラメーター最適化を
    「最外層の最適化問題」と捉えられる
  type: multichoice
  title: 003-18-二段最適化
  question: |
    ハイパーパラメーター選択は数式的に次のどの形で表現できるか。
    ただし $$\mathrm{Criterion}(\lambda)$$ は
    ハイパーパラメーター $$\lambda$$ で学習・検証して得た指標とする。
  choices:
    A: $$\displaystyle \min_\theta \mathrm{Criterion}(\theta)$$
    B: $$\displaystyle \min_\lambda \mathrm{Criterion}(\lambda)$$
    C: $$\displaystyle \max_\lambda \mathrm{Criterion}(\lambda)$$
    D: 解析解が存在し最適化は不要
  answer: B
  feedback:
    A: $$\theta$$ はモデルパラメータです．
    B: 正解です．外側で $$\lambda$$ を最適化します．
    C: ここでは指標が小さいほど良いと設定しています．
    D: ブラックボックスで解析解はありません．

- rubric: 経験リスク最小化の限界を議論できる（学生会話）
  type: multichoice
  title: 003-19-ERMの限界を語る学生たち
  question: |
    以下の会話で，ERM の役割を最も正確に説明しているのは誰か。
    ---
    Aさん「すべての予測タスクは結局 ERM で解けるんだよ。」
    Bさん「ERM は一つの方法論だけど，過適合などの課題が残るから
            正則化や別の基準が併用されることも多いよ。」
    Cさん「ERM では損失を最小化するので，ハイパーパラメーターは不要だよ。」
    Dさん「ERM を使えば未知データでのリスクを直接計算できるんだ。」
  choices:
    A: Aさん
    B: Bさん
    C: Cさん
    D: Dさん
  answer: B
  feedback:
    A: 万能ではありません．
    B: 正解です．ERM の位置づけと限界を指摘しています．
    C: ハイパーパラメーターはモデルや正則化で必要です．
    D: リスクは未知分布の期待値で直接計算できません．

- rubric: モデル自由度と過適合の関係を理解している
  type: truefalse
  title: 003-20-モデル自由度と過適合
  question: |
    モデルの自由度が高いほど過適合のリスクは一般に大きくなる。
  answer: true
  feedback:
    true: 正解です．自由度が高いと訓練データに合わせすぎやすいです．
    false: 自由度が低いほどリスクが小さくなるとは限りませんが，
      自由度が高いと過適合しやすいのは一般的傾向です．
