  - rubric: λ とモデル複雑度のトレードオフを定量的に理解している．
    type: multichoice
    title: 003-04-λ最適値を選ぶ
    question: |
      訓練データ 1000\,件，検証データ 200\,件で L2 正則化係数 λ を
