  - rubric: 時系列分割の意義を説明できる．
    type: truefalse
    title: 002-02-時系列スプリット
    question: |
      時系列データでは，ランダムにシャッフルして 7:3 に分割するよりも，
      直近の期間を丸ごと検証データとして取り置く方が望ましい．
    answer: true
    feedback:
      true: 正解です．時間依存を壊さず将来データを模擬できます．&#8203;:contentReference[oaicite:2]{index=2}&#8203;:contentReference[oaicite:3]{index=3}
      false: ランダム分割では将来情報が訓練側に漏れてしまう恐れがあります．

  - rubric: ハイパーパラメータ λ の役割を説明できる．
    type: multichoice
    title: 003-01-正則化係数の効果
    question: |
      線形回帰に L2 正則化を導入し，損失を
      $$ L(w,b)=\frac1n\sum_{i=1}^n( y_i-(wx_i+b) )^2+\lambda (w^2+b^2) $$
      とした．λ を大きくすると学習済みモデルはどう変わるか．
    choices:
      A: 係数 $$w$$ と $$b$$ が 0 に近づき，予測は水平線に近づく．
      B: 係数が発散して急峻な直線になる．
      C: 学習結果に影響しない．
      D: 訓練誤差が必ず減少する．
    answer: A
    feedback:
      A: 正解．λ→∞ で $$w,b\to0$$ となり定数モデルになります．&#8203;:contentReference[oaicite:4]{index=4}&#8203;:contentReference[oaicite:5]{index=5}
      B: 逆です．
      C: λ はハイパーパラメータで結果を制御します．
      D: 過学習を抑えるため訓練誤差はむしろ増えることがあります．

  - rubric: ハイパーパラメータ探索を実行できる．
    type: truefalse
    title: 003-02-グリッドサーチ
    question: |
      グリッドサーチよりもベイズ最適化の方が
      すべての場合でハイパーパラメータ探索時間が短くなる．
    answer: false
    feedback:
      true: ベイズ最適化は高価な 1 評価を賢く選びますが，評価自体が安価なら必ずしも速くなりません．
      false: 正解です．問題の次元・コストにより適切な探索法を選ぶ必要があります．

  - rubric: 事例ベース vs. パラメトリックの違いを区別できる．
    type: multichoice
    title: 005-01-kNNと線形モデル
    question: |
      次のうち，ノンパラメトリックモデルの典型例として最も適切なのはどれか．
    choices:
      A: k-最近傍法 (k-NN)
      B: 1 次多項式回帰
      C: 1 層パーセプトロン
      D: ロジスティック回帰
    answer: A
    feedback:
      A: 正解．パラメータを持たず訓練データを直接保持します．&#8203;:contentReference[oaicite:6]{index=6}&#8203;:contentReference[oaicite:7]{index=7}
      B-D: いずれもパラメータ数が固定のパラメトリックモデルです．

  - rubric: 帰納バイアスの具体例を選べる．
    type: multichoice
    title: 006-02-帰納バイアスの例
    question: |
      次のうち，**帰納バイアスの具体例**として最も適切なのはどれか．
    choices:
      A: データをシャッフルする．
      B: ニューラルネットに畳み込み層を入れて平行移動不変性を取り入れる．
      C: GPU で学習を高速化する．
      D: モデルの出力を丸め込んで整数化する．
    answer: B
    feedback:
      A: シャッフルは i.i.d. 仮定を満たす前処理です．
      B: 正解．画像には平行移動不変性があるという事前知識を組み込みます．&#8203;:contentReference[oaicite:12]{index=12}&#8203;:contentReference[oaicite:13]{index=13}
      C: 計算資源の話であり帰納バイアスとは無関係．
      D: 出力形式の話です．

  - rubric: 学生同士の議論を通じて検証分割を理解している．
    type: multichoice
    title: 002-04-学生の会話‐取り置きか交差検証か
    question: |
      4 人の学生がモデル評価方法について議論している．**正しい発言**をしているのは誰か．
      ---
      Aさん「交差検証は検証セットを 1 回しか使わないホールドアウトの特別版だよ」
      Bさん「取り置き法はランダム分割だけを指し，時系列分割は含まれない」
      Cさん「交差検証では訓練データの一部が毎回検証に回るのでデータ効率が高い」
      Dさん「検証データはハイパーパラメータを選び終わった後にだけ使うべきだ」
    choices:
      A: Aさん
      B: Bさん
      C: Cさん
      D: Dさん
    answer: C
    feedback:
      A: 「1 回しか使わない」は誤り．k 回学習を回します．
      B: 取り置き法には時系列 split も含まれます．
      C: 正解です．複数分割でデータ利用効率が向上します．&#8203;:contentReference[oaicite:14]{index=14}&#8203;:contentReference[oaicite:15]{index=15}
      D: 検証データは**選択のとき**に使います．

