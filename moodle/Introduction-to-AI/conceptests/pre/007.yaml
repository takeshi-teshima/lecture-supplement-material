    choices:
      A: 高校数学レベルの微分公式だけで任意の複雑関数に対応できる
      B: 分解により勾配計算を**コードで自動化できる**
      C: 分解すれば計算量が必ず $O(1)$ になる
      D: 分解するとモデルの精度が必ず上がる
    answer: B
    feedback:
      A: 複雑関数でも演算ごとの「局所微分テーブル」があれば十分。ただし高校数学だけでは網羅できない場合も。
      B: **正解。** 各演算の勾配をライブラリに登録すれば，残りはチェーンルールで自動計算できる。
      C: 計算量が不変になるわけではない。
      D: 勾配計算の方法とモデル精度は直接関係しない。

  - rubric:
    type: multichoice
    title:
    # 一方、実際にニューラルネットワークの学習のために誤差逆伝播法を用いる際には、
    # まず初めにいちど順伝播を行ってから、モデルの計算グラフを逆順に辿りながら偏微分の積を順次とることによって、勾配の計算が行われる。
    # これを繰り返し適用することにより、ニューラルネットワークの誤差逆伝播法が導かれる。
    # このとき、初めに順伝播を行う必要があるのはなぜか。
    choices:
      A: 合成関数の微分法則の式は略記であり，実際には現在のパラメーター等における勾配を計算する必要があるから。
    answer: A
    feedback:
      A: 正解。逆伝播では、順伝播で計算された活性化関数の出力値（中間層の出力）を利用して勾配を計算します。これらの値を保持していない場合、逆伝播の際に勾配を計算することができません。
      B: 誤り。パラメータの初期化は通常、学習の開始前に行われます。順伝播は、初期化されたパラメータを用いてネットワークの出力を計算するプロセスの一部です。
      C: 誤り。逆伝播は順伝播の結果に強く依存しています。特に、各層の活性化関数の出力値は逆伝播における勾配計算に不可欠です。
      D:

  - rubric: 逆伝播計算に先立って順伝播が必要となる理由を説明できる
    type: multichoice
    title: 007-002-順伝播が先行するわけ
    question: |
      ニューラルネットワークを誤差逆伝播法で学習するときには，
      まず入力をネットワークに通して **順伝播 (forward pass)** を行い，
      その後に **逆伝播 (backward pass)** で勾配を求めるのが常です。
      なぜ逆伝播の前に順伝播を１回走らせておく必要があるのか。
      最も適切な説明を選びなさい。
    choices:
      A: 順伝播で各層の出力（活性値）を計算しておかないと，
         逆伝播で合成関数の微分の連鎖律を適用する際に局所勾配（計算グラフの部分ごとの勾配）を計算できないから。
      B: 順伝播を行わないと，ネットワークのパラメータがまだ
         初期化されておらず，逆伝播が実行できないから。
      C: 逆伝播は順伝播の結果に依存しないので，実際には
         順伝播は省略可能だが慣習的に入れているだけである。
    answer: A
    feedback:
      A: 正解。チェーンルールで各層の局所勾配 $$\partial z/\partial a$$ を計算するには，
         順伝播時に得た中間出力 $$a$$ の値が必要です。これらをキャッシュしておく
         ことで逆伝播が一度の走査で済みます。
      B: パラメータはモデル構築段階で初期化されており，
         順伝播の有無とは無関係です。
      C: 逆伝播の式は順伝播の各中間値に依存するため，
         順伝播をスキップすると勾配を計算できません。

