    choices:
      A: 入力 $\mathbf x$ を固定の $\varphi(\mathbf x)$ に写像し，後段で *学習不能* な線形変換を掛ける
      B: 入力 $\mathbf x$ を **パラメータを学習しながら** 多段階の写像で表現空間に送り込む
      C: 最終層を除くすべての写像を凍結し，下流タスクでは重み更新しない
      D: 特徴写像は決定木で近似できるため NN とは無関係
    answer: B
    feedback:
      B: 正解。講義「これまでのあらすじ」で説明された通りです。 [oai_citation:19‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      A: 線形モデル側の立場に近い説明です。
      C: Fine-tuning の *一部* の流儀に過ぎません。
      D: 汎用的な説明ではありません。

  - rubric: ニューラルネットと固定特徴モデルの「特徴写像」の位置づけを対比できる
    type: multichoice
    title: 007-12-学習するϕか固定ϕか
    question: |
      「特徴写像 (feature map)」という観点で **順伝播型ニューラルネット (NN)** と
      **固定特徴を使う線形モデル** とを比較する。
      NN の特徴写像に関する次の 4 つの説明のうち，
      *講義で示された本質* を最も正確に捉えているものを 1 つ選びなさい。
    choices:
      A: NN は入力 $$\mathbf x$$ を **あらかじめ決め打ち** の写像
         $$\varphi(\mathbf x)$$ に通し，その後の線形層は
         *学習不可能* な定数行列である。
      B: NN は入力 $$\mathbf x$$ を **パラメータを学習しながら**
         多層の非線形写像で潜在空間へ送り込み，
         その写像 $$\varphi_\theta(\mathbf x)$$ 自体が学習の対象となる。
      C: NN では最終層を除くすべての写像を
         事前学習モデルとして完全に凍結し，下流タスクでは重みを更新しない
         ことが前提である。
      D: 特徴写像は決定木などの非微分モデルで
         近似するのが一般的であり，ニューラルネットの構築とは無関係である。
    answer: B
    feedback:
      A: >
        **誤り。** これは「固定特徴 + 線形回帰／SVM」型のモデルに相当する説明であり，
        ニューラルネットは特徴写像 $$\varphi_\theta$$ のパラメータ $$\theta$$ を
        学習によって最適化する点が決定的に異なる。
      B: >
        **正解。** NN では多層の非線形変換を通じて
        $$\varphi_\theta(\mathbf x)$$ を **自動的に学習** し，
        そのまま *表現学習* として機能するところが大きな利点である。
      C: >
        部分的に正しい状況（Fine-tuning の一形態）はあるが，
        講義の “特徴写像 vs 学習済み写像” の本質的対比を説明していない。
      D: >
        決定木は微分不可能なモデルであり，
        “連鎖律で勾配を流す” ニューラルネットの特徴写像とは
        アプローチが根本的に異なる。
