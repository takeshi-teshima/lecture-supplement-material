      true: **正解。** チェーンルールで前段と後段を一意に並べるためには DAG が必須。
      false: ループがある場合は時間展開（RNN の unroll など）で DAG に変換してから勾配を計算します。

  - rubric: 計算グラフ分解が“複雑な式”の勾配を容易にする理由を説明できる
