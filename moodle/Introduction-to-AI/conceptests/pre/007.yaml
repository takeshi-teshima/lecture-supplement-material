Quizzes:
  - rubric: 構造化データと非構造化データの本質的な違いを説明できる
    type: multichoice
    title: 007-01-データの2大分類
    question: |
      「非構造化データ」を次の 4 人が説明している。正しい説明は誰か。
    choices:
      A: Aさん「非構造化データは表形式でないため，行列に数値を並べて表せないデータの総称である。」
      B: Bさん「非構造化データは，どの位置にどの意味の情報があるか *あらかじめ決まっていない* データを指す。」
      C: Cさん「非構造化データは画像やテキストのことであるが，動画や音声は含まれない。」
      D: Dさん「表形式データにラベル列が欠けていれば，それは非構造化データと呼ぶ。」
    answer: B
    feedback:
      A: 「表形式でない」という形状だけがポイントではなく，*意味の位置づけ* が固定されていない点が本質です。 [oai_citation:0‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      B: 正解。講義では「決まった位置に決まった意味が書かれていない」と説明されました。 [oai_citation:1‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      C: 画像・テキストに限らず，動画・音声も典型的な非構造化データです。 [oai_citation:2‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      D: ラベルの有無は構造化／非構造化の判定基準ではありません。 [oai_citation:3‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)

  - rubric: 非構造化データに潜む「階層性」の概念を理解している
    type: multichoice
    title: 007-02-階層性とは何か
    question: |
      非構造化データにおける「階層性」の具体例として最も適切なのはどれか。
    choices:
      A: 画像の各ピクセル値が $[0,1]$ の範囲に正規化されている点
      B: 文章が文字 → 単語 → 文 → 段落…と意味が統合されていく点
      C: 表形式データで列どうしが独立である点
      D: ニューラルネットのバッチサイズを 32 に設定する点
    answer: B
    feedback:
      A: 階層的な *意味の統合* を指しておらず，単なる前処理です。 [oai_citation:4‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      B: 正解。講義では文字列の例で階層的統合を示しました。 [oai_citation:5‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      C: 表形式データはむしろ構造が固定されているため階層性の文脈とは異なります。
      D: ハイパーパラメータ設定であり階層性とは無関係です。

  - rubric: 深層ネットワークの浅い層と深い層の役割を区別できる
    type: multichoice
    title: 007-03-浅い層と深い層
    question: |
      深層 CNN を画像分類に用いたとき，「浅い層」が学習しやすい特徴として最も典型的なのはどれか。
    choices:
      A: 「犬」か「猫」かのクラス決定
      B: イチゴの種の位置関係
      C: 特定方向のエッジや局所的な模様
      D: 背景に写り込んだ文字列の意味
    answer: C
    feedback:
      A: クラス決定は最終層付近のタスク特化部で行われます。 [oai_citation:6‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      B: イチゴ固有の形状は中〜深層で抽出される例です。 [oai_citation:7‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      C: 正解。浅い層はエッジや簡単なパターンに反応するユニットを学習します。 [oai_citation:8‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      D: 文字認識は追加タスクであり浅層の典型的機能ではありません。

  - rubric: 計算グラフと自動微分の考え方を説明できる
    type: multichoice
    title: 007-04-計算グラフとは
    question: |
      計算グラフを **非** 常に簡潔に定義した次の説明のうち，正しいものはどれか。
    choices:
      A: 「変数間の依存関係を辺で結んだ *非巡回有向* グラフで，各頂点に計算が紐づく構造」
      B: 「ニューラルネットワークの重みだけをノードに並べたリスト構造」
      C: 「入力から出力までを線形写像だけで結んだ有向グラフ」
      D: 「損失値を子，パラメータを親にもつ *巡回* グラフ」
    answer: A
    feedback:
      A: 正解。講義では「非巡回有向グラフ」である点と「各頂点に関数が割り当てられる」点が強調されました。 [oai_citation:9‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      B: パラメータ“だけ”ではなく，中間変数も含めて頂点になります。
      C: 非線形活性も計算グラフに含まれます。
      D: 巡回があると逆伝播が定義できません。 [oai_citation:10‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)

  - rubric: 自動微分と誤差逆伝播法の関係を理解している
    type: truefalse
    title: 007-05-逆伝播は自動微分の特殊例？
    question: |
      「誤差逆伝播法（Backpropagation）は，ニューラルネットワークという *特定の構造* に限って自動微分を適用したアルゴリズムである。」
      この主張は正しいか。
    answer: true
    feedback:
      true: 正解。計算グラフに対する一般的な自動微分を，層構造をもつ NN へ適用したものが逆伝播です。 [oai_citation:11‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      false: 「逆伝播は NN 専用」と見なすのは誤りではなく，むしろ歴史的経緯として正しい整理です。

  - rubric: Pre-training / Fine-tuning の目的と利点を説明できる
    type: multichoice
    title: 007-06-事前学習の利点
    question: |
      事前学習＋精密調整（fine-tuning）の **主** たる利点として最も適切なのはどれか。
    choices:
      A: 下流タスクごとに 0 から学習するより教師データ量を減らせる
      B: モデルのパラメータ数を減らせる
      C: 学習率の最適値を自動で決定してくれる
      D: 勾配消失を完全に防げる
    answer: A
    feedback:
      A: 正解。講義の図では「タスクごとの教師データは小さめで済む」と説明されました。 [oai_citation:12‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      B: パラメータ数は変わらないことが多いです。
      C: 学習率は依然として手動設計が必要です。
      D: 勾配消失は深層学習一般の課題で，事前学習だけでは解決しません。

  - rubric: Fine-tuning の代表的な 2 つの流儀を区別できる
    type: multichoice
    title: 007-07-fine-tuning の流儀
    question: |
      Fine-tuning の典型的な 2 手法「①全パラメータ更新」「②最終層だけ学習」の説明として正しい対応はどれか。
    choices:
      A: ①=新規層のみ更新，②=全体を学習率小さく更新
      B: ①=全体を更新，②=新規層のみ更新
      C: ①=全体を凍結，②=新規層のみ更新
      D: ①=新規層のみ更新，②=最初の層だけ更新
    answer: B
    feedback:
      B: 正解。講義スライドでは「全体を追加学習」「新規層だけ再学習」が紹介されました。 [oai_citation:13‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      A,C,D: 説明と手法の対応が誤っています。

  - rubric: 表現学習の定義を口述できる
    type: truefalse
    title: 007-08-表現学習の定義
    question: |
      表現学習とは，入力データを**手動で設計した**特徴写像 $\varphi_\lambda$ に通したベクトルを学習するプロセスである。
    answer: false
    feedback:
      true: 手動設計と対照的に「自動的に学習する」点が表現学習の肝です。 [oai_citation:14‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      false: 正解。講義では「タスクに有用な中間表現を *自動的に* 学習すること」と定義されました。 [oai_citation:15‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)

  - rubric: オートエンコーダの目的関数を説明できる
    type: multichoice
    title: 007-09-再構成誤差
    question: |
      オートエンコーダが最小化する典型的な損失 $L(\theta)$ として最も標準的なのはどれか。
    choices:
      A: 負の対数尤度
      B: 再構成誤差 $\|x-D_\theta(E_\theta(x))\|^2$
      C: KL ダイバージェンス $D_{\mathrm{KL}}(p\|q)$
      D: ヒンジ損失 $\max(0,1-yf_\theta(x))$
    answer: B
    feedback:
      A,C,D: いずれもオートエンコーダでは代表的ではありません。
      B: 正解。講義では二乗再構成誤差が最も標準と紹介されました。 [oai_citation:16‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)

  - rubric: 活性値最大化（activation maximization）の考え方を説明できる
    type: multichoice
    title: 007-10-活性値最大化
    question: |
      ある中間ユニット $u_1$ の出力を最大化する入力 $\mathbf{x}^\*$ を求める最適化式として正しいものはどれか。
    choices:
      A: $\displaystyle \arg\min_{\mathbf x}u_1(\mathbf x)$
      B: $\displaystyle \arg\max_{\mathbf x}u_1(\mathbf x)$
      C: $\displaystyle \arg\max_{\theta}u_1(\mathbf x)$
      D: $\displaystyle \arg\min_{\theta}u_1(\mathbf x)$
    answer: B
    feedback:
      B: 正解。講義に示された式 $\max_{\mathbf x}u_1$ そのものです。 [oai_citation:17‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      A,C,D: 目的関数の向きや最適化変数が誤っています。

  - rubric: 深層学習が流行し得た背景を説明できる
    type: truefalse
    title: 007-11-深層学習が遅れた理由
    question: |
      講義では「深層学習が近年まで本格的に使われなかった理由」として，データ量不足と適切なアーキテクチャ探究の難しさが挙げられた。
    answer: true
    feedback:
      true: 正解。スライドで「データ量が少なかった」「アーキテクチャ探究に時間が掛かった」と説明されました。 [oai_citation:18‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      false: 上記 2 点は深層学習黎明期の主要課題として強調されています。

  - rubric: 早期停止が持つ 2 つの利点を理解している
    type: multichoice
    title: 007-13-早期停止の効果
    question: |
      早期停止 (early stopping) の利点として *講義で挙げられた* ２点の正しい組合せはどれか。
    choices:
      A: 学習時間の節約 ＆ モデル正則化
      B: 学習率自動調整 ＆ 精度向上
      C: メモリ使用量削減 ＆ 推論速度向上
      D: オーバーパラメータの削除 ＆ 勾配消失の防止
    answer: A
    feedback:
      A: 正解。時間の節約と正則化効果が示されました。 [oai_citation:20‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      B,C,D: 講義で強調されたポイントではありません。

  - rubric: Pre-training task の例として ImageNet が持つ役割を説明できる
    type: truefalse
    title: 007-14-ImageNet は下流タスク専用？
    question: |
      ImageNet 1000クラス分類は「画像系モデルの**事前学習**タスクの定番」として紹介された。
    answer: true
    feedback:
      true: 正解。スライドに「ImageNet が事前学習タスクの定番」と明記されています。 [oai_citation:21‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      false: 事前学習専用ではないものの，「定番」と紹介されたのは事実です。

  - rubric: 活性化関数 ReLU の導入動機を理解している
    type: multichoice
    title: 007-16-ReLU の利点
    question: |
      ReLU (Rectified Linear Unit) を中間層で採用する主な技術的メリットとして**講義内で暗示された**ものはどれか。
    choices:
      A: 勾配消失を和らげる
      B: パラメータ数を減少させる
      C: 勾配爆発を必ず防ぐ
      D: モデルの出力を確率に変換できる
    answer: A
    feedback:
      A: 正解。ReLU はシグモイド系より勾配を保ちやすい利点があります（資料の実験設定にも採用）。 [oai_citation:24‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      B: 層幅が同じならパラメータ数は変わりません。
      C: 勾配爆発は別の問題です。
      D: Softmax など最終層の話です。

  - rubric: He 初期化の目的を説明できる
    type: multichoice
    title: 007-17-He 初期化
    question: |
      He 初期化が特に有効とされる組合せはどれか。
    choices:
      A: ReLU 活性と深いネットワーク
      B: Sigmoid 活性と浅いネットワーク
      C: Softmax 活性と単層パーセプトロン
      D: 線形回帰モデル
    answer: A
    feedback:
      A: 正解。実験設定で ReLU + He 初期化が採用されていました。 [oai_citation:25‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      B,C,D: He の設計動機に合いません。

  - rubric: Adam 最適化の位置づけを説明できる
    type: truefalse
    title: 007-18-Adam は勾配法？
    question: |
      Adam は「慣性項（モーメンタム）を導入した確率的勾配法の一種」と講義で紹介された。
    answer: true
    feedback:
      true: 正解。スライド「最適化手法 Adam」での説明そのままです。 [oai_citation:26‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      false: Adam は勾配ベースです。

  - rubric: オートエンコーダでノイズを加える意味を説明できる
    type: multichoice
    title: 007-19-デノイジング AE
    question: |
      デノイジング・オートエンコーダが入力にノイズ $\eta$ を加えて学習する主眼は何か。
    choices:
      A: 計算時間短縮
      B: 潜在表現のロバスト化
      C: モデル容量削減
      D: 出力次元の削減
    answer: B
    feedback:
      B: 正解。講義で「ノイズを加えた入力から元のきれいなデータを復元」と説明されました。 [oai_citation:27‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      A,C,D: ノイズ投入の動機ではありません。

  - rubric: 階層的特徴抽出と「魔法の $\varphi$」の比喩を説明できる
    type: truefalse
    title: 007-20-魔法の φ
    question: |
      講義では「高次概念を抽出する魔法のような $\varphi$ を作れればよい」という比喩が用いられた。
    answer: true
    feedback:
      true: 正解。該当スライドでこの表現が使われました。 [oai_citation:28‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      false: 実際に登場した比喩です。

  # ---- ここから後半 10 問（21〜30）----

  - rubric: ImageNet 事前学習の汎用性に関する誤解を正す
    type: multichoice
    title: 007-21-ImageNet は万能？
    question: |
      ImageNet 事前学習モデルを**そのまま**転移した際に**必ず**起こると誤って語られがちな現象はどれか。
    choices:
      A: 全タスクで即座に SOTA を達成できる
      B: 最終層がタスク特化である
      C: 浅い層が一般的なエッジ検出器になる
      D: Fine-tuning なしでも教師データが不要になる
    answer: A
    feedback:
      A: 正解（誤解）。講義では「Fine-tuning が一般的」と説明され，万能ではない点が示されました。 [oai_citation:29‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      B,C は事実であり得ます。D は誇張です。

  - rubric: Fine-tuning で層の凍結 (freeze) を行う意図を説明できる
    type: truefalse
    title: 007-22-層の凍結は正則化？
    question: |
      層を凍結 (freeze) する主な狙いは，下流タスクのデータが少ない場合に過学習を抑えることである。
    answer: true
    feedback:
      true: 正解。パラメータ数の一部を固定し，過適合を抑える実践的目的があります。 [oai_citation:30‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      false: その狙いで用いられることが多いです。

  - rubric: 深層モデルの最適化難易度に関する理解を問う
    type: multichoice
    title: 007-23-最適化の課題
    question: |
      深層モデルの最適化が「高難易度」とされる理由として**講義で示された**ものはどれか。
    choices:
      A: 勾配が計算できない
      B: 最適化の工夫が多数必要
      C: 線形モデルよりパラメータが少ない
      D: 現在は勾配法が全く使われない
    answer: B
    feedback:
      A,D: 計算も勾配法も **使われています**。 [oai_citation:31‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      B: 正解。「最適化は大変，多くの工夫を要する」と説明されました。 [oai_citation:32‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      C: パラメータはむしろ多いです。

  - rubric: 再構成誤差の損失で教師なし学習が成立する理由を説明できる
    type: truefalse
    title: 007-24-教師なしの根拠
    question: |
      オートエンコーダは再構成誤差だけで学習できるため，**ラベルデータが不要**である。
    answer: true
    feedback:
      true: 正解。入力自体がターゲットなのでラベル不要です。 [oai_citation:33‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      false: ラベルは必要ありません。

  - rubric: 活性値最大化の「入力を最適化する」という視点を理解している
    type: truefalse
    title: 007-25-入力最適化の意味
    question: |
      活性値最大化では，**重み $\theta$ を固定**して入力 $\mathbf x$ を最適化する。
    answer: true
    feedback:
      true: 正解。目的は「そのユニットが好む入力」を可視化することです。 [oai_citation:34‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      false: 変数は入力側です。

  - rubric: 中間表現の「汎用性とタスク特化の線引きがない」点を説明できる
    type: truefalse
    title: 007-26-線引きなし
    question: |
      「どの層までが汎用でどこからタスク特化かという明確な線引きはない」
      これは講義スライド中の注釈①である。
    answer: true
    feedback:
      true: 正解。注釈①でこの点が明示されました。 [oai_citation:35‡第7回.pdf](file-service://file-3i8ttqaJSfSQspSTshfBh6)
      false: 実際に注釈として示されています。

  - rubric: 非構造化データ処理で「階層性」が鍵となる直観を説明できる
    type: multichoice
    title: 007-27-階層性が鍵
    question: |
      非構造化データのタスクで階層性が「鍵」となる理由として最も適切なのはどれか。
    choices:
      A: 入力の次元数が常に固定だから
      B: 低次情報を統合して高次概念を抽出する必要があるから
      C: 画像は RGB の 3 チャネルしかないから
      D: モデルのパラメータを減らすため
