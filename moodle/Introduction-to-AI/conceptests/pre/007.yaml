  - rubric: Forward モードと Reverse モード AD の違いを説明できる
    type: multichoice
    title: 007-15A-2つのモード
    question: |
      スカラー出力 $f:\mathbb{R}^n\!\to\!\mathbb{R}$ の勾配 $\nabla_{\mathbf x}f$ を計算する際、
      Forward モード AD と Reverse モード AD の計算コストを比較するとどうなるか。
    choices:
      A: Forward は $\mathcal O(n)$、Reverse は $\mathcal O(1)$
      B: Forward は $\mathcal O(1)$、Reverse は $\mathcal O(n)$
      C: 両者とも常に $\mathcal O(n)$
      D: Forward が $\mathcal O(n)$、Reverse も $\mathcal O(n^2)$
    answer: A
    feedback:
      A: **正解。** 変数数 $n$ に対して Forward は１回の前進で１方向、逆モードは１回で全成分を得られるのでスカラー出力なら $\mathcal O(1)$。
      B: 逆です。
      C: コストはモードによって異なります。
      D: Reverse が二乗になるわけではありません。

  - rubric: AD と数値差分の本質的違いを説明できる
    type: multichoice
    title: 007-15B-AD vs 数値差分
    question: |
      自動微分 (AD) を数値差分（有限差分）と比較したとき、**AD だけが** 持つ決定的な利点はどれか。
    choices:
      A: 微分計算に乱数を用いない
      B: 解析的に導出した厳密な勾配と丸め誤差レベルで一致する
      C: 勾配を並列計算できる
      D: 一般に計算グラフを書き換える必要がない
    answer: B
    feedback:
      A: 数値差分も乱数は使いません。
      B: **正解。** AD は数値誤差の蓄積がなく、理論的に厳密な勾配を返します（丸め誤差のみ）。
      C: 並列化はどちらも可能。
      D: 数値差分も実装修正は要りません。

  - rubric: Reverse モード AD のメモリ使用を理解している
    type: truefalse
    title: 007-15C-メモリと逆モード
    question: |
      Reverse モード AD では、順方向の計算で生成した **すべての中間値** を保存しておかなければ
      正確な勾配を計算できない。
    answer: true
    feedback:
      true: **正解。** 逆伝播時に各ノードの局所微分を参照するため、中間値は原則保持が必要（チェックポイント法で部分的に捨てる工夫もある）。
      false: 中間値を保持しないと多くの場合再計算が必要で計算量か精度を損ないます。

  - rubric: 非微分可能点での AD の振る舞いを説明できる
    type: multichoice
    title: 007-15D-非微分点
    question: |
      活性化関数 $h(x)=\max(0,x)$（ReLU）の $x=0$ で AD フレームワークが返す勾配として
      **最も一般的** な挙動はどれか。
    choices:
      A: 0 を返す
      B: 1 を返す
      C: エラーを投げる
      D: 実装に依存して 0 または 1 のどちらか
    answer: A
    feedback:
      A: **正解。** 多くの実装は subgradient の 0 を返す（PyTorch, TensorFlow 等）。
      B: Leaky-ReLU での斜面誤解と混同。
      C: ランタイムエラーにはしません。
      D: 標準実装では決め打ちで 0。

  - rubric: Jacobian–vector と Vector–Jacobian の区別を説明できる
    type: multichoice
    title: 007-15E-Jv と vJ
    question: |
      $f:\mathbb{R}^n\!\to\!\mathbb{R}^m$ のヤコビアン $J_f(\mathbf x)\!\in\!\mathbb{R}^{m\times n}$
      に対し、Forward モード AD と Reverse モード AD で自然に得られる演算の組み合わせはどれか。
    choices:
      A: Forward は $\mathbf v^\top\!J_f$、Reverse は $J_f\mathbf v$
      B: Forward は $J_f\mathbf v$、Reverse は $\mathbf v^\top\!J_f$
      C: 両者とも $J_f\mathbf v$
      D: 両者とも $\mathbf v^\top\!J_f$
    answer: B
    feedback:
      B: **正解。** 前進は Jacobian–vector product (Jv), 逆モードは Vector–Jacobian product (vJ) を１回で計算できます。
      A: 向きが逆。
      C,D: モードで区別がつきません。

  - rubric: 手計算・数値差分・自動微分の位置づけを区別できる
    type: multichoice
    title: 007-15F-３つの勾配計算法
    question: |
      次のうち，**自動微分だけ** が同時に満たす特徴はどれか。
      1. 再現性のある厳密な勾配（丸め誤差のみ）
      2. 実行時にアルゴリズム的に導出され，人手による数式変形が不要
      3. 高次導関数（２階以上）の計算がそのまま拡張で可能
    choices:
      A: 手計算による解析的微分
      B: 有限差分（数値差分）
      C: 自動微分
      D: いずれも満たさない
    answer: C
    feedback:
      A: 手計算は 1 を満たすが 2 を満たさない。
      B: 有限差分は 2 を満たすが 1 を満たさない（近似誤差が入る）。
      C: **正解。** 自動微分のみが 1・2・3 を同時に満たす。

  - rubric: 計算グラフの各ノードが担う役割を説明できる
    type: truefalse
    title: 007-15G-ノードの意味
    question: |
