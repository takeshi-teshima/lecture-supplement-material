      D: 穏健からリベラル方向へのシフト
    answer: C
    feedback:
      A: 報告されています。
      B: 報告されています。
      C: 正解。むしろ高収入寄りに。
      D: 報告されています。

  # ------------- Training Pipeline (21–30) -----------
  - rubric: Instruction Tuning の目的を説明できる
    type: truefalse
    title: 013-22-指示適合化の目的
    question: |
      Instruction Tuning の主目的はモデルにタスク固有の入出力フォーマットを覚えさせることである。
    answer: false
    feedback:
      true: 入出力形式だけでなく “指示に従う振る舞い全般” を学習させることが目的です。
      false: 正解です。

  - rubric: Preference Tuning と RLHF の工程を列挙できる
    type: multichoice
    title: 013-23-RLHF 工程
    question: |
      RLHF 手順の **正しい順序** はどれか。
      (α) 報酬モデル学習
      (β) 人間ランキング収集
      (γ) 方策モデル更新
    choices:
      A: β → γ → α
      B: α → β → γ
      C: β → α → γ
      D: γ → β → α
    answer: C
    feedback:
      A: 報酬モデルより先に方策更新はできません。
      B: 報酬モデル用データが先に要ります。
      C: 正解です。
      D: 順序が逆です。

  - rubric: RLVR と RLHF の違いを説明できる
    type: truefalse
    title: 013-24-RLVR の報酬
    question: |
      RLVR では報酬が “検証可能 (verifiable)” であり、人間主観のランキングを必要としない。
    answer: true
    feedback:
      true: 正解。数学正答率など機械評価可能報酬を用います。
      false: 人間主観を要する RLHF とは異なります。

  - rubric: DPO が報酬モデルをバイパスする仕組みを説明できる
    type: multichoice
    title: 013-25-DPO の本質
    question: |
      DPO が RLHF と比べて **優位になる可能性が高い理由** はどれか。
    choices:
      A: KL 正則化項が完全に不要になる
      B: 報酬モデル推定のハイパーパラメーターが不要
      C: 方策勾配推定がなくなるためサンプル効率が悪化
      D: 人間ランキングが不要になる
    answer: B
    feedback:
      A: KL 項は暗黙的に含まれます。
      B: 正解。ハイパーが減り学習安定。
      C: 悪化ではなく改善が報告。
      D: ランキングは依然必要です。

  - rubric: Alignment Tax の緩和策を理解している
    type: truefalse
    title: 013-26-Alignment Tax 緩和
    question: |
      Alignment Tax を抑える一手法は、RLHF の損失に事前学習の言語モデル損失を混合することである。
    answer: true
    feedback:
      true: 正解。事前知識の忘却を防ぎます。
      false: 緩和策として実用されています。

  - rubric: 指示チューニング用データの規模効果を説明できる
    type: multichoice
    title: 013-27-LIMA の示唆
    question: |
      LIMA (Zhou et al., 2023) が示した最小データ指示チューニングの教訓として正しいものはどれか。
    choices:
      A: 1 万件未満では性能向上しない
      B: 丁寧に選んだ 1 千件でも高性能になり得る
      C: RLHF が必須である
      D: データ多様性より量が重要
    answer: B
    feedback:
      A: 反証例が LIMA です。
      B: 正解。
      C: 必須ではありません。
      D: 量より質が重要という示唆です。

  - rubric: 15 % Mask 率の起源と現在の知見を説明できる
    type: multichoice
    title: 013-28-15 % Mask
    question: |
      BERT 系で Mask 率 15 % が採用された理由として最も近いのはどれか。
    choices:
      A: 理論解析により最適と証明
      B: 文脈情報と学習シグナルの折衷という経験則
      C: GPU メモリ上限による制約
      D: 15 という素数の縁起
    answer: B
    feedback:
      B が正解。経験則です。

  - rubric: RLHF の KL 正則化の役割を理解している
    type: truefalse
    title: 013-29-KL 正則化
    question: |
      RLHF で KL ダイバージェンスを用いる主目的は、新方策が参照方策からの過度な乖離を防ぐことである。
    answer: true
    feedback:
      true: 正解。
      false: 乖離抑制が主目的です。

  - rubric: RLHF の勾配推定法を区別できる
    type: multichoice
    title: 013-30-REINFORCE vs PPO
    question: |
      PPO が REINFORCE より実務で好まれる主な理由はどれか。
    choices:
      A: 対数勾配が不要で計算が簡便
      B: ステップサイズを信頼領域で制御し学習安定
      C: 事前学習損失を同時に最適化できる
      D: サンプル収集を行わずバッチ内のみで完結
    answer: B
    feedback:
      A: ログ勾配は使います。
      B: 正解。
      C: それは追加項です。
      D: サンプル収集は必要。

  # ------------- Agents & Tools (31–35) -------------
  - rubric: Tool Invocation マッチング実装上の注意を説明できる
    type: multichoice
    title: 013-31-正規表現抽出
    question: |
      ツール呼び出し文字列を抽出する実装で **誤り** はどれか。
    choices:
      A: 正規表現で JSON をパースする
      B: 出力ストリームを逐次監視して即時実行
      C: args 部分を別途 JSON.parse で解析
      D: name キーだけでツール選択し args を無視
    answer: D
    feedback:
      D は危険。args 無視で誤実行します。

  - rubric: ReAct ループが提供する利点を説明できる
    type: truefalse
    title: 013-32-ReAct の利点
    question: |
