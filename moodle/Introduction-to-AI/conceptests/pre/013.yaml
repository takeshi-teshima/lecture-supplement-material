Quizzes:

  - rubric: Emergent Ability の閾値的性質を理解している
    type: truefalse
    title: 013-02-創発能力は連続的？
    question: |
      パラメーター数が徐々に増えるにつれ、タスク性能も滑らかに向上し、臨界点のような急激な性能変化は観測されない。
    answer: false
    feedback:
      true: 創発的能力は「量的変化が質的飛躍を生む」という報告があり、滑らかとは限りません。
      false: 正解です。Wei et al. が報告したように閾値的な跳ね上がりが見られます。

  - rubric: スケーリング則と “Alignment Tax” の関係を説明できる
    type: multichoice
    title: 013-03-Alignment Tax
    question: |
      Alignment Tax を最も適切に説明しているのはどれか。
    choices:
      A: アラインメントするとモデル容量が物理的に減少する追加コスト
      B: RLHF などで下流性能が低下することに伴う “損失”
      C: チューニング時に GPU メモリが増えるための電力課税
      D: Prompt 長が伸び推論コストが上がる経済的税
    answer: B
    feedback:
      A: 容量が減るわけではありません。
      B: 正解。RLHF で事前学習タスクを忘れる等の性能低下を指します。
      C: 電力税の話ではありません。
      D: プロンプト長課税は別概念です。

  - rubric: パラメーターとデータの大規模化が脳ニューロン数と比べてどの程度かを概算できる
    type: multichoice
    title: 013-04-脳との比較オーダー
    question: |
      スライドに示された「LLM のパラメーター数と人間脳ニューロン数比較」の説明として **最も正しい** ものはどれか。
    choices:
      A: LLM のパラメーター数は人間のニューロン数の約 1/100 である。
      B: 両者はオーダーが近いが機能単位が異なるため単純比較は無意味。
      C: LLM はニューロン数で既に人間を 10 倍以上上回っている。
      D: パラメーターはニューロンと同義なのでほぼ同じ性能を示す。
    answer: B
    feedback:
      A: 実際は 1/100 ではなく同オーダーです。
      B: 正解。数量は近いが機能差ゆえ直接比較できません。
      C: 10 倍以上ではありません。
      D: パラメーター≠ニューロンで性能も同等ではありません。

  - rubric: Prompt 内例示数と性能の関係を説明できる
    type: truefalse
    title: 013-05-Few-shot が常に最適？
    question: |
      少数事例プロンプティングでは、例示数を増やせば増やすほど必ずタスク性能が単調に向上する。
    answer: false
    feedback:
      true: 単調向上とは限らず、長すぎるプロンプトで逆効果も報告されています。
      false: 正解。効果はタスクやモデルに依存し、メモリ制限やオーバーフィッティングも起こり得ます。

  # --- Prompt Engineering -------------------------------------------------
  - rubric: Zero-shot と Zero-shot CoT の違いを説明できる
    type: multichoice
    title: 013-06-Zero-shot vs Zero-shot CoT
    question: |
      “Let’s think step by step.” を追加することで性能が向上する理由として **適切でない** ものはどれか。
    choices:
      A: モデルに推論過程を生成させ自己整合性を高められる
      B: 出力トークン数が増え温度が事実上下がる
      C: Chain-of-Thought の学習シグナルが強まる
      D: プロンプト長が一定なら計算コストは変わらない
    answer: D
    feedback:
      A: 適切です。
      B: 一因になり得ます。
      C: 適切です。
      D: 正解。トークン増加で計算コストも増えます。

  - rubric: CoT の例示が逆効果になり得るケースを理解している
    type: multichoice
    title: 013-07-CoT 例示の罠
    question: |
      Chain-of-Thought 例示が性能を下げる可能性が高い状況はどれか。
    choices:
      A: 例示タスクと本番タスクが同一形式
      B: 例示が誤答を含みモデルが模倣する
      C: 例示が短すぎて情報量が不足
      D: 例示が多様で一般化を促す
    answer: B
    feedback:
      A: 問題ありません。
      B: 正解。誤答例を模倣し性能低下します。
      C: 情報不足でも極端に悪影響とは限りません。
      D: 多様性はむしろプラスです。

  - rubric: Prompt Injection と Alignment の関係を説明できる
    type: truefalse
    title: 013-08-Prompt Injection
    question: |
      Prompt Injection 攻撃は Alignment‐HHH の “Honest” 目標とは無関係である。
    answer: false
    feedback:
      true: 不正確です。Injection 攻撃は虚偽誘導を助長し “Honest” を脅かします。
      false: 正解です。

  # --- Reasoning Models ---------------------------------------------------
  - rubric: Parallel Sampling+Verification の構造を説明できる
    type: multichoice
    title: 013-10-並列生成と検証
    question: |
      “Parallel Sampling + Verification” 戦略で **誤っている** 手順はどれか。
    choices:
      A: 複数候補を独立に生成する
      B: 各候補に検証モデルでスコアを付け最良を選ぶ
      C: 最良候補を入力として再帰的に追加候補を生成する
      D: 思考トークンを用いることで検証コストが上がる
    answer: C
    feedback:
      A: 正しいステップです。
      B: 正しいステップです。
      C: 正解。再帰的生成はこの戦略の必須要素ではありません。
      D: 正しい。検証用計算が増えます。

  - rubric: Tree-of-Thought (ToT) の枝刈り戦略を理解している
    type: truefalse
    title: 013-11-ToT の枝刈り
    question: |
      Tree-of-Thought では各ノードに確率ではなくヒューリスティックなスコアを割り当てて枝刈りしても良い。
    answer: true
    feedback:
      true: 正解。確率に限らず評価関数で枝刈り可能です。
      false: 確率スコアに限定されません。

  - rubric: 推論時スケーリングと訓練時スケーリングの対比を説明できる
    type: multichoice
    title: 013-12-Compute Allocation
    question: |
      “推論時に計算をかける vs 訓練時に計算をかける” の比較として **適切でない** ものはどれか。
    choices:
      A: 推論時スケーリングはサービス運用コストを高める
      B: 訓練時スケーリングだけでは創発能力を引き出せない場合がある
      C: 推論時スケーリングはモデルパラメーターを増やす手法である
      D: 訓練時スケーリングは再訓練が必要でデプロイが遅い
    answer: C
    feedback:
      A: 正しい記述。
      B: 正しい記述。
      C: 正解。パラメーター増ではなく計算ステップ増。
      D: 正しい記述。

  - rubric: ReAct ループの Thought/Action/Observation の順序を理解している
    type: multichoice
    title: 013-13-ReAct ループ
    question: |
      ReAct フレームワークにおける 1 サイクルの正しい順序はどれか。
    choices:
      A: Action → Thought → Observation
      B: Thought → Observation → Action
      C: Thought → Action → Observation
      D: Observation → Thought → Action
    answer: C
    feedback:
      A: 誤順序。
      B: Observation は Action の後です。
      C: 正解です。
      D: 最初に Observation は来ません。

  - rubric: Tool Invocation JSON を生成させるプロンプト設計を説明できる
    type: truefalse
    title: 013-14-ツール呼び出し JSON
    question: |
      エージェントが {name:"search_web",args:{query:"..."}} の形式を出力するよう促すには、システムプロンプトにその JSON スキーマを含めておく方法が一般的である。
    answer: true
    feedback:
      true: 正解。事前にフォーマットを明示しパターンマッチで実行させます。
      false: スキーマを示さなければ合致する文字列を出力しません。

  - rubric: CLIP の対照学習目的を説明できる
    type: multichoice
    title: 013-15-CLIP 損失の目的
    question: |
      CLIP で Softmax 温度 $\alpha$ 付きコサイン類似度行列に損失を掛ける主目的はどれか。
    choices:
      A: 同一画像–テキスト対の類似度を最大化し非対を最小化する
      B: 画像だけの自己再構成誤差を減らす
      C: テキストの言語モデル損失を最小化する
      D: 画像の拡散ノイズを学習する
    answer: A
    feedback:
      A: 正解。対照学習でペアリングを強調します。
      B: 自己再構成は VAE 系です。
      C: 言語モデル損失ではありません。
      D: 拡散は別手法です。

  # ------------- Multimodal (16–20) -----------------
  - rubric: ユニモーダル vs マルチモーダルの定義を理解している
    type: truefalse
    title: 013-16-ユニモーダル判定
    question: |
      “画像キャプション生成” は入力が画像，出力がテキスト 1 モダリティずつなのでユニモーダルに分類される。
    answer: false
    feedback:
      true: 入出力が異なるモダリティなのでクロス／マルチモーダルです。
      false: 正解です。

  - rubric: Transfusion の Early-Fusion 概要を説明できる
    type: multichoice
    title: 013-17-Transfusion Early Fusion
    question: |
      Transfusion が “画像パッチ＋テキストトークンを統一埋め込みで処理” する際の **誤り** はどれか。
    choices:
      A: 画像は VAE 符号化器で潜在変換される
      B: 画像潜在を固定長パッチに分割する
      C: パッチ列はテキストトークンと同じトークン種として扱う
      D: 画像はピクセル空間のまま CNN で別処理してから融合する
    answer: D
    feedback:
      D は Early-Fusion ではありません。他は概略正しい。

  - rubric: HHH フレームの各要素の例を挙げられる
    type: multichoice
    title: 013-18-HHH 具体例
    question: |
      “Honest” 目標の具体例として最も適切なのはどれか。
    choices:
      A: 有害指示を拒否する
      B: 不確かな質問に確率や根拠の提示を伴う
      C: ユーザーの作業を短時間で終わらせる
      D: 出力を常に 50 トークン以内に収める
    answer: B
    feedback:
      A: これは Harmless 領域です。
      B: 正解。誠実さ＝根拠・不確実性表明。
      C: Helpful の例。
      D: 目標とは直接関係ありません。

  - rubric: 幻覚 (Hallucination) と Confabulation の区別を理解している
    type: truefalse
    title: 013-19-幻覚 vs 捏造
    question: |
      スライドでは “Hallucination” という語より “Confabulation” がより正確と指摘されている。
    answer: true
    feedback:
      true: 正解。Emsley (2023) などが指摘しています。
      false: 指摘済みの用語区分を誤っています。

  - rubric: Bias 評価研究の主張を説明できる
