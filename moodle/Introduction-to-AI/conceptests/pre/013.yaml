    answer: C
    feedback:
      C: 正解。順序情報が本質です。

  - rubric: Chinchilla スケーリング則と計算予算のトレードオフを説明できる
    type: multichoice
    title: 013-02-スケーリング則の誤解
    question: |
      Chinchilla スケーリング則はトランスフォーマー型のモデルに関する経験則であり，
      CNNなどのアーキテクチャには適用できない．

  - rubric: CoTの効果
    type: multichoice
    title: 013-02-CoTの効果
    question: |
      Chain-of-Thought (CoT) の効果に関する説明のうち，**正しい** のはどれか．
    choices:
      A: CoT は常に全てのタスクで性能を向上させる。
      B: CoT は特に論理的推論タスクで有効である。
      C: CoT はモデルのパラメーター数を増やす必要がある。
      D: CoT はトレーニング時にのみ有効であり、推論時には効果がない。
    answer: B
    feedback:
      A: CoT は全てのタスクで効果的ではありません。
      B: 正解。CoT は特に論理的推論タスクで有効です。
      C: CoT は必ずしもパラメーター数を増やす必要はありません。
      D: CoT は推論時にも効果があります。

  - rubric: 思考トークン追加が性能に与える影響を定性的に説明できる
    type: multichoice
    title: 013-09-Thinking Token 数
    question: |
      思考トークンを増やす “Test-time Compute Scaling” の **主な利点** はどれか。
    choices:
      A: パラメーター数削減と同等の効果
      B: サンプリング多様化と自己検証を通じた誤り低減
      C: 出力速度を高速化できる
      D: GPU メモリ消費を減少させる
    answer: B
    feedback:
      A: 削減効果ではありません。
      B: 正解。探索と検証で精度向上が報告。
      C: 速度はむしろ低下。
      D: 消費は増加します。

  - rubric: 思考モデルがあくまでも言語モデルであることを理解している
    type: multichoice
    title: 013-09-Thinking models
    question: |
      思考モデルに関する説明のうち，誤っているのは次のうちどれか．
    choices:
      A: 思考モデルの出現により，自律的なエージェントを作ることが可能になった．

  - rubric: エージェントの実現の仕組みの理解
    type: multichoice
    title: 013-09-LLM-Agents
    question: |
      大規模言語モデルから作られる自律エージェントに関する説明のうち，正しいのは次のうちどれか．
    choices:
      A: エージェントは自身のソースコードを書き換えることによってタスクを設定し直している．
      B: エージェントは，特定の形式に則ったトークン出力をすることにより，外部ツールの呼び出しを行えるようにされることが多い．
      C: 外部ツールの呼び出しを伴わない場合は，自律エージェントとはみなされない．
      D: エージェントは常に人間の監視下で動作する．
    answer: B
    feedback:
      A: ソースコードの書き換えは一般的ではありません．
      B: 正解．特定の形式に則ったトークン出力が重要です．
      C: 自律エージェントは外部ツールの呼び出しを伴うことが多いですが，必ずしも必要ではありません．
      D: 人間の監視下で動作することは必ずしも必要ではありません．

  - rubric: 思考トークン追加が性能に与える影響を定性的に説明できる
    type: multichoice
    title: 013-04-思考トークン
    question: |
      思考トークンを増やす “Test-time Compute Scaling” の **主な利点** はどれか。
    choices:
      A: パラメーター数削減と同等の効果
      B: サンプリング多様化と自己検証を通じた誤り低減
      C: 出力速度を高速化できる
      D: GPU メモリ消費を減少させる
    answer: B
    feedback:
      A: パラメーターを減らせるわけではありません。
      B: **正解**。探索幅を広げ検証で精度を向上できます。
      C: 思考トークンが増えれば推論時間はむしろ延びます。
      D: トークン数増でメモリも増大します。
