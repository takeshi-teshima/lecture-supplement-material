    answer: true
    feedback:
      true: 正解。Thought ログが可視化されます。
      false: 視認性向上は利点です。

  - rubric: Parallel ツール呼び出しの競合管理を説明できる
    type: multichoice
    title: 013-33-ツール競合
    question: |
      複数ツールを並列呼び出し可能なエージェント設計で必要な対策はどれか。
    choices:
      A: 出力トークン同士のミューテックス
      B: ツール実行キューと非同期コールバック
      C: GPU Warp 同期
      D: ユーザー認証トークンのハードコード
    answer: B
    feedback:
      B が適切な一般的対策です。

  - rubric: エージェントが “タスク定義自動生成” で得るメリットを説明できる
    type: truefalse
    title: 013-34-タスク自律設計
    question: |
      エージェントが自律的にタスク定義を行うことで、ユーザーは入出力仕様を詳細設計する手間を軽減できる。
    answer: true
    feedback:
      true: 正解。
      false: これは主なメリットです。

  - rubric: 思考の木 (ToT) と ReAct の補完関係を説明できる
    type: multichoice
    title: 013-35-ToT vs ReAct
    question: |
      ToT と ReAct を組み合わせる意義として適切なのはどれか。
    choices:
      A: ToT はツール呼び出し数を削減できる
      B: ReAct の Thought を ToT のノード評価関数に流用できる
      C: ReAct は木探索を必ず深さ優先にする
      D: ToT はツール呼び出しを禁止する枠組み
    answer: B
    feedback:
      B が正解。

