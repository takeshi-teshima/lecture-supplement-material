    answer: true
    feedback:
      true: 正解。複数フォーマットの一例です。
      false: 実際に採用されている形式です。


  - rubric: Chinchilla スケーリング則と計算予算のトレードオフを説明できる
    type: multichoice
    title: 013-01-チンチラ則の誤解
    question: |
      チンチラ・スケーリング則に関して **誤っている** 主張はどれか。
      1. 計算量が一定なら $P$ と $D$ を均衡させるのが最適である。
      2. 語彙埋め込みのパラメーターは通常 $P$ に含めない。
      3. この則は RNN や CNN でも同様に経験的に成り立つ。
      4. 事前学習損失の経験則であり下流性能と完全に同一ではない。
    choices:
      A: 1
      B: 2
      C: 3
      D: 4
    answer: C
    feedback:
      A: 正解ではありません。計算量制約下での均衡はチンチラ論文の結論です。
      B: 正解ではありません。論文では埋め込みを除外して報告します。
      C: 正解。報告はトランスフォーマーに限定され、他モデルへの一般化は保証されません。
      D: 正解ではありません。下流性能と強い相関はあるが同一ではない点に注意します。

Quizzes:
