Quizzes:
  - rubric: 学習戦略の 3 区分を説明できる．
    type: multichoice
    title: 010-01-学習戦略の分類
    question: |
      類似度学習における「学習戦略」の説明として **不適切なもの** はどれか。
    choices:
      A: 分類ラベルを用いて，クラス間の距離が広がるように学習する方法
      B: 類似・非類似の 2 値ラベルのみを用いて学習する方法
      C: 入力データから擬似ラベルを自動生成して学習する方法
      D: クラスラベルをまったく使わず，ランダムノイズのみを入力として学習する方法
    answer: D
    feedback:
      A: 正解ではありません．分類ラベルを利用する有効な戦略です．
      B: 正解ではありません．これは「類似度ラベル」を用いる戦略です．
      C: 正解ではありません．これは自己教師付き学習に該当します．
      D: 正解です．ランダムノイズだけでは類似度の学習信号が得られません．

  - rubric: 類似度ラベル収集の利点を理解している．
    type: truefalse
    title: 010-02-類似度ラベルの収集コスト
    question: |
      「同一人物かどうか」の 2 値ラベルを付ける作業は，「人物ごとにクラス ID を付与する」よりも一般に安価で済む。
    answer: true
    feedback:
      true: 正解です．2 値判断はクラス分けより作業負荷が小さい場合が多いです．
      false: クラス ID の付与は，高精度な識別が必要なため一般に高コストです．

  - rubric: 対照学習での負例混入を説明できる．
    type: truefalse
    title: 010-04-負例混入の許容
    question: |
      ミニバッチ内に実は「正例」となるべき類似画像が偶然含まれていても，バッチサイズが十分大きければ学習は成立しやすい。
    answer: true
    feedback:
      true: 正解です．少数ノイズは統計的に希釈され性能に大きく影響しません．
      false: 大きなバッチはノイズ影響を相対的に小さくします．

  - rubric: コサイン類似度の値域を理解している．
    type: multichoice
    title: 010-05-コサイン類似度の範囲
    question: |
      ベクトル \(u,v\) に対しコサイン類似度 \(\mathrm{cos}(u,v)\) の取り得る値域はどれか。
    choices:
      A: \([-1,1]\)
      B: \([0,1]\)
      C: \([0,\infty)\)
      D: \((-\infty,\infty)\)
    answer: A
    feedback:
      A: 正解です．\(-1\) は逆向き，\(1\) は同方向です．
      B: 負の相関を取れないため誤りです．
      C: コサイン値は無限大にはなりません．
      D: 内積の取り得る範囲と混同しています．

  - rubric: 温度パラメータの定性的影響を説明できる．
    type: truefalse
    title: 010-06-温度と分布の鋭さ
    question: |
      Softmax に温度 \(T>1\) を掛けると出力確率分布は **より平坦** になる。
    answer: true
    feedback:
      true: 正解です．大きな温度は指数項を割り算し尖りを弱めます．
      false: \(T>1\) は分布を鋭くするのではなく平坦化します．

  - rubric: 温度パラメータの定量的比較ができる．
    type: multichoice
    title: 010-07-温度の大小比較
    question: |
      ロジット \(\mathbf z=(1,0,0)\) に対し，温度 \(T=0.5\) と \(T=2\) を適用した Softmax 出力の最大成分値の大小関係はどれか。
    choices:
      A: \(T=0.5\) の方が大きい
      B: \(T=2\) の方が大きい
      C: 同じ
      D: 温度とは無関係
    answer: A
    feedback:
      A: 正解です．小さい温度は分布を尖らせ最大確率を高めます．
      B: 逆です．大きい温度は平坦化します．
      C: 温度依存性を無視しています．
      D: 温度は Softmax に直接影響します．

  - rubric: 1:N 認証で類似度学習が有利な理由を説明できる．
    type: multichoice
    title: 010-08-オープンセット認証
    question: |
      類似度学習を用いた顔認証が「新規ユーザ追加」を容易にする主因はどれか。
    choices:
      A: クラス分類ではなく距離計算だけで照合できる
      B: モデルパラメータが自動で増殖するため
      C: 類似度学習モデルはバッチ正規化を使わないため
      D: 顔画像は必ず高解像度であるため
    answer: A
    feedback:
      A: 正解です．新ユーザは埋め込みベクトルを登録するだけで対応可能です．
      B: パラメータが増殖するわけではありません．
      C: 正規化層の有無は本質ではありません．
      D: 解像度は議論のポイントではありません．

  - rubric: フラット化が空間情報を失うことを説明できる．
    type: multichoice
    title: 010-10-フラット化の弊害
    question: |
      画像を 1 次元ベクトルにフラット化してから全結合層のみで処理する際の **主な欠点** はどれか。
    choices:
      A: 計算量が指数的に増える
      B: ピクセル間の空間的隣接関係が失われる
      C: 画像サイズが自動的に可変になる
      D: 畳み込みよりも必ず精度が高くなる
    answer: B
    feedback:
      A: 計算量は増えますが指数的ではありません．
      B: 正解です．構造が無視され特徴抽出が困難になります．
      C: サイズ可変化は自動では起きません．
      D: 精度が高くなるとは限りません．

  - rubric: テンソル用語を区別できる．
    type: multichoice
    title: 010-11-テンソルの次数
    question: |
      縦ベクトルはテンソルの次数で表すと何次に分類されるか。
    choices:
      A: 0 次（スカラー）
      B: 1 次
      C: 2 次
      D: 3 次
    answer: B
    feedback:
      A: スカラーは 0 次です．
      B: 正解です．ベクトルは 1 次テンソルに当たります．
      C: 行列は 2 次です．
      D: 3 次は立方体状データです．

  - rubric: 畳み込みと相互相関の違いを指摘できる．
    type: truefalse
    title: 010-12-畳み込みか相互相関か
    question: |
      数学的に厳密な「畳み込み」はカーネルを左右反転させるが，CNN で実装される演算はしばしば反転せずに用いられる。
    answer: true
    feedback:
      true: 正解です．実装上は相互相関ですが慣例で畳み込みと呼びます．
      false: CNN で反転を省くため純粋な畳み込みとは異なります．

  - rubric: 多チャネル畳み込みのカーネル形状を説明できる．
    type: multichoice
    title: 010-13-多チャネルカーネル
    question: |
      RGB 入力 (3 チャンネル) を 1 枚の特徴マップに変換する畳み込みカーネルの **形状** として正しいのはどれか（カーネル高 \(h\)，幅 \(w\)）。
    choices:
      A: \((h,w)\)
      B: \((h,w,1)\)
      C: \((h,w,3)\)
      D: \((h,w,3,3)\)
    answer: C
    feedback:
      A: チャンネル軸が欠けています．
      B: 1 チャンネル分しか扱えません．
      C: 正解です．深さが入力チャネル数と一致します．
      D: 出力チャネルまで含み冗長です．

  - rubric: パディング無し畳み込みで出力が縮小することを説明できる．
    type: truefalse
    title: 010-14-サイズ縮小
    question: |
      パディングを行わない 3×3 畳み込み層は，入力画像の各辺を 1 ピクセルずつ短くしたサイズの出力を生成する。
    answer: true
    feedback:
      true: 正解です．カーネル幅−1 に相当する 2 ピクセルを両端で分け合うため各辺 1 ピクセル短くなります．
      false: 「2 ピクセルずつ短くなる」は誤りで，各辺 1 ピクセル減少です．

  - rubric: 主要 CV タスクを適切に分類できる．
    type: multichoice
    title: 010-15-タスク分類
    question: |
      次のうち **画像生成** タスクに最も近いものはどれか。
    choices:
      A: 物体検出
      B: 領域分割
      C: 無条件 GAN による画像合成
      D: 画像分類
    answer: C
    feedback:
      A: 入力画像の解析であり生成ではありません．
      B: 分割も解析タスクです．
      C: 正解です．新規画像を生成します．
      D: ラベルを出力する解析タスクです．

  - rubric: 分類と検出の入出力形式の違いを説明できる．
    type: multichoice
    title: 010-16-入出力の違い
    question: |
      物体検出モデルの出力に **必ず** 含まれる情報はどれか。
    choices:
      A: 画像全体を 1 つのクラスに分類したラベル
      B: 各物体を囲むバウンディングボックスの座標
      C: ピクセルごとのクラス確率
      D: 入力画像と同じサイズのノイズマスク
    answer: B
    feedback:
      A: これは画像分類です．
      B: 正解です．検出では位置情報が不可欠です．
      C: これは領域分割の出力に近いです．
      D: 無関係な情報です．

  - rubric: キーポイント推定の出力を理解している．
    type: multichoice
    title: 010-18-キーポイント座標
    question: |
      人体姿勢推定で「右肘」の推定結果として **最も自然な表現** はどれか。
    choices:
      A: 右肘が映っているか否かの 0/1 ラベル
      B: 右肘のピクセル座標 \((x,y)\)
      C: 「右肘」という文字列
      D: 右肘が属するクラスタ番号
    answer: B
    feedback:
      A: 存在検出ですが座標が得られません．
      B: 正解です．キーポイントは座標で表現します．
      C: テキスト出力は通常不要です．
      D: クラスタ番号は不適です．

  - rubric: 最近傍補間アップサンプリングの手順を述べられる．
    type: multichoice
    title: 010-20-最近傍アップサンプル
    question: |
      最近傍補間アップサンプリングで **最初に行う操作** はどれか。
    choices:
      A: 入力テンソルをランダムノイズで膨らませる
      B: 入力テンソルの各隣接ピクセルを平均する
      C: 空白ピクセルを挿入してテンソルを拡大する
      D: フーリエ変換で周波数領域に写す
    answer: C
    feedback:
      A: ノイズは挿入しません．
      B: それは線形補間です．
      C: 正解です．まず空白を挿入し穴埋めします．
      D: 周波数領域は用いません．

  - rubric: アップサンプルで出力サイズを大きくできることを説明できる．
    type: truefalse
    title: 010-21-サイズ拡大
    question: |
      アップサンプリング層を挿入すると，畳み込みだけのネットワークでも「入力より大きい」画像を出力可能になる。
    answer: true
    feedback:
      true: 正解です．拡大層で解像度を上げられます．
      false: アップサンプリングがあれば出力を拡大できます．

  - rubric: U-Net のスキップ接続の役割を説明できる．
    type: multichoice
    title: 010-22-スキップ接続
    question: |
      U-Net のスキップ接続が **主に寄与する効果** はどれか。
    choices:
      A: 勾配消失の完全な回避
      B: 高解像度情報をデコーダ側に直接渡し詳細を復元しやすくする
      C: モデルサイズを劇的に削減する
      D: 温度パラメータを自動学習する
    answer: B
    feedback:
      A: ResNet 的効果もありますが主目的は詳細保持です．
      B: 正解です．ダウンサンプリングで失われる情報を補完します．
      C: パラメータはむしろ増えます．
      D: 温度とは無関係です．

  - rubric: ピクセル単位 softmax を使う理由を説明できる．
    type: truefalse
    title: 010-23-ピクセル softmax
    question: |
      領域分割タスクでは，各ピクセルがどのクラスに属すかを同時に推定するため，ピクセル単位で softmax を適用する必要がある。
    answer: true
    feedback:
      true: 正解です．独立に確率を出力します．
      false: 画像全体で 1 つの softmax を取ると空間情報が失われます．

  - rubric: 境界ピクセル重み付けの目的を理解している．
    type: multichoice
    title: 010-24-境界重み
    question: |
      Ronneberger らが U-Net で導入した「境界ピクセルに高い重みを付ける損失」の **主な目的** はどれか。
    choices:
      A: モデルの計算コスト削減
      B: クラス不均衡の解消
      C: 隣接物体の境界をより正確に分離する
      D: 勾配爆発を防ぐ
    answer: C
    feedback:
      A: 計算量はむしろ増えます．
      B: 不均衡対策もありますが境界強調が核心です．
      C: 正解です．境界で誤認しにくくします．
      D: 勾配爆発とは関係しません．

  - rubric: CNN が微分可能であることを説明できる．
    type: truefalse
    title: 010-25-微分可能性
    question: |
      畳み込み層を含む CNN は活性化関数が微分可能である限り，全体として誤差逆伝播法で勾配を計算できる。
    answer: true
    feedback:
      true: 正解です．そのため勾配法で最適化可能です．
      false: 微分不可能な関数ではサブグラディエントを使う場合もありますが，本設問の前提外です．

  - rubric: 高次元球の表面体積比を説明できる．
    type: multichoice
    title: 010-26-高次元球の直感
    question: |
      次元 \(d\) の単位球 \(B^d(1)\) について，「体積のほとんどが半径 \(r\approx1\) の薄い殻に集中する」現象の主な理由はどれか。
    choices:
      A: 球面積が半径の \(d-1\) 乗に比例して急速に増えるため
      B: 体積が指数関数的に減衰するため
      C: 中心付近の点が消えるため
      D: 球面と体積は無関係であるため
    answer: A
    feedback:
      A: 正解です．球面積の急増が殻体積を支配します．
      B: 減衰ではなく増加が本質です．
      C: 中心は消えません．
      D: 球面と体積は密接に関係します．

  - rubric: 多チャネル畳み込みのパラメータ数を計算できる．
    type: multichoice
    title: 010-27-カーネル当たりのパラメータ数
    question: |
      入力チャネル数 \(C_{\text{in}}=3\)，出力チャネル数 \(C_{\text{out}}=64\)，
      カーネルサイズ \(3\times3\) の 2-D 畳み込み層（バイアスあり）で
      **総パラメータ数** はいくつか。
    choices:
      A: \(3\times3\times64 = 576\)
      B: \(3\times3\times3\times64 = 1{,}728\)
      C: \(3\times3\times3\times64 +64 = 1{,}792\)
      D: \(3\times3\times64+3 = 579\)
    answer: C
    feedback:
      A: 入力チャネルを考慮していません．
      B: バイアス 64 個を忘れています．
      C: 正解です．カーネル \(3\times3\times3\) が 64 枚＋バイアス 64 個です．
      D: 入力チャネル数が不足しバイアスも不足です．

  - rubric: 受容野サイズの増加を定性的に説明できる．
    type: truefalse
    title: 010-28-受容野の拡大
    question: |
      3×3 畳み込み層を 2 枚連続でスタックすると，1 枚の 5×5 畳み込み層を
      1 枚だけ用いるよりも **受容野サイズは小さく** なる。
    answer: false
    feedback:
      true: 逆です．スタックすると有効受容野は 5×5 と同じかそれ以上になります．
      false: 正解です．2 枚重ねで 5×5 相当の受容野を得られます．

  - rubric: Attention と畳み込みの違いを説明できる．
    type: multichoice
    title: 010-29-Attention と畳み込み
    question: |
      Self-Attention を畳み込みと比較したとき **特有の利点** として正しいのはどれか。
    choices:
      A: カーネルが固定サイズなので大域文脈を捉えやすい
      B: 入力長に応じて動的に重みを計算し長距離依存を扱える
      C: パラメータが画像サイズに比例して増える
      D: 計算が局所的でメモリ消費が小さい
    answer: B
    feedback:
      A: 固定カーネルは畳み込み側の特徴です．
      B: 正解です．Self-Attention は入力間の相互関係を動的に学習します．
      C: パラメータは位置非依存で画像サイズに比例しません．
      D: 全ペア計算でメモリはむしろ大きいです．

  - rubric: Max Pooling と Average Pooling の効果を比較できる．
    type: multichoice
    title: 010-30-プーリングの違い
    question: |
      Max プーリングと Average プーリングを比較したとき **Max プーリングの典型的な効果** として最も近いものはどれか。
    choices:
      A: 出力がスムーズになりブラー効果が高まる
      B: 局所的に最も顕著な特徴を保持し背景ノイズを除去しやすい
      C: 勾配の計算が平均より安定するため学習が早い
      D: パラメータ数が大幅に増える
    answer: B
    feedback:
      A: それは Average プーリングの特徴に近いです．
      B: 正解です．最大値抽出でエッジ情報など強調されます．
      C: 勾配安定性は一概には言えません．
      D: プーリングに学習パラメータはありません．

  - rubric: Global Average Pooling (GAP) の目的を説明できる．
    type: truefalse
    title: 010-31-GAP の役割
    question: |
      Global Average Pooling は，空間次元を完全に平均化して
      **パラメータを増やさず** に特徴マップをクラススコアに縮約できる。
    answer: true
    feedback:
      true: 正解です．GAP はパラメータ無しでチャネルごと平均を取ります．
      false: GAP は新規パラメータを導入しません．

  - rubric: バッチ正規化の内部動作を説明できる．
    type: multichoice
    title: 010-32-バッチ正規化
    question: |
      バッチ正規化層が **学習時に保持する移動平均** は何に対する統計量か。
    choices:
      A: 勾配の平均と分散
      B: 各チャネルの出力の平均と分散
      C: 重み行列の平均と分散
      D: 誤差の平均絶対値
    answer: B
    feedback:
      A: 勾配ではなく出力値を正規化します．
      B: 正解です．推論時に固定値として用います．
      C: 重みではありません．
      D: 誤差統計は保持しません．

  - rubric: 残差接続の効果を説明できる．
    type: truefalse
    title: 010-33-残差接続
    question: |
      ResNet の残差接続は，勾配が深い層まで届きやすくなり
      **学習安定性を向上させる** ことに寄与する。
    answer: true
    feedback:
      true: 正解です．恒等経路が勾配消失を緩和します．
      false: 残差接続は学習を悪化させるものではありません．

  - rubric: Dropout の推論時スケーリングを理解している．
    type: multichoice
    title: 010-34-Dropout 推論時
    question: |
      Dropout を訓練時に 50 % で適用した層を推論時に
      **何もせずそのまま通す** と，同層の出力期待値はどうなるか。
    choices:
      A: 訓練時より 2 倍大きくなる
      B: 訓練時と同程度になる
      C: 訓練時より 2 倍小さくなる
      D: 無作為に変動する
    answer: A
    feedback:
      A: 正解です．推論時はドロップしないため平均が 2 倍になります．
      B: スケーリングが必要ですが本設問では行っていません．
      C: 小さくはなりません．
      D: 推論時は確率的にマスクしません．

  - rubric: ラベル保存変換を判定できる．
    type: truefalse
    title: 010-35-データ拡張の可否
    question: |
      手書き数字分類 (MNIST) で，入力画像を左右反転するデータ拡張は
      **ラベル保存変換** として適切である。
    answer: false
    feedback:
      true: 反転すると 2 と 5 などが入れ替わり誤ラベルになります．
      false: 正解です．数字認識では左右反転はラベルを保ちません．

  - rubric: マルチラベルとマルチクラス分類の違いを説明できる．
    type: multichoice
    title: 010-36-マルチラベル vs マルチクラス
    question: |
      「1 枚の画像に複数のタグ（犬・公園・ボールなど）を付ける」タスクの
      **分類種別** として正しいのはどれか。
    choices:
      A: マルチクラス分類
      B: マルチラベル分類
      C: 二値分類
      D: セマンティックセグメンテーション
    answer: B
    feedback:
      A: クラスが排他的でないため誤りです．
      B: 正解です．タグが複数同時に成り立ちます．
      C: ラベルが 2 値ではありません．
      D: ピクセルごとの分類ではありません．

  - rubric: マルチラベル問題での活性化選択を説明できる．
    type: truefalse
    title: 010-37-活性化関数の選択
    question: |
      マルチラベル分類の出力層では Softmax よりも Sigmoid を用いる方が一般的である。
    answer: true
    feedback:
      true: 正解です．各ラベルを独立に 0/1 予測できます．
      false: Softmax は排他的クラスで使います．

  - rubric: ファインチューニング戦略を理解している．
    type: multichoice
    title: 010-38-ファインチューニング
    question: |
      転移学習で「下位層を凍結し上位数層だけ学習する」設定の **主な利点** はどれか。
    choices:
      A: 全層更新よりも計算グラフが深くなりメモリを節約できる
      B: 通常，大量データで学習済みの汎用特徴を保持できる
      C: 学習率を層ごとに変える必要がなくなる
      D: ラベルノイズに対してロバスト性が下がる
    answer: B
    feedback:
      A: 凍結でメモリは減りますがグラフ深度は変わりません．
      B: 正解です．一般的特徴を保持し過学習を抑えます．
      C: 逆に層ごと学習率を変えることもあります．
      D: ロバスト性が必ず下がるわけではありません．

  - rubric: 早期停止の目的を説明できる．
    type: truefalse
    title: 010-39-早期停止
    question: |
      早期停止 (early stopping) は検証誤差が再び増加し始めた時点で学習を止め，
      **過学習を防ぐ** ことを主目的とする。
    answer: true
    feedback:
      true: 正解です．汎化性能が最良の時点でモデルを確定します．
      false: 検証誤差悪化を放置すると過学習に陥ります．

  - rubric: Focal Loss の効果を説明できる．
    type: multichoice
    title: 010-40-Focal Loss
    question: |
      Focal Loss が **クラス不均衡データ** に有効とされる主な理由はどれか。
    choices:
      A: 誤分類サンプルの損失勾配を意図的に弱める
      B: 易しいサンプルより難しいサンプルの重みを相対的に高める
      C: ラベルスムージングを導入する
      D: 出力層を Softmax から Sigmoid に変更する
    answer: B
    feedback:
      A: 逆で，誤分類ほど損失が強調されます．
      B: 正解です．希少クラスで誤りやすい難例を重点学習します．
      C: Focal Loss 自体にスムージングは含まれません．
      D: 活性化の変更とは独立です．

  - rubric: IoU を定義できる．
    type: multichoice
    title: 010-41-IoU の定義
    question: |
      物体検出評価指標 Intersection-over-Union (IoU) を表す式はどれか。
    choices:
      A: \(\frac{\text{TP}}{\text{TP}+\text{FP}}\)
      B: \(\frac{|A\cap B|}{|A\cup B|}\)
      C: \(\frac{|A\cap B|}{|A|}\)
      D: \(|A| - |B|\)
    answer: B
    feedback:
      A: Precision の式です．
      B: 正解です．検出ボックス A と真値 B の重なり率です．
      C: Recall の一部に類似します．
      D: 単純差分ではありません．

  - rubric: Non-Maximum Suppression (NMS) の目的を説明できる．
    type: truefalse
    title: 010-42-NMS の役割
    question: |
      非極大抑制 (NMS) は，同一物体を示す重複バウンディングボックスを
      **スコアの高いもの 1 つに絞る** 後処理である。
    answer: true
    feedback:
      true: 正解です．多数検出をまとめ重複を減らします．
      false: NMS は重複を残さず統合します．

  - rubric: アンカーボックスの概念を説明できる．
    type: multichoice
    title: 010-43-アンカーボックス
    question: |
      アンカーボックス (anchor) を用いる検出器で，
      **訓練時に回帰する量** として適切なのはどれか。
    choices:
      A: アンカーと真値ボックスの座標差分
      B: アンカーの IoU 閾値
      C: 画像の平均輝度
      D: 真値ボックスのクラスセンター
    answer: A
    feedback:
      A: 正解です．オフセット回帰でボックスを調整します．
      B: IoU 閾値はマッチング判定に使います．
      C: 輝度は関係ありません．
      D: クラスセンターという概念はありません．

  - rubric: mAP の計算目的を理解している．
    type: truefalse
    title: 010-44-mAP
    question: |
      平均適合率 (mAP) は，各 IoU 閾値で計算した AP を
      **クラスごとに平均** することで得られる。
    answer: true
    feedback:
      true: 正解です．複数クラスの平均 AP が mAP です．
      false: mAP はクラスごとの平均を取ります．

  - rubric: Dice 係数を説明できる．
    type: multichoice
    title: 010-45-Dice 係数
    question: |
      セグメンテーション評価指標 Dice 係数 (F1-score) の式はどれか
      （\(A\): 予測マスク，\(B\): 真値マスク）。
    choices:
      A: \(\frac{2|A\cap B|}{|A|+|B|}\)
      B: \(\frac{|A\cap B|}{|A\cup B|}\)
      C: \(\frac{|A|-|B|}{|A\cap B|}\)
      D: \(\frac{|A|}{|B|}\)
    answer: A
    feedback:
      A: 正解です．Dice は重複の 2 倍を正規化します．
      B: これは IoU です．
      C: 意味を持たない式です．
      D: 単純比は不適です．

  - rubric: Autoencoder の損失を説明できる．
    type: truefalse
    title: 010-46-再構成損失
    question: |
      オートエンコーダの典型的な学習では，
      入力と再構成出力との **距離を最小化** する損失を用いる。
    answer: true
    feedback:
      true: 正解です．L2 損失や BCE などが用いられます．
      false: 分類用クロスエントロピーは通常使いません．

  - rubric: GAN の 2 ネットワーク役割を説明できる．
    type: multichoice
    title: 010-47-GAN の役割
    question: |
      GAN において **ジェネレータ (G)** が最終的に学習する目標はどれか。
    choices:
      A: 真のデータ分布を識別する
      B: ノイズを入力としてデータと見分けがつかないサンプルを生成する
      C: 損失を最小化せず勾配を最大化する
      D: 判別器のパラメータを更新する
    answer: B
    feedback:
      A: それは判別器の役割です．
      B: 正解です．生成サンプルを実データに近づけます．
      C: 勾配を最大化するわけではありません．
      D: 判別器は別ネットワークで更新されます．

  - rubric: Mode Collapse の症状を説明できる．
    type: truefalse
    title: 010-48-Mode Collapse
    question: |
      GAN の学習で「Mode Collapse」が起きると，
      **生成画像の多様性が失われる** 現象が観測される。
    answer: true
    feedback:
      true: 正解です．特定モードの繰り返し生成が起きます．
      false: Mode Collapse は多様性の向上ではなく低下です．

  - rubric: VAE の潜在分布を説明できる．
    type: multichoice
    title: 010-49-VAE 潜在変数
    question: |
      変分オートエンコーダ (VAE) が
      **潜在空間で前提とする確率分布** として最も一般的なのはどれか。
    choices:
      A: 一様分布
      B: 多次元ガウス分布
      C: ポアソン分布
      D: 多項分布
    answer: B
    feedback:
      A: 一様は一般的ではありません．
      B: 正解です．標準正規分布を仮定し KLD で整合させます．
      C: 離散カウント分布で本設定には合いません．
      D: 多項はカテゴリカル変数用です．

  - rubric: 1-D と 2-D 畳み込みの違いを説明できる．
    type: multichoice
    title: 010-50-1D vs 2D Conv
    question: |
      1-D 畳み込みと 2-D 畳み込みを比較して **1-D 畳み込みが主に用いられるタスク** として最も妥当なのはどれか。
    choices:
      A: 時系列信号処理
      B: 衛星画像セグメンテーション
      C: 顔画像生成
      D: 点群 3-D 物体検出
    answer: A
    feedback:
      A: 正解です．1-D 畳み込みはシーケンス処理で多用されます．
      B: 2-D または 3-D 畳み込みが一般的です．
      C: 画像生成には 2-D 畳み込みが主流です．
      D: 点群には 3-D Conv や PointNet 系が用いられます．
# ------------------------------------------------------------
# 010-51 〜 010-53 : 畳み込み層の「手計算」問題
# ------------------------------------------------------------
Quizzes:
  - rubric: 畳み込み出力サイズを計算できる．
    type: multichoice
    title: 010-51-出力サイズ計算
    question: |
      入力特徴マップは \(7\times7\)，カーネルは \(3\times3\)，パディング \(p=1\)，
      ストライド \(s=2\) で畳み込みを 1 枚の出力チャネルで実行する．
      出力の空間サイズ \(H_\text{out}\times W_\text{out}\) はどれか。
      \[
        H_\text{out}= \left\lfloor\frac{H+2p-k}{s}\right\rfloor + 1,\;
        W_\text{out}= \left\lfloor\frac{W+2p-k}{s}\right\rfloor + 1
      \]
    choices:
      A: \(3\times3\)
      B: \(4\times4\)
      C: \(5\times5\)
      D: \(6\times6\)
    answer: B
    feedback:
      A: \((7+2-3)/2+1 = 3\) と誤算しています．
      B: 正解です．\((7+2-3)/2+1 = 4\) で \(4\times4\) となります．
      C: パディング効果を二重に数えています．
      D: ストライド 2 のためここまで大きくなりません．

  - rubric: 畳み込み演算に要する MAC 数を見積もれる．
    type: multichoice
    title: 010-53-MAC 数計算
    question: |
      入力チャネル数 \(C_{\text{in}}=16\)，出力チャネル数 \(C_{\text{out}}=32\)，
      入力の空間サイズ \(32\times32\)，カーネルサイズ \(5\times5\)，
      パディング \(0\)，ストライド \(1\) とする．
      **1 フォワードパス** で実行される乗算加算 (MAC) 演算総数に
      最も近いものはどれか。
      \[
        H_\text{out}=32-5+1=28,\quad
        \text{MAC}=H_\text{out}^2\,C_{\text{out}}\,C_{\text{in}}\,k^2
      \]
    choices:
      A: 約 \(2.5\times10^{6}\)
      B: 約 \(6.0\times10^{6}\)
      C: 約 \(1.0\times10^{7}\)
      D: 約 \(2.5\times10^{7}\)
    answer: C
    feedback:
      A: 出力チャネル数を考慮していません．
      B: 入出力チャネルのいずれかを半分で計算しています．
      C: 正解です．\(28^2\times32\times16\times25\approx1.0\times10^{7}\) MAC です．
      D: 出力サイズを \(32\times32\) と誤って仮定しています．
