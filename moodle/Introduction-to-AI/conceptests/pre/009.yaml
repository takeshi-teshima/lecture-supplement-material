Quizzes:
  - rubric: 高次元球で体積が外殻に集中する現象を説明できる
    type: multichoice
    title: 009-01-球面集中
    question: |
      半径 $$r=1$$ の $$d$$-次元球（$$d\gg1$$）に一様分布で点を撒いた。
      厚さ $$s=0.01$$ の外殻（半径 $$1-s$$〜1）に含まれる体積の割合として最も妥当なのはどれか。
    choices:
      A: 1 % 未満
      B: 約 10 %
      C: 約 50 %
      D: 90 % 以上
    answer: D
    feedback:
      A: 中心側の体積は急速に小さくなるため 1 % 未満にはならない。
      B: 低次元ならあり得るが，高次元では外殻がほとんどを占める。
      C: $$d\rightarrow\infty$$ では 50 % でも過小評価。
      D: 正解。球面集中現象により体積のほぼ全てが薄い外殻に集まる。

  - rubric: 距離の均質化を理解している
    type: multichoice
    title: 009-02-最近傍距離の収束
    question: |
      $$n$$ 個の点を高次元等方 Gaussian ($$\mathcal N(\mathbf0,I_d)$$) から独立にサンプリングした。
      $$d\to\infty$$ で隣接距離 $$\|x_i-x_j\|$$ の最小値と最大値の比はどうなるか。
    choices:
      A: 0 に近づく
      B: 1 に近づく
      C: $$\sqrt{d}$$ に近づく
      D: 毎回ランダムにばらつく
    answer: B
    feedback:
      A: 高次元では最短距離も遠いので 0 にはならない。
      B: 正解。距離の均質化で最近傍と最遠点の差が縮み比は 1 に近づく。
      C: $$\sqrt{d}$$ は距離の典型的スケールであって比ではない。
      D: 次元が十分高ければばらつきは極小になる。

  - rubric: ランダムベクトルのなす角が直交に集中することを理解している
    type: truefalse
    title: 009-03-高次元での直交性
    question: |
      $$d$$-次元の等方 Gaussian ベクトル $$X,Y$$（独立）について
      $$
        \lim_{d\to\infty}\Pr\!\bigl[\lvert\cos\angle(X,Y)\rvert<0.01\bigr]=1
      $$
      である。
    answer: true
    feedback:
      true: 正解。内積は $$O(\sqrt d)$$ だがノルムは $$O(\sqrt d)$$ なので比は 0 に収束する。
      false: 高次元ではほぼ直交になるため誤り。

  - rubric: 距離尺度選択の落とし穴を説明できる
    type: multichoice
    title: 009-04-マンハッタン距離の効用
    question: |
      次元 $$d$$ が極端に高い場合，ユークリッド距離よりマンハッタン距離（$$L_1$$）が有利となる主な理由として最も妥当なのはどれか。
    choices:
      A: $$L_1$$ は三角不等式を満たさないため柔軟
      B: $$L_1$$ は外れ値に対して一様に鈍感
      C: $$L_1$$ は距離のばらつきが $$L_2$$ より残りやすい
      D: どちらの距離でも均質化は同程度なので差は無い
    answer: C
    feedback:
      A: $$L_1$$ も距離の公理を満たすので誤り。
      B: 外れ値へのロバスト性は距離均質化とは別問題。
      C: 正解。成分ごとに加算するため距離分布の集中がやや緩やか。
      D: 実際には縮み具合に差があり得る。

  - rubric: 過剰パラメーター化の挙動を概念的に説明できる
    type: truefalse
    title: 009-05-暗記＝過適合？
    question: |
      モデルが訓練データを完璧に暗記できる場合，汎化誤差は必ず劣化する。
    answer: false
    feedback:
      true: 事例ベースモデルの例が反証となる。
      false: 正解。暗記と汎化は排他的ではなく，NN の広い盆地解など反例多数。

  - rubric: 記憶と法則の両極モデルの対比を理解している
    type: multichoice
    title: 009-06-モデル三極図
    question: |
      講義で示された「小さいモデル」「事例ベースモデル」「巨大モデル」の関係を示す次の説明のうち正しいものはどれか。
    choices:
      A: 事例ベースモデルは法則抽出のみで記憶を用いない
      B: 小さいモデルは事例暗記能力が高い
      C: 巨大モデルは記憶と法則の情報がパラメータに共存する
      D: 巨大モデルでもパラメータ数がデータ数未満なら過適合する
    answer: C
    feedback:
      A: k-NN は暗記寄りで法則をほぼ用いない。
      B: 小さな多項式モデルは暗記できない自由度。
      C: 正解。両者が曖昧に融合していると説明された。
      D: データ数未満は過剰パラメター化ではない。

  - rubric: 損失地形の盆地解の概念を理解している
    type: truefalse
    title: 009-07-広い盆地と情報量
    question: |
      広くて浅い損失盆地（flat minima）は，パラメータが多少変動しても性能が変わりにくいのでモデルが保持する情報量を抑える傾向がある。
    answer: true
    feedback:
      true: 正解。情報ボトルネックの観点とも整合。
      false: 広い盆地は過度な情報を保持しない点が鍵。

  - rubric: median heuristic を概念的に理解している
    type: truefalse
    title: 009-09-メディアンヒューリスティック
    question: |
      データ間距離の中央値をバンド幅 $$h$$ に取る方法（median heuristic）は，理論的に最小汎化誤差を保証する。
    answer: false
    feedback:
      true: 経験則であり理論保証は無い。
      false: 正解。経験的に妥当なだけで最適性は示されていない。

  - rubric: k-NN の高次元での性能低下を説明できる
    type: multichoice
    title: 009-10-kNNと次元の呪い
    question: |
      高次元データで $$k$$-最近傍分類器の誤分類率が悪化する主因として最も本質的なのはどれか。
    choices:
      A: 距離計算が数値的不安定
      B: 近傍距離と遠方距離がほぼ等しくなる
      C: 木構造による探索が指数時間
      D: サンプル数に依存せず誤差が一定
    answer: B
    feedback:
      A: 浮動小数誤差より距離の意味が薄れる方が深刻。
      B: 正解。距離の均質化で近傍情報が失われる。
      C: 計算量の問題と分類誤差は別。
      D: データが増えれば理論上改善可能。

  - rubric: 表現学習で次元削減が性能向上に繋がる理由を説明できる
    type: truefalse
    title: 009-11-有効次元の抽出
    question: |
      もとの特徴次元が高くても，本質的変動が低次元多様体に制限されていれば，その低次元表現で近傍探索する方が一般に高い分類性能を得やすい。
    answer: true
    feedback:
      true: 正解。ノイズ次元を捨て類似度の分解能を回復できる。
      false: 次元削減は不要どころかしばしば決定的に重要。

  - rubric: 双子アーキテクチャの動機を理解している
    type: multichoice
    title: 009-12-ツインネットの役割
    question: |
      類似度学習で同一重みのネットワークを 2 つ並べて入力ペアを処理する構造（ツイン・アーキテクチャ）が採用される主な利点はどれか。
    choices:
      A: 正則化パラメータを不要にする
      B: 入力順序の非対称性をモデル化できる
      C: 同一写像で共通の表現空間に埋め込む
      D: 勾配消失を完全に回避する
    answer: C
    feedback:
      A: 正則化とは独立。
      B: 同じ写像なので対称。
      C: 正解。比較可能な共通表現を保証。
      D: 勾配問題の解決策ではない。

  - rubric: コントラスト学習の正例・負例設計を理解している
    type: multichoice
    title: 009-13-対照学習のペア
    question: |
      自己教師付き対照学習で同一入力から生成した 2 ビュー $$(x^{(1)},x^{(2)})$$ を正例とし，同一ミニバッチ内の他ビューを負例とする理由として最も適切なのはどれか。
    choices:
      A: ミニバッチを大きくすれば常に同クラスは含まれない
      B: 負例生成コストが追加データ取得より低い
      C: 正例ペアが多いほどソフトマックスが滑らかになる
      D: クラスラベルがあっても必ず捨てる方が安定
    answer: B
    feedback:
      A: 実際には同クラスが混入しうるが許容。
      B: 正解。追加アノテーション不要でスケール。
      C: 正例数ではなく分母の負例多様性が重要。
      D: ラベルがあれば活用手法もある。

  - rubric: 温度付きソフトマックスの効果を説明できる
    type: truefalse
    title: 009-14-温度パラメータの役割
    question: |
      温度 $$T<1$$ を用いるとソフトマックス出力分布はより鋭くなり，対照学習で正例と負例を区別しやすくなる。
    answer: true
    feedback:
      true: 正解。確率質量が大きく集中する。
      false: $$T>1$$ が平坦化，$$T<1$$ が鋭化である。

  - rubric: オープンセット認識と類似度閾値を説明できる
    type: multichoice
    title: 009-15-未知クラス処理
    question: |
      1:N 顔認証で「登録無し」を返す決定ルールとして最も標準的なのはどれか。
    choices:
      A: 全登録埋め込みとの平均類似度を用いる
      B: 最高類似度が固定閾値未満なら未知とする
      C: 登録クラス数に応じて閾値を動的に下げる
      D: 距離の 1 位と 2 位の差が小さいとき未知とする
    answer: B
    feedback:
      A: 平均では同一者でも低くなる危険。
      B: 正解。最高スコア vs. 閾値の単純判定が一般的。
      C: 閾値調整は検証で行うが固定で運用することが多い。
      D: 差分判定は二重閾値として補助的に使う場合。

  - rubric: ラベル収集コストと学習戦略のトレードオフを理解している
    type: truefalse
    title: 009-16-2値類似ラベルの利点
    question: |
      クラスラベルよりも「同じか違うか」だけの 2 値ラベルの方が大量収集しやすい場合があるため，類似度学習では 2 値アノテーションが有効に機能する。
    answer: true
    feedback:
      true: 正解。クラウドソーシングでも取得容易。
      false: 2 値ラベルは有効活用されている。

  - rubric: 距離一様化がサンプル数に与える影響を理解している
    type: multichoice
    title: 009-17-サンプル複雑度境界
    question: |
      Shalev-Shwartz & Ben-David (2014) に示される「$$n<2^{d/2}$$ では任意アルゴリズムが誤分類率 $$\ge1/4$$」型の下界は何を示唆するか。
    choices:
      A: 高次元でも少数サンプルで高精度は可能
      B: サンプル数は次元に指数的に必要な場合がある
      C: 距離に Lipschitz 条件が無いときの特殊結果
      D: ベイズ誤差が 1/2 のタスクは存在しない
    answer: B
    feedback:
      A: 真逆の示唆。
      B: 正解。次元の呪いを理論的に裏付ける例。
      C: 条件を課していても下界が成立する点が肝。
      D: 定数は 1/4 であり 1/2 ではない。

  - rubric: Gaussian 分布の半径スケールを理解している
    type: truefalse
    title: 009-18-正規分布と球面
    question: |
      等方 Gaussian $$\mathcal N(\mathbf0,I_d)$$ の標本は半径 $$\sqrt d$$ 近辺の薄い殻に集中する。
    answer: true
    feedback:
      true: 正解。ノルム平方の期待値が $$d$$。
      false: 中心付近ではほとんど観測されない。

  - rubric: 事前学習タスクと下流タスクの関係を評価できる
    type: truefalse
    title: 009-20-ドメイン一致仮説
    question: |
      医療画像タスクにおいて IMAGENET 事前学習が往々にして効果薄と報告されるのは，被写体と解像度の違いなどドメインギャップに起因する。
    answer: true
    feedback:
      true: 正解。Raghu et al. (2019) が示す。
      false: 効果が薄い理由として主にデータサイズ不足ではない。

  - rubric: 類似度閾値運用の実務を理解している
    type: multichoice
    title: 009-21-閾値設計
    question: |
      顔認証システムの閾値は主にどの工程で決定するか。
    choices:
      A: 本番運用中にリアルタイム学習
      B: 検証セットで許容誤認率に合わせて調整
      C: 訓練セットの最大スコアに合わせる
      D: ランダム値を初期設定とし現場で微調整
    answer: B
    feedback:
      A: 運用中の再学習はリスクが高い。
      B: 正解。ROC を見て閾値を定める。
      C: 訓練セットだと過適合閾値になる。
      D: ランダムではなく検証に基づく。

  - rubric: 表現学習の層選択を理解している
    type: multichoice
    title: 009-22-どの層を使うか
    question: |
      分類学習済み CNN から類似度計算用ベクトルを抽出する際，最も一般的に選ばれるのはどの層か。
    choices:
      A: 入力層
      B: 出力ソフトマックス層
      C: 出力の一つ前の全結合層
      D: 畳み込み層の最初の出力
    answer: C
    feedback:
      A: 原画像ピクセルは抽象化不足。
      B: クラス分布に縮退して情報が乏しい。
      C: 正解。意味的情報が濃い。
      D: 低レベル特徴に留まり不足。

  - rubric: 温度パラメータと確率分布の鋭さの関係を定量化できる
    type: truefalse
    title: 009-23-温度とエントロピー
    question: |
      ソフトマックスの温度 $$T$$ を上げるほど出力エントロピーは増加する。
    answer: true
    feedback:
      true: 正解。分布が平坦化してエントロピー上昇。
      false: $$T<1$$ が鋭化でエントロピー低下。

  - rubric: 距離均質化の直感的説明ができる
    type: multichoice
    title: 009-24-全部遠い世界
    question: |
      距離均質化が「どの点も遠い」と感じられる直感的理由として最も適切なのはどれか。
    choices:
      A: 視覚化できないため錯覚
      B: 空間容量が指数的に増え隙間だらけ
      C: ノルムがゼロに近づくため
      D: 角度が 0 度に集中するため
    answer: B
    feedback:
      A: 数学的事実であり錯覚ではない。
      B: 正解。体積が膨張し稠密になり得ない。
      C: ノルムはむしろ大きくなる。
      D: 角度は 90 度に集中。

  - rubric: ノイズ次元付加実験の意義を説明できる
    type: truefalse
    title: 009-25-ノイズ次元の害
    question: |
      有用情報 2 次元に 98 次元の独立ノイズを付加すると k-NN 性能が劇的に落ちるのは，距離にノイズが大きく寄与するためである。
    answer: true
    feedback:
      true: 正解。ノイズで近傍が判別不能。
      false: ノイズは性能に中立ではない。

  - rubric: 損失地形の局所最適への到達可能性を理解している
    type: multichoice
    title: 009-26-高次元勾配法
    question: |
      高次元ネットワークで勾配法が局所解に陥りにくいとされる主な説明はどれか。
    choices:
      A: バックプロパゲーションが確率的最適化を避ける
      B: 回り道できる方向が多く障壁を迂回しやすい
      C: 活性化関数が ReLU なら平坦化する
      D: 学習率を小さくすれば常に逃げられる
    answer: B
    feedback:
      A: 手法の問題ではなく幾何。
      B: 正解。自由度の多さが救い。
      C: ReLU でも局所解はあり得る。
      D: 学習率は十分条件ではない。

  - rubric: バンド幅選択と正則化の違いを混同しない
    type: truefalse
    title: 009-27-カーネル幅vs L2
    question: |
      ガウシアンカーネル回帰でバンド幅 $$h$$ を大きくしても L2 正則化を強くしたときと同じ効果が得られるわけではない。
    answer: true
    feedback:
      true: 正解。幅は近傍定義，正則化は係数制約と別次元。
      false: 作用点が異なるため等価ではない。

  - rubric: パラメータ数とデータ数の大小を一般化性能と短絡しない
    type: multichoice
    title: 009-28-パラメータ神話
    question: |
      「パラメータ数 < データ数 なら必ず汎化しやすい」という主張が誤りである理由として最も適切なのはどれか。
    choices:
      A: パラメータのスパース性が考慮されていない
      B: バイアス–バリアンス分解においてバリアンス項は無関係
      C: モデルの事前分布やアーキテクチャが影響する
      D: 訓練誤差が必ず大きくなるから
    answer: C
    feedback:
      A: スパースでも汎化しない場合はある。
      B: バリアンス項は関係する。
      C: 正解。自由度だけでなく帰納バイアス全体が鍵。
      D: 小さいモデルでも訓練誤差をゼロに近づけることは可能。

  - rubric: 高温・低温ソフトマックスの勘違いを正せる
    type: truefalse
    title: 009-29-低温分布
    question: |
      温度 $$T=0.01$$ の極低温ソフトマックスは，ほぼ $$\arg\max$$ と同じ振る舞いを示す。
    answer: true
    feedback:
      true: 正解。最小指数項以外は無視される。
      false: 低温は鋭くなるため $$\arg\max$$ に近い。

  - rubric: 高次元現象のまとめを総合的に説明できる
    type: multichoice
    title: 009-30-次元の呪い総括
    question: |
      次元の呪いを回避・緩和する一般的な戦略として*不適切*なものはどれか。
    choices:
      A: 有効低次元表現を学習する
      B: データ量を指数的に増やす
      C: 距離に依存しない学習原理を採用する
      D: 距離を学習で適応的に再定義する
    answer: B
    feedback:
      A: 有効手段。
      B: 正解。実用的に不可能。
      C: 汎用的な打開策となり得る。
      D: 類似度学習は有効。

  # ---------- high-dimensional geometry ----------
  - rubric: 高次元 Gaussian のノルム集中を定量的に述べられる
    type: truefalse
    title: 001-12-Gaussianノルムの集中
    question: |
      $$X\sim\mathcal N(\mathbf0,I_d)$$ のとき
      $$\lVert X\rVert^2/d\to1$$ （確率収束）する。
    answer: true
    feedback:
      true: 正解。$$\lVert X\rVert^2$$ は $$\chi^2_d$$ に従い，期待値 $$d$$ に集中する。 [oai_citation:2‡第9回.pdf](file-service://file-EdvwTznuGnZDDEoEmMcDL4)
      false: 集中不成立という主張は $$\chi^2$$ の大数律に反する。

  - rubric: 距離の均質化が「相対コントラスト」を低下させる説明を理解している
    type: multichoice
    title: 001-13-相対コントラスト
    question: |
      Aggarwal ら (2001) で示された「相対コントラスト」の定義は？
    choices:
      A: $$\frac{\operatorname{max}d-\operatorname{min}d}{\operatorname{min}d}$$
      B: $$\frac{\operatorname{max}d-\operatorname{min}d}{\operatorname{max}d}$$
      C: $$\frac{\operatorname{E}[d]-\operatorname{min}d}{\operatorname{min}d}$$
      D: $$\operatorname{E}[d]$$
    answer: C
    feedback:
      A: 分母が $$\operatorname{min}d$$ ではなく平均距離を含める。
      B: 分母が $$\operatorname{max}d$$ では情報量が薄れる。
      C: 正解。平均と最小距離の差が埋まるほど相対コントラストは小さくなる。 [oai_citation:3‡第9回.pdf](file-service://file-EdvwTznuGnZDDEoEmMcDL4)
      D: 距離自体ではなく比で測る指標。

  - rubric: Manhattan 距離が高次元で残すばらつきの理由を定性的に説明できる
    type: truefalse
