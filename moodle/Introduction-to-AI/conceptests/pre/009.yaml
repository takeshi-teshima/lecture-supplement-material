  # ---------- curse summary ----------
  - rubric: 距離頼りの手法性能が次元で悪化する理由を総合的にまとめられる
    type: multichoice
    title: 001-29-距離手法の弱体化
    question: |
      距離ベース学習が高次元で不利になる直接的理由として最も本質的なのは？
    choices:
      A: データが指数的に増える
      B: 近傍と遠方の距離差が縮む
      C: 距離計算が数値オーバーフロー
      D: 木構造探索が使えない
    answer: B
    feedback:
      A: データ量ではなく距離の性質。
      B: 正解。距離の均質化が核心。 [oai_citation:19‡第9回.pdf](file-service://file-EdvwTznuGnZDDEoEmMcDL4)
      C: 計算精度より幾何が問題。
      D: 計算量は副次的。

  - rubric: データ量指数増は実用上不適切という判断を下せる
    type: truefalse
    title: 001-30-指数的データ不可
    question: |
      次元の呪いを真に克服するためにデータ量を指数的に増やす戦略は，実務上ほぼ不可能である。
    answer: true
    feedback:
      true: 正解。指数的サンプル要求は現実的でない。 [oai_citation:20‡第9回.pdf](file-service://file-EdvwTznuGnZDDEoEmMcDL4)
      false: 実務で指数増データは調達困難。

  - rubric: k-最近傍法で距離の均質化を克服できる“現実的な状況と具体的方策”を正しく対応付けられる
    type: multichoice
    title: 009-04-距離の均質化を避ける条件と戦略
    question: |
      高次元データでは，距離の均質化（近傍距離と遠方距離の差が縮む）などにより k-最近傍法 (k-NN) の精度が低下することがある。
      以下のうち，**この「次元の呪い」現象を回避しうる「希望が持てる状況」と，そのための「方策」を正しく組み合わせているもの**はどれか。
    choices:
      A: |
        状況「サンプル数が極めて大きく，局所平均が統計的に安定する」
        方策「k の値を大きくして多数の近傍を平均化する」
      B: |
        状況「特徴ベクトルが非常にスパースで，各点が高々数個の非ゼロ要素しか持たない」
        方策「距離関数をユークリッド ($$L_2$$) からマンハッタン ($$L_1$$) に切り替える」
      C: |
        状況「データが低次元多様体や圧縮可能な表現空間上に実質的に分布している」
        方策「表現学習・PCA・Autoencoder などで低次元表現を抽出し，その空間で距離を測る」
      D: |
        状況「各特徴のスケールがばらばらで，大きいスケールが距離を支配している」
        方策「Z-score 正規化（平均 0・分散 1）で特徴をスケーリングする」
    answer: C
    feedback:
      A: |
        サンプル数を増やし k を大きくしても「近傍と遠方の距離差が縮む」という幾何的問題は残り，
        根本的な改善にはつながりにくい。
      B: |
        スパースデータで $$L_1$$ は $$L_2$$ よりばらつきがわずかに残るが，高次元では依然として
        距離の均質化が発生するため決定的とは言えない。
      C: |
        **正解**。本質的に低次元構造があれば，その表現空間に射影・学習することで距離コントラスト
        が回復し，k-NN の性能向上が期待できる。
      D: |
        スケール統一は重要な前処理だが，距離の均質化による「全て遠い」問題を解決するわけではない。

  - rubric: 類似度学習が 1:N 認証（open-set 認証）を簡潔にする理由を説明できる
    type: multichoice
    title: 009-05-オープンセット認証での類似度学習の利点
    question: |
      1:N 認証タスクは，特殊な分類タスクと考えることができる．
      しかし，典型的な分類タスクとは異なる事情があるため，1:N 認証タスクにおいては **類似度学習** が用いられることが多い。

      この場合に、1:N 認証タスクが持つ特徴と、それに対して類似度学習によるアプローチから得られる利点の組み合わせとして **不適当** なものはどれか。
    # **単一のしきい値 $$\tau$$** だけで「未知」を判定できる．
    # その主な根拠として最も適切なのはどれか。
    # 1. 入力画像が **登録外の人物** である可能性がある（オープンセット分類タスク）．
    # 2. 登録人物の数 $$N$$ が大きく，登録ベクトルをすべて保持する必要がある．
    # で得た埋め込み $$z = \phi_\eta(x)$$
    choices:
      A: >
        1:N 認証タスクでは，未登録人物は登録ベクトルすべてと **高い** 類似度を示すため，最大値が高いほど未知と判断できる
      B: 各登録人物の代表ベクトル $$\{\mathbf g_i\}_{i=1}^{N}$$ を保持し，
         $$\displaystyle\max_i \mathrm{sim}(\mathbf z,\mathbf g_i) < \tau$$ なら「未知」とするだけでよい
      C: 埋め込みは必ず **3 次元以下** に圧縮されるため，可視化クラスタで未知を検出できる
      D: クラス追加時に再学習は不要になるが，未知判定には **人物ごとの別しきい値** が必要になる
    answer: B
    feedback:
      A: 未登録人物はむしろ類似度が **低く** なるため，「高い＝未知」は誤りです．
      B: >
        **正解。** 埋め込みは「同一人物⇔近い／別人⇔遠い」と学習されているので，
        最大類似度が $$\tau$$ を下回るかどうかだけで未知クラスを弾けます  [oai_citation:0‡第9回.pdf](file-service://file-B5soMZY519ax2Sziuw96Mv)
      C: 埋め込み次元はタスク設計次第であり，可視化は必須ではありません．
      D: 良好な埋め込みなら **共通しきい値** $$\tau$$ ひとつで十分です．
