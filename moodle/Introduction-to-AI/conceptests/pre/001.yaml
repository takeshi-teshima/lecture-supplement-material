Quizzes:
  - type: multichoice
    title: 機械学習の定義
    question: |
      「機械学習」の説明として適切なのはどれか。
    choices:
      A: 大量の計算を高速に実行する技術
      B: データから自動的に規則性や知識を獲得する技術
      C: 人間の直感や常識を直接プログラムとして記述する技術
      D: 大量の知識をルールとして手作業で登録する技術
    answer: B
    feedback:
      A: これは計算機の性能に関する説明です。
      B: 正解です。これが機械学習の本質です。
      C: これはルールベースの手法に近い説明です。
      D: これは第2次AIブームのエキスパートシステムです。

  - type: multichoice
    title: 予測系タスク
    question: |
      次のうち予測系タスクに該当しないものはどれか。
    choices:
      A: 画像データをもとに動物の種類を分類する
      B: 株価データをもとに未来の株価を推定する
      C: ユーザーの購入履歴から興味のある新商品を推薦する
      D: 顧客データから購買傾向のルールを発見する
    answer: D
    feedback:
      A: これは分類という予測タスクです。
      B: これは回帰という予測タスクです。
      C: 推薦は予測系に含まれます。
      D: 分析・発見系タスクです。

  - type: multichoice
    title: 教師付き学習
    question: |
      教師付き学習において必要不可欠なものはどれか。
    choices:
      A: 大量の入力データ（特徴量）
      B: 特徴量と正解ラベルがペアになったデータ
      C: ラベルなしの特徴量データのみ
      D: 正解ラベルのみのデータセット
    answer: B
    feedback:
      A: 特徴量だけでは学習できません。
      B: 正解です。ラベル付きデータが必要です。
      C: これは教師なし学習の前提です。
      D: ラベルだけでは入力との関係が学習できません。

  - type: multichoice
    title: ラベルの意味
    question: |
      「ラベル」の説明として適切なのはどれか。
    choices:
      A: 必ずカテゴリカルな分類結果を指す
      B: 予測タスクで予測される変数（数値も含む）
      C: データを分けるための特徴量
      D: 誤差がない真の値
    answer: B
    feedback:
      A: 数値のラベルもあります。
      B: 正解です。
      C: これは特徴量の説明です。
      D: ラベルは観測された値で誤差を含むこともあります。

  - type: multichoice
    title: パラメーターの役割
    question: |
      モデルにおけるパラメーターの役割はどれか。
    choices:
      A: データの誤差を補正する変数
      B: 特徴量の選択基準
      C: 性能を高めるための調整変数
      D: 予測性能とは無関係な固定値
    answer: C
    feedback:
      A: 誤差は損失関数で扱います。
      B: 特徴選択とは異なります。
      C: 正解です。
      D: パラメーターは予測性能に影響します。

  - type: multichoice
    title: 損失関数
    question: |
      損失関数に関する説明で正しいのはどれか。
    choices:
      A: データ生成プロセスを特定する関数
      B: 予測誤差を定量的に測る関数
      C: モデルの複雑さを測る指標
      D: 特徴量を抽出するための関数
    answer: B
    feedback:
      A: それは尤度の役割です。
      B: 正解です。
      C: 正則化項に近い説明です。
      D: 特徴量抽出とは別です。

  - type: multichoice
    title: 経験リスク最小化
    question: |
      経験リスク最小化を行う理由として正しいのはどれか。
    choices:
      A: 生成分布が既知だから
      B: リスクを直接計算できないから
      C: 常に真のリスクより小さいから
      D: 経験リスクは変化しないから
    answer: B
    feedback:
      A: 実際は未知です。
      B: 正解です。
      C: 小さくなりすぎると過学習になります。
      D: 経験リスクはデータに依存して変動します。

  - type: multichoice
    title: IID仮定
    question: |
      IID仮定とはどのようなものか。
    choices:
      A: データ間に強い依存がある
      B: 訓練とテストの分布が異なる
      C: データが独立で同じ分布に従う
      D: データの順序に意味がある
    answer: C
    feedback:
      A: 独立性が否定されています。
      B: これは分布シフトです。
      C: 正解です。
      D: これは時系列などの非IIDデータです。

  - type: multichoice
    title: 汎化性能
    question: |
      「汎化性能」とは何か。
    choices:
      A: 訓練データへの適合精度
      B: 未知データへの予測性能
      C: モデルのパラメーター数
      D: 推論時の計算速度
    answer: B
    feedback:
      A: それは訓練誤差です。
      B: 正解です。
      C: これはモデルの複雑さの指標です。
      D: 実行性能の指標です。
