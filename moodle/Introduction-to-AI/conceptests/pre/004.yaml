      false: 正解です。数値的手法で解を求めます。

  - rubric: 勾配降下法の停止基準の理解
    type: multichoice
    title: 004-28-勾配法の停止条件
    question: |
      勾配降下法の停止基準に該当しないものはどれか？
    choices:
      A: 最大更新回数
      B: 勾配の大きさが小さい
      C: 検証データの性能改善停止
      D: パラメータのランダム変動
    answer: D
    feedback:
      A: これはよくある停止基準です。
      B: 勾配の大きさはよく使われます。
      C: 早期停止で一般的です。
      D: 正解です。これは停止基準になりません。

  - rubric: ロジスティック関数の用途の理解
    type: multichoice
    title: 004-29-ロジスティック関数の用途
    question: |
      ロジスティック関数が分類モデルでよく使われる理由は？
    choices:
      A: 計算が簡単になるため
      B: 出力が確率値になるため
      C: 常に線形な出力を得るため
      D: 損失関数を使わずに済むため
    answer: B
    feedback:
      A: 計算簡便さが主な理由ではありません。
      B: 正解です。
      C: 線形に限定されません。
      D: 損失関数は依然として必要です。

  - rubric: 条件付き確率のモデル化方法理解
    type: multichoice
    title: 004-30-条件付き確率のモデル化
    question: |
      分類において条件付き確率をモデル化するために使われる主な損失関数はどれか？
    choices:
      A: 平均二乗誤差
      B: 絶対誤差
      C: 交差エントロピー損失
      D: ピンボール損失
    answer: C
    feedback:
      A: 回帰タスクの損失です。
      B: これは中央値の推定です。
      C: 正解です。
      D: 分位点回帰用の損失です。

  - rubric: 分位点回帰のための近似ターゲット概念
    type: multichoice
    title: 004-32-分位点回帰の近似ターゲットの理解
    question: |
      分位点回帰で特定の分位点（例：90%分位点）を近似ターゲットとして設定した場合、そのターゲットとなる関数の性質として適切な説明を選びなさい。
    choices:
      A: データ分布の外れ値の影響を強く受けるため、外れ値に対して敏感である。
      B: 特定の分位点より大きな値をとるデータの割合が、その分位点を基準として固定されるような関数である。
      C: データの期待値を最適に近似するため、平均的な予測に最適な関数である。
      D: データ点の絶対誤差を最小化することを目的とした関数である。
    answer: B
    feedback:
      A: 条件付き分位点は外れ値の影響を受けにくい性質があります。
      B: 正解です。分位点回帰のターゲット関数は、定義された分位点以上の割合が固定される性質を持ちます。
      C: 平均値は期待値回帰のターゲットであり、分位点回帰とは異なります。
      D: 絶対誤差の最小化は中央値回帰（特別な分位点回帰）に限定されますが、一般的な分位点回帰の性質とは異なります。
