Quizzes:
  - rubric: 分類タスクの定義
    type: multichoice
    title: 004-01-分類タスクとは
    question: |
      分類タスクとはどのような予測タスクか？
    choices:
      A: 連続的な数値の予測を行う
      B: 離散的な質的カテゴリーを予測する
      C: モデルのパラメーターを推定する
      D: データをランダムに分ける
    answer: B
    feedback:
      A: これは回帰タスクです。
      B: 正解です。
      C: それは分類タスク自体の定義ではありません。
      D: それは分類タスクではありません。

  - rubric: 0/1損失関数の特徴
    type: truefalse
    title: 004-03-0/1損失と微分
    question: |
      0/1損失関数は微分ができない損失関数である。
    answer: true
    feedback:
      true: 正解です。
      false: 微分はできません。

  - rubric: 分類タスクのモデル特性
    type: multichoice
    title: 004-04-モデルの出力特性
    question: |
      分類タスクのモデルはどのような出力を扱うか？
    choices:
      A: 常に数値出力
      B: 連続値のみ
      C: 離散的な質的ラベル
      D: 常に線型
    answer: C
    feedback:
      A: 数値出力に限定されません。
      B: 連続値は回帰の特徴です。
      C: 正解です。
      D: 線型とは限りません。

  - rubric: 決定論的分類の特徴
    type: truefalse
    title: 004-05-決定論的分類の目標
    question: |
      決定論的分類は直接リスクの最小化を狙う。
    answer: true
    feedback:
      true: 正解です。
      false: 決定論的分類は直接リスク最小化を狙います。

  - rubric: ベイズ分類器の理解
    type: truefalse
    title: 004-07-ベイズ分類器
    question: |
      ベイズ分類器はクラス事後確率が最大のクラスを選択する。
    answer: true
    feedback:
      true: 正解です。
      false: クラス事後確率が最大のクラスを選びます。

  - rubric: KLダイバージェンス理解
    type: multichoice
    title: 004-08-KLダイバージェンスと交差エントロピー
    question: |
      KLダイバージェンスと交差エントロピーの関係は？
    choices:
      A: 無関係
      B: 同じもの
      C: 交差エントロピーがKLダイバージェンスの一部
      D: KLダイバージェンスが交差エントロピーの一部
    answer: C
    feedback:
      A: 無関係ではありません。
      B: 完全に同じではありません。
      C: 正解です。
      D: 逆です。

  - rubric: ロジスティック関数の特性
    type: truefalse
    title: 004-09-ロジスティック関数
    question: |
      ロジスティック関数は実数を確率値に変換する。
    answer: true
    feedback:
      true: 正解です。
      false: 確率値に変換します。

  - rubric: 勾配降下法の基礎
    type: truefalse
    title: 004-10-勾配降下法の更新方向
    question: |
      勾配降下法は勾配の反対方向へパラメーターを更新する。
    answer: true
    feedback:
      true: 正解です。
      false: 勾配の反対方向へ更新します。

  - rubric: 勾配降下法における学習率の役割理解
    type: multichoice
    title: 004-11-学習率の役割
    question: |
      勾配降下法で用いられる学習率の役割は？
    choices:
      A: 勾配の方向を決める
      B: 更新幅の大きさを調整する
      C: 更新回数を決める
      D: 更新の停止を決める
    answer: B
    feedback:
      A: 勾配自体が方向を決めます。
      B: 正解です。
      C: 更新回数は別のハイパーパラメーターです。
      D: 停止条件とは異なります。

  - rubric: 重み減衰の意味を理解している
    type: truefalse
    title: 004-12-重み減衰の効果
    question: |
      重み減衰（L2正則化）はパラメーターを小さくする効果がある。
    answer: true
    feedback:
      true: 正解です。
      false: パラメーターを小さくするのが重み減衰です。

  - rubric: ロジスティック回帰の定義を理解している
    type: truefalse
    title: 004-13-ロジスティック回帰の目的
    question: |
      ロジスティック回帰は分類タスクに用いられる。
    answer: true
