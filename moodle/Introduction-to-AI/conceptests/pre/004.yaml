  - rubric: 最尤法で使われる目的関数を理解している
    type: multichoice
    title: 004-14-最尤法の目的関数
    question: |
      最尤法での目的関数は以下のどれか？
    choices:
      A: 平均二乗誤差
      B: 負の対数尤度
      C: 0/1損失
      D: ピンボール損失
    answer: B
    feedback:
      A: これは回帰タスクの損失です。
      B: 正解です。
      C: 分類の基本的な損失関数ですが、最尤法ではありません。
      D: 分位点回帰用です。

