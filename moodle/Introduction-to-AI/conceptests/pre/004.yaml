  - rubric: KLダイバージェンスが0となる条件の理解
    type: multichoice
    title: 004-16-KLダイバージェンスの最小値
    question: |
      KLダイバージェンスが0となる条件は？
    choices:
      A: 分布が異なる場合
      B: 分布が完全に一致する場合
      C: 分布が似ている場合
      D: ランダムな場合
