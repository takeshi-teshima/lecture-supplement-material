Quizzes:
  - rubric: カーネル法で次元爆発を回避できる理由を理解している
    type: truefalse
    title: 003-17-カーネルトリック
    question: |
      カーネル法を用いれば，明示的に高次元特徴を作成せずとも
      内積を計算するだけで高次元線形モデルと同等の効果が得られる。
    answer: true
    feedback:
      true: 正解です．カーネルトリックにより計算量を抑えられます．
      false: カーネル法の本質は「計算を特徴空間で暗黙に行う」点です．

  - rubric: k の大きさとバイアス・バリアンスの関係を理解している．
    type: multichoice
    title: 005-02-kの影響
    question: |
      k-NN で k を大きくしたときに起こりやすい現象はどれか．
    choices:
      A: 高バリアンス・低バイアス
      B: 低バリアンス・高バイアス
      C: バリアンスもバイアスも低下
      D: 予測不能
    answer: B
    feedback:
      A: k が小さい場合です．
      B: 正解．多数決が平滑化しバリアンスが下がる一方でバイアスが増えます．&#8203;:contentReference[oaicite:8]{index=8}&#8203;:contentReference[oaicite:9]{index=9}
      C: 同時に下がることは通常ありません．
      D: 不正解．

  - rubric: ベイズ最適予測器と 1-NN の誤差上限を把握している．
    type: truefalse
    title: 005-03-1NNの誤差限界
    question: |
      理想的な条件下では，1-最近傍分類器の誤分類率は Bayes 最適分類器の誤分類率の 2 倍以下に収束する．
    answer: true
    feedback:
      true: 正解．Cover & Hart (1967) の結果です．&#8203;:contentReference[oaicite:16]{index=16}&#8203;:contentReference[oaicite:17]{index=17}
      false: 理論上 2 倍が上界です．

  # --- Deep Learning & Representation Learning (12問) ------------------------
  - rubric: 活性値最大化の目的を理解している．
    type: truefalse
    title: 008-02-活性値最大化の解釈
    question: |
      **活性値最大化**（activation maximization）は，中間層ユニットの出力を最大化する入力を解析的に計算するため，誤差逆伝播を用いる必要はない．
    answer: false
    feedback:
      true: 勾配計算せず解析的に解けるわけではありません．
      false: 正解です．入力に対する勾配を逆伝播で求めながら最適化します．

  - rubric: 表現学習の位置付けを説明できる．
    type: truefalse
    title: 008-04-教師付き副産物
    question: |
      画像分類のような教師付き学習で訓練した深層モデルが，**表現学習**に成功することはあり得ない．
    answer: false
    feedback:
      true: 教師付き学習でも中間表現が有用に学習される場合があります．
      false: 正解です．分類タスクの*副産物*として優れたベクトル表現が得られることが広く報告されています．

  - rubric: オートエンコーダの目的関数を理解している．
    type: multichoice
    title: 008-05-再構成誤差の役割
    question: |
      **オートエンコーダ**の学習で最も頻繁に用いられる損失関数はどれか．
    choices:
      A: クロスエントロピー損失
      B: 再構成誤差（入力と出力の二乗誤差）
      C: KLダイバージェンス
      D: コサイン類似度
    answer: B
    feedback:
      A: 分類タスクなら妥当ですが再構成ではありません．
      B: 正解です．入力を忠実に**再現**できるかで学習します．
      C: 変分オートエンコーダなど拡張で登場しますが標準的ではありません．
      D: 主に類似度指標として使われます．

  - rubric: 凍結(freeze)の意味を理解している．
    type: multichoice
    title: 008-07-パラメータを凍結する理由
    question: |
      ファインチューニング時に**一部層を凍結**（重みを更新しない）する主な利点はどれか．
    choices:
      A: 勾配消失を完全に防止できる
      B: 計算コストと過適合リスクを低減できる
      C: モデル容量を増やして表現力を向上できる
      D: 学習率の自動調整が不要になる
    answer: B
    feedback:
      A: 凍結しても他層で勾配消失は起こり得ます．
      B: 正解です．既存知識を保持しつつ計算量と過学習を抑えます．
      C: 凍結は容量を*固定*する操作で逆方向です．
      D: 学習率チューニングの必要性は依然残ります．

  - rubric: 表現学習の注意点を理解している．
    type: truefalse
    title: 008-08-ベクトル成分の解釈
    question: |
      表現学習で得られた**ベクトル表現**の各成分には，常に人間が対応づけられる明確な意味が存在する．
    answer: false
    feedback:
      true: 多くの場合，成分は絡み合った情報を持ち単純解釈できません．
      false: 正解です．ベクトル値は高次元で**分散表現**となるため単純な解釈は困難です．

  - rubric: デノイジング目的の亜種を識別できる．
    type: multichoice
    title: 008-09-デノイジングAEの入力
    question: |
      **デノイジング・オートエンコーダ**では，学習時にどのような入力をモデルに与えるか．
    choices:
      A: 元のデータにランダムノイズを加えたもの
      B: 元データをそのまま入力する
      C: ラベル埋め込みを入力しデータを出力させる
      D: ノイズのみを入力する
    answer: A
    feedback:
      A: 正解．ノイズを加えた入力からクリーンデータを再構成させて頑健な表現を学習します．
      B: これは通常AEです．
      C: これは条件付き生成モデルに近いです．
      D: ノイズのみでは再構成できません．

  - rubric: 深層モデルとデータ量の関係を理解している．
    type: truefalse
    title: 008-10-パラメータ数とデータ量
    question: |
      深層モデルはパラメータが多いほど*必ずしも*より少ない訓練データで高性能になる．
    answer: false
    feedback:
      true: パラメータが多いとむしろ**より多くのデータ**が必要になるケースが一般的です．
      false: 正解です．パラメータ数増加は表現力と同時にデータ要求を高めます．

  - rubric: 転移学習の下流タスクを説明できる．
    type: multichoice
    title: 008-11-下流タスクとは
    question: |
      **下流タスク**（downstream task）の説明として最も適切なのはどれか．
    choices:
      A: 事前学習と同じモデルで同じデータを用いた再学習
      B: 事前学習済みモデルを利用して解決したい本来の目的タスク
      C: 事前学習用に大量データで学習する補助タスク
      D: データ前処理で行うラベルノイズ除去タスク
    answer: B
    feedback:
      A: それは再学習であり下流とは言いません．
      B: 正解です．**転移先**として実際に解きたい課題です．
      C: これはむしろ事前学習タスクです．
      D: 前処理作業であって学習タスクではありません．

  - rubric: Fine-tuningの学習率調整を理解している．
    type: truefalse
    title: 008-12-学習率の統一
    question: |
      Fine-tuning では再利用パラメータと新規パラメータに**同一の学習率**を適用するのが一般的である．
    answer: false
    feedback:
      true: 既存重みは小さめ，新規層は大きめなど**層別学習率**を設定する場合が多いです．
      false: 正解です．層により適切な学習率を変えることが通例です．

  # --- k-最近傍法 (10問) -----------------------------------------------------
  - rubric: k-NNのハイパーパラメータを理解している．
    type: multichoice
    title: 008-13-kと距離
    question: |
      **k-最近傍法**で*ハイパーパラメータ*として**直接**調整可能なのはどれか．
    choices:
      A: k の値と距離関数
      B: 学習率とバッチサイズ
      C: 木構造の深さ
      D: 損失関数の重み
    answer: A
    feedback:
      A: 正解です．k と距離・類似度の定義を選ぶ必要があります．
      B: k-NNは勾配学習しないので存在しません．
      C: 木構造は近似近傍探索時の実装依存です．
      D: 損失関数を最適化する工程はありません．

  - rubric: kの大小がバイアス–バリアンスに与える影響を説明できる．
    type: truefalse
    title: 008-14-kが小さいと？
    question: |
      k を**小さく**するとモデルは*柔軟*になり**過適合しやすい**傾向がある．
    answer: true
    feedback:
      true: 正解です．kが小さいほど境界が訓練データに敏感になります．
      false: kが小さいとデータに合わせすぎるリスクが高まります．

  - rubric: 距離関数の条件を理解している．
    type: multichoice
    title: 008-15-距離の三角不等式
    question: |
      次のうち**距離関数**の公理に*必ず*含まれるものはどれか．
    choices:
      A: 線形性
      B: 三角不等式
      C: 正規化（0〜1に収まる）
      D: 非負区間平均性
    answer: B
    feedback:
      A: 距離の定義には不要です．
      B: 正解です．d(a,c) ≤ d(a,b)+d(b,c) が必須です．
      C: 必須ではなく距離は任意の非負値を取り得ます．
      D: そのような公理は存在しません．

  - rubric: 距離と類似度の使い分けを説明できる．
    type: truefalse
    title: 008-16-距離でなくてもOK
    question: |
      k-NN では必ず数学的距離関数を使わねばならず，内積やコサイン類似度では動作しない．
    answer: false
    feedback:
      true: 類似度指標でも**順位付け**ができればk-NNは成立します．
      false: 正解です．距離の公理を満たさなくても類似度で近傍を測れます．

  - rubric: k-NN分類と回帰の違いを説明できる．
    type: multichoice
    title: 008-17-分類 vs 回帰
    question: |
      **k-NN回帰**が予測値を計算する代表的な方法はどれか．
    choices:
      A: 近傍ラベルの多数決
      B: 近傍ラベルの平均または距離重み付き平均
      C: 最近傍点のラベルに置き換える
      D: 線形最小二乗フィット
    answer: B
    feedback:
      A: これはk-NN分類です．
      B: 正解．連続値なので平均を取ります．
      C: k=1 の回帰では平均=値ですが，一般解釈は多数決ではありません．
      D: 別手法（線形回帰）です．

  - rubric: 1-NNの誤分類率上界を理解している．
    type: truefalse
    title: 008-18-誤分類率の上界
    question: |
      適切な条件下で，1-NN分類器の期待誤分類率はベイズ最適分類器の誤分類率の**高々2倍**に収束し得る．
    answer: true
    feedback:
      true: 正解です．Cover & Hart (1967) の古典的結果です．
      false: 実際に 2 R\* の上界が示されています．

  - rubric: 推論コストを計算できる．
    type: multichoice
    title: 008-19-計算量
    question: |
      d 次元空間で n 個の訓練点を持つ**逐次実装**の k-NN 推論の最悪計算量はどれか．
    choices:
      A: 𝒪(k log n)
      B: 𝒪(n d)
      C: 𝒪(d log n)
      D: 𝒪(k d)
    answer: B
    feedback:
      A: 全探索しない限り木構造などが必要です．
      B: 正解です．全点との距離計算で n × d です．
      C: k-d tree探索時の平均的ケースです．
      D: 訓練点に比例しません．

  - rubric: 近似最近傍探索の動機を理解している．
    type: truefalse
    title: 008-20-ANNの目的
    question: |
      近似最近傍探索（ANN）は推論精度を犠牲にしても推論速度を向上させるために導入される．
    answer: true
    feedback:
      true: 正解．計算コスト削減とメモリ効率が主目的です．
      false: ANN の主眼は推論速度とスケーリングです．

  - rubric: k-NNの遅延学習的性質を理解している．
    type: multichoice
    title: 008-21-遅延学習とは
    question: |
      k-NN が**遅延学習 (lazy learning)** と呼ばれる主な理由は何か．
    choices:
      A: 訓練時に重みを確率的勾配でゆっくり更新するから
      B: 訓練時にほとんど計算を行わず，推論時に重い計算をするから
      C: モデルが少数のエポックしか学習しないから
      D: 学習率をきわめて低く設定するから
    answer: B
    feedback:
      A: 勾配更新はありません．
      B: 正解．「覚えておき推論時に検索」する様式です．
      C: エポック概念自体ありません．
      D: 学習率は存在しません．

  - rubric: 類似度と距離の整理ができる．
    type: truefalse
    title: 008-22-マンハッタン距離
    question: |
      マンハッタン距離はユークリッド距離に比べ**三角不等式**を満たさないため距離関数とは呼べない．
    answer: false
    feedback:
      true: マンハッタン距離も距離の公理を満たします．
      false: 正解です．L₁距離は正真正銘の距離です．

  # --- カーネル法 (12問) -----------------------------------------------------
  - rubric: カーネル線型モデルの形を理解している．
    type: multichoice
    title: 008-23-カーネル線型モデル
    question: |
      カーネル線型モデルの予測関数 $$ f_\gamma(x) $$ の**典型的な形**として正しいものはどれか．
    choices:
      A: $$f_\gamma(x)=\gamma^\top x$$
      B: $$f_\gamma(x)=\sum_{j=1}^{n}\gamma_j\,K(x,x_j)$$
      C: $$f_\gamma(x)=\sigma(\gamma^\top x)$$
      D: $$f_\gamma(x)=K(x,\gamma)$$
    answer: B
    feedback:
      A: これは通常の線形モデルです．
      B: 正解．訓練点との**カーネル和**で表します．
      C: シグモイド付き線形でカーネルではありません．
      D: $$\gamma$$ が1点のみを指す場合の特殊形です．

  - rubric: ガウスカーネルのパラメータを理解している．
    type: truefalse
    title: 008-24-バンド幅 $$h$$
    question: |
      ガウスカーネル $$K(x,x')=\exp(-\|x-x'\|^2/2h^2)$$ において，$$h$$ が**大きいほど**カーネル値は局所的になる．
    answer: false
    feedback:
      true: $$h$$ を大きくすると距離の影響が緩和され**広がりが大きく**なります．
      false: 正解．$$h$$ 小→狭い，$$h$$ 大→広い．

  - rubric: 表現定理の要点を理解している．
    type: multichoice
    title: 008-25-表現定理とは
    question: |
      **表現定理 (representer theorem)** が示す主張として最も適切なのはどれか．
    choices:
      A: 線形モデルの重みは常にカーネル行列の固有ベクトルで表せる
      B: 正則化付き損失を最小化する解は訓練点に対応するカーネルの線形結合になる
      C: どんな非線形モデルもカーネル化できる
      D: カーネル関数は必ずガウス形でなければならない
    answer: B
    feedback:
      A: 固有ベクトルとは限りません．
      B: 正解．解が**有限和表現**になることを保証します．
      C: 条件次第で不可能な場合もあります．
      D: カーネルの形は多様です．

  - rubric: 正定値カーネルの条件を理解している．
    type: truefalse
    title: 008-26-半正定値性
    question: |
      任意の点集合 $$\{x_i\}$$ と任意の係数 $$\{\alpha_i\}$$ に対し
      $$\sum_{ij}\alpha_i\alpha_j K(x_i,x_j)\ge 0$$ を満たす $$K$$ を**正定値カーネル**と呼ぶ．
    answer: true
    feedback:
      true: 正解．これは半正定値性の要件です．
      false: 実際にはこの条件が必要です．

  - rubric: カーネルトリックによる次元削減効果を説明できる．
    type: multichoice
    title: 008-27-ポリカーネルの利点
    question: |
      2次元入力を3次多項式特徴に明示展開すると6次元になる．カーネルトリックで同じ効果を得る際の**主な利点**はどれか．
    choices:
      A: 計算時間は増えるが精度が向上する
      B: 高次元ベクトルを明示的に計算せず内積だけで済み計算効率がよい
      C: 正則化項が不要になる
      D: モデルが線形でなくなる
    answer: B
    feedback:
      A: むしろ時間を削減します．
      B: 正解．高次元**特徴計算コスト**を回避できます．
      C: 正則化は依然必要です．
      D: 内積空間では*線形*として扱えます．


  - rubric: ノンパラメトリックの概念を理解している．
    type: multichoice
    title: 008-29-ノンパラメトリックとは
    question: |
      モデルが**ノンパラメトリック**と呼ばれる理由として最も適切なのはどれか．
    choices:
      A: パラメータが1つも存在しない
      B: パラメータ数がデータ量に依存し理論上無限次元になり得る
      C: パラメータが連続値である
      D: モデルがニューラルネットでない
    answer: B
    feedback:
      A: カーネル法は重みを持ちます．
      B: 正解．データが増えると自由度も増えます．
      C: 連続離散に依存しません．
      D: 手法の種類とは無関係です．

  - rubric: カーネル化の意義を説明できる．
    type: truefalse
    title: 008-30-モデル横断的
    question: |
      線形モデル以外のアルゴリズム（例：k-means クラスタリング）ではカーネル化を適用できない．
    answer: false
    feedback:
      true: k-means などにもカーネル版が存在します．
      false: 正解です．クラスタリングやPCAなど多くの手法がカーネル化可能です．

  - rubric: 再生核ヒルベルト空間 (RKHS) の発想を説明できる．
    type: multichoice
    title: 008-31-RKHSの再生性
    question: |
      *再生性*とは，カーネル $$K$$ と対応する RKHS で成り立つ
      $$K(x,x')=\langle K(\cdot,x),K(\cdot,x')\rangle$$
      という関係により何が保証されるか．
    choices:
      A: 無限次元特徴量を内積で表現できる
      B: カーネル行列が対角化できる
      C: すべての関数が連続になる
      D: ベイズ最適解が常に存在する
    answer: A
    feedback:
      A: 正解．**関数を特徴写像**として扱えます．
      B: 個別条件が必要です．
      C: RKHS の関数でも不連続例があります．
      D: 直接保証しません．

  - rubric: カーネル法の計算コストを比較できる．
    type: truefalse
    title: 008-32-学習 vs 推論
    question: |
      カーネルリッジ回帰では学習に $$\mathcal{O}(n^3)$$ のコストが掛かる一方，推論は $$\mathcal{O}(n)$$ である．
    answer: true
    feedback:
      true: 正解．学習でカーネル行列を反転しますが推論は和で n に比例します．
      false: 実際に学習は立方コストがボトルネックです．

  - rubric: 類似度重みの役割を理解している．
    type: multichoice
    title: 008-33-重み付き和
    question: |
      カーネル線型モデルで各 $$\gamma_j$$ が**大きく**なると示す最も直接的な意味はどれか．
    choices:
      A: 入力 $$x_j$$ のラベルが間違っている
      B: 訓練点 $$x_j$$ が予測に強く寄与する
      C: カーネル値が常に1になる
      D: 距離計算に誤差がある
    answer: B
    feedback:
      A: 重みの大きさは誤りとは無関係です．
      B: 正解．重み×カーネルで寄与度が決まります．
      C: カーネル形に依存しますが重みとは独立です．
      D: 重みだけからは判断できません．

  - rubric: カーネルと距離の関係を説明できる．
    type: truefalse
    title: 008-34-距離からカーネル
    question: |
      すべての距離関数から必ず正定値カーネルを構成できる．
    answer: false
    feedback:
      true: 距離が与えられても正定値性を満たすカーネルが作れない場合があります．
      false: 正解．距離→カーネルは常に可能ではありません．

  # --- 比較・総合 (6問) -----------------------------------------------------
  - rubric: 事例ベース vs パラメトリックを整理できる．
    type: multichoice
    title: 008-35-モデルの立ち位置
    question: |
      **カーネル線型モデル**は次のどのカテゴリに最も適切に当てはまるか．
    choices:
      A: 純粋事例ベース・パラメータなしモデル
      B: 事例ベースだがパラメータを持つモデル
      C: 完全パラメトリックモデルで事例を保持しない
      D: 生成モデル
    answer: B
    feedback:
      A: k-NN が近い例です．
      B: 正解．訓練点*＋重み*を持つハイブリッドです．
      C: 訓練点依存なので当てはまりません．
      D: discriminative モデルです．

  - rubric: 各手法の計算タイミングを把握している．
    type: truefalse
    title: 008-36-学習コスト比較
    question: |
      k-NN は**学習**時の計算コストが小さいが**推論**時は訓練データ全体と比較するため重くなる．
    answer: true
    feedback:
      true: 正解．遅延学習の特性です．
      false: 実際には推論で距離計算がボトルネックです．

  - rubric: 各手法の過適合リスクを比較できる．
    type: multichoice
    title: 008-37-過適合しやすさ
    question: |
      次のうち**過適合**を特に防ぐために強い正則化やハイパーパラメータ調整が**不可欠**となる手法はどれか．
    choices:
      A: 1-NN 分類
      B: カーネルリッジ回帰（$$\lambda$$ 正則化あり）
      C: 深層ニューラルネット（層数大・パラメータ多数）
      D: ロジスティック回帰（2パラメータのみ）
    answer: C
    feedback:
      A: 過適合しやすいがハイパーパラメータは k だけで正則化は使わない手法です．
      B: $$\lambda$$ により過適合を制御できます．
      C: 正解．多数パラメータで正則化やDropout等が重要です．
      D: パラメータが少なく比較的過適合しにくい．

  - rubric: ハイパーパラメータの種類を整理できる．
    type: truefalse
    title: 008-38-バンド幅とk
    question: |
      k-NN の **k** とガウスカーネルの **バンド幅 $$h$$** はどちらも「モデルの柔軟性」を制御するハイパーパラメータである．
    answer: true
    feedback:
      true: 正解．k 小 / h 小 は境界を複雑にし過適合を招きます．
      false: いずれも予測曲面の滑らかさに影響します．

  - rubric: 類似度学習手法の使い所を説明できる．
    type: multichoice
    title: 008-39-実務での選択
    question: |
      大量画像検索システムで高速検索が最重要な場合，典型的に採用**されにくい**手法はどれか．
    choices:
      A: 近似最近傍による埋め込み検索
      B: k-NN (k=1) 直接検索（訓練画像=数千万枚）
      C: 事前学習CNNで埋め込み→ANN検索
      D: ハッシュベース近似探索 (LSH)
    answer: B
    feedback:
      A: 高速検索でよく使われます．
      B: 正解．全点距離計算はスケールしません．
      C: 実用例多数です．
      D: 代表的な高速類似度検索です．

  - rubric: 手法間の共通点を説明できる．
    type: truefalse
    title: 008-40-類似度の本質
    question: |
      k-NN とカーネル法はともに「入力と訓練点の**類似度**」を評価し予測に活用するという共通点を持つ．
    answer: true
    feedback:
      true: 正解．どちらも類似度ベースの加重和/多数決が根底にあります．
      false: 両者とも類似度（距離やカーネル値）を中心に設計されています．
