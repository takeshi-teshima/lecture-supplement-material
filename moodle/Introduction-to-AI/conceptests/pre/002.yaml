Quizzes:
  - rubric: 単回帰（線型単回帰）の意味を理解している。
    type: truefalse
    title: 002-単回帰の意味
    question: |
      単回帰とは、特徴量が複数存在する場合の回帰タスクを指す。
    answer: false
    feedback:
      true: 複数ではなく、特徴量が1つの場合を単回帰と呼びます。
      false: 正解です。単回帰は特徴量が1つの回帰です。

  - rubric: 最小二乗法の目的と原理を理解している。
    type: multichoice
    title: 002-最小二乗法の目的
    question: |
      最小二乗法の目的として最も適切な説明はどれか？
    choices:
      A: 経験リスクを最大化するパラメーターを見つける
      B: 訓練データの平均二乗誤差を最小化するパラメーターを見つける
      C: 未知データの予測を完全に正しくする
      D: 最も単純なモデルを作る
    answer: B
    feedback:
      A: 経験リスクは最小化します。
      B: 正解です。平均二乗誤差の最小化が目的です。
      C: 完全な正解は不可能です。
      D: 必ずしも最も単純とは限りません。

  - rubric: 最適化問題の基本用語（目的関数、最小化元、制約条件）を理解している。
    type: multichoice
    title: 002-最適化問題の基本用語
    question: |
      最適化問題において「目的関数」とは何を指すか？
    choices:
      A: 最小化または最大化する対象の関数
      B: 制約条件の式
      C: 最適解を求める手法の名前
      D: 最適化されたパラメーターのこと
    answer: A
    feedback:
      A: 正解です。
      B: それは「制約条件」です。
      C: それは「最適化手法」です。
      D: それは「解」または「最小化元」です。

  - rubric: 最適化の一階の条件（微分して0となる点が最適解の必要条件）を理解している。
    type: truefalse
    title: 002-最適化の一階の条件
    question: |
      制約条件のない最適化問題では、最適解の必要条件として「微分した結果が0になる点」が使われる。
    answer: true
    feedback:
      true: 正解です。
      false: 制約なし最適化の必要条件は「微分＝0」です。

  - rubric: 特徴量変換（feature map）の概念を理解している。
    type: truefalse
    title: 002-特徴量変換の概念
    question: |
      特徴量変換（feature map）は入力データを新たな特徴空間に写像する関数のことである。
    answer: true
    feedback:
      true: 正解です。
      false: 特徴量変換は新たな特徴空間への写像です。

  - rubric: 正則化の意味と、なぜ必要か（過適合の防止）を理解している。
    type: multichoice
    title: 002-正則化の意味
    question: |
      正則化を行う主な目的は何か？
    choices:
      A: 訓練データの誤差を最小化する
      B: モデルの複雑さを増やす
      C: 過適合を防ぐ
      D: 計算を高速化する
    answer: C
    feedback:
      A: 正則化は訓練誤差をむしろ増やすこともあります。
      B: 正則化はモデルの複雑さを抑えます。
      C: 正解です。正則化は過適合防止のためにあります。
      D: 計算の高速化は直接的な目的ではありません。

  - rubric: 検証データを使ったモデル選択の基本的な方法を理解している。
    type: truefalse
    title: 002-検証データを用いたモデル選択
    question: |
      検証データ（validation data）を使用する目的は、未知データに対するモデルの性能を近似的に評価し、ハイパーパラメーターを決定するためである。
    answer: true
    feedback:
      true: 正解です。
      false: 検証データは未知データの性能近似評価とモデル選択に用います。

  - rubric: 経験リスク最小化が過適合を引き起こし得ることと、正則化がそれを防ぐための有効な手法であることを理解している。
    type: multichoice
    title: 002-過適合を防ぐ本質的手法
    question: |
      あなたはモデルの経験リスクを最小化して予測性能を高めようとしましたが、評価用データで性能が著しく低下しました。この問題を解決するために、本質的に最も有効と考えられる方法はどれですか？
    choices:
      A: 特徴量の数を減らすしか根本的な方法は存在しない
      B: 特徴量を維持したまま、パラメーターの大きさに制約をかける正則化を導入する
      C: 学習データをより厳選し、サンプル数を削減する
      D: モデルの複雑さを高め、表現能力を最大限に引き出す
    answer: B
    feedback:
      A: 特徴量の削減は有効ですが、根本的な唯一の方法ではありません。正則化という他の重要な手法があります。
      B: 正解です。正則化により、過度なパラメーターの調整を防ぎ、汎化性能の向上を実現できます。
      C: サンプル数を減らすことは通常、過適合を悪化させる方向に作用します。
      D: モデルの複雑さをさらに高めることは過適合の問題を一層深刻にします。

  - rubric: 経験リスク最小化が過適合を引き起こし得ることと、正則化がそれを防ぐための有効な手法であることを理解している。
    type: multichoice
    title: 002-過適合への対処法
    question: |
      経験リスク最小化を行った結果、過適合が発生した場合に採り得る適切な対処法はどれか？
    choices:
      A: 特徴量の数を減らす以外に有効な方法はない
      B: 特徴量を変えず、パラメーターに対して正則化を導入する
      C: データの数を減らして訓練を簡略化する
      D: モデルの複雑さを増やして表現能力を高める
    answer: B
    feedback:
      A: 特徴量を減らすことは有効ですが、それ以外にも正則化という方法があります。
      B: 正解です。正則化を用いることで過適合を防止できます。
      C: データ数を減らすと、むしろ過適合が悪化します。
      D: モデルの複雑さを増やすことは、さらに過適合を促進します。


  - rubric: パラメーター線型モデルにおいて、経験リスク最小化やL2正則化付き最小二乗法など、具体的な学習手法の数理的な位置づけを理解している。
    type: multichoice
    title: 002-04-パラメーター線型モデルの学習
    question: |
      次のうち、パラメーター線型モデル $$f_{\theta}(x) = \langle \theta, \phi(x)\rangle$$ を学習する方法に関して適切に記述されているものはどれか？
    choices:
      A: $$\phi(x)$$ が非線型である場合は、線型モデルとして学習することはできない。
      B: 線型モデルでは、どのような損失関数を選んでも解析的な解（閉じた形式の解，すなわち解の公式）が存在する。
      C: L2正則化は、経験リスクの最小化だけでなく、パラメーターのノルムも同時に小さくなるように最適化を行い、過適合を防ぐ働きをする。
      D: 線型モデルでは、モデルが単純すぎて過適合は原理的に起こり得ない。
    answer: C
    feedback:
      A: |
        誤りです。$$\phi(x)$$ は入力に対して非線型でも、 $$\theta$$ に対して線型であればパラメーター線型モデルとして学習可能です（例：多項式特徴量など）。
      B: |
        誤りです。二乗損失など特定の損失関数を使った場合には解析解が得られることがありますが、任意の損失関数で得られるとは限りません。
      C: |
        正解です。L2正則化は「経験リスク + パラメーターノルム」という目的関数を最小化することで、予測器の関数としての極端な変動（＝過適合の一因）を抑制します。これは「訓練データにおける損失の小ささ」と「モデルの単純さ」のバランスをとる仕掛けです。
      D: |
        誤りです。線型モデルでも、例えば特徴量が多く表現力が高くなりすぎれば過適合は起こり得ます。モデルの単純さだけで過適合を完全に防ぐことはできません。

  - rubric: 経験リスク最小化は教師付き学習の一つの方法論にすぎず、唯一の学習原則ではないことを理解している。
    type: multichoice
    title: 002-05-経験リスク最小化の限界
    question: |
      次の会話は3人の学生が機械学習の原理について議論している様子です。ERM（経験リスク最小化）の役割についての説明として、適切な発言をしているのは誰でしょう？
    choices:
      A: Aさん「全ての機械学習アルゴリズムは、結局のところ経験リスクを最小化しているに過ぎないんだよ。」
      B: Bさん「ERMはデータの平均的な誤差を最小化するという考え方だけど、損失の分散が極端に大きいケースや、誤差の平均値だけでなく最悪ケースを重視したい場合には、他の方法が必要になることもある。」
      C: Cさん「ERMは単純だから、ベイズ学習も、マージン最大化も、ロバスト最適化もすべてERMの特殊ケースにすぎないんだよ。」
      D: Dさん「ERMだけで学習すると必ず過適合するから、そもそも実用的な場面では使われないよ。」
    answer: B
    feedback:
      A: |
        誤りです。機械学習にはERM以外にも多くの学習原則があります。たとえば、L2正則化付きの学習は、ERMに基づいていますが、純粋なERMそのものとは異なります。また、ベイズ的機械学習など、ERMとは異なる考え方で導出される学習法もあります。
      B: |
        正解です。ERMは期待値（平均）を最小化する考え方ですが、分散や最悪ケースを重視するような別の学習原則も存在します。
      C: |
        誤りです。ベイズ学習やマージン最大化、ロバスト最適化などの学習原理は、ERMの特殊ケースではなく、むしろERMとは異なる原則に基づいています。
      D: |
        誤りです。ERMだけで学習した場合に過適合することはありますが、実用的な場面でも使われることは多々あります。ただし、正則化などの工夫が併せて使われることが一般的です。
