  - rubric: 分布仮説の本質を説明できる
    type: multichoice
    title: 011-XX-分布仮説の誤解
    question: |
      自然言語処理でしばしば引用される「分布仮説（Distributional Hypothesis）」は
      「単語の意味はその周囲に現れる単語の分布によって特徴づけられる」という考え方である。
      次の説明のうち **分布仮説の説明として適切でないもの** はどれか。
    choices:
      A: 単語の意味を捉えるには、その単語がどの語と頻繁に共起するかを見るとよい。
      B: 同じ文脈で使われる単語どうしは、意味的に類似している可能性が高い。
      C: 文脈が変われば、同じ単語でも異なる意味合いを示すことがあるため、文脈は重要な手掛かりになる。
      D: 単語の意味は、その綴り（文字列）そのものに完全に規定され、共起する語の分布とは無関係である。
    answer: D
    feedback:
      A: 正解ではありません。これは分布仮説の核心的な説明です。
      B: 正解ではありません。共通文脈 → 意味類似は分布仮説の帰結です。
      C: 正解ではありません。文脈に依存して意味が揺れることも分布仮説を支持します。
      D: **正解**。文字列そのものだけで意味が決まるとする説明は分布仮説と真逆で不適切です。

    # 「単語の意味は、その単語が出現する *文脈（共起語の分布）* によって特徴づけられる」
    # という考え方である。
    # 次の説明のうち **分布仮説の説明として正しいもの** はどれか。
    # choices:
    #   A: 単語の意味を捉えるには、その単語がどの語と頻繁に共起するかを見るとよい。
    #   B: 同じ単語がどんな文脈で使われても常に同じ意味を持つと主張する。
    #   C: 分布仮説は、機能語（助詞・冠詞など）にしか適用できず、内容語には無関係である。
    #   D: 単語の意味は、その綴りや語形のみで決まり、共起分布を考慮する必要はない。
    # answer: A
    # feedback:
    #   A: **正解。** 共起分布が意味情報を与えるという分布仮説を正しく述べています。
    #   B: 不正解。文脈が変われば同じ語でも異なる意味合いを帯び得るとするのが分布仮説です。
    #   C: 不正解。分布仮説は語彙全体に適用され、内容語でも有効です。
    #   D: 不正解。文字列だけで意味が決まるとする考えは分布仮説と正反対です。

    # 講義では「トークン」という用語が「単語」よりも一般的で柔軟な最小単位として用いられると説明された。
