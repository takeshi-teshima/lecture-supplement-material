Quizzes:
  # - rubric: なぜモデルは確率値を出す必要があるか？損失関数と絡めた理解をできている

  - rubric: 分類において最適な予測器がクラス事後確率を用いて定義されることを理解している。
    type: multichoice
    title: 005-01-最適な分類器の形
    question: |
      確率論的分類において、誤分類率を最小にする予測器 $$ f^* $$ の定義として正しいものはどれか。
    choices:
      A: $$ f^*(x) = \arg\min_y p(x|y) $$
      B: $$ f^*(x) = \arg\max_y p(y|x) $$
      C: $$ f^*(x) = \arg\max_y p(y) $$
      D: $$ f^*(x) = \arg\min_y \|x - y\| $$
    answer: B
    feedback:
      A: 条件付き確率の向きが逆です。
      B: 正解です。最適な分類器はクラス事後確率 $$ p(y|x) $$ を最大化するラベルを選びます。
      C: $$ p(y) $$ は事前分布であり、入力 $$ x $$ に依存しません。
      D: 距離に基づく最近傍法に類似していますが、誤分類率を最小にする理論的根拠にはなりません。

  - rubric: モデルが確率値を出力するためには確率ベクトルである必要があることを理解している。
    type: truefalse
    title: 005-02-確率ベクトルの要件
    question: |
      確率論的分類において、モデルが出力するベクトルの成分は、すべて正であれば確率ベクトルと呼んでよい。
    answer: false
    feedback:
      true: 総和が1である必要があります。
      false: 正解です。確率ベクトルとは、非負かつ成分の総和が1であるベクトルのことです。

  - rubric: ロジスティック関数の数式表現と意味を理解している。
    type: multichoice
    title: 005-03-ロジスティック関数とは
    question: |
      ロジスティック関数（シグモイド関数）の表式として正しいものはどれか。
    choices:
      A: $$ \phi(z) = \frac{1}{1 + z} $$
      B: $$ \phi(z) = \frac{e^z}{1 + e^z} $$
      C: $$ \phi(z) = \frac{1}{1 + e^{-z}} $$
      D: $$ \phi(z) = \frac{1}{1 - e^{-z}} $$
    answer: C
    feedback:
      A: この式では $$ z \to \infty $$ のとき発散します。
      B: 上限が1を超えるため確率値にはなりません。
      C: 正解です。これはロジスティック関数の正しい定義です。
      D: 0以上1以下にならず、確率値として不適切です。

  - rubric: 多クラス分類におけるSoftmax関数の役割を理解している。
    type: multichoice
    title: 005-04-Softmax関数の性質
    question: |
      次のうち，Softmax関数に関する正しい記述はどれか。
    choices:
      A: Softmax関数は出力が任意の実数値になるよう設計されている。
      B: Softmax関数は入力ベクトルの最大成分だけに1を割り当てる関数である。
      C: Softmax関数は入力ベクトルを0以上で総和が1の確率ベクトルに変換する。
      D: Softmax関数は2次元ベクトルに対してのみ定義される。
    answer: C
    feedback:
      A: 実数値ではなく，確率値を出力するための関数です。
      B: これはargmaxに該当し，Softmaxは連続値を出力します。
      C: 正解です。Softmaxは確率値ベクトルを生成するための標準的な方法です。
      D: 任意の次元の入力に対して定義されます。

  - rubric: KLダイバージェンスと交差エントロピーの関係を理解している。
    type: multichoice
    title: 005-05-KLダイバージェンスと交差エントロピー
    question: |
      KLダイバージェンス $$ KL(p \| q) $$ と交差エントロピーの関係に関する記述として適切なものはどれか。
    choices:
      A: KLダイバージェンス = 交差エントロピー + エントロピー
      B: KLダイバージェンス = 交差エントロピー - エントロピー
      C: KLダイバージェンス = エントロピー - 交差エントロピー
      D: KLダイバージェンスと交差エントロピーには数学的関係はない
    answer: B
    feedback:
      A: 足し算の向きが逆です。
      B: 正解です。KLは交差エントロピーからエントロピーを引いた量として定義されます。
      C: 符号が逆になっています。
      D: 明確な数学的関係があります。

  - rubric: 二値分類においてロジスティック関数が0.5で閾値を与えることを理解している。
    type: truefalse
    title: 005-06-ロジスティック関数の閾値
    question: |
      二値分類で用いるロジスティック関数の出力が0.5を超えるとき，モデルはラベル1を予測する。
    answer: true
    feedback:
      true: 正解です。0.5はクラス1がもっともらしいという意味になります。
      false: 出力が0.5を超える場合はクラス1の確率が0.5を超えるため、クラス1を予測します。

  - rubric: ロジスティック回帰が分類器であることを理解している。
    type: multichoice
    title: 005-07-ロジスティック回帰の役割
    question: |
      「ロジスティック回帰」という名称に関して正しい理解はどれか。
    choices:
      A: 「回帰」とあるが，連続値を予測する回帰モデルである。
      B: 「回帰」とあるが，確率値を出力する分類モデルである。
      C: 「回帰」とあるので，最小二乗誤差で学習される。
      D: 「回帰」とあるが，尤度最大化ではなくベイズ推定が基本である。
    answer: B
    feedback:
      A: ロジスティック回帰は分類タスクに使われます。
      B: 正解です。分類タスクに用いるが，確率値を出力するモデルなので「回帰」と呼ばれています。
      C: 損失関数は負の対数尤度（交差エントロピー）です。
      D: ベイズ推定も可能ですが、標準的には最尤法です。

  - rubric: ロジスティック回帰の損失関数が交差エントロピーであることを理解している。
    type: truefalse
    title: 005-08-ロジスティック回帰の損失関数
    question: |
      ロジスティック回帰で用いられる損失関数は，二乗誤差である。
    answer: false
    feedback:
      true: 二乗誤差ではありません。交差エントロピー（負の対数尤度）です。
      false: 正解です。ロジスティック回帰では交差エントロピーを最小化します。

  - rubric: 重み減衰とL2正則化の関係を理解している。
    type: multichoice
    title: 005-09-重み減衰と正則化
    question: |
      次のうち，「重み減衰（weight decay）」という用語の意味として正しいものはどれか。
    choices:
      A: 勾配法の学習率を徐々に下げていく操作。
      B: パラメーターのL1ノルムを小さくする正則化。
      C: パラメーターのL2ノルムを用いた正則化のこと。
      D: パラメーターの値を途中でランダムにゼロにする操作。
    answer: C
    feedback:
      A: 学習率のスケジューリングと混同しています。
      B: L1ノルムではなくL2ノルムです。
      C: 正解です。重み減衰とは，L2ノルム正則化項を勾配法で実装したときの挙動です。
      D: これはドロップアウトの説明です。

  - rubric: ソフトマックス関数が多クラス分類で用いられる理由を理解している。
    type: multichoice
    title: 005-10-ソフトマックス関数の役割
    question: |
      多クラス分類においてSoftmax関数が用いられる理由として最も適切なものはどれか。
    choices:
      A: 総和が任意の定数となるようスコアを調整するため。
      B: 各クラスに対する確率的なスコアを出力するため。
      C: ロジスティック回帰の精度を向上させるため。
      D: モデルの表現力を高めるために非線形性を導入するため。
    answer: B
    feedback:
      A: 総和が1になる点がポイントです。
      B: 正解です。Softmax関数は，複数クラスの確率値ベクトルを生成するために使います。
      C: 精度を上げるためというよりは，多クラス分類の基本的構造に関わるものです。
      D: 非線形性の導入は確かにありますが，主目的は確率値への変換です。

  - rubric: ロジスティック関数とソフトマックス関数の関係を理解している。
    type: truefalse
    title: 005-11-ロジスティック関数とソフトマックス関数
    question: |
      2クラス分類におけるソフトマックス関数は，ロジスティック関数と数学的に等価である。
    answer: true
    feedback:
      true: 正解です。ソフトマックス関数の2次元版はロジスティック関数と一致します。
      false: 実は等価です。ロジスティック関数はSoftmax関数の特殊ケースと見なせます。

  - rubric: クラス事後確率の推定と目的関数の関係を理解している。
    type: multichoice
    title: 005-12-近似ターゲットと目的関数
    question: |
      確率論的分類において，モデルを学習する目的が「クラス事後確率の推定」と一致するのはどのような場合か。
    choices:
      A: 交差エントロピーを目的関数にした場合
      B: 二乗誤差を目的関数にした場合
      C: 損失関数を使わずヒューリスティックに分類する場合
      D: Softmax関数を用いた場合
    answer: A
    feedback:
      A: 正解です。交差エントロピー損失の下では，最適な関数は事後確率になります。
      B: 二乗誤差では条件付き期待値が近似ターゲットになります。
      C: 損失関数なしでは近似ターゲットが明確になりません。
      D: Softmaxは出力変換であり、目的関数の選択が重要です。

  - rubric: 勾配降下法が最適化手法であることを理解している。
    type: multichoice
    title: 005-13-勾配降下法の理解
    question: |
      勾配降下法に関する記述として正しいものはどれか。
    choices:
      A: 勾配方向にパラメータを更新することで目的関数を最大化する手法である。
      B: 勾配の大きさに関係なく，毎回一定幅だけパラメータを更新する。
      C: 勾配の反対方向に移動することで目的関数を最小化する手法である。
      D: 収束条件として目的関数の最大化が前提となる。
    answer: C
    feedback:
      A: 勾配降下法は目的関数の最小化を目指します。
      B: 学習率は勾配の大きさと連動して変わる場合もあります。
      C: 正解です。負の勾配方向に進むのが基本です。
      D: 最小化が目的なので、最大化が前提にはなりません。

  - rubric: 多クラス分類のロジスティック回帰の構造を理解している。
    type: multichoice
    title: 005-15-多クラス分類のロジスティック回帰
    question: |
      多クラス分類のロジスティック回帰モデルについて正しい記述はどれか。
    choices:
      A: 各クラスに1つずつ線型モデルを用意し，Softmaxで出力を確率化する。
      B: 1つの線型モデルで全クラスを同時に予測する。
      C: クラスごとのモデルは不要で，Softmax関数のみで分類が可能である。
      D: 確率ベクトルの出力にはロジスティック関数を使用する。
    answer: A
    feedback:
      A: 正解です。Softmax前のスコアをクラス数分出力する必要があります。
      B: 線型モデルは通常クラスごとにパラメータを持ちます。
      C: モデルが出力するスコアが必要です。
      D: ロジスティック関数は2クラス用で，多クラスにはSoftmaxを使います。
  - rubric: ソフトマックス関数がLogSumExpの勾配であることを理解している。
    type: multichoice
    title: 005-16-SoftmaxとLogSumExpの関係
    question: |
      Softmax関数とLogSumExp関数の関係として正しい記述はどれか。
    choices:
      A: SoftmaxはLogSumExpの2乗に一致する。
      B: SoftmaxはLogSumExpの逆関数である。
      C: SoftmaxはLogSumExpの勾配である。
      D: SoftmaxとLogSumExpには直接の数学的関係はない。
    answer: C
    feedback:
      A: 2乗とは無関係です。
      B: 逆関数ではありません。
      C: 正解です。SoftmaxはLogSumExpの勾配に一致します。
      D: 実は密接な数学的関係があります。

  - rubric: 確率論的分類における決定規則の意味を理解している。
    type: truefalse
    title: 005-17-最大事後確率則の意味
    question: |
      最大事後確率則とは，推定された事後確率が最大となるラベルを予測ラベルとする方法である。
    answer: true
    feedback:
      true: 正解です。最も尤もらしいラベルを選ぶのが最大事後確率則です。
      false: 決定規則の定義として正しいため、誤りです。

  - rubric: 交差エントロピー損失が最尤法に対応していることを理解している。
    type: multichoice
    title: 005-18-交差エントロピーと最尤法
    question: |
      確率論的分類で交差エントロピーを目的関数とする理由として最も適切なものはどれか。
    choices:
      A: 計算が単純だから。
      B: 最大事後確率則を近似できるから。
      C: 最尤法の負の対数尤度と一致するから。
      D: 二乗誤差よりも高速に収束するから。
    answer: C
    feedback:
      A: 計算の単純さではなく理論的な意味があります。
      B: それは副次的効果であり本質的理由ではありません。
      C: 正解です。交差エントロピーの最小化は最尤法と一致します。
      D: 学習速度の違いではなく、意味論に関わる話です。

  - rubric: 勾配法において勾配の符号の意味を理解している。
    type: truefalse
    title: 005-19-勾配の符号
    question: |
      勾配が正の値をとるとき，目的関数はその方向に移動すると減少する。
    answer: false
    feedback:
      true: 実際には勾配方向は上昇方向なので，これは誤りです。
      false: 正解です。勾配が正ならその方向に進めば目的関数は増加します。

  - rubric: L2正則化項が最適化に与える影響を理解している。
    type: multichoice
    title: 005-20-L2正則化の効果
    question: |
      L2正則化項が目的関数に与える影響として適切な記述はどれか。
    choices:
      A: パラメーターの値を増幅する。
      B: パラメーターの次元を増やす。
      C: パラメーターの大きさを抑制し，過学習を防ぐ。
      D: 損失関数の値には一切影響を与えない。
    answer: C
    feedback:
      A: 実際には抑制する方向に働きます。
      B: 次元数は増やしません。
      C: 正解です。パラメータの大きさを抑えて汎化性能を向上させます。
      D: 影響を与えます。目的関数に加算されます。

  - rubric: 早期停止の目的と仕組みを理解している。
    type: multichoice
    title: 005-21-早期停止の目的
    question: |
      機械学習において「早期停止（early stopping）」が行われる主な目的は何か。
    choices:
      A: 訓練データの誤差を0に近づけるため。
      B: 学習時間を最短にするため。
      C: 過学習を防ぎ，汎化性能を保つため。
      D: 計算機資源の節約のため。
    answer: C
    feedback:
      A: 訓練誤差が小さくても過学習している可能性があります。
      B: 学習時間短縮は副次的効果です。
      C: 正解です。過学習を防ぐために使われます。
      D: 節約にもなりますが，主要目的ではありません。

  - rubric: 確率ベクトルの性質を理解している。
    type: truefalse
    title: 005-22-確率ベクトルの定義
    question: |
      確率ベクトルとは，成分がすべて0以上1以下の実数で，総和が1になるベクトルのことをいう。
    answer: true
    feedback:
      true: 正解です。確率値ベクトルの定義です。
      false: これは確率ベクトルの定義そのものです。

  - rubric: Softmax関数が確率ベクトルを生成する理由を理解している。
    type: multichoice
    title: 005-23-Softmaxの仕組み
    question: |
      Softmax関数の出力が確率ベクトルになる理由として適切なものはどれか。
    choices:
      A: 全ての入力成分を2乗して正規化するから。
      B: 入力の絶対値を正規化しているから。
      C: 指数関数で非負化し，その総和で割るから。
      D: 入力の最大値だけに1を割り当てるから。
    answer: C
    feedback:
      A: 2乗は使いません。
      B: 絶対値は使用されません。
      C: 正解です。Softmaxは指数関数で正にして，総和で正規化します。
      D: これはargmaxの性質です。

  - rubric: ソフトマックス関数がargmaxの滑らかな近似であることを理解している。
    type: truefalse
    title: 005-24-argmaxとの関係
    question: |
      Softmax関数の出力は，argmax関数の滑らかな近似（soft version）とみなすことができる。
    answer: true
    feedback:
      true: 正解です。Softmaxは最大値のインデックスを滑らかに近似します。
      false: 実際にはargmaxの近似として設計された関数です。

  - rubric: 多クラス分類の予測器の構造を理解している。
    type: multichoice
    title: 005-25-予測器の構造
    question: |
      多クラス分類における予測器 $$ f_\theta(x) $$ の構造として最も適切なものはどれか。
    choices:
      A: $$ f_\theta(x) = \text{Softmax}(x) $$
      B: $$ f_\theta(x) = \arg\max_k \theta_k x $$
      C: $$ f_\theta(x) = \gamma(g_\theta(x)) $$ with $$ g_\theta(x) = \text{Softmax}(s_\theta(x)) $$
      D: $$ f_\theta(x) = \min_k g_\theta(x)[k] $$
    answer: C
    feedback:
      A: Softmaxは確率出力であって予測ラベルを返しません。
      B: 確率化の工程が抜けています。
      C: 正解です。Softmaxでスコアを確率化し，最大事後確率則で予測します。
      D: 最小値を選ぶのは予測とは逆です。
  - rubric: 二値交差エントロピー損失の意味を理解している。
    type: multichoice
    title: 005-26-二値交差エントロピーの定義
    question: |
      二値分類における交差エントロピー損失（binary cross entropy）として正しい式はどれか。
    choices:
      A: $$ - y \log(1 - g(x)) - (1 - y) \log g(x) $$
      B: $$ - y \log g(x) - (1 - y) \log(1 - g(x)) $$
      C: $$ y \log y + (1 - y) \log(1 - y) $$
      D: $$ (y - g(x))^2 $$
    answer: B
    feedback:
      A: 項が逆転しています。
      B: 正解です。これはロジスティック回帰で使われる典型的な損失関数です。
      C: これは自己エントロピーの形です。
      D: 二乗誤差であり、回帰向けです。

  - rubric: 交差エントロピーがKLダイバージェンスと関連することを理解している。
    type: truefalse
    title: 005-27-交差エントロピーとKL
    question: |
      KLダイバージェンスは，交差エントロピーと真のエントロピーとの差として表される。
    answer: true
    feedback:
      true: 正解です。KLは $$ \text{cross-entropy} - \text{entropy} $$ と表されます。
      false: 実際には交差エントロピーとエントロピーの差です。

  - rubric: モデル出力を確率に変換する必要性を理解している。
    type: multichoice
    title: 005-28-確率値としての整合性
    question: |
      線形モデルをそのまま分類タスクに用いると確率値にならないため，どのような対策が必要か。
    choices:
      A: 出力に重みを乗じて調整する。
      B: 出力にシグモイド関数やSoftmax関数を合成する。
      C: 出力を0か1に丸める。
      D: 出力に平均値を引く。
    answer: B
    feedback:
      A: 重み調整では確率性は保証されません。
      B: 正解です。シグモイドやSoftmaxで出力を [0,1] に変換します。
      C: これは予測後の処理であり，学習時には不可。
      D: 中心化は効果がありません。

  - rubric: 勾配降下法が繰り返し更新であることを理解している。
    type: truefalse
    title: 005-29-勾配降下法の手続き
    question: |
      勾配降下法では，目的関数の勾配を用いてパラメーターを1回だけ更新する。
    answer: false
    feedback:
      true: 1回だけではなく，繰り返し更新が基本です。
      false: 正解です。繰り返し更新が前提となっています。

  - rubric: 最尤推定に正則化を加える理由を理解している。
    type: multichoice
    title: 005-30-正則化の目的
    question: |
      最尤推定にL2正則化を加える主な目的はどれか。
    choices:
      A: モデルのパラメーター空間を広げるため。
      B: 計算時間を短縮するため。
      C: パラメーターが極端な値をとるのを防ぐため。
      D: 尤度の値を大きくするため。
    answer: C
    feedback:
      A: 空間を広げるのではなく，制限します。
      B: 必ずしも計算時間短縮にはなりません。
      C: 正解です。過学習防止のため，パラメータの暴走を防ぎます。
      D: 正則化は尤度の最大化とはトレードオフになる場合があります。
