Quizzes:
  - rubric:
    type: multichoice
    title:
    question: >
      合成関数の微分法則は、例えば次のように表される。
      \[ \frac{\partial L}{\partial x} = \frac{\partial L}{\partial y} \cdot \frac{\partial y}{\partial x} \]
      この式は、出力側の変数から入力側の変数へと順に偏微分の積をとれば合成関数の微分を計算できるということを表している。
      これを繰り返し適用することにより、ニューラルネットワークの誤差逆伝播法が導かれる。

      一方、実際にニューラルネットワークの学習のために誤差逆伝播法を用いる際には、
      まず初めにいちど順伝播を行ってから、モデルの計算グラフを逆順に辿りながら偏微分の積を順次とることによって、勾配の計算が行われる。

      このとき、初めに順伝播を行う必要があるのはなぜか。
      次のうち、最も適切な説明を選べ。
    choices:
      A: 合成関数の微分法則の式は略記であり，実際には現在のパラメーター等における勾配を計算する必要があるから。
      B: 順伝播を行うことで、ネットワークのパラメータを初期化する必要があるから。
      C: 逆伝播は順伝播の結果に依存しないため、順伝播は必須ではない。
      D:
    answer: A
    feedback:
      A: 正解。逆伝播では、順伝播で計算された活性化関数の出力値（中間層の出力）を利用して勾配を計算します。これらの値を保持していない場合、逆伝播の際に勾配を計算することができません。
      B: 誤り。パラメータの初期化は通常、学習の開始前に行われます。順伝播は、初期化されたパラメータを用いてネットワークの出力を計算するプロセスの一部です。
      C: 誤り。逆伝播は順伝播の結果に強く依存しています。特に、各層の活性化関数の出力値は逆伝播における勾配計算に不可欠です。
      D:
