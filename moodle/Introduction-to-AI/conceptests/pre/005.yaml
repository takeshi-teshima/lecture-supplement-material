Quizzes:
  - rubric: ""
    type: multichoice
    title: 次元の呪い
    question: |
      なぜ高次元ではk-最近傍法の分類精度が低い傾向があるのか？
    choices:
      A: 距離がすべて同じになるから
      B: ノイズが増えるから
      C: kの値が自動で変わるから
      D: アルゴリズムが遅くなるから
    answer: A

  - rubric: ""
    type: multichoice
    title: 距離 vs. 次元
    question: |
      k最近傍法の場合に，次元の呪いの対策として希望が持てる方法はどれか？
    choices:
      A: kを増やす
      B: 距離関数をユークリッドからマンハッタンに変える
      C: データの低次元構造を見つけてそれを使う距離関数を作る
      D: データを正規化する
    answer: C
