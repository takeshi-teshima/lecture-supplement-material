Quizzes:
  - rubric:
    type: multichoice
    title:
    question: >
      ニューラルネットワークの学習のために誤差逆伝播法を用いる際、
      モデルの計算グラフを逆順に辿りながら偏微分の積を順次とることによって勾配の計算が行われるが、
      その際に、初めにいちど順伝播を行う必要があるのはなぜか。
      次のうち、最も適切な説明を選べ。
    # これに対して、合成関数の微分法則は
    choices:
      A: 順伝播の際に各層での活性化関数の出力値を保持しておかないと、逆伝播の際に勾配を計算できないから。
      B: 順伝播を行うことで、ネットワークのパラメータを初期化する必要があるから。
      C: 逆伝播は順伝播の結果に依存しないため、順伝播は必須ではない。
      D:
    answer: A
    feedback:
      A: 正解。逆伝播では、順伝播で計算された活性化関数の出力値（中間層の出力）を利用して勾配を計算します。これらの値を保持していない場合、逆伝播の際に勾配を計算することができません。
      B: 誤り。パラメータの初期化は通常、学習の開始前に行われます。順伝播は、初期化されたパラメータを用いてネットワークの出力を計算するプロセスの一部です。
      C: 誤り。逆伝播は順伝播の結果に強く依存しています。特に、各層の活性化関数の出力値は逆伝播における勾配計算に不可欠です。
      D:

    - rubric:
    type: truefalse
    title:
    question: >
      一般に、より多くの層を持つ、より大きなニューラルネットワークは、より少ない層を持つ、より小さなニューラルネットワークよりも表現力が高い。
    answer: true
    feedback:
      true: 正解。より多くの層を持つニューラルネットワークは、より複雑な関数を近似できるため、表現力が高いと言えます。ただし、過学習のリスクも高まります。
      false: 誤り。一般に、より多くの層を持つネットワークはより複雑な関数を表現できるため、表現力が高いです。

