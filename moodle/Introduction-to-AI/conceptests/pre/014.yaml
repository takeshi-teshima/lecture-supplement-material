      false: 正解．安全とは許容できないリスクがない状態です．

  - rubric: ハルシネーション対策の具体策を説明できる
    type: multichoice
    title: 014-51-ハルシネーション対策
    question: |
      ハルシネーション（事実と異なる内容を生成する現象）を低減するために
      **有効だと考えられる対策** はどれか。
    choices:
      A: モデルの温度パラメータを極端に高く設定して多様性を最大化する
      B: 外部の信頼できるデータベースをリアルタイムで参照し，取得した情報を回答に反映させる仕組みを用いる
      C: 入力トークンの一部をランダムに置換してから生成を行う
      D: 学習データを完全に非公開とし，透明性を下げる
    answer: B
    feedback:
      A: 温度を高くすると，出力の多様性が上がり，ハルシネーションが増える傾向があります．
      B: 正解です．外部知識を検索して生成に取り込む**Retrieval-Augmented Generation (RAG)** の考え方で，事実への忠実性を向上させることが期待できます．
      C: 誤りです．特に意味はなく，強いて言うならむしろ誤った情報の生成を助長する可能性があります．
      D: 透明性を下げてもハルシネーション低減には寄与しません．

