  - rubric: GPU クラスタと参入障壁の要因を理解している
    type: multichoice
    title: 014-10-GPU 参入障壁
    question: |
      100,000 台規模の H100 クラスタ建設が参入障壁となる主因として **最も直接的** なのはどれか。
    choices:
      A: CUDA の学習コスト
      B: 電力会社との契約
      C: 初期資本コストの巨額さ
      D: ソフトウェア特許
    answer: C
    feedback:
      A: 重要だが主因ではない．
      B: 補助的要因．
      C: 正解．
      D: 関連薄い．

  - rubric:  LLM 曝露度の 3 段階区分 (E0/E1/E2) を説明できる
    type: multichoice
    title: 014-11-曝露度の区分
    question: |
      Eloundou ら (2023) は職業タスクの AI 曝露度を
      **(E0) 曝露なし / (E1) LLM 単体で高曝露 / (E2) LLM＋画像生成で高曝露**
      の 3 段階で評価した。
      次のうち **誤っている説明** はどれか。 [oai_citation:0‡第14回.pdf](file-service://file-BjJaNdNzUCtrfvcAcutGbo)
    choices:
      A: E0 はタスク所要時間が AI により半減しない
      B: E1 はテキスト系 LLM だけで半減しうるタスク
      C: E2 は画像生成の助けがあっても半減できないタスク
      D: 評価はタスクレベルで行われ職業単位に集約された
    answer: C
    feedback:
      A: 正しい説明です
      B: 正しい説明です
      C: 正解（E2 は「画像生成を併用すれば半減できる」タスク）
      D: 正しい説明です

