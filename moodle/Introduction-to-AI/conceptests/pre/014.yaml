Quizzes:
  - rubric: 高賃金職と AI 曝露度の関係を説明できる
    type: multichoice
    title: 014-01-曝露度と賃金
    question: |
      Eloundou et al. (2023) による職業タスク曝露度の分析結果として **正しいもの** はどれか。
    choices:
      A: 低賃金職ほど曝露度が高い傾向がある
      B: 高賃金職ほど曝露度が高い傾向がある
      C: 曝露度は賃金と無相関だった
      D: 曝露度は製造業に限定して評価された
    answer: B
    feedback:
      A: 逆です．
      B: 正解．
      C: 相関が報告されています．
      D: サービス業なども評価対象です．

  - rubric: 生成 AI ツールが生産性に与える影響のパターンを理解している
    type: multichoice
    title: 014-02-低スキル層への効果
    question: |
      コールセンター，ソフトウェア開発，ビジネス文書の３つの RCT に共通して観測された傾向として **最も適切** なのはどれか。
    choices:
      A: 高スキル従業員だけが大幅に効率化した
      B: 全レベルで作業時間が増加した
      C: 低スキル従業員の改善幅が特に大きかった
      D: 顧客満足度は低下した
    answer: C
    feedback:
      A: RCT ではむしろ逆でした．
      B: 作業時間は短縮しました．
      C: 正解．
      D: 顧客満足度は上昇または維持です．

  - rubric: リスク・脅威・脆弱性の区別ができる
    type: multichoice
    title: 014-04-リスクの三要素
    question: |
      次の説明のうち **正しいもの** はどれか。
    choices:
      A: 脅威とは脆弱性を悪用する結果生じる損害のこと
      B: 脆弱性とは損害を与える動機を持つ主体のこと
      C: リスクは脅威が脆弱性を利用して損害を生む可能性と影響度の組み合わせ
      D: リスクは脅威と脆弱性がゼロでも常に存在する
    answer: C
    feedback:
      A: 逆です．
      B: それは脅威です．
      C: 正解．
      D: 要素が無ければリスクはゼロです．

  - rubric: ハルシネーションの原因と対策を説明できる
    type: multichoice
    title: 014-05-ハルシネーション対策
    question: |
      RAG (Retrieval-Augmented Generation) を導入する主な目的として **最も適切** なのはどれか。
    choices:
      A: 計算量を削減する
      B: モデルサイズを小さくする
      C: ハルシネーションを抑制し事実性を高める
      D: 出力トークンを減らして通信量を削減する
    answer: C
    feedback:
      A: 目的ではありません．
      B: 直接小さくしません．
      C: 正解．
      D: 関連しません．

  - rubric: プロンプトインジェクションのバリエーションを区別できる
    type: multichoice
    title: 014-06-間接プロンプト攻撃
    question: |
      間接的プロンプトインジェクション (Indirect Prompt Injection) の特徴として **誤り** はどれか。
    choices:
      A: 攻撃文がアップロード文書に埋め込まれる
      B: ユーザーが攻撃文を意図せず送信する
      C: 攻撃検出が難しい
      D: 必ずユーザー入力欄に直接攻撃文を入力する
    answer: D
    feedback:
      A: 特徴です．
      B: 特徴です．
      C: 特徴です．
      D: 正解．直接入力せずとも攻撃可能です．

  - rubric: 公平性指標の数式的定義を説明できる
    type: multichoice
    title: 014-07-公平性指標の違い
    question: |
      デモグラフィック・パリティ (DP) と均等化オッズ (EO) の主な違いは何か。
    choices:
      A: DP は予測陽性率を，EO は真陽性率・偽陽性率を揃える
      B: DP は真陽性率を揃え，EO は予測陽性率を揃える
      C: 両者とも同じ式である
      D: DP は保護属性を無視して計算する
    answer: A
    feedback:
      A: 正解．
      B: 逆です．
      C: 別の指標です．
      D: 保護属性による分割が必要です．

