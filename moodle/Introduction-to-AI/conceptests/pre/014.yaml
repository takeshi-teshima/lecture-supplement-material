    choices:
      A: 長期的性能向上とコスト低下
      B: 用途の広さと拡散性
      C: 初期投資の回収率の高さ
      D: 他技術への波及効果
    answer: C
    feedback:
      A: 含まれる条件です．
      B: 含まれる条件です．
      C: 正解．投資回収は条件にありません．
      D: 含まれる条件です．補完的波及効果が条件です．

  - rubric: 安全の定義を ISO/IEC ガイドに沿って説明できる
