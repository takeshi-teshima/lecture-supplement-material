Quizzes:
  - rubric: SoftmaxとLogSumExpの微分関係を説明できる。
    type: truefalse
    title: 006-01-Softmaxと勾配
    question: |
      $$\mathrm{Softmax}(z)$$ は $$\mathrm{LogSumExp}(z)$$ を各成分で偏微分したものになっている。
    answer: true
    feedback:
      true: 正解です。$$ \frac{\partial}{\partial z_k}\mathrm{LogSumExp}(z)=\mathrm{Softmax}(z)[k] $$ です。 [oai_citation:3‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      false: Softmax はまさに LogSumExp の勾配ベクトルです。

  - rubric: 活性化関数の役割を区別できる。
    type: multichoice
    title: 006-02-ReLUの特徴
    question: |
      ReLU 活性化関数 $$\theta(u)=\max\{0,u\}$$ に関して正しい記述はどれか。
    choices:
      A: 負の入力でも勾配が一定の非ゼロ値を持つため勾配消失を防ぐ。
      B: 出力が線形であるためネットワークに非線形性を与えない。
      C: 零点より左では勾配が 0 となるため，負の入力領域でユニットが更新されなくなる可能性がある。
      D: 平均出力が 0 付近になりやすいのでシグモイドよりバニッシンググラディエントが深刻。
    answer: C
    feedback:
      A: Leaky ReLU の説明です。
      B: 正の領域は線形ですが負側が 0 なので全体として非線形です。 [oai_citation:6‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      C: 正解です。いわゆる “dying ReLU” 問題です。
      D: ReLU の方がシグモイドより勾配が保たれやすいです。

  - rubric: 前向き計算グラフと誤差逆伝播の考え方を理解している。
    type: truefalse
    title: 006-03-計算グラフと自動微分
    question: |
      計算グラフを用いる自動微分では，各パラメーターごとにヤコビ行列を個別に計算する必要があるため，ネットワークが深くなるとメモリ消費はパラメーター数の二乗オーダーで増える。
    answer: false
    feedback:
      true: ヤコビ行列を個別保持するわけではありません。共有中間勾配を再利用するためメモリはおおむね線形です。
      false: 正解です。逆伝播は動的計画法的に中間結果を共有するためメモリ・計算ともパラメーター数に比例します。 [oai_citation:7‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)

  - rubric: 決定規則の最大事後確率則を適用できる。
    type: multichoice
    title: 006-04-MAP決定
    question: |
      ソフトマックス出力 $$ g_\theta(x) $$ から予測ラベル $$ f_\theta(x) $$ を得る決定規則として正しいものはどれか。
    choices:
      A: $$ f_\theta(x) = \arg\max_k g_\theta(x)[k] $$
      B: $$ f_\theta(x) = \arg\min_k g_\theta(x)[k] $$
      C: $$ f_\theta(x) = \arg\max_k \log g_\theta(x)[k] $$
      D: A と C は同じ結果になる
    answer: D
    feedback:
      A: 正しいが C と同値です。 [oai_citation:8‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      B: 最小確率クラスを選ぶ誤りです。
      C: 正しいが A と同値です。
      D: 正解です。対数は単調変換なので argmax は変わりません。

  - rubric: 2クラスへの帰着を通して Softmax とシグモイドの関係を説明できる。
    type: truefalse
    title: 006-08-二値の場合のSoftmax
    question: |
      2クラス（$$K=2$$）の場合，ソフトマックス関数はロジスティックシグモイド関数と同形となる。
    answer: true
    feedback:
      true: 正解です。$$ w=z_1-z_2 $$ と置くと $$ \mathrm{Softmax}(z_1,z_2)=(\delta(w),1-\delta(w)) $$ になります。 [oai_citation:9‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      false: 2 クラスでは Softmax はシグモイドと一致します。

  - rubric: 最適化手法の改良点を区別できる。
    type: multichoice
    title: 006-09-Adamの特徴
    question: |
      Adam 最適化アルゴリズムが標準の確率的勾配降下法 (SGD) と比べて **導入していない** 改良点はどれか。
    choices:
      A: 勾配の一次モーメント（移動平均）による慣性項
      B: 勾配の二次モーメント（分散）の推定と学習率の座標ごとの調整
      C: エポックごとにデータをシャッフルしてミニバッチを再生成する操作
      D: 時間ステップに応じたバイアス補正
    answer: C
    feedback:
      A: Adam は慣性項を含みます。
      B: 二次モーメント推定により適応的学習率を行います。
      C: 正解です。これはデータローダ側の設定であり Adam 固有ではありません。 [oai_citation:10‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      D: Adam にはバイアス補正項が含まれます。

  - rubric: ニューラルネットワーク層の計算を理解している。
    type: multichoice
    title: 006-10-レイヤー計算の流れ
    question: |
      順伝播型ニューラルネットワーク (FNN) の 1 層で行われる計算として正しいものはどれか。
      ここで $$\theta$$ は活性化関数とする。
    choices:
      A: $$x \mapsto W x + b \mapsto \theta(Wx+b)$$
      B: $$x \mapsto \theta(x) \mapsto W\theta(x)+b$$
      C: $$x \mapsto W x \odot b \mapsto \theta(Wx\odot b)$$（$$\odot$$ は要素積）
      D: $$x \mapsto \theta(Wx+b) \mapsto W\theta(x)+b$$
    answer: A
    feedback:
      A: 正解です。線形変換の後に活性化を適用します。 [oai_citation:11‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      B: 活性化を入力前に適用しています。
      C: バイアスは加算であり要素積ではありません。
      D: 活性化後に再度同じ線形変換は行いません。

  - rubric: One-hot 表現とパラメータ数の関係を理解している。
    type: truefalse
    title: 006-12-One-hot とパラメータ
    question: |
      $$K$$ クラス分類で one-hot ラベルを用いるとき，最終層の重み行列の列数は常に $$K$$ になる。
    answer: true
    feedback:
      true: 正解です。列方向がクラス次元を張ります。 [oai_citation:1‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      false: クラス数より小さい列数では one-hot を線形に再現できません。

  - rubric: 交差エントロピー損失と負の対数尤度の等価性を区別できる。
    type: truefalse
    title: 006-13-CE と NLL
    question: |
      モデルが出力する確率分布 $$q_\theta(y\mid x)$$ に対し，離散ラベルの交差エントロピー損失は負の対数尤度と一致する。
    answer: true
    feedback:
      true: 正解です。教師ラベルを one-hot とみなすと同一式になります。 [oai_citation:2‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      false: 同じ式であり用語の違いにすぎません。

  - rubric: 学習率の大きさの影響を説明できる。
    type: multichoice
    title: 006-14-学習率の罠
    question: |
      学習率 $$\eta$$ が **過度に大きい** と発生しやすい現象として **最も直接的** なものはどれか。
    choices:
      A: 勾配ノルムが 0 に収束しネットワークが停滞する。
      B: 損失が発散して訓練過程が数値的に不安定になる。
      C: 汎化誤差が小さくなりテスト精度が極端に向上する。
      D: バッチサイズを増やさないと GPU メモリが不足する。
    answer: B
    feedback:
      A: これは主にバニッシンググラディエント由来の問題です。
      B: 正解です。大きすぎる更新で最小値を飛び越え損失が爆発します。 [oai_citation:3‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      C: 通常は逆効果です。
      D: 学習率とは無関係です。

  - rubric: モデル容量とデータサイズの不均衡を評価できる。
    type: truefalse
    title: 006-15-過学習の前兆
    question: |
      トレーニング損失が単調減少を続けている一方，検証損失が上昇し始めた場合，モデル容量がデータ量に対して大きすぎる可能性が高い。
    answer: true
    feedback:
      true: 正解です。典型的な overfitting のサインです。 [oai_citation:4‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      false: 逆のパターンが一般的に観測されます。

  - rubric: バニッシンググラディエントの原因を説明できる。
    type: multichoice
    title: 006-16-勾配消失の主犯
    question: |
      シグモイド活性化関数を深いネットワークで用いると勾配消失が起こりやすい主な理由はどれか。
    choices:
      A: シグモイドの最大勾配が 1 であるため。
      B: シグモイド勾配が $$(0,1)$$ に挟まれ連鎖積で指数的に小さくなるため。
      C: シグモイドは偶関数であるため。
      D: シグモイドの出力が常に正で平均 0 にならないため。
    answer: B
    feedback:
      A: 最大でも 0.25 であり “1” ではありません。
      B: 正解です。深層でのチェーンルール積による指数減衰が原因です。 [oai_citation:5‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      C: 奇偶性は無関係です。
      D: 平均 0 でない点は勾配飽和の一因ですが主因は B です。

  - rubric: 重み減衰 (L2 正則化) の作用機序を理解している。
    type: multichoice
    title: 006-17-L2 正則化の効果
    question: |
      L2 正則化（重み減衰）を損失に追加したときの **直接的** な効果として正しいものはどれか。
    choices:
      A: 重みベクトルのノルムに比例するペナルティが勾配に追加される。
      B: 活性化関数の出力スケールを自動で正規化する。
      C: 学習率を自動適応させる。
      D: ミニバッチ内の入力を白色化する。
    answer: A
    feedback:
      A: 正解です。勾配項 $$\lambda w$$ が足されます。 [oai_citation:6‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      B: これはバッチ正規化の役割です。
      C: L2 正則化自体は学習率を変えません。
      D: 入力正規化とは別概念です。

  - rubric: バッチ正規化の利点を説明できる。
    type: truefalse
    title: 006-18-バッチ正規化と内部共変量シフト
    question: |
      バッチ正規化は層入力を平均 0・分散 1 へ正規化し，**勾配消失／爆発の緩和と収束加速** の両方に寄与する。
    answer: true
    feedback:
      true: 正解です。内部共変量シフトを抑え最適化を安定化します。 [oai_citation:7‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      false: 主要なモチベーションはまさにそれです。

  - rubric: 早期終了を正則化として捉えられる。
    type: truefalse
    title: 006-19-早期終了の効果
    question: |
      早期終了（Early Stopping）はパラメータに明示的な正則化項を加えていなくても，実質的にモデル容量を制限する正則化として機能する。
    answer: true
    feedback:
      true: 正解です。最小損失到達前で学習を止めパラメータノルムの成長を抑えます。 [oai_citation:8‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      false: 実験的に汎化誤差改善が確認されています。

  - rubric: ミニバッチサイズと勾配推定分散の関係を理解している。
    type: multichoice
    title: 006-20-バッチサイズのトレードオフ
    question: |
      ミニバッチサイズ $$B$$ を増やすと **一般に** どう変化するか。最も網羅的に正しいものを選べ。
    choices:
      A: 勾配推定の分散が減り計算あたりの統計効率が向上する反面，1 エポックの計算コストが増える。
      B: 勾配推定の分散が増えるが計算は高速になる。
      C: 勾配分散と計算コストの両方が増える。
      D: バッチサイズは勾配にも計算時間にも影響しない。
    answer: A
    feedback:
      A: 正解です。大きい $$B$$ は滑らかな更新だが 1 ステップが重い。 [oai_citation:9‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      B: 分散は減少します。
      C: 分散は減りますがコストは増です。
      D: 影響しないことはありません。

  - rubric: Softmax の変換不変性と決定則の違いを区別できる。
    type: multichoice
    title: 006-21-スケール vs シフト
    question: |
      ベクトル $$z\in\mathbb{R}^K$$ に同じ定数変換を施したときの **Softmax 出力** と **最大事後確率決定則**への影響を考える。
      「決定ラベルは変わらないが Softmax 出力確率は変わる」変換はどれか。
    choices:
      A: すべての成分に同じ実数 $$c$$ を加える（$$z \mapsto z+c\mathbf{1}$$）。
      B: すべての成分に同じ正の実数 $$\alpha>0$$ を掛ける（$$z \mapsto \alpha z$$）。
      C: 各成分に独立な微小ノイズを加える（$$z_k \mapsto z_k+\epsilon_k$$）。
      D: すべての成分に $$-1$$ を掛ける（$$z \mapsto -z$$）。
    answer: B
    feedback:
      A: シフト不変性により確率もラベルも不変です。 [oai_citation:0‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      B: **正解。** スケーリングは argmax を保ちつつ確率分布の鋭さを変えます。
      C: ノイズ次第で argmax も変わり得ます。
      D: 符号反転で argmax が逆転する場合があります。

  - rubric: LogSumExp と Softmax の勾配関係を説明できる。
    type: multichoice
    title: 006-22-LogSumExp 勾配の向き
    question: |
      $$z=(2,5,8,0)$$ に対する $$\nabla \mathrm{LogSumExp}(z)$$ について正しい記述はどれか。
    choices:
      A: 成分がちょうど一つだけ 1 で他は 0 のベクトルになる。
      B: Softmax$$z$$ と同一であり、第3成分が 1 に近く他は 0 に近い。
      C: 第1成分が最大なので最初の要素が約 1 になる。
      D: 勾配は $$z$$ の大きさに依存せず常に一様確率ベクトルになる。
    answer: B
    feedback:
      A: 最大成分に“ほぼ”1ですが厳密に 1 ではありません。
      B: **正解。** 勾配ベクトルは Softmax そのものです。 [oai_citation:1‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      C: 最大は第3成分です。
      D: Softmax が一様になるのは全要素等しいときのみです。

  - rubric: Softmax＋交差エントロピーの勾配を数式で言い換えられる。
    type: truefalse
    title: 006-23-予測確率と真ラベルの差
    question: |
      Softmax 出力 $$g_\theta(x)$$ と one-hot ラベル $$\mathbf{e}_{y}$$ を用いる交差エントロピー損失の勾配は
      $$
        \frac{\partial L}{\partial s_\theta(x)} = g_\theta(x)-\mathbf{e}_{y}
      $$
      で与えられる。
    answer: true
    feedback:
      true: **正解。** スコア勾配は「予測確率−真ラベル」です。 [oai_citation:2‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      false: Softmax と CE を組み合わせるとこの簡潔形になります。

  - rubric: Backprop の計算コスト削減メカニズムを理解している。
    type: truefalse
    title: 006-24-ヤコビを持たない効率
    question: |
      誤差逆伝播法では中間勾配を再利用するため，ネットワーク総パラメータ数を $$P$$ とした場合でも
      勾配計算は $$O(P)$$ で行える。
    answer: true
    feedback:
      true: **正解。** 共有部分を一度だけ計算することで線形時間になります。 [oai_citation:3‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      false: ヤコビ行列を個別に持たず共有する点がポイントです。

  - rubric: エポック毎のシャッフル有無が SGD に与える影響を説明できる。
    type: multichoice
    title: 006-25-シャッフルしないと？
    question: |
      ミニバッチ SGD で **エポック毎のデータシャッフルを行わない** と起こり得る問題はどれか。
      （訓練データはラベル順に並んでいると仮定）
    choices:
      A: 期待勾配がバイアスされ学習が理論的に破綻する。
      B: 勾配推定の分散が周期的パターンを持ち，収束が遅くなる。
      C: 早期停止が機能しなくなる。
      D: モデル容量が物理的に減少する。
    answer: B
    feedback:
      A: バイアスはありませんが分散構造が悪化します。
      B: **正解。** 系列相関が残り振動的な更新になります。 [oai_citation:4‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      C: 直接の因果はありません。
      D: パラメータ数は不変です。

  - rubric: Early Stopping の判定基準を誤解なく説明できる。
    type: truefalse
    title: 006-26-停止条件の基準
    question: |
      早期終了では **検証損失の改善幅** が所定閾値より小さくなった時点のモデルを採用するため，
      最小訓練損失モデルが採用されるとは限らない。
    answer: true
    feedback:
      true: **正解。** 検証セットに基づき過学習を回避します。 [oai_citation:5‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      false: 早期終了は訓練損失より検証損失を監視します。

  - rubric: 多クラスロジスティック回帰のパラメータ数を計算できる。
    type: multichoice
    title: 006-27-重み行列の形
    question: |
      特徴量次元 $$d$$，クラス数 $$K$$，バイアス込みの多クラスロジスティック回帰の総パラメータ数は？
    choices:
      A: $$K(d+1)$$
      B: $$d(K+1)$$
      C: $$Kd$$
      D: $$K^2d$$
    answer: A
    feedback:
      A: **正解。** 各クラスに独立な重みベクトルとバイアスが必要です。 [oai_citation:6‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      B: 特徴量次元の解釈が逆です。
      C: バイアスを忘れています。
      D: 二乗は不要です。

  - rubric: Softmax 出力飽和時の勾配大きさを定量的に理解している。
    type: truefalse
    title: 006-28-飽和と勾配
    question: |
      交差エントロピー損失で正解クラス確率が 0.99 になると，そのクラスのスコア勾配は $$-0.01$$ となり小さくなるためパラメータ更新が鈍化する。
    answer: true
    feedback:
      true: **正解。** 勾配は $$g_y-1 = 0.99-1$$ で -0.01 と小さくなります。 [oai_citation:7‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      false: 高確率でも勾配は小さくなります。

  - rubric: 内部共変量シフトの緩和手法を識別できる。
    type: multichoice
    title: 006-29-内部共変量シフト対策
    question: |
      講義で「内部共変量シフト抑制」として紹介された手法はどれか。
    choices:
      A: Batch Normalization
      B: Dropout
      C: Weight Decay (L2)
      D: 早期終了 (Early Stopping)
    answer: A
    feedback:
      A: **正解。** 入力を平均 0・分散 1 に正規化します。 [oai_citation:8‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      B: 主目的は過学習防止です。
      C: 重みノルム制御が目的です。
      D: 学習エポック数の制限が目的です。

  - rubric: Adam のバイアス補正の意図を説明できる。
    type: multichoice
    title: 006-30-Adam の補正項
    question: |
      Adam で一次・二次モーメント推定を
      $$
        \hat{m}_t = \frac{m_t}{1-\beta_1^t},\quad
        \hat{v}_t = \frac{v_t}{1-\beta_2^t}
      $$
      と補正する主な理由はどれか。
    choices:
      A: 初期ステップでモーメント推定値がゼロ寄りに偏るのを除去するため。
      B: 学習率を指数関数的に減衰させるため。
      C: 勾配クラッピングを自動で行うため。
      D: 勾配の符号のみで更新方向を決めるため。
    answer: A
    feedback:
      A: **正解。** 初期化バイアスを打ち消し適切なスケールにします。 [oai_citation:9‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      B: 学習率スケジューリングは別機構です。
      C: Adam はクラッピング機能を持ちません。
      D: AdaGrad 系でなくとも大きさ情報を使います。

  - rubric: 多クラスロジスティック回帰の勾配式を理解している。
    type: multichoice
    title: 006-03-負の対数尤度の勾配
    question: |
      多クラスロジスティック回帰で負の対数尤度 $$L$$ を $$\theta_k$$ で微分した結果として正しいものはどれか。
      ただし $$g_\theta(x)[k]$$ はクラス $$k$$ の予測確率，$$\phi(x)$$ は特徴量変換，$$1\{\cdot\}$$ は指示関数とする。
    choices:
      A: $$\displaystyle \nabla_{\theta_k}L = \frac{1}{n}\sum_{i=1}^n (g_\theta(x_i)[k]-1\{y_i=k\})\phi(x_i)$$
      B: $$\displaystyle \nabla_{\theta_k}L = \frac{1}{n}\sum_{i=1}^n (1\{y_i=k\}-g_\theta(x_i)[k])\phi(x_i)$$
      C: $$\displaystyle \nabla_{\theta_k}L = \sum_{i=1}^n g_\theta(x_i)[k]\phi(x_i)$$
      D: $$\displaystyle \nabla_{\theta_k}L = -\sum_{i=1}^n 1\{y_i=k\}\phi(x_i)$$
    answer: A
    feedback:
      A: 正解です。予測確率と真のラベルの差が勾配を決定します。 [oai_citation:4‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      B: 符号が逆です。
      C: 真値との差が含まれていません。
      D: 予測確率が無視されています。

  - rubric: シグモイドの勾配最大値を計算できる。
    type: multichoice
    title: 007-03-シグモイド勾配のピーク
    question: |
      ロジスティックシグモイド関数 $$ \sigma(u)=\frac{1}{1+e^{-u}} $$ の勾配は
      $$
        \sigma'(u)=\sigma(u)\bigl(1-\sigma(u)\bigr)
      $$
      で与えられる。$$u\in\mathbb{R}$$ 全体での $$ \sigma'(u) $$ の **最大値** はどれか。
    choices:
      A: $$1$$
      B: $$0.25$$
      C: $$0.5$$
      D: 最大値を持たない（無限大に発散する）
    answer: B
    feedback:
      A: 勾配は 1 より小さく抑えられます。
      B: 正解です。$$u=0$$ で $$ \sigma'(0)=0.25 $$ となります。 [oai_citation:0‡第6回.pdf](file-service://file-5y1H8kKj8gAZ63CMWf1xdL)
      C: 0.5 は $$ \sigma(u)=0.5 $$ のときの関数値であり勾配値ではありません。
      D: Sigmoid 勾配は有界です。
