Quizzes:
  - rubric: タスクと学習戦略の違いを説明できる
    type: multichoice
    title: 003-01-タスクと戦略
    question: |
      「分類タスクを教師付き学習で解く」と述べたとき、教師付き学習は何を指すか。
    choices:
      A: 入力特徴量の選択
      B: 学習に用いるデータの持ち方と前提（i.i.d. など）
      C: モデルのパラメータ最適化アルゴリズム
      D: 評価指標に F1 スコアを使うという方針
    answer: B
    feedback:
      A: 特徴量設計は学習戦略とは別。
      B: 正解。教師付き学習はデータの構造と利用方法を定める戦略。
      C: それは最適化手法。
      D: 評価指標の選択に過ぎない。

  - rubric: モデル・損失・最適化の三層構造を理解している
    type: truefalse
    title: 003-02-三層構造再確認
    question: |
      最適化手法を変えてもモデルと損失関数を変えなければ、目的関数の形は変わらない。
    answer: true
    feedback:
      true: 正解。目的関数はモデルと損失で決まり、解き方を何にするかは別層。
      false: 手法は値の求め方を変えるだけで関数自体は同じ。

  - rubric: リスクと経験リスクの関係を説明できる
    type: multichoice
    title: 003-03-リスクの定義
    question: |
      真のリスク $$ R(f) $$ を直接計算できない理由として最も適切なのはどれか。
    choices:
      A: $$ R(f) $$ は損失関数がないと定義できない
      B: 期待値を取る生成分布 $$ p(x,y) $$ が未知だから
      C: サンプルサイズが有限だと計算が面倒なだけで概念上は可能
      D: 損失が 0–1 なら常に $$ R(f) = $$ 経験リスクになる
    answer: B
    feedback:
      A: 損失があれば定義はできるが計算可能とは限らない。
      B: 正解。未知分布なので期待値を積分できない。
      C: 面倒ではなく理論的に不可能。
      D: 0–1 損失でも分布未知なら同じ問題。

  - rubric: ERM と過適合の関係を説明できる
    type: truefalse
    title: 003-04-ERMの限界
    question: |
      経験リスク最小化だけでは、訓練誤差がゼロでも汎化誤差が大きい可能性がある。
    answer: true
    feedback:
      true: 正解。過適合の代表的状況。
      false: 訓練誤差ゼロでも未知データでは失敗しうる。

  - rubric: L2 正則化の数学的効果を理解できる
    type: multichoice
    title: 003-05-L2罰則
    question: |
      目的関数 $$ L(\theta) = \text{EmpRisk} + \beta \|\theta\|^2 $$ において
      $$ \beta \to \infty $$ としたとき、最終的に得られる $$ \theta $$ はどうなるか。
    choices:
      A: 経験リスク最小解に収束
      B: ゼロベクトルに収束
      C: 発散して無限大になる
      D: ハイパーパラメータ選択に依存し一定値で固定
    answer: B
    feedback:
      A: $$ \beta \to 0 $$ の極限。
      B: 正解。罰則が支配的になり $$ \theta = 0 $$ に近づく。
      C: 罰則が正なら発散はしない。
      D: 無限大にする仮定ではない。

  - rubric: 目的関数設計の意図を説明できる
    type: truefalse
    title: 003-06-目的関数設計
    question: |
      正則化項があると経験リスクが必ず小さくなるわけではないが、
      総合的な目的関数 $$ L(\theta) $$ は小さくできる可能性がある。
    answer: true
    feedback:
      true: 正解。罰則で損失が増えても $$ L $$ は下がる余地がある。
      false: 正則化はしばしば経験リスクを犠牲にする。

  - rubric: 検証・テストデータの役割を区別できる
    type: multichoice
    title: 003-07-データ分割
    question: |
      テストデータをモデル選択に使うと起こる最も深刻な問題は何か。
    choices:
      A: 訓練時間が長くなる
      B: 過適合がテストセットにも広がり真の性能推定が歪む
      C: ハイパーパラメータの候補が減る
      D: テストデータのラベルが不要になる
    answer: B
    feedback:
      A: 時間とは無関係。
      B: 正解。性能見積りが楽観的バイアスを持つ。
      C: 候補数の問題ではない。
      D: 逆にラベルは必須。

  - rubric: 近似ターゲットの定義を言語化できる
    type: multichoice
    title: 003-21-近似ターゲットとは
    question: |
      機械学習の文脈で「近似ターゲット（approximate target）」と呼ばれるものは何を指すか。
    choices:
      A: 訓練誤差が最小になるパラメータ値
      B: リスク $$ R(f) $$ を与えられた仮説クラス内で最小にする関数
      C: テストデータで最高精度を示したモデル
      D: 検証データで早期停止した時点のモデル
    answer: B
    feedback:
      A: 経験リスク最小解であり、真のリスク最小とは限らない。
      B: 正解。損失関数と仮説クラスが決まれば一意に定まる。
      C,D: 評価や学習停止の産物であり定義が異なる。

  - rubric: 損失関数によって近似ターゲットが変化することを理解している
    type: truefalse
    title: 003-22-損失と近似ターゲット
    question: |
      同じ仮説クラスでも、二乗損失と 0–1 損失では近似ターゲットとして得られる関数が一般に異なる。
    answer: true
    feedback:
      true: 正解。二乗損失は条件付き期待値、0–1 損失はベイズ判別器になる。
      false: 損失が変わればリスクの形が変わるため同じにはならない。

  - rubric: 二値交差エントロピー損失の近似ターゲットを答えられる
    type: multichoice
    title: 003-23-BCEの近似ターゲット
    question: |
      ラベル $$ y \in \{0,1\} $$、入力 $$ x $$ に対し二値交差エントロピー損失を用いるとき、
      真のリスクを最小化する近似ターゲット $$ g^*(x) $$ は次のどれか。
    choices:
      A: $$ 1\{p(y=1|x) \geq 0.5\} $$
      B: $$ p(y=1|x) $$
      C: $$ \mathbb{E}[y|x] - 0.5 $$
      D: 常に 0.5
    answer: B
    feedback:
      A: 0–1 損失の場合の近似ターゲット。
      B: 正解。確率そのものを出力するのが BCE の最適解。
      C: 条件付き期待値だが範囲が異なる。
      D: データ分布を無視している。
