Quizzes:
  - rubric: 回帰タスクの基本的定義を理解している．
    type: multichoice
    title: <講義の回数番号00d>-[問題番号0d]-簡潔な見出し
    question: |
      次の中で，．．．
      （数式は全てLaTeXで，インラインの場合は $$ $$ によって囲み，改行を入れる場合は $$ $$ によって囲む記法で記載する．）
    choices:
      A: やっほー
      B: こんにちは
      C: あなたはあああ
      D: 私はまるまる
    answer: B
    feedback:
      A: 説明が逆です．
      B: 正解です．
      C: 実際は異なります．
      D: 必ずしも正解ではありません．

  - rubric: AがBではないことを理解している．
    type: truefalse
    title: <講義の回数番号:00d>-[問題番号0d]-簡潔なタイトル（見出し）
    question: |
      AはBである．
    answer: false
    feedback:
      true: 説明が逆です．
      false: 正解です．
