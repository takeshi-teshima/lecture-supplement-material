config:
  format: markdown
Quizzes:
  - rubric: 自己教師付き学習の正例生成を説明できる．
    type: multichoice
    title: 010-01-正例ペアの作製
    question: |
      自己教師付き対照学習で「正例ペア」を作る典型的な操作はどれか。
    choices:
      A: 異なるデータサンプル同士をランダムに組み合わせる
      B: 同じ入力データに 2 種類のランダム変換を施して，得られた 2 サンプルを組にする
      C: 1 枚の入力をそのまま複製した全く同一サンプル 2 つを組にする
      D: ランダムノイズで生成したベクトル 2 本を組にする
    answer: B
    feedback:
      A: 負例となる可能性が高く正例には不適です．
      B: 正解です．このようにデータを増やす処理を「データ拡張」と呼びます．拡張後も同一の「意味」を保つと見なして正例を作ります．
      C: 変換が無いと学習が自明なもの（無意味なもの）になりやすいです．
      D: 意味的な関係がなく学習信号になりません．

  - rubric: 画像をテンソルとみなすことを理解している．
    type: truefalse
    title: 010-02-画像とテンソル
    question: |
      RGB 画像は「高さ × 幅 × 3 チャンネル」の 3 次テンソルとして扱える。
    answer: true
    feedback:
      true: 正解です．各ピクセル位置に 3 つの値が格納されます．
      false: RGB 画像は 2 次行列ではなく 3 次テンソルです．

  - rubric: インスタンス vs セマンティックセグメンテーションを区別できる．
    type: truefalse
    title: 010-03-セグメンテーションの種類
    question: |
      インスタンスセグメンテーションは，同じ「犬」が 2 匹写っていればそれぞれ別ラベルを付けるが，セマンティックセグメンテーションでは 2 匹を区別しない。
    answer: true
    feedback:
      true: 正解です．前者は物体を個々に識別します．
      false: 区別しないのはセマンティックセグメンテーションです．

  - rubric: 無条件生成と条件付き生成を区別できる．
    type: truefalse
    title: 010-04-生成の条件
    question: |
      テキスト「虹色のネモフィラ」を入力し対応する画像を出力するモデルは「無条件生成」に分類される。
    answer: false
    feedback:
      true: テキスト条件があるため無条件ではありません．
      false: 正解です．これは条件付き生成です．

  - rubric: 畳み込み演算を具体的に計算できる．
    type: multichoice
    title: 010-05-畳み込み数値計算
    question: |
      入力
      $$X = \begin{bmatrix}
        1 & 2 & 0\\
        3 & 1 & 2\\
        0 & 2 & 1
      \end{bmatrix}$$
      に対し，カーネル
      $$W = \begin{bmatrix}
        1 & 0\\
        -1 & 1
      \end{bmatrix}$$
      を用いて **畳み込み $$W \star X$$** を計算する

      これにより得られる出力行列として正しいものはどれか。

      （補足：ここでいう畳み込みは講義で説明したもので，数学ではこれは相互相関と呼ばれるものであることに注意．なお，講義では解説していないハイパーパラメーターとして，パディングとストライドがあるが，パディングはなし，ストライドは 1 とする）．
    choices:
      A: |
        $$\begin{bmatrix}
          -1 & 2\\
           4 & 0
        \end{bmatrix}$$
      B: |
        $$\begin{bmatrix}
           0 & 4\\
           4 & 0
        \end{bmatrix}$$
      C: |
        $$\begin{bmatrix}
           1 & 2\\
           3 & 1
        \end{bmatrix}$$
      D: |
        $$\begin{bmatrix}
          -1 & 3\\
           5 & 0
        \end{bmatrix}$$
    answer: D
    feedback:
      A: 一部パッチ計算までは正しいものの，符号あるいは和で誤りがあります．
      B: 誤りです．これは，カーネルを転置してから計算した結果です．
      C: 入力行列をそのまま写した誤答です．畳み込み計算を行っていません．
      D: 正解です．
