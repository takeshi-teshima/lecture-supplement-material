Quizzes:
  - rubric: モデル出力と確率値との整合性を理解している。
    type: truefalse
    title: 005-01-モデルの出力の要件
    question: |
      ロジスティック回帰モデルの出力は，常に $$ [0,1] $$ の範囲に収まるので，確率値としての要件を満たす。
    answer: true
    feedback:
      true: 正解です。ロジスティック関数によって出力が確率値になります。
      false: 実際にはロジスティック関数で [0,1] に変換しているため、確率値となっています。

  - rubric: ロジスティック関数の関数形を，実際に計算を行うことを通して理解したことがある
    type: multichoice
    title: 005-02-ロジスティック関数
    question: |
      ロジスティック関数（シグモイド関数）は次のように定義される：
      $$
      \sigma(z) = \frac{1}{1 + e^{-z}}
      $$

      以下の中で正しいものはどれか。
    choices:
      A: $$ \sigma(\log 2) = \frac{2}{5} $$
      B: $$ \sigma(\log 7) = \frac{7}{10} $$
      C: $$ \sigma(\log 5) = \frac{5}{11} $$
      D: $$ \sigma(\log 3) = \frac{3}{4} $$
    answer: D
    feedback:
      A: 誤りです。$$ \sigma(\log 2) = \frac{2}{3} $$ です。
      B: 誤りです。$$ \sigma(\log 7) = \frac{7}{8} $$ です。
      C: 誤りです。$$ \sigma(\log 5) = \frac{5}{6} $$ です。
      D: 正解です。$$ \sigma(\log 3) = \frac{3}{4} $$ となります。

  - rubric: シグモイドの場合の勾配の式を詳しく見たことがある
    type: truefalse
    title: 005-03-シグモイドモデルの勾配の向き
    question: |
      モデル $$ g_{\theta}(x) = \sigma(s_{\theta}(x)) $$ において，
      $$ \sigma(z) = \frac{1}{1 + e^{-z}} $$ はロジスティック関数（シグモイド関数）とする．

      正例 $$(x, 1)$$ に対する負の対数尤度損失関数は
      $$
      \ell((x, 1), g_{\theta}(x)) = -\log g_{\theta}(x)
      $$
      で与えられ，そのパラメーター勾配は次式で表される：
      $$
      \nabla_{\theta} \ell((x, 1), g_{\theta}(x)) = (g_{\theta}(x) - 1) \nabla_{\theta} s_{\theta}(x)
      $$

      このとき，次は正しいか？

      この正例に対する勾配ベクトル $$ \nabla_{\theta} \ell $$ は，
      パラメーターの微小変化において，
      モデルの中間出力 $$ s_{\theta}(x) $$ を最も大きく増加させる方向（最急上昇方向）を指す。
    answer: false
    feedback:
      true: |
        誤りです。
        この正例に対する勾配ベクトル $$ \nabla_{\theta} \ell $$ は，
        パラメーターの微小変化において $$ s_{\theta}(x) $$ の**最急降下方向**を指します。

        まず，勾配 $$ \nabla_{\theta} s_{\theta}(x) $$ は $$ s_{\theta}(x) $$ の最急上昇方向ですが，
        $$ g_{\theta}(x) $$ は確率値なので，常に $$ 0 \leq g_{\theta}(x) \leq 1 $$ を満たします。
        したがって，正例においては $$ g_{\theta}(x) - 1 \leq 0 $$ となり，
        勾配ベクトルは $$ s_{\theta}(x) $$ を**小さくする方向**を向きます。

        あれ，正例なのに出力を大きくする方向じゃないの？と思いますよね。
        そのとおりです。しかし，よく考えると，勾配降下法ではこの勾配の**逆方向**，つまり
        にパラメータを更新するため，更新は $$ - \nabla_{\theta} \ell $$ の方向に行われます。
        それにより，$$ s_{\theta}(x) $$ は増加し，$$ g_{\theta}(x) $$ は 1 に近づくように学習が行われます。

      false: |
        正解です。
        この正例に対する勾配ベクトル $$ \nabla_{\theta} \ell $$ は，
        パラメーターの微小変化において $$ s_{\theta}(x) $$ の**最急降下方向**を指します。

        まず，勾配 $$ \nabla_{\theta} s_{\theta}(x) $$ は $$ s_{\theta}(x) $$ の最急上昇方向ですが，
        $$ g_{\theta}(x) $$ は確率値なので，常に $$ 0 \leq g_{\theta}(x) \leq 1 $$ を満たします。
        したがって，正例においては $$ g_{\theta}(x) - 1 \leq 0 $$ となり，
        勾配ベクトルは $$ s_{\theta}(x) $$ を**小さくする方向**を向きます。

        あれ，正例なのに出力を大きくする方向じゃないの？と思いますよね。
        そのとおりです。しかし，よく考えると，勾配降下法ではこの勾配の**逆方向**，つまり
        にパラメータを更新するため，更新は $$ - \nabla_{\theta} \ell $$ の方向に行われます。
        それにより，$$ s_{\theta}(x) $$ は増加し，$$ g_{\theta}(x) $$ は 1 に近づくように学習が行われます。

  - rubric: 負の対数尤度による学習が，確率分布の推定として用いられる理由を相対化して理解できている
    type: multichoice
    title: 005-04-負の対数尤度を損失関数とする理由
    question: |
      モデル $$ q(y \mid x) $$ によって条件付き確率を近似するように学習する際，
      損失関数として負の対数尤度（negative log likelihood）が用いられることが多い．

      この選択が取られる理由を最も的確に説明した選択肢はどれか．
    choices:
      A: 確率値は0から1の範囲にあり，1に近い値に対しては対数値を用いるほうが計算が安定するから。
      B: 負の対数尤度のデータに関する期待値の最小化における近似ターゲットが、データの分布における条件付き確率関数になるから。
      C: データに対するモデルの尤もらしさ（もっともらしさ）の最大化になるから。
      D: 0-1損失とは異なり、負の対数尤度は正則化と組み合わせやすいから。
    answer: B
    feedback:
      A: 対数により確率値の積を和の形に分解できることは計算の安定性に寄与しますが，この安定性は1に近い値よりも0に近い値においてもたらされます．また，計算の安定性は副次的な利点であり，ここでの主要な理由ではありません。
      B: |
        正解です。負の対数尤度の期待値である交差エントロピーの最小化は，データの分布 $$ p(y \mid x) $$ に対するKLダイバージェンス $$ \mathrm{KL}(p \| q) $$ の最小化と等価になります。
        そして、KLダイバージェンスの最小化における近似ターゲットは、条件付き確率 $$p(y \mid x)$$ です。
      C: もっともらしさの最大化であると解釈できるという説明はあくまでレトリックであり、それ自体が十分な理由付けであるとは言えません。正解の選択肢のほうがより的確です。
      D: 他の損失関数と比べて正則化と組み合わせやすくなる要因はありません。

  - rubric: KLダイバージェンスの非対称性理解
    type: multichoice
    title: 005-05-KLダイバージェンスの対称性
    question: |
      KLダイバージェンスについて正しい記述はどれか？
    choices:
      A: 対称な量である
      B: 非対称な量である
      C: 常にゼロである
      D: 常に正の値である
    answer: B
    feedback:
      A: 対称ではありません。
      B: 正解です。
      C: ゼロとは限りません。
      D: 2つの引数が同じ分布の場合はゼロになります。
