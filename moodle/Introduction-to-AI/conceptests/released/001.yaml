Quizzes:
  - type: multichoice
    title: 001-01-特徴量とは
    question: |
      「特徴量」に関する説明として適切なのはどれか。
    choices:
      A: 予測対象となる変数
      B: 最適化されるモデルのパラメーター
      C: 予測を行うための入力として用いる変数
      D: データに含まれるノイズ成分
    answer: C
    feedback:
      A: これはラベルの説明です。
      B: これはパラメーターの定義です。
      C: 正解です。
      D: ノイズは特徴量とは異なります。

  - type: multichoice
    title: 001-02-ラベルとは
    question: |
      以下は4人の学生による「ラベル」の説明である。この中で、正しい説明はただ一人である。正しい説明は誰のものか。
    choices:
      A: Aさん「『ラベル』とは、データを分類する際に使われる『カテゴリーの名前』のことである。回帰のような数値予測では『ラベル』という用語は適切ではない。」
      B: Bさん「『ラベル』という用語は、予測系タスクで『予測される変数』に付けられる名前である。『ラベル』は質的変数だけでなく、数値など量的な値も含まれる。」
      C: Cさん「『ラベル』は、データを分けるための『特徴』を指す用語であり、予測対象ではなく入力データに属する。」
      D: Dさん「『ラベル』というのは『正解』を意味し、実際にデータを測定したときに誤差が絶対に存在しない『真の値』を指している。」
    answer: B
    feedback:
      A: >
        Aさん（よくある誤解）
        多くの初学者が直感的に陥りやすい誤解．
        → 学び：「ラベル」という言葉は、分類タスクだけでなく回帰タスクなどの数値予測においても同様に用いられることを知る。
      B: 正解です。
      C: >
        Cさん（特徴量との混同）
        特徴量（入力）とラベル（予測対象）を混同している非常に典型的な間違い。
        → 学び：「特徴量」と「ラベル」は明確に役割が異なる。「ラベル」は必ず「予測の対象」であることを再確認する。
      D: >
        Dさん（真の値との混同）
        「ラベル」と「真の値」は概念として近いが、実際には測定時に誤差が含まれる可能性があり、「ラベル」は「実際にデータセットとして与えられた正解（観測値）」に過ぎない。
        → 学び：「ラベル」は必ずしも誤差ゼロの真実の値を指すのではない。「現実の観測データ」であり、測定誤差やノイズを含む可能性があることを知る。

  - type: multichoice
    title: 001-03-モデルとは
    question: |
      以下の説明のうち、「モデル」の説明として（相対的に）最も的確なのはどれか？
    choices:
      A: 良い予測器を作製するための手続きや手法
      B: 訓練データそのもの（観測された入力と出力のペアの集合）
      C: パラメーターで調整可能な関数でもあり、関数の集合ともいえる
    answer: C
    feedback:
      A: これは「学習法」の説明であり、「モデル」ではありません（「使用するモデルの選択まで含めて学習法と呼ぶべきだ」という主張であればありえます）。
      B: これは「訓練データ」の説明です。モデルとはデータではなく、関数の集合です。
      C: 正解です。「モデル」は予測器の集合であり、具体的なパラメーターで特定の予測関数になります。

  - type: multichoice
    title: 001-04-リスク関数の定義
    question: |
      リスク関数とは何か。
    choices:
      A: 損失関数の最小値
      B: 損失の期待値
      C: 経験リスクの最大値
      D: パラメーターの総和
    answer: B
    feedback:
      A: リスクは期待値で定義されます。
      B: 正解です。
      C: これはまったく別の概念です。
      D: パラメーターは定義に関係ありません。

  - type: multichoice
    title: 001-05-リスクと経験リスク
    question: |
      以下の説明で、「リスク」と「経験リスク」の違いについて正しく述べているのはどれか？
    choices:
      A: 経験リスクは真のデータ分布から計算した理想値で、リスクは訓練データから計算した値である。
      B: リスクは損失の期待値であり、経験リスクは実際のデータから計算されるリスクの近似値である。
      C: リスクと経験リスクは常に一致し、どちらを使っても同じ結果になる。
      D: 経験リスクはリスクよりも常に小さい値を取ることが理論的に保証されている。
    answer: B
    feedback:
      A: 説明が逆です。
      B: 正解です。これがリスクと経験リスクの正しい関係です。
      C: 実際は異なります。
      D: 必ずしも経験リスクが小さいとは限りません。
