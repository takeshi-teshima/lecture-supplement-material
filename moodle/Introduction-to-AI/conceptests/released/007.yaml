Quizzes:
  - rubric: 自動微分が計算グラフ一般に適用できる事実を理解している
    type: truefalse
    title: 007-01-自動微分の適用範囲
    question: |
      次の主張は正しいか。
      「順伝播型ニューラルネットワーク(FNN)は，誤差逆伝播による勾配計算を行うことができる。
      これは他のもっと複雑なアーキテクチャとは異なる利点である。
      この利点のため，FNNは多くのアーキテクチャの構成要素としてよく用いられる。」
    answer: false
    feedback:
      true: 誤りです。CNN や RNN など **任意の微分可能な計算グラフ** に対し，誤差逆伝播（自動微分）はそのまま適用できます。順伝播型 NN だけの特権ではありません。
      false: 正解です。誤差逆伝播はアーキテクチャを問わず利用できるため，「順伝播型のみ勾配計算可能」ではありません。

  - rubric: 逆伝播計算に先立って順伝播が必要となる理由を説明できる
    type: multichoice
    title: 007-02-順伝播が必要な理由
    question: >
      合成関数の微分法則は、例えば次のように表される。
      $$ \frac{\partial L}{\partial x} = \frac{\partial L}{\partial y} \cdot \frac{\partial y}{\partial x}. $$
      この式は、出力側の変数から入力側の変数へと順に偏微分の積をとれば合成関数の微分を計算できるということを表している。

      この関係を中間変数ごとに繰り返し適用すれば，
      ニューラルネットワーク全体の勾配を出力側から入力側へ向けて計算できる。
      これが誤差逆伝播法の原理である。

      実装では，まず順伝播 (forward pass)を 1 回走らせたあとに
      逆伝播 (backward pass)で計算グラフを逆順にたどり
      局所偏微分の積を取ることで勾配を求めるのが常である。

      なぜ逆伝播の前に順伝播を必ず 1 度行う必要があるのか。
      次のうち最も適切な説明を選べ。
    choices:
      A: 順伝播で各層の出力（活性値）を計算しておかないと，
         逆伝播で合成関数の微分の連鎖律を適用する際に局所勾配（計算グラフの部分ごとの勾配）を計算できないから。
      B: 順伝播を行うことで、ネットワークのパラメータを初期化する必要があるから。
      C: 逆伝播は順伝播の結果に依存しないため、実際には順伝播は省略可能だが慣例的に入れているだけである。
      D: 順伝播を一度行うとモデルの出力が $$[0, 1]$$ の範囲に正規化され、学習の安定化につながるから。
    answer: A
    feedback:
      A: >
        正解。逆伝播で用いる局所微分
        $$\frac{\partial L}{\partial y}$$ や $$\frac{\partial y}{\partial x}$$ などの計算には
        順伝播時の **具体的な中間値 $$x,y$$** が必要。
        したがって各層の出力（活性値）を使用しないと
        勾配を数値として評価できない。
      B: >
        パラメータの初期化はモデル構築時に行われており，
        順伝播の必要性とは無関係である。
      C: >
        逆伝播は順伝播で得る中間値がなければ計算を実行できない。
      D: >
        誤差逆伝播のために順伝播を行うのは、そもそも **活性値の計算に必要だから** であって，
        学習の安定化とは関係ない。

  - rubric: Softmax の温度パラメータの効果を説明できる。
    type: multichoice
    title: 007-03-温度スケーリング
    question: |
      ソフトマックス関数にパラメーター $$T>0$$ （温度パラメーターという） を導入して
      $$
        \mathrm{Softmax}_T(z)[k] := \frac{\exp(z_k/T)}{\sum_{j=1}^K \exp(z_j/T)}
      $$
      と定義する。
      **$$T$$ を大きくする** とき、$$\mathrm{Softmax}_T$$の出力の確率値ベクトルに生じる変化として正しいものはどれか。
    choices:
      A: 分布がシャープになり，一番大きい成分に確率が集中する。
      B: 分布がフラットになり，確率がクラス間で一様な分布 $$\left(\frac{1}{K}, \ldots, \frac{1}{K}\right)$$ に近づく。
      C: すべての成分が同じ値 $$1/K$$ になる。
      D: 温度は数値安定性のためのテクニックであり確率分布自体は変化しない。
    answer: B
    feedback:
      A: $$T$$ を **小さく** するときの挙動です。
      B: 正解です。大きな温度は確率を平滑化します。
      C: $$T\to\infty$$ の極限では近づきますが有限 $$T$$ では厳密には一致しません。
      D: 温度は分布の形を直接変えます。

  - rubric: 非構造化データと構造化データを区別できる
    type: multichoice
    title: 007-04-構造化データ
    question: |
      次のデータのうち、**構造化データ** に分類されるものはどれか。
    choices:
      A: 顧客アンケートの自由回答テキスト
      B: RGB 犬画像のピクセル行列
      C: 売上・降水量・休日フラグを列にもつ店舗日次データ
      D: 2 分間の音声 WAV ファイル
    answer: C
    feedback:
      A: 「位置と意味の対応が固定でない」非構造化データである。
      B: 「位置と意味の対応が固定でない」非構造化データである。
      C: 正解。列名があり位置と意味が対応した表形式データ＝構造化データ。
      D: 「位置と意味の対応が固定でない」非構造化データである。

  - rubric: ニューラルネットと線形モデルの“特徴写像”の立場を対比できる
    type: multichoice
    title: 007-05-特徴写像の違い
    question: |
      「特徴写像 (feature map)」という観点で **順伝播型ニューラルネット (FNN)** と
      **固定特徴を使う線形モデル** とを比較する。
      次の説明のうち、FNN の特徴写像に関する記述として最も的確なものを 1 つ選べ。
    choices:
      A: >
        FNN では入力 $$\mathbf x$$ を **あらかじめ決めた固定写像**
        $$\varphi(\mathbf x)$$ に通し、その後の線形層は
        *学習不可能* な定数行列である。
      B: >
        FNN は入力 $$\mathbf x$$ に対して多層の **学習可能パラメーター付き写像で**
        変換を施す。つまり、特徴写像も含めて学習可能なモデルとみなせる。
      C: >
        FNN では最終層を除くすべての写像を特徴写像とみなして
        事前にランダムな初期化で固定しておき、学習時に更新するのは線形重みだけである。
      D: >
        FNN の特徴写像は、事前に人手で特徴量エンジニアリングするのが一般的である。
    answer: B
    feedback:
      A: >
        誤り。これは線形モデルに当たる構造の説明だが、その場合であっても線型層は学習可能なパラメータを持つ。
      B: >
        正解。順伝播型 FNN は多層の非線形変換を通じて入力を変換し、
        そのパラメーターもデータに基づいて最適化する。
      C: >
        誤り。FNN の特徴写像は **学習可能なパラメータ** を持つ。
        記載の通りの構造は線形モデルに当たる。
      D: >
        ニューラルネットの特徴写像は、人手での特徴量エンジニアリングを行うことはほとんどない。
        アーキテクチャの設計はよく行われるが、具体的なパラメーターの値は学習によってデータから決定されることが一般的である。
