config:
  format: markdown
Quizzes:
  #――― ① 生産性・雇用・スキル ─────────────────────────
  - rubric: 汎用技術 (GPT) の 3 条件を挙げられる
    type: multichoice
    title: 014-01-GPT の要件
    question: |
      Lipsey et al. (2005) が示す汎用技術（General-Purpose Technology, GPT）の基準に **含まれない** のはどれか．
    choices:
      A: 長期的な性能向上
      B: 用途の多様さと普及率の高さ
      C: 初期投資の回収率の高さ
      D: 他技術への波及効果
    answer: C
    feedback:
      A: 含まれる条件です．
      B: 含まれる条件です．
      C: "**正解**．投資回収率は GPT 条件に含まれません．"
      D: 含まれる条件です（補完的波及効果）．

  #――― ② 倫理・安全・ガバナンス ────────────────────────
  - rubric: ハルシネーション対策の具体策を説明できる
    type: multichoice
    title: 014-02-ハルシネーション対策
    question: |
      大規模言語モデルの使用時にハルシネーション（事実と異なる内容を生成する現象）を低減するために
      **有効だと考えられる対策** はどれか．
    choices:
      A: モデルの温度パラメータをできる限り高く設定して多様性を最大化する
      B: 外部の信頼できるデータベースをリアルタイムに照会し，取得情報を入力に付加して生成させる仕組みを導入する
      C: 入力トークンの一部をランダムに置換してから生成を行う
      D: 学習データを完全に非公開とし，透明性を下げる
    answer: B
    feedback:
      A: 温度を高くするとランダム性が増し，ハルシネーションも増える傾向があります．
      B: "**正解**．外部知識を検索して生成に取り込む「検索拡張生成（Retrieval-Augmented Generation, RAG）」により，事実への忠実性を高められます．"
      C: 無意味な置換は誤情報を助長します．
      D: 透明性を下げてもハルシネーション低減には寄与しません．

  - rubric: 安全の定義を ISO/IEC ガイドに沿って説明できる
    type: truefalse
    title: 014-03-安全と許容リスク
    question: |
      ISO/IECガイド51:2014 では「安全」は「リスクがゼロの状態」と定義されている．
    answer: false
    feedback:
      true: 誤りです．ISO/IECガイド51:2014は「許容できないリスクがない状態」（freedom from risk which is not tolerable）と定義しています．安全＝リスクゼロではありません．
      false: "**正解**．ISO/IECガイド51:2014は「許容できないリスクがない状態」（freedom from risk which is not tolerable）と定義しています．"

  #――― ③ 環境負荷 ──────────────────────────────────
  - rubric: 大規模モデル学習の環境負荷指標を挙げられる
    type: multichoice
    title: 014-04-水資源消費
    question: |
      Li et al. (2025) によれば，GPT-3 規模のモデルの学習に伴い冷却で蒸発する淡水量はどの程度と推計されたか（モデルの学習時の水資源消費に関する推計．モデルの使用時の水資源消費は含まない）．
    choices:
      A: 約 70 万リットル
      B: 約 7 万リットル
      C: 約 700 万リットル
      D: 約 70 リットル
    answer: A
    feedback:
      A: "**正解**．約70万リットルと推計されています．一般的な学校のプールに換算すると約 2.3 杯分に相当するようです（一般的な学校のプールは300立方メートル程）．"
      B: 誤り．桁が異なります．
      C: 誤り．桁が異なります．
      D: 誤り．桁が異なります．

  #――― ④ AI 関連法規 ─────────────────────────────────
  - rubric: AI 法（日本）の公布年を答えられる
    type: multichoice
    title: 014-05-AI 法の年
    question: |
      日本の「AI 法」が公布・施行された／されるのは西暦何年か．
      （※正式名称：人工知能関連技術の研究開発及び活用の推進に関する法律）
    choices:
      A: 2023 年
      B: 2024 年
      C: 2025 年
      D: 2026 年
    answer: C
    feedback:
      A: 違います．
      B: 違います．
      C: "**正解**（2025 年 6 月 4 日公布・同日施行）．"
      D: 違います．
