config:
  format: markdown
Quizzes:
  - rubric: トークンと単語の区別を理解している
    type: multichoice
    title: 011-01-トークンと単語の違い
    question: |
      次の説明のうち **正しいものはどれか**。
    choices:
      A: トークンとは辞書に載る語（見出し語）のことを指し，句読点や絵文字は含まない．
      B: トークナイザーは常に空白文字で区切ってトークン列を得るため，日本語では使えない．
      C: 適切なサブワードトークナイザーと十分なデータを用いると，未知語発生をほとんど抑制できる．
      D: トークンとは形態素解析で得られる「形態素」そのもので，粒度はどのツールでも固定である．
    answer: C
    feedback:
      A: 記号や絵文字もトークンに含まれ得ます．
      B: 日本語では形態素解析器やサブワードトークナイザーが用いられます．常に空白で区切るわけではありません．
      C: 正解．サブワードトークナイザーでは最終的に 1 文字単位まで分割するため未知語が出にくい．ただし，トークナイザーの学習時のデータに存在しない文字などは未知トークンになる可能性があります．
      D: トークンは形態素そのものという説明は誤りです．また，トークンの粒度はツール・設定・データ等で変動し得ます．固定ではありません．

  - rubric: 系列ラベリングと分類の違いを理解
    type: multichoice
    title: 011-02-系列ラベリング
    question: |
      次のうち系列ラベリングに **該当しないタスク** はどれか。
    choices:
      A: 固有表現認識（BIOフォーマット）
      B: 品詞タグ付け
      C: 文書感情分類
      D: 単語の意味役割付与
    answer: C
    feedback:
      A: 固有表現の開始 (B) / 内部 (I) / 外部 (O) を各トークンに付与する典型的な系列ラベリングです。
      B: 各トークンへ品詞タグを割り当てる系列ラベリングです。
      C: 正解．これは，文書単位でラベル1つを割り当てる，文書分類のタスクであって，系列の1要素ごとのラベリングをするタスクではありません．
      D: 単語の意味役割付与（semantic role labeling）は，文中の各述語に対して AGENT・PATIENT などの役割タグをトークン（あるいはスパン）単位で割り当てる系列ラベリングタスクです．

  - rubric: 系列変換タスク(seq2seq)の範囲を理解
    type: multichoice
    title: 011-03-どれがseq2seqか？
    question: |
      以下のうち **系列変換タスク（seq2seq＝可変長出力列を生成するタスク）として最も適さない** ものはどれか．
    choices:
      A: 機械翻訳
      B: 文書要約
      C: 固有表現認識（BIOフォーマット）
      D: 対話応答生成
    answer: C
    feedback:
      A: >
        不正解。機械翻訳は入力言語のトークン列を別言語のトークン列へ **長さが変わる形で変換** する典型的な seq2seq タスクです。
      B: >
        不正解。文書要約も入力文書列を **短い要約列へ変換** するため、seq2seq の代表例に数えられます。
      C: >
        正解。NER は入力系列→出力ラベル系列で長さが一致することが要請されるため，
        一般に系列長が入出力で変化する「系列変換（seq2seq）」タスクとは区別されます。
      D: >
        不正解。対話応答生成はそれまでの対話履歴やユーザ発話から新しい応答列を生成する **seq2seq** の一種です。

  - rubric: STS の用途を説明できる
    type: multichoice
    title: 011-04-STSの用途
    question: |
      テキストの意味的類似度計算（semantic textual similarity, STS）を直接活用する場面として最も適切なのは次のうちどれか．
    choices:
      A: スパム検出
      B: セマンティック検索での，関連文書のランキング
      C: 多言語翻訳
      D: トークナイザーの語彙削減
    answer: B
    feedback:
      A: 文書分類タスクであり，通常STSが直接的に用いられるタスクではない．STSスコアをスパム検出へ直接入力とする設計（最近傍法など）は少数派で，通常はタスクに合わせて学習された特徴量が用いられる．
      B: 正解．STS は検索やランキングに直結する．
      C: 多言語翻訳は系列変換タスクであり，STS の直接的な用途ではない．
      D: トークナイザーの語彙削減には STS は直接関与しない．

  - rubric: 分布仮説の本質を説明できる
    type: multichoice
    title: 011-05-分布仮説
    question: |
      自然言語処理でよく引用される **分布仮説 (distributional hypothesis)** を説明した文として正しいものはどれか。
    choices:
      A: 単語の意味を捉えるには、その単語がどの語と頻繁に共起するかを見るとよい，という考え方のもとになっている．
      B: 同じ単語がどんな文脈で使われても常に同じ意味を持つという主張がしたがう仮説であるため，同分野において最も非自明な事前知識とされている．
      C: 分布仮説とするのは誤訳で，より正確には「流通仮説」と訳されるべきである．「新規の単語の出典は，単語の出現頻度を見ることで最初の使用例を推定できる」という考え方である．
      D: テキストデータの条件付き生成を扱う上では，文脈となる情報を条件付けることにより性能を向上できるという考え方である．
    answer: A
    feedback:
      A: 正解．共起分布が意味情報を与えるという分布仮説を正しく述べています．
      B: 不正解．文脈が変われば同じ語でも異なる意味合いを帯び得るという可能性を，分布仮説は排除していません．
      C: 不正解．この選択肢は出鱈目に書いたダミーです（選択肢に記載されているような仮説自体がありません）．
      D: 不正解．無関係な内容です．
