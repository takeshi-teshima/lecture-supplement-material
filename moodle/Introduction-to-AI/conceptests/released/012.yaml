config:
  format: markdown
Quizzes:
  - rubric: テキスト生成におけるよくある不正確な説明を回避できる
    type: truefalse
    title: 012-01-自己回帰型の生成
    question: |
      自己回帰的な生成は，「最も確率が高い次トークンを出力すること」によって行われる．
    answer: false
    feedback:
      true: >
        これはよくある誤解・不正確な説明です．
        一般には生成結果がいくらかの多様性を持つこともタスクとして要請されるため，
        最も確率が高い次トークンではなく，ある程度確率が高いトークンは生成候補となります．
      false: >
        問題文は誤りです．
        自己回帰的な生成は，次トークンの確率分布からサンプリングすることによって行われます．
        このとき，例えば温度パラメーターを極端に小さくすると最も確率が高いトークンばかり選ばれるような
        振る舞いにすることも可能ですが，一般には多様な生成結果を得ることもタスクの目的に含まれるため，
        必ずしも最も確率が高くない次トークンであっても生成されるのが普通です．
