config:
  format: markdown
Quizzes:
  - rubric: Self-attention の Query と Key の次元が一致すべき理由を説明できる
    type: multichoice
    title: 012-01-クエリとキーの次元
    question: |
      アテンション層で Query と Key の次元を一致させる主な理由は何か．
    choices:
      A: Softmax の計算量を減らすため
      B: 内積で類似度を計算するので次元を揃える必要があるため
      C: バリューの長さと合わせる慣習があるため
      D: 勾配の値が過剰に大きくなることを防ぐため
    answer: B
    feedback:
      A: 計算量の問題ではありません．
      B: 正解．内積による類似度は同次元空間で定義される．
      C: バリューの次元と一致させる必要はない．バリューの次元は出力として欲しい次元とする必要がある．
      D: この選択肢は出まかせです．

  - rubric: 位置エンコーディングの目的を説明できる
    type: truefalse
    title: 012-02-位置情報の注入
    question: |
      工夫のないアテンションはトークンの並び順が結果に影響を与えない（※）ため，別途位置エンコーディングで順序情報を加える工夫が用いられる．

      ※正確には，トークンの位置を入れ替えると，それに応じて出力ベクトルも位置が入れ替わるだけであり，個別の出力ベクトルの値が変わらない．
    answer: true
    feedback:
      true: 正解
      false: 通常のアテンション層だけでは順序が失われる．

  - rubric: 次トークン予測の目的関数を理解している
    type: multichoice
    title: 012-03-次トークン予測の最尤法による学習
    question: |
      次トークン予測による言語モデルの学習に用いられる損失関数として正しいものはどれか．

      ここで $$S = (\omega_0 \cdots \omega_T)$$ は入力系列（$$\omega_0$$ は開始トークン）とする．
      また，$$p_\theta(\omega_t \mid \omega_0 \cdots \omega_{t-1})$$ は条件付き確率モデル，
      $$p_\theta(\omega_t)$$ はそこから誘導される周辺分布とする．
      さらに，$$q$$は$$S$$における単語の出現確率分布とする．
    choices:
      A: $$-\sum_{t=0}^{T}\log p_\theta(\omega_t)$$
      B: $$-\sum_{t=1}^{T}\log p_\theta(\omega_t \mid \omega_0,\ldots,\omega_{t-1})$$
      C: $$-\sum_{t=1}^{T}\log p_\theta(\omega_t \mid \omega_{t-1})$$
      D: $$\mathrm{KL}(q \Vert p_\theta)$$
    answer: B
    feedback:
      A: 誤り．条件付き情報を無視した学習になってしまう．
      B: 正解．途中までの系列を条件付けた次トークンの確率論的分類と同じ方法で，負の対数尤度による学習が行われる．
      C: 誤り．直前 1 トークンだけに条件づけるのは1つの近似とはみなせるが，それでは文脈を十分に活用できない．
      D: 誤り．ここでは単語の出現分布は使われない．

  - rubric: テキスト生成におけるよくある不正確な説明を回避できる
    type: truefalse
    title: 012-04-自己回帰型の生成
    question: |
      自己回帰的な生成は「そこまでのデータを条件付けたときに最も確率が高い，次トークンを出力すること」を繰り返すことによって実現される．
    answer: false
    feedback:
      true: >
        これはよくある誤解・不正確な説明です．
        一般には生成結果がいくらかの多様性を持つこともタスクとして要請されるため，
        最も確率が高い次トークンではなく，ある程度確率が高いトークンは生成候補となります．
      false: >
        正解です．問題文は誤っています．
        自己回帰的な生成は，次トークンの条件付き確率分布からサンプリングすることによって行われます．
        このとき，最も確率が高いトークンを選択する貪欲法による生成を行うことも可能ですが，
        一般には多様な生成結果を得ることもタスクの目的に含まれるため，
        必ずしも最も確率が高くない次トークンであっても生成されるように工夫することが普通です．
      # 例えば温度パラメーターを極端に小さくすることでばかり選ばれるような振る舞いにすることも可能ですが，

  - rubric: Top-p サンプリングの仕組みを理解している
    type: truefalse
    title: 012-05-Top-pサンプリング
    question: |
      Top-p サンプリング(nucleus sampling)では，
      予測された条件付き確率が高い順に並べたときに，
      上位 $$k$$ 個のトークンを候補とするが，
      その際，上位 $$k$$ 個の確率の合計がちょうど $$p$$ 以上となるように $$k$$ を動的に決める．
    answer: true
    feedback:
      true: 正解．累積確率基準で候補集合を決定する．
      false: 不正解．固定長ではなく，動的に候補数が変化する．
