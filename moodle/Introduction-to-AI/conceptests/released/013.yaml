config:
  format: markdown
Quizzes:
  - rubric: 事前学習の自己教師付きタスクを説明できる
    type: multichoice
    title: 013-01-次トークン予測
    question: |
      デコーダー構成の大規模言語モデルの，次トークン予測による事前学習法の特徴として **誤った説明** はどれか。
    choices:
      A: 擬似ラベルを自動生成することによる学習法なので，自己教師付き学習に分類される．
      B: 文全体を生成してから，生成結果と次トークンの距離を測り，それに基づく損失値を計算する．
      C: トークンの順序をシャッフルすると，一般に損失値は変化する．
      D: 言語以外の系列データにも，同じ方法が応用可能である．
    answer: B
    feedback:
      A: 正しい説明です．
      B: >
        誤った説明なので，この選択肢が正解です．
        次トークン予測では，確率論的分類と同じく，条件付き確率を近似するように学習します．その際に，トークン間の距離を測るのではなく，次トークンの確率分布を出力し，交差エントロピーで損失を定義します．
      C: 正しい説明です．順序は本質的であり，トークンをシャッフルすると損失値は変わります．
      D: 正しい説明です．音声や時系列など他モダリティの系列データにも適用可能です．

  - rubric: Chinchilla スケーリング則と計算予算のトレードオフを説明できる
    type: multichoice
    title: 013-02-Chinchillaスケーリング則の理解
    question: |
      Chinchilla スケーリング則に関して **誤っている** 主張はどれか。
    choices:
      A: モデルのパラメーター数と学習トークン数のバランスが重要であり，パラメーター数を増やすだけでは最適な性能は得られない．
      B: トークン埋め込みに使われるパラメーターは，スケーリング則において通常はパラメーター数に含めない．
      C: この法則は十分大きな任意のニューラルネットに適用可能である点に最大の意義がある．
      D: これは事前学習損失値に関する経験則であり，下流タスクでの性能に関する法則ではない．
    answer: C
    feedback:
      A: 正しい説明です．
      B: 正しい説明です．Chinchilla の論文では埋め込みを除外してパラメーター数を定義しています．
      C: >
        誤った説明であり．よって正解です．トランスフォーマーでのみ確認された経験則であり，CNN など他のアーキテクチャには適用できません．
        ただし，異なるアーキテクチャに対しても，同様のスケーリング法則が模索されています．
      D: 正しい説明です．ただし，事前学習の損失値と下流タスクでの性能の間には，強い関連があることが経験的に知られており，それゆえに指針として役立っています．

  - rubric: CoT の効果を説明できる
    type: multichoice
    title: 013-03-CoTの効果
    question: |
      思考の連鎖（CoT）の効果に関する説明のうち，**正しい** のはどれか。
    choices:
      A: CoT は，原理的に，あらゆるタスクで性能を毀損しないか，または向上させる．
      B: CoT は特に論理的推論タスクで有効である．
      C: CoT は，予測時にモデルのパラメーターを精密調整することによって実現される．
      D: CoT は，特に事実に関する知識タスクで有効であり，複雑な推論が必要な問題では効果が限定的である．
    answer: B
    feedback:
      A: 常に向上するわけではなく逆効果になるタスクも存在します．
      B: 正解．論理・算術推論で顕著な改善が報告されています．
      C: パラメーターの変更は不要なまま用いられる，プロンプトの工夫です．
      D: 実際は逆で，単純な事実確認より複雑な推論問題で特に効果を発揮します．

  - rubric: 思考モデルがあくまでも言語モデルであることを理解している
    type: multichoice
    title: 013-04-思考モデル
    question: |
      「思考モデル (reasoning/thinking models)」 に関する説明のうち，**正しい** のはどれか．
    choices:
      A: 思考モデルの出現により，自律的なエージェントを作ることが可能になった．
      B: 思考モデルはCoTプロンプトを使用するようにする推論時の入力における工夫のことを指し，正確にはモデルの種類を指すものではない．
      C: 思考モデルの実現にはトランスフォーマーとは異なる全く新しいニューラルアーキテクチャが必要であった．
      D: 思考トークン生成を増やすほど計算コストは増加する。
    answer: D
    feedback:
      A: 誤った説明です．思考モデルはより高い性能を達成することに繋がり，間接的にエージェント構築を後押ししましたが，エージェントは思考モデル以前から構築されていました．
      B: 誤った説明です．一般に思考モデルはCoTを自発的に行うように傾向付けられた言語モデルを指し，単なるプロンプトの工夫にはとどまりません．
      C: 誤った説明です．アーキテクチャの変更は必要ではなく，同じアーキテクチャのもとで学習方法を工夫することなどにより実現されます．
      D: 正しい説明です．トークン増は計算負荷を増すため留意が必要です．
    # 実現することを指し，推論時の戦略変更であり，基盤となる言語モデル自体を再訓練する必要はない。

  - rubric: エージェントの仕組みを理解している
    type: multichoice
    title: 013-05-LLM-Agents
    question: |
      大規模言語モデルから作られる自律エージェントに関する説明のうち，**正しい** のはどれか。
    choices:
      A: エージェントは自身のソースコードを書き換えることによってタスクを設定し直す．
      B: エージェントは，特定の形式に則ったトークン出力をすることで外部ツールを呼び出すようにシステムを設計することで実現されることが多い．
      C: 外部ツールの呼び出しを伴わない場合は，自律エージェントとはみなされない．
      D: エージェントは常に人間の監視下で動作しなければならない．
    answer: B
    feedback:
      A: 誤った説明です．ソースコード自己改変は一般的なアプローチではありません．
      B: 正しい説明です．JSON などの特定のフォーマットで出力させることで，外部ツール呼び出しが実現されます．
      C: 誤った説明です．内省や自己質問のみで動くエージェントも存在します．
      D: 誤った説明です．ガバナンス上望ましい場合は多いですが，必須条件ではありません．
