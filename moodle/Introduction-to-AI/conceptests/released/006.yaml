Quizzes:
  - rubric: Softmaxの関数形に慣れている
    type: multichoice
    title: 006-01-Softmaxの関数形に慣れる
    question: |
      ソフトマックス関数の定義は次式であった．
      $$
        \mathrm{Softmax}(z_1, \ldots, z_K)
        := \left(\frac{e^{z_1}}{\sum_{j=1}^K e^{z_j}},
                 \ldots,
                 \frac{e^{z_K}}{\sum_{j=1}^K e^{z_j}}\right)
      $$

      このとき，
      $$\mathrm{Softmax}(\log 2, \log 3, \log 5, \log 7)$$
      の値は次のうちどれか？
    choices:
      A: $$\left(\frac{2}{17}, \frac{3}{17}, \frac{5}{17}, \frac{7}{17}\right)$$
      B: $$\left(\frac{\log 2}{\log 210}, \frac{\log 3}{\log 210}, \frac{\log 5}{\log 210}, \frac{\log 7}{\log 210}\right)$$
      C: $$\left(\frac{2}{4}, \frac{3}{4}, \frac{5}{4}, \frac{7}{4}\right)$$
      D: $$\left(\frac{4}{87}, \frac{9}{87}, \frac{25}{87}, \frac{49}{87}\right)$$
    answer: A
    feedback:
      A: 正解です．$$e^{\log x}=x$$ となり，分母は $$2+3+5+7=17$$．確率ベクトルとして総和も 1 になります．
      B: 入力をそのまま用いて指数化を忘れています．Softmax は「指数化して正規化」することを思い出しましょう．
      C: 分母を要素数 $$K=4$$ で割っており正規化が不適切です（総和が 1 になりません）．
      D: 指数化のあと二乗してしまう誤りです．Softmax に二乗操作は不要で，確率分布も変わってしまいます．

  - rubric: Softmaxの基本性質を理解している
    type: multichoice
    title: 006-02-Softmaxの基本性質
    question: |
      ソフトマックス関数 $$ \mathrm{Softmax}(z) $$ の性質として **誤っている** ものはどれか。
      ここで $$ z=(z_1,\ldots,z_K)\in\mathbb{R}^K $$ とする。
      また、シグモイド関数は $$\sigma(z) := \frac{1}{1+e^{-z}}$$ と定義する。
    choices:
      A: すべての成分が非負で総和が $$1$$ になる。
      B: 入力ベクトル $$z$$ の各成分に同じ定数 $$a$$ を足しても出力は変化しない、つまり、$$ \mathrm{Softmax}(z_1 + a, \ldots, z_K + a) = \mathrm{Softmax}(z) $$ である。
      C: 入力ベクトルの各成分を同じ正の定数倍しても出力は変化しない、つまり、$$ \mathrm{Softmax}(a \cdot z_1, \ldots, a \cdot z_K) = \mathrm{Softmax}(z) $$ である。
      D: $$K=2$$ の場合にはシグモイド関数を用いて表現できる、つまり、$$ \mathrm{Softmax}(z_1, z_2) = \left(\sigma(z_1 - z_2), 1 - \sigma(z_1 - z_2)\right) $$ である。
    answer: C
    feedback:
      A: 正しい性質です。Softmax の出力は確率値ベクトルになります。
      B: 正しい。シフト不変性により全成分を同じだけ平行移動しても比は不変です。
      C: 誤りです。一般に異なる値になります。
      D: 正しい。2クラスではシグモイド関数を用いて表現できます。

  - rubric: Softmax の負の対数尤度をパラメーターで微分したことがある
    type: multichoice
    title: 006-03-Softmaxの負の対数尤度の勾配
    question: |
      ソフトマックス関数を用いた多クラスの確率論的分類モデルを考える。
      $$s_{\theta} $$ は適切な入出力形状の条件を満たす順伝播型ニューラルネットワークとし、
      $$g_{\theta}(x) := \mathrm{Softmax}(s_{\theta}(x))$$ とする。
      ラベル付きデータ $$ (x, y) $$ に対する負の対数尤度は、
      $$
        \ell((x, y), g_{\theta}) = -\log g_{\theta}(x)[y]
      $$
      である。
      このとき，$$\nabla_{\theta}\ell((x, y), g_{\theta})$$ を正しく表す式はどれか。
    choices:
      A: $$ -\nabla_\theta s_\theta(x)[y] + \sum_{k} g_\theta(x)[k] \cdot \nabla_{\theta} s_\theta(x)[k] $$
      B: $$ \nabla_\theta s_\theta(x)[y] - \sum_{k} g_\theta(x)[k] \cdot \nabla_{\theta} s_\theta(x)[k] $$
      C: $$ \left(\sum_{k} g_\theta(x)[k] \cdot \nabla_{\theta} s_\theta(x)[k]\right) + 1 $$
      D: $$ -\nabla_{\theta} s_\theta(x)[y] $$
    answer: A
    feedback:
      A: 正解です。
      B: 符号が逆です。
      C: 正ラベルとの差が含まれていません。また、不要な定数 1 が入っています。
      D: Softmax の寄与が抜けています。

  - rubric: ミニバッチ学習の目的を理解している
    type: truefalse
    title: 006-04-ミニバッチの役割
    question: |
      ミニバッチ確率的勾配降下法では，計算量を抑えつつリスクに対する不偏推定量として勾配を近似するために，毎ステップで訓練データ全体の中から小さなサンプルを用いる。
    answer: true
    feedback:
      true: 正解です。ミニバッチは計算削減と統計的推定の両立を図ります。
      false: 正しいステートメントです。

  - rubric: シグモイドの勾配が取り得る値域を理解している
    type: multichoice
    title: 006-05-シグモイド勾配の範囲
    question: |
      シグモイド関数の勾配 $$ \sigma'(z)=\sigma(z)(1-\sigma(z)) $$ の値域の範囲（即ち、像 $$ \mathrm{Image}(\sigma') $$）として正しいものはどれか。
    choices:
      A: $$(0,\,0.25]$$
      B: $$[0,\,0.25]$$
      C: $$[0,\,1]$$
      D: $$(-\infty, \infty)$$
    answer: A
    feedback:
      A: 正解です。極限 $$z\to\pm\infty$$ で 0 に漸近し，$$z=0$$ で上限 0.25 に達します。
      B: 0 は極限値であり到達しません。
      C: シグモイド関数の勾配の上限は 0.25 です。また、0 は極限値であり到達しません。
      D: シグモイド関数の勾配は正で有限です。
