Quizzes:
  - rubric: 近似ターゲット概念の理解
    type: multichoice
    title: 004-01-近似ターゲットの意味
    question: |
      近似ターゲットの概念について、次の学生の説明のうち適切なものを選びなさい。
    choices:
      A: Aさん「近似ターゲットとはモデル内で最も性能が良い予測関数のことで、訓練データ上での予測誤差が最も小さい関数のことともいえる。」
      B: Bさん「近似ターゲットはあらゆる可能な予測器の中で最小リスクを達成するもののことであり、学習時に使うモデルとは独立に定義される。」
      C: Cさん「近似ターゲットとは最適化手法を用いて数値的に求められる具体的なパラメーターであり、この値を計算することが学習に他ならない。」
      D: Dさん「近似ターゲットとはテストデータに対する性能評価で最も良い結果を出すように設定される理想的なパラメーター値である。」
    answer: B
    feedback:
      A: 近似ターゲットはモデル内で最も性能が良い関数ではなく、モデルとは独立に定義される理論的な関数です。
      B: 正解です。近似ターゲットはモデルに関係なく理論的に最小リスクを持つ関数です。
      C: これは近似ターゲットの説明ではありません。
      D: テストデータで性能が良い関数やパラメーターのことではありません。

  - rubric: 二値分類の用語理解
    type: truefalse
    title: 004-02-正例と負例
    question: |
      二値分類において、正ラベルを持つデータは正例と呼ばれる。
    answer: true
    feedback:
      true: 正解です。
      false: 正ラベルが付いたデータが正例です。

  - rubric: 確率論的分類の特徴
    type: multichoice
    title: 004-03-確率論的分類の目標
    question: |
      確率論的分類では通常、モデルを用いて何を近似するか？
    choices:
      A: リスク関数
      B: クラス事後確率
      C: データ分散
      D: 入力変数
    answer: B
    feedback:
      A: クラス事後確率を近似します。
      B: 正解です。
      C: 分散は関係ありません。
      D: クラス事後確率を近似します。

  - rubric: ベイズ分類器が誤分類率を最小化することの理解
    type: multichoice
    title: 004-04-ベイズ分類器の最適性
    question: |
      誤分類率をリスクとする場合の近似ターゲットは、次のうちどれか。
      （$$X$$は特徴量，$$Y$$はラベル，$$1, \ldots, K$$はクラス，$$c_{j,k}$$は正解ラベルが$$j$$で予測ラベルが$$k$$の場合の費用感応的損失とする）
    choices:
      A: $$f^*(x) = \mathbb{E}[Y \mid X = x]$$
      B: $$f^*(x) = \arg\max_{k \in \{1, \dots, K\}} p(Y=k \mid X=x)$$
      C: $$f^*(x) = \inf\{y \mid P(Y \le y \mid X=x) \geq 0.5\}$$
      D: $$f^*(x) = \mathbb{E}[Y^2 \mid X = x]$$
      # $$f^*(x) = \arg\min_{k \in \{1, \dots, K\}} \sum_{j=1}^{K} c_{j,k} p(Y=j \mid X=x)$$
    answer: B
    feedback:
      A: 条件付き期待値は期待二乗誤差をリスクとする場合の近似ターゲットです。
      B: 正解です。誤分類率の最小化に対応するのは、最大事後確率分類器（ベイズ分類器）です。
      C: これは条件付き中央値を表し、絶対誤差を用いる場合の近似ターゲットです。
      D: 誤りです。
      # これは費用感応的損失を用いる場合の近似ターゲットです。

  - rubric: 2クラス分類に対する感覚を養えている
    type: multichoice
    title: 004-05-2クラス分類の最低性能
    question: |
      2クラス分類において，学習の結果，正答率（= 1 - 誤分類率）が20%の分類器が得られたとする．
      このとき，次のうち正しいのはどれか．
      ただし，データをこれ以上増やすことはできないと仮定する．
    choices:
      A: 正則化により必ず性能を改善できる．
      B: モデルの複雑さを上げることで必ず性能を改善できる．
      C: 20%では性能が低すぎるので，データを増やせない以上，このタスクを学習で解決することは諦めた方がよい．
      D: 20%は低すぎるので，必ず性能を改善できる方法が存在する．
    answer: D
    feedback:
      A: 正則化は性能を改善する可能性があるが，必ずではない．
      B: モデルの複雑度を上げることで性能が改善する可能性はあるが，必ずではない．
      C: データを追加できないとしても，学習方法の変更によってより高い性能を達成できる可能性はある．ただし，今回はそもそもD.の通り20%という評価そのものが不適切である．
      D: 正しい．2クラス分類で精度が20%のモデルが得られたら，そのモデルの予測を反転した予測器を用いれば，必ず80%の精度を達成できる．
