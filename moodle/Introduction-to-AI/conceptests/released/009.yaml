config:
  format: markdown
Quizzes:
  - rubric: 高次元空間での距離均質化（距離の集中現象）が k-最近傍法の性能に与える影響を説明できる
    type: multichoice
    title: 009-01-次元の呪いと最近傍法
    question: |
      特徴量次元が高次元の場合に k-最近傍法の分類精度が低い傾向にある理由の説明として，最も適切なものはどれか？
    choices:
      A: 距離が均質化しやすいから
      B: ラベルのノイズが増えやすいから
      C: k の値が自動で変わるから
      D: アルゴリズムが遅くなるから
    answer: A
    feedback:
      A: 正解です。高次元では「距離の均質化」により最近傍距離と遠方距離の差が縮まり，近傍情報が判別に役立たなくなります。
      B: ラベルのノイズ有無は別の話であり、次元の呪いとは直接関係しません。
      C: k は通常固定であり，自動で変わることが精度低下の主因ではありません。
      D: 計算が遅いことは実行時間の問題であり，分類精度の低下を直接説明しません。

  - rubric: カーネル幅と過適合の関係を説明できる
    type: multichoice
    title: 009-02-ガウシアンカーネルの帯域
    question: |
      ガウシアンカーネル $$k_h(x,x')=\exp\!\bigl(-\|x-x'\|^2/(2h^2)\bigr)$$ でバンド幅 $$h$$ を極端に小さくすると主に何が起きやすいか。
    choices:
      A: 計算量が大幅に増えるため，過適合が起きにくくなる
      B: 訓練点近傍のみ類似度が高くなり過適合を招く
      C: 全ての点間で類似度がほぼ 1 になり，類似度としての有用性が失われる
      D: 正則化項を導入した場合と同様の効果で汎化性能が向上する
    answer: B
    feedback:
      A: 計算量を軽減する特段の効果はない。過適合はむしろ起きやすくなる傾向にある。
      B: 正解。
      C: 値が一様化するのは，$$h\to\infty$$ での挙動。
      D: ガウスカーネルの場合，極端に小さいバンド幅を用いることは過適合を招きやすく，逆効果になりやすい。

  - rubric: 高次元球の体積公式をパラメータ $$s$$ で計算できる
    type: multichoice
    title: 009-03-外殻体積の一般公式
    question: |
      半径 $$r$$ の $$d$$-次元球の体積 $$V(r)$$ は，次元 $$d$$ に依存する定数 $$a_d$$ を用いて
      $$
        V(r) = a_d r^d
      $$
      と表される。

      半径 $$r=1$$ の $$d$$-次元球の，厚さ $$s$$($$s \in (0, 1)$$) の外殻に含まれる体積の割合
      $$\displaystyle\frac{V(1)-V(1-s)}{V(1)}$$ はどの式になるか。
    choices:
      A: $$s^d$$
      B: $$\exp(-ds)$$
      C: $$1-\exp(-ds)$$
      D: $$1-(1-s)^d$$
    answer: D
    feedback:
      A: 誤り（$$d \to \infty$$ の極限で合わない）。
      B: 誤り（$$s \to +0$$ の極限で合わない）。
      C: 誤り。
      D: 正解。体積 $$V(r)=a_d r^{d}$$ を用いて引き算すると得られる。

  - rubric: 次元の呪いの対策を考察できる
    type: multichoice
    title: 009-04-次元の呪いと対応方策
    question: |
      **次元の呪い** は高次元データ解析で生じる様々な障害の総称である。

      学習においては，例えば「距離の均質化」に代表されるような高次元現象により，k-最近傍法 (k-NN) の分類精度が低くなりやすいなどの形で現れる。

      この次元の呪いを回避できる可能性のある **「前提条件（状況）」と「具体的対策法（方策）」の組み合わせ** として最も適切なのはどれか。
    choices:
      A: |
        ・状況「サンプル数 $$n$$ と特徴量の次元 $$d$$ について，$$n \in [d, d^2 \log d]$$ が成立する」

        ・方策「k の値を $$d$$ よりも大きくする」
      B: |
        ・状況「データは高次元だが，ノイズが高次元球の外殻近くに集中的に分布している」

        ・方策「距離関数をユークリッドからマンハッタンに変える」
      C: |
        ・状況「データが低次元多様体や圧縮可能な表現空間上に実質的に分布しているなどの，低次元構造を持つ」

        ・方策「表現学習などで低次元表現を抽出し，その空間で距離を測る」
      D: |
        ・状況「各特徴のスケールがばらばらで，大きいスケールが距離を支配している」

        ・方策「各特徴を平均0・分散1になるように標準化する」
    answer: C
    feedback:
      A: 誤り。kの値を大きくしても、次元の呪いは解決しない。なお、この条件の数式には特に意味はない。
      B: >
        誤り。データ自体が本質的に高次元で追加的な構造を持たなければ，距離関数を変えることは次元の呪いの解決には直接的な効果がない。
        特に，有限次元ベクトルのノルムは全て互いに同値であるため，ユークリッド距離をマンハッタン距離に変えるだけで次元の呪いを根本的に回避できることはない。
      C: 正解。低次元構造を持つデータであれば、低次元表現を抽出することで次元の呪いを回避できる余地があると期待できる。
      D: 誤り。標準化は次元の呪い自体には直接的な効果はない。

  - rubric: 類似度学習が 1:N 認証（open-set 認証）を簡潔にする理由を説明できる
    type: multichoice
    title: 009-05-オープンセット認証での類似度学習の利点
    question: |
      1:N 認証タスクは **登録外ユーザーの出現** や **後からの利用者追加** など，典型的な分類タスクとは異なる要件を持つ場合がある．
      類似度学習のアプローチを用いると，これらの要件に自然に対応できる。

      これらの要件と「類似度学習により得られる利点」を組み合わせた説明として **不適当なもの** を選べ。
    choices:
      A: |
        （要件）入力が登録外ユーザーかもしれないため，未知のクラスに対しても対応できる必要がある

        （利点）類似度学習では、未知のクラスに対しても距離を計算できるため、登録外ユーザーを自然に扱える
      B: |
        （要件）運用開始後に，新規登録のたびにモデルの全体を学習し直すことは避けたい

        （利点）その新規ユーザーの情報をデータベースに追記するだけで対応可能であり，再学習が不要
      C: |
        （要件）登録者数が多くても，認証処理を高速にしたい（リアルタイム応答にしたい）

        （利点）表現学習による類似度学習を行えば，ベクトル埋め込み空間での近似最近傍探索を用いることが可能になり，検索時間を短縮しやすい。
      D: |
        （要件）ユーザーのプライバシーを保護したい

        （利点）類似度学習では、ユーザーの個別情報を直接扱うことなく、埋め込み空間での距離計算が可能になる
    answer: D
    feedback:
      A: 正しい組合せ。例えば、最大類似度が、あらかじめ決めた閾値より低い場合に未知とする、などの判定が典型的な方法。
      B: 正しい組合せ。新規クラスは「特徴量を記録しておくだけ」で対応できる。
      C: 正しい組合せ。近似最近傍探索（ANN）などの手法を用いることで、登録者数 $$N$$ が多くても高速な照合が可能になる。
      D: 不適当（正解）。類似度学習によっては必ずしもこの利点は得られない。類似度学習は暗号化とは異なる。
