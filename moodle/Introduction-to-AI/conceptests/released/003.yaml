Quizzes:
  - rubric: L2 正則化の数学的効果を理解できる
    type: multichoice
    title: 003-01-L2罰則が強すぎる場合
    question: |
      ある手法では目的関数 $$ \tilde L(\theta) $$ の最小化によりパラメーターを決定するのに対して，
      それにL2正則化を施した手法を考える．即ち，目的関数 $$ L(\theta) = \tilde L(\theta) + \lambda \|\theta\|^2 $$ の最小化で学習を行う．
      $$ \lambda $$ が十分大きいとき，その最小化により得られる $$ \theta $$ はどうなるか．
    choices:
      A: 正則化なしの解に近づく
      B: ゼロベクトルに近くなる
      C: 発散して無限大になる
      D: 単位ベクトルに近くなる
    answer: B
    feedback:
      A: これは $$ \lambda = 0 $$ の場合。
      B: 正解。罰則が支配的になり $$ \theta = 0 $$ に近づく。
      C: $$ \lambda \geq 0 $$ なら発散はしない。
      D: 誤り．例えば罰則項を $$ \lambda (\|\theta\|^2 - 1)^2 $$ などとすれば可能だろう．

  - rubric: 評価用データを取り置く理由を理解している．
    type: multichoice
    title: 003-02-取り置き法の目的
    question: |
      ハイパーパラメーター選択を行う際，訓練データとは別に検証データ（validation set）を取り置く主な理由はどれか．
    choices:
      A: 訓練時間を短縮するため．
      B: モデルの汎化性能を推定するため．
      C: ハイパーパラメータの組み合わせの個数を抑制するため．
      D: 過適合を促進するため．
    answer: B
    feedback:
      A: 訓練時間とは直接関係しません．
      B: 正解です．「未知データ」を擬似的に用意することで，未知データに対する性能を推定する近似として検証データを使います．それによりハイパーパラメーターの良し悪しを比較する指標を構成します．
      C: ハイパーパラメータは検証データを用いて**選択**します．組み合わせの個数は関係ありません．
      D: 検証データは過適合を**防ぐ**ために用います．

  - rubric: k-分割交差検証の利点を理解している．
    type: multichoice
    title: 003-03-k分割CV
    question: |
      K分割交差検証 (K-fold CV) が，単純な取り置き法（1回の取り置き）よりも優れている点はどれか．
    choices:
      A: 手持ちのデータを捨てることなく，余すことなく活用できる．
      B: ハイパーパラメータが不要になる．
      C: データ量が少ない場合，単純な取り置き法では検証データの分割が偶然偏ったものとなる可能性があるが，交差検証により全体の傾向を取り入れた評価ができる．
      D: モデルの計算コストを削減できる．
    answer: C
    feedback:
      A: 単純な取り置き法でも交差検証でも，全データを使うという点は同じです．
      B: ハイパーパラメータは依然として必要です．
      C: 正解です．各サブセットを検証に回すことで性能推定のばらつきを減らします．
      D: 学習〜検証評価をK回繰り返すのでむしろ計算量は増えます．

  - rubric: 帰納バイアスの概念を説明できる．
    type: multichoice
    title: 003-04-帰納バイアスとは
    question: |
      「帰納バイアス (inductive bias)」を最もよく表す説明はどれか．
    choices:
      A: 訓練データのノイズを減らす前処理工程．
      B: 学習手法が好む仮説への**事前の偏り**のこと．
      C: モデルが推論時に用いる確率分布のこと．
      D: ハイパーパラメータチューニング手法の一種．
    answer: B
    feedback:
      A: ノイズ除去は帰納バイアスではありません．
      B: 正解．学習を可能にする「必要悪」でもあり，高い性能を発揮する余地を生む非自明さの源泉です．
      C: 誤りです．
      D: 誤りです．

  - rubric: オッカムの剃刀に基づくモデル選択を理解している
    type: multichoice
    title: 003-05-オッカムの剃刀
    question: |
      同じ訓練損失ならどのモデルを選ぶのが
      オッカムの剃刀の原理に最も合致するか。
    choices:
      A: パラメータノルムが最も小さいモデル
      B: パラメータ数が最も多いモデル
      C: パラメータノルムが最も大きいモデル
      D: どれも同じ
    answer: A
    feedback:
      A: 正解です．必要最小限の仮説を選ぶのが倹約の原理です．
      B: 逆です．
      C: 逆です．
      D: BとCは倹約の原理に逆行しています．Aは倹約の原理に適っています．
