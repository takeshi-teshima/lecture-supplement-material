Quizzes:
  - rubric: 階層的特徴抽出の基本を理解している．
    type: multichoice
    title: 008-01-浅い層は何を見る？
    question: |
      画像に適したアーキテクチャの深層ニューラルネットワークにおいて、
      深層ニューラルネットワークの*浅い層*（入力に近い層）が学習しやすい特徴として**典型的**なのはどれか．
    choices:
      A: 画像全体の意味内容（「犬」や「車」など）
      B: 画像中の特定クラスに固有な複雑パターン
      C: 局所的なエッジや簡単な模様
      D: 画像全体に写っている物体の総個数
    answer: C
    feedback:
      A: これはむしろ*深い層*で現れやすい抽象概念です．
      B: もう少し深い層で現れる傾向にあります．
      C: 正解です．浅い層はエッジや簡単なテクスチャなど**局所特徴**に強く反応します．
      D: 画像全体に写っている物体の総個数のような高次の情報は、浅い層は担わないことが多いです．

  - rubric: 事前学習と精密調整の流れを説明できる．
    type: multichoice
    title: 008-02-ファインチューニングの典型手順
    question: |
      事前学習モデルをタスクに固有のデータで精密調整（fine-tuning）する際，最も一般的な操作はどれか．
    choices:
      A: すべての層の重みをゼロで初期化し再学習する
      B: 最終層近辺を新しい層に置き換え，残りは学習率を下げて更新する
      C: 入力層だけを訓練し，深い層は凍結する
      D: 事前学習重みを用いずランダム初期化から訓練する
    answer: B
    feedback:
      A: それでは事前学習の利点が消えてしまいます．
      B: 正解です．浅い層を活かしつつ出力側をタスクに合わせます．
      C: 逆です．むしろ浅い層を固定する方が一般的．
      D: これはフルスクラッチ学習であり，ファインチューニングではありません．それでは事前学習の利点が消えてしまいます．

  - rubric: 事前学習タスクの選定理由を説明できる．
    type: truefalse
    title: 008-03-事前学習タスクと下流タスクとの一致
    question: |
      事前学習タスクは精密調整対象の下流タスクと同じ種類（例：どちらも画像分類）でなければ効果がない．
    answer: false
    feedback:
      true: 不正解です．例えば，ImageNetデータでの分類タスクの学習などは，多様な下流タスクにおける有用性が知られています．
      false: >
        正解です．大量データが得られる汎用タスクであれば下流と異なっても有効なことがあります．
        その理由の一端は，事前学習から汎用的な特徴表現の学習（特徴抽出器の学習）が可能なことにあると考えられています．

  - rubric: cosine similarityとEuclidean distance の関係を理解している
    type: multichoice
    title: 008-04-Cosine SimilarityとEuclidean Distanceの関係
    question: |
      $$ d $$-次元実ベクトルの2変数関数として、コサイン類似度とユークリッド距離がある。
      これらの関係として、正しいものは次のうちどれか？
    choices:
      A: 引数のベクトルが等しい場合（$$x = y$$）には、等号関係
        $$ 1 - \mathrm{cos}(x, y) = \frac{1}{2}\mathrm{dist}_{\mathrm{Euclid}}(x, y)^2 $$ が成り立つ。
      B: 引数のベクトルがともに単位ベクトルの場合には、等号関係
        $$ 1 - \mathrm{cos}(x, y) = \frac{1}{2}\mathrm{dist}_{\mathrm{Euclid}}(x, y)^2 $$ が成り立つ。
      C: 引数のベクトルが並行な場合には、等号関係
        $$ 1 - \mathrm{cos}(x, y) = \frac{1}{2}\mathrm{dist}_{\mathrm{Euclid}}(x, y)^2 $$ が成り立つ。
      D: 引数のベクトルが直交している場合には、等号関係
        $$ 1 - \mathrm{cos}(x, y) = \frac{1}{2}\mathrm{dist}_{\mathrm{Euclid}}(x, y)^2 $$ が成り立つ。
    answer: B
    feedback:
      A: 誤りです。
      B: 正解です。Cosine SimilarityとEuclidean Distanceは、ベクトルが単位ベクトルのときは等価（値が1対1に対応）になります。
      C: 誤りです。
      D: 誤りです。なお、Cosine Similarityは直交している場合、ゼロになります。

  - rubric: カーネル法のパラメータ数を説明できる．
    type: truefalse
    title: 008-05-データ依存パラメータ
    question: |
      カーネル線型モデルのパラメータ数は訓練データ数の2乗 $$n^2$$ に比例して増加する．
    answer: false
    feedback:
      true: 誤り．データ数に比例して増加します．
      false: 正解．各訓練点に1つ重みが対応します．
