- rubric: 回帰タスクの基本的定義を理解している。
  type: multichoice
  title: 002-01-回帰タスクとは
  question: |
    回帰タスクとして最も適切な例はどれか？
  choices:
    A: 写真に写る動物が犬か猫かを判定する
    B: 翌日の気温を数値として予測する
    C: メールを迷惑メールかどうか分類する
    D: 商品のカテゴリーを特定する
  answer: B
  feedback:
    A: これは分類タスクです。
    B: 正解です。回帰は数値を予測するタスクです。
    C: これは分類タスクです。
    D: これは分類タスクです。

- rubric: 経験リスク最小化の概念を理解している。
  type: yesno
  title: 002-02-経験リスク最小化
  question: |
    経験リスク最小化とは、手元のデータで計算できる損失の平均を最小化することである。
  answer: true
  feedback:
    true: 正解です。
    false: 経験リスク最小化は、データから計算できる損失の平均を最小化することです。

- rubric: パラメーター線型モデルの意味を理解している。
  type: multichoice
  title: 002-03-パラメーター線型モデル
  question: |
    パラメーター線型モデルの特徴として正しいものはどれか？
  choices:
    A: 特徴量変換は常に線型である
    B: パラメーターが線型に効いている
    C: 入力に対して必ず線型な関数となる
    D: パラメーターは非線型に作用する
  answer: B
  feedback:
    A: 特徴量変換は非線型でもよいです。
    B: 正解です。
    C: 入力に対して非線型でもよいです。
    D: パラメーターは線型に作用します。

- rubric: パラメーター線型モデルにおいて、経験リスク最小化やL2正則化付き最小二乗法など、具体的な学習手法の数理的な位置づけを理解している。
  type: multichoice
  title: 002-04-パラメーター線型モデルの学習
  question: |
    次のうち、パラメーター線型モデル f[θ](x) = ＜θ, ϕ(x)＞ を学習する手法として適切に記述されているものはどれか？
  choices:
    A: ϕ(x) が非線型である場合は、線型モデルとして学習することはできない。
    B: 線型モデルでは、どのような損失関数を選んでも解析的な解（閉じた形式の解）が存在する。
    C: L2正則化は、経験リスクの最小化だけでなく、パラメーターのノルムも同時に小さくなるように最適化を行い、過適合を防ぐ働きをする。
    D: 線型モデルでは、モデルが単純すぎて過適合は原理的に起こり得ない。
  answer: C
  feedback:
    A: |
      誤りです。ϕ(x) は入力に対して非線型でも、θ に対して線型であればパラメーター線型モデルとして学習可能です（例：多項式特徴量など）。
    B: |
      誤りです。二乗損失など特定の損失関数を使った場合には解析解が得られることがありますが、任意の損失関数で得られるとは限りません。
    C: |
      正解です。L2正則化は「経験リスク + パラメーターノルム」という目的関数を最小化することで、予測器の関数としての極端な変動（＝過適合の一因）を抑制します。これは「訓練データにおける損失の小ささ」と「モデルの単純さ」のバランスをとる仕掛けです。
    D: |
      誤りです。線型モデルでも、例えば特徴量が多く表現力が高くなりすぎれば過適合は起こり得ます。モデルの単純さだけで過適合を完全に防ぐことはできません。

- rubric: 経験リスク最小化は教師付き学習の一つの方法論にすぎず、唯一の学習原則ではないことを理解している。
  type: multichoice
  title: 002-05-経験リスク最小化の限界
  question: |
    次の会話は3人の学生が機械学習の学習原則について議論している様子です。ERM（経験リスク最小化）の役割についての説明として、適切な発言をしているのは誰でしょう？

    Aさん「全ての機械学習アルゴリズムは、結局のところ経験リスクを最小化しているに過ぎないんだよ。」

    Bさん「ERMはデータの平均的な誤差を最小化するという考え方だけど、リスクの分散が極端に大きいケースや、誤差の平均値だけでなく最悪ケースを重視したい場合には、他の方法が必要になることもある。」

    Cさん「ERMは単純だから、ベイズ学習も、マージン最大化も、ロバスト最適化もすべてERMの特殊ケースにすぎないんだよ。」

    Dさん「ERMだけで学習すると必ず過適合するから、そもそも実用的な場面では使われないよ。」
  choices:
    A: Aさんの発言が正しい
    B: Bさんの発言が正しい
    C: Cさんの発言が正しい
    D: Dさんの発言が正しい
  answer: B
  feedback:
    A: |
      誤りです。機械学習にはERM以外にも多くの学習原則があります。たとえば、ベイズ学習やロバスト最適化などはERMとは異なる考え方をしています。
    B: |
      正解です。ERMは期待値（平均）を最小化する考え方ですが、分散や最悪ケースを重視するような別の学習原則も存在します。
    C: |
      誤りです。ベイズ学習やマージン最大化、ロバスト最適化などの学習原理は、ERMの特殊ケースではなく、むしろERMとは異なる原則に基づいています。
    D: |
      誤りです。ERMだけで学習した場合に過適合することはありますが、実用的な場面でも使われることは多々あります。ただし、正則化などの工夫が併せて使われることが一般的です。
