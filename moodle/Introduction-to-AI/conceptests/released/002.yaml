Quizzes:
  - rubric: 回帰タスクの基本的定義を理解している。
    type: multichoice
    title: 002-01-回帰タスクとは
    question: |
      回帰タスクとして最も適切な例はどれか？
    choices:
      A: 写真に写った動物が犬か猫かを判定する
      B: 翌日の気温を数値として予測する
      C: メールを迷惑メールボックスに振り分ける
      D: 商品のカテゴリーを特定する
    answer: B
    feedback:
      A: これは分類タスクです。
      B: 正解です。回帰は数値を予測するタスクです。
      C: これは分類タスクです。
      D: これは分類タスクです。

  - rubric: 経験リスク最小化の概念を理解している。
    type: truefalse
    title: 002-02-経験リスク最小化
    question: |
      経験リスク最小化とは、手元のデータで計算できる損失の平均を最小化することである。
    answer: true
    feedback:
      true: 正解です。
      false: 経験リスク最小化は、データから計算できる損失の平均を最小化することです。

  - rubric: パラメーター線型モデルの意味を理解している。
    type: multichoice
    title: 002-03-パラメーター線型モデル
    question: |
      パラメーター線型モデルの特徴として正しいものはどれか？
    choices:
      A: 特徴量変換は常に線型である
      B: パラメーターが出力に対して線型に効いている
      C: 入力に対して必ず線型な関数となる
      D: パラメーターは非線型に作用する
    answer: B
    feedback:
      A: 特徴量変換は非線型でもよいです。
      B: 正解です。
      C: 入力に対して非線型でもよいです。
      D: パラメーターは線型に作用します。

  - rubric: パラメーター線型モデルにおいて、経験リスク最小化やL2正則化付き最小二乗法など、具体的な学習手法の数理的な性質を理解している。
    type: multichoice
    title: 002-04-パラメーター線型モデルの学習
    question: |
      次のうち、パラメーター線型モデル $$f_{\theta}(x) = \langle \theta, \phi(x)\rangle$$ を学習する方法に関して**正しく記述されているもの**はどれか？
      （※ただし、適切な逆行列の存在やランク条件など、必要な数学的仮定は満たされているものとする。）
    choices:
      A: $$\phi(x)$$ が非線型である場合、モデルはもはや線型モデルではなく、最小二乗法を使うことはできない。
      B: 最小二乗法で線型モデルを学習する場合は、L2正則化を加えていても、解の公式によって解を求めることができる。
      C: 線型モデルでは、モデルが単純すぎて過適合は原理的に起こり得ない。
      D: 正則化項を加えると、経験リスクを最小化するという目的から逸れてしまうため、理論的には望ましくない。
    answer: B
    feedback:
      A: |
        誤りです。$$\phi(x)$$ が入力に対して非線型であっても、パラメーター $$\theta$$ に対して線型であれば、パラメーター線型モデルとして扱えます。
        また、最小二乗法は線型モデルに限らず、非線型なモデルに対しても利用可能な**一般的な学習法**です。
      B: |
        正解です。L2正則化を加えたとしても、パラメーター線型モデルにおける二乗損失の最適化問題は、解の公式によって解析的に解くことができます。
        L2正則化は「経験リスク + パラメーターノルム」という目的関数を最小化することで、予測器の関数としての極端な変動（＝過適合の一因）を抑制します。これは「訓練データにおける損失の小ささ」と「モデルの単純さ」のバランスをとる仕掛けです。
      C: |
        誤りです。線型モデルでも、例えば特徴量が多く表現力が高くなりすぎれば過適合は起こり得ます。
      D: |
        誤りです。正則化項は、経験リスク最小化が真のリスク低減に直結しない状況（例：過適合など）への対応策であり、むしろ学習の最終目的に資するための方法です。

  - rubric: 経験リスク最小化は教師付き学習の一つの方法論にすぎず、唯一の学習原則ではないことを理解している。
    type: multichoice
    title: 002-05-経験リスク最小化の限界
    question: |
      次の会話は3人の学生が機械学習の原理について議論している様子です。ERM（経験リスク最小化）の役割についての説明として、適切な発言をしているのは誰でしょう？
    choices:
      A: Aさん「全ての機械学習アルゴリズムは、結局のところ経験リスクを最小化しているに過ぎないんだよ。」
      B: Bさん「ERMはデータの平均的な誤差を最小化するという考え方だけど、それだけではリスク低減という目標に直結しないこともあるから、他の方法が必要になることもある。」
      C: Cさん「ERMで学習すれば、訓練データの誤差が小さくなるから、それだけで常に未知データに対しても正確な予測ができるようになるよ。単純だからこそ一番効果的な方法なんだ。」
      D: Dさん「ERMだけで学習すると必ず過適合するから、そもそも実用的な場面では使われないよ。」
    answer: B
    feedback:
      A: |
        誤りです。機械学習にはERM以外にも多くの学習原則があります。たとえば、L2正則化付きの学習は、ERMに基づいていますが、純粋なERMそのものとは異なります。また、ベイズ的機械学習など、ERMとは異なる考え方で導出される学習法もあります。
      B: |
        正解です。ERMは期待値（平均）を最小化する考え方ですが、分散や最悪ケースを重視するような別の学習原則も存在します。
      C: |
        誤りです。ERMによって訓練データでの誤差が小さくなっても、未知データに対するリスクが小さくなるとは限りません。これはまさに第2回講義で学んだ、経験リスクと真のリスクの違い、そして汎化性能の重要性に関わるポイントです。
      D: |
        誤りです。ERMだけで学習した場合に過適合することはありますが、実用的な場面でも使われることは多々あります。ただし、正則化などの工夫が併せて使われることが一般的です。
